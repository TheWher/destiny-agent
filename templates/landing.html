<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Destiny Agent</title>
<style>
:root{
  --bg-deep:#0F0A06;--glass:rgba(255,255,255,0.10);--glass-hover:rgba(255,255,255,0.16);
  --glass-border:rgba(255,255,255,0.14);--glass-border-hover:rgba(255,255,255,0.26);
  --champagne:#E4B863;--champagne-light:#F3DCA8;--amber:rgba(200,134,58,0.18);
  --text-primary:rgba(255,248,235,0.90);--text-secondary:rgba(255,248,235,0.65);--text-muted:rgba(255,248,235,0.40);
  --ease-spring:cubic-bezier(0.16,1,0.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{
  font-family:"Noto Serif SC","Source Han Serif SC","STSong","PingFang SC",serif;
  background:var(--bg-deep);color:var(--text-primary);line-height:1.7;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 55% 40% at 60% 15%,rgba(200,134,58,0.16),transparent),
    radial-gradient(ellipse 40% 35% at 35% 80%,rgba(180,130,80,0.20),transparent),
    radial-gradient(ellipse 30% 22% at 50% 50%,rgba(228,184,99,0.05),transparent);
}
body::after{
  content:'';position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.022;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px 200px;mix-blend-mode:overlay;
}
main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;max-width:860px;width:100%}
.hero{text-align:center;margin-bottom:3rem}
.hero .mark{display:inline-block;font-size:.7rem;letter-spacing:.2em;color:var(--champagne);border:1px solid rgba(228,184,99,.35);padding:3px 14px;border-radius:20px;margin-bottom:1.4rem}
.hero h1{font-family:"STKaiti","KaiTi","Noto Serif SC",serif;font-size:clamp(2rem,5vw,3rem);font-weight:400;color:var(--text-primary);letter-spacing:.08em;margin-bottom:.6rem;line-height:1.3}
.hero p{font-size:.9rem;color:var(--text-secondary);max-width:380px;margin:0 auto;line-height:1.8}
.systems{display:grid;grid-template-columns:1fr 1fr;gap:1rem;width:100%;margin-bottom:2rem}
.card{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:2.2rem 1.8rem;
  background:var(--glass);backdrop-filter:blur(60px) saturate(160%);
  -webkit-backdrop-filter:blur(60px) saturate(160%);
  border:1px solid var(--glass-border);border-radius:24px;
  cursor:pointer;text-decoration:none;color:inherit;
  background-image:linear-gradient(to bottom,rgba(255,248,235,.08),transparent 50%);
  box-shadow:0 12px 32px rgba(8,5,3,.45),inset 0 1px 0 rgba(255,248,235,.12),inset 0 -1px 0 rgba(6,3,1,.25);
  transition:all .6s var(--ease-spring);
}
.card:hover{transform:translateY(-2px);border-color:var(--glass-border-hover);box-shadow:0 18px 44px rgba(8,5,3,.55),inset 0 1px 0 rgba(255,248,235,.18)}
.card .icon{font-size:2.2rem;margin-bottom:.6rem}
.card .tag{font-size:.66rem;letter-spacing:.1em;margin-bottom:.8rem;padding:2px 10px;border-radius:20px;font-weight:600}
.card .tag.bazi{color:var(--champagne-light);border:1px solid rgba(228,184,99,.30);background:rgba(228,184,99,.08)}
.card .tag.ziwei{color:var(--champagne-light);border:1px solid rgba(228,184,99,.30);background:rgba(228,184,99,.08)}
.card h2{font-family:"STKaiti","KaiTi","Noto Serif SC",serif;font-size:1.4rem;font-weight:400;margin-bottom:.4rem;letter-spacing:.05em;color:var(--text-primary)}
.card p{font-size:.8rem;color:var(--text-muted);line-height:1.7;max-width:260px}
.card .specs{display:flex;gap:.8rem;margin-top:.8rem;font-size:.68rem;color:var(--text-secondary)}
.card .specs span{padding:2px 8px;border:1px solid rgba(255,255,255,.10);border-radius:20px}
footer{position:relative;z-index:2;text-align:center;font-size:.68rem;color:var(--text-muted);padding:1rem;letter-spacing:.04em}
@media(max-width:640px){.systems{grid-template-columns:1fr}.hero h1{font-size:1.6rem}.card{padding:1.6rem 1rem}}
@media(max-width:480px){main{padding:2rem 1rem}.hero .mark{font-size:.64rem;padding:2px 10px}.hero h1{font-size:1.35rem}.hero p{font-size:.78rem;max-width:100%}.card{padding:1.2rem .8rem}.card .icon{font-size:1.6rem}.card h2{font-size:1.1rem}.card .specs{gap:.4rem;font-size:.62rem}footer{font-size:.6rem}}
/* ── 性能降级：毛玻璃与 ziwei 页同款处理（2026-08-01） ── */
@media (max-width:768px){
  .card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  body::after{display:none}
}
@media (min-width:769px){
  .card{backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}
}
</style>
</head>
<body>
<main>
<section class="hero"><div class="mark">AI 命理解读</div><h1>推命 · 观星 · 知运</h1><p>八字 · 紫微斗数 · AI 深度解读</p></section>
<div class="systems">
<a href="/app" class="card"><div class="icon">&#x2630;</div><div class="tag bazi">八字</div><h2>四柱推命</h2><p>排四柱、看五行十神，大运流年逐年展开，AI 逐项解读你的命局</p><div class="specs"><span>真太阳时</span><span>大运流年</span><span>250+城市</span></div></a>
<a href="/ziwei" class="card"><div class="icon">&#x1F52E;</div><div class="tag ziwei">紫微</div><h2>斗数观星</h2><p>十二宫命盘、四化飞星，AI 逐宫解读性格与运势走向</p><div class="specs"><span>24格局</span><span>大限流年</span><span>AI追问</span></div></a>
</div>
<footer>AI 驱动的传统命理解读</footer>
</main>
<script>
// ── 入口页埋点：landing_view 浏览 + landing_click 卡片点击（匿名，sendBeacon 保证跳转前送达） ──
(function(){
  var did = localStorage.getItem('ziwei_device_id');
  if(!did){ try{ did = crypto.randomUUID(); localStorage.setItem('ziwei_device_id', did); }catch(e){} }
  function fire(ev, meta){
    try{
      var body = JSON.stringify({event: ev, device_id: did, meta: meta || {}});
      if(navigator.sendBeacon){ navigator.sendBeacon('/api/events', new Blob([body], {type:'application/json'})); }
      else { fetch('/api/events', {method:'POST', headers:{'Content-Type':'application/json'}, body: body}).catch(function(){}); }
    }catch(e){}
  }
  fire('landing_view');
  document.querySelectorAll('.card').forEach(function(c){
    c.addEventListener('click', function(){
      fire('landing_click', {target: (c.getAttribute('href') === '/app') ? 'bazi' : 'ziwei'});
    });
  });
})();
</script>
</body>
</html>
