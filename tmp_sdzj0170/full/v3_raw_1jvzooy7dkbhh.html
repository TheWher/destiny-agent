ntent\":\"新鋟希夷陳先生紫㣲斗数全書 卷之三\",\"logicSentenceId\":\"7580337533881958434\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176266479566888","endPageId":"7330176266479566888","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":302,"chapterOrder":14,"inChapterOrder":1,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158872928878629","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"3\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安身命例 \",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"4\",\"lineNum\":0,\"lineType\":2,\"content\":\"要知與五星大不同\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176266479566888","endPageId":"7330176266479566888","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":209,"chapterOrder":14,"inChapterOrder":2,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158872928895013","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"5\",\"lineNum\":0,\"lineType\":1,\"content\":\"大抵入命俱從寅上起，正月順数至本生月止。\",\"logicSentenceId\":\"7580337533881974818\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"6\",\"lineNum\":0,\"lineType\":1,\"content\":\"又自人生月上起子時，逆至本生時安命，順至本生時安身。\",\"logicSentenceId\":\"7580337533881991202\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"7\",\"lineNum\":0,\"lineType\":1,\"content\":\"假如正月生子時，就在寅宫安命身。\",\"logicSentenceId\":\"7580337795084845108\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"8\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑時逆轉丑安命，順去卯安身；寅時逆轉，子安命，順至辰安身。\",\"logicSentenceId\":\"7580337795084861492\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"9\",\"lineNum\":0,\"lineType\":1,\"content\":\"餘宫倣此。\",\"logicSentenceId\":\"7580337795084877876\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"10\",\"lineNum\":0,\"lineType\":1,\"content\":\"又若閠正月生者，要在二月内起安身命，凢有閠月，俱要依此為例。\",\"logicSentenceId\":\"7580337795084894260\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"11\",\"lineNum\":0,\"lineType\":1,\"content\":\"納音甲子歌，務要熟讀。\",\"logicSentenceId\":\"7580337795084910644\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"12\",\"lineNum\":0,\"lineType\":1,\"content\":\"就如甲生人安命在寅，却起甲巳之年丙寅首是丙寅丁卯炉中火，就去火局尋某日生期起紫微帝主。\",\"logicSentenceId\":\"7580337795084927028\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"13\",\"lineNum\":0,\"lineType\":1,\"content\":\"如是正月初一日生者，是火局酉宫，有初一日，就\",\"logicSentenceId\":\"7580337795084943412\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"14\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176278257205285\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"15\",\"lineNum\":0,\"lineType\":1,\"content\":\"從酉宫起紫㣲，庶無差悞。\",\"logicSentenceId\":\"7580337795084943412\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"16\",\"lineNum\":0,\"lineType\":1,\"content\":\"若錯了，則差之毫厘，失之千里矣。\",\"logicSentenceId\":\"7580337795084959796\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"17\",\"lineNum\":0,\"lineType\":1,\"content\":\"順至生時便歸藏。\",\"logicSentenceId\":\"7580337795084976180\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176266479566888","endPageId":"7330176278257205285","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795084943412\",\"content\":\"如果是正月初一出生的人，属于火局酉宫，因为是初一，就从酉宫起算紫微，这样大概就不会有差错。\"},{\"logicSentenceId\":\"7580337795084845108\",\"content\":\"假如在正月出生于子时，就在寅宫确定命宫和身宫。\"},{\"logicSentenceId\":\"7580337795084877876\",\"content\":\"其他宫位按这样的方法推算。\"},{\"logicSentenceId\":\"7580337795084927028\",\"content\":\"就像甲年出生的人安命在寅宫，却按照‘甲巳之年丙寅首’，丙寅丁卯是炉中火，就去火局查找出生的日期来确定紫微帝主。\"},{\"logicSentenceId\":\"7580337795084861492\",\"content\":\"如果是丑时出生，就逆向转到丑宫确定命宫，顺向转到卯宫确定身宫；如果是寅时出生，就逆向转到子宫确定命宫，顺向转到辰宫确定身宫。\"},{\"logicSentenceId\":\"7580337795084894260\",\"content\":\"另外，如果是闰正月出生的人，要从二月开始确定命宫和身宫的位置，凡是遇到闰月的情况，都要依照这个规则处理。\"},{\"logicSentenceId\":\"7580337795084959796\",\"content\":\"如果算错了，就会差之毫厘，失之千里了。\"},{\"logicSentenceId\":\"7580337533881974818\",\"content\":\"大概推算命运都是从寅位开始，从正月起顺着数到出生的月份为止。\"},{\"logicSentenceId\":\"7580337795084976180\",\"content\":\"顺着顺序数到出生的时辰，就可以确定星曜的归藏宫位了。\"},{\"logicSentenceId\":\"7580337533881991202\",\"content\":\"又从人出生的月份开始以子时起算，逆推到出生的时辰来确定命宫，顺推到出生的时辰来确定身宫。\"},{\"logicSentenceId\":\"7580337795084910644\",\"content\":\"纳音甲子歌，一定要熟读。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":4108,"chapterOrder":14,"inChapterOrder":3,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158872928911397","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"18\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安十二宫例 \",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"19\",\"lineNum\":0,\"lineType\":2,\"content\":\"男女俱從逆轉，切記莫順去\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176278257205285","endPageId":"7330176278257205285","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":226,"chapterOrder":14,"inChapterOrder":4,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158872928927781","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"20\",\"lineNum\":0,\"lineType\":1,\"content\":\"一命宫，二兄弟，三妻妾，四子女，五財帛，六疾厄，七遷移，八奴僕，九官禄，十田宅，十一、福徳，十二父母。\",\"logicSentenceId\":\"7580337795084992564\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176278257205285","endPageId":"7330176278257205285","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795084992564\",\"content\":\"第一是命宫，第二是兄弟宫，第三是妻妾宫，第四是子女宫，第五是财帛宫，第六是疾厄宫，第七是迁移宫，第八是奴仆宫，第九是官禄宫，第十是田宅宫，第十一是福德宫，第十二是父母宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":621,"chapterOrder":14,"inChapterOrder":5,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158872928944165","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"21\",\"lineNum\":0,\"lineType\":10,\"content\":\"○起五寅例\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176278257205285","endPageId":"7330176278257205285","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":117,"chapterOrder":14,"inChapterOrder":6,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158872928960549","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"22\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲己之𡻕起丙寅，乙庚之𡻕起戊寅，丙辛之𡻕起庚寅，丁壬之𡻕起壬寅，戊癸之𡻕起甲寅。\",\"logicSentenceId\":\"7580337795085008948\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176278257205285","endPageId":"7330176278257205285","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085008948\",\"content\":\"甲年和己年从丙寅开始起算，乙年和庚年从戊寅开始起算，丙年和辛年从庚寅开始起算，丁年和壬年从壬寅开始起算，戊年和癸年从甲寅开始起算。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":533,"chapterOrder":14,"inChapterOrder":7,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873473908787","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"23\",\"lineNum\":0,\"lineType\":10,\"content\":\"○六十花甲子納音歌\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176278257205285","endPageId":"7330176278257205285","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":129,"chapterOrder":14,"inChapterOrder":8,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873473925171","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"24\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲子乙丑海中金，丙寅丁卯炉中火，戊辰己巳大林木，\",\"logicSentenceId\":\"7580337795085025332\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"25\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176346343079971\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"26\",\"lineNum\":0,\"lineType\":1,\"content\":\"庚午辛未路傍土，壬申癸酉劔鋒金。\",\"logicSentenceId\":\"7580337795085025332\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"27\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲戌乙亥山頭火，丙子丁丑澗下水，戊寅已卯城頭土，庚辰辛巳白臘金，壬午癸未楊柳木。\",\"logicSentenceId\":\"7580337795085041716\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"28\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲申乙酉泉中水，丙戍丁亥屋上王，戊子已丑霹靂火，庚寅辛卯松栢木，壬辰癸巳長流水。\",\"logicSentenceId\":\"7580337795085058100\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"29\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲午乙未沙中金，丙申丁酉山下火，戊戌巳亥平地木，庚子辛丑壁上土，壬寅癸卯金泊金。\",\"logicSentenceId\":\"7580337795085074484\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"30\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲辰乙巳覆灯火，丙午丁未天河水，戊申巳酉大驛土，庚戍辛亥釵釧金。\",\"logicSentenceId\":\"7580337795085090868\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"31\",\"lineNum\":0,\"lineType\":1,\"content\":\"壬子癸丑桑柘木，甲寅乙卯大溪水。\",\"logicSentenceId\":\"7580337795085107252\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"32\",\"lineNum\":0,\"lineType\":1,\"content\":\"丙辰丁巳沙中土，戊午巳未天上火，庚申辛酉石橊木，壬戍癸亥大海水。\",\"logicSentenceId\":\"7580337795085123636\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176278257205285","endPageId":"7330176346343079971","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085107252\",\"content\":\"壬子年和癸丑年是桑柘木，甲寅年和乙卯年是大溪水。\"},{\"logicSentenceId\":\"7580337795085123636\",\"content\":\"丙辰年、丁巳年对应的是沙中土，戊午年、己未年对应的是天上火，庚申年、辛酉年对应的是石榴木，壬戌年、癸亥年对应的是大海水。\"},{\"logicSentenceId\":\"7580337795085025332\",\"content\":\"甲子、乙丑年的年柱的纳音为海中金，丙寅、丁卯年的年柱的纳音为炉中火，戊辰、己巳年的年柱的纳音为大林木，庚午、辛未年的年柱的纳音为路旁土，壬申、癸酉年的年柱的纳音为剑锋金。\"},{\"logicSentenceId\":\"7580337795085041716\",\"content\":\"甲戌年、乙亥年是山头火命，丙子年、丁丑年是涧下水命，戊寅年、己卯年是城头土命，庚辰年、辛巳年是白腊金命，壬午年、癸未年是杨柳木命。\"},{\"logicSentenceId\":\"7580337795085058100\",\"content\":\"甲申年、乙酉年出生对应的是泉中水命，丙戌年、丁亥年出生对应的是屋上土命，戊子年、己丑年出生对应的是霹雳火命，庚寅年、辛卯年出生对应的是松柏木命，壬辰年、癸巳年出生对应的是长流水命。\"},{\"logicSentenceId\":\"7580337795085074484\",\"content\":\"甲午年、乙未年对应的是沙中金，丙申年、丁酉年对应的是山下火，戊戌年、己亥年对应的是平地木，庚子年、辛丑年对应的是壁上土，壬寅年、癸卯年对应的是金箔金。\"},{\"logicSentenceId\":\"7580337795085090868\",\"content\":\"甲辰年、乙巳年对应的是覆灯火，丙午年、丁未年对应的是天河水，戊申年、己酉年对应的是大驿土，庚戌年、辛亥年对应的是钗钏金。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":3625,"chapterOrder":14,"inChapterOrder":9,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873473941555","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"33\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安南北斗諸星訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343079971","endPageId":"7330176346343079971","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":126,"chapterOrder":14,"inChapterOrder":10,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873473957939","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"34\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176365976666122\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"35\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫㣲天機逆行傍，隔一陽武天同當，又隔二位𤎉貞地，空三復見紫㣲郎。\",\"logicSentenceId\":\"7580337795085140020\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"36\",\"lineNum\":0,\"lineType\":1,\"content\":\"天府太隂與貪狼，巨門天相及天梁七殺空三破軍位，八星順数細推詳。\",\"logicSentenceId\":\"7580337795085156404\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176365976666122","endPageId":"7330176365976666122","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085140020\",\"content\":\"紫微天机逆向而行依傍在旁，隔一颗星是阳武、天同星所在位置，又相隔两个位置，廉贞、地空星三次重复出现后见到紫微郎星。\"},{\"logicSentenceId\":\"7580337795085156404\",\"content\":\"天府星、太阴星和贪狼星，巨门星、天相星以及天梁星，七杀星空过三位到破军星的位置，这八颗星按顺序仔细推算端详。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1034,"chapterOrder":14,"inChapterOrder":11,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873473974323","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"37\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安文昌文曲星訣 \",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"38\",\"lineNum\":0,\"lineType\":2,\"content\":\"論本生時\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176365976666122","endPageId":"7330176365976666122","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":208,"chapterOrder":14,"inChapterOrder":12,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873473990707","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"39\",\"lineNum\":0,\"lineType\":1,\"content\":\"子時戍上起文昌，逆到生時是貴郷。\",\"logicSentenceId\":\"7580337795085172788\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"40\",\"lineNum\":0,\"lineType\":1,\"content\":\"文曲数從辰上起，文昌星從戌上起子時，如人生子時，就在戍宫安；若丑時逆至酉宫安之。\",\"logicSentenceId\":\"7580337795085189172\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"41\",\"lineNum\":0,\"lineType\":1,\"content\":\"文曲星從辰上起子時，若人生子時，就在辰宫安，若丑時順去巳宫安之，餘宫星此。\",\"logicSentenceId\":\"7580337795085205556\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176365976666122","endPageId":"7330176365976666122","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085172788\",\"content\":\"子时从戌位起文昌星，逆推到出生时辰所在的宫位就是贵乡。\"},{\"logicSentenceId\":\"7580337795085189172\",\"content\":\"文曲星从辰宫起数，文昌星从戌宫开始对应子时来推算，如人生于子时，就在戌宫安文昌星；若出生在丑时，就逆推到酉宫安放文昌星。\"},{\"logicSentenceId\":\"7580337795085205556\",\"content\":\"文曲星从辰宫起子时，如果人生于子时，就将文曲星安在辰宫；如果生于丑时，就将文曲星顺移到巳宫，其余各宫以此类推。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1282,"chapterOrder":14,"inChapterOrder":13,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474007091","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"42\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安左輔、右弼星訣 \",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"43\",\"lineNum\":0,\"lineType\":2,\"content\":\"論本生月\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176365976666122","endPageId":"7330176365976666122","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":211,"chapterOrder":14,"inChapterOrder":14,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474023475","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"44\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176346343178275\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"45\",\"lineNum\":0,\"lineType\":1,\"content\":\"左輔正月起於辰，順逢生月是貴倣。\",\"logicSentenceId\":\"7580337795085221940\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"46\",\"lineNum\":0,\"lineType\":1,\"content\":\"右弼正月宫尋戌，逆至生月便調停。\",\"logicSentenceId\":\"7580337795085238324\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343178275","endPageId":"7330176346343178275","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085221940\",\"content\":\"左辅星从正月开始在辰宫起算，按照顺序数到出生的月份所在的宫位就是贵乡。\"},{\"logicSentenceId\":\"7580337795085238324\",\"content\":\"右弼星从正月对应的戌宫开始推算，逆着数到出生的月份就确定其位置。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":808,"chapterOrder":14,"inChapterOrder":15,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474039859","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"47\",\"lineNum\":0,\"lineType\":1,\"content\":\"左輔從辰上起，正月順行，如正月生者，就辰宫安之，二月在巳宫。\",\"logicSentenceId\":\"7580337795085254708\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"48\",\"lineNum\":0,\"lineType\":1,\"content\":\"右弼從宫逆轉，如正月就戍宫安之，二月在酉宫。\",\"logicSentenceId\":\"7580337795085271092\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"49\",\"lineNum\":0,\"lineType\":1,\"content\":\"餘倣此。\",\"logicSentenceId\":\"7580337795085287476\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343178275","endPageId":"7330176346343178275","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085254708\",\"content\":\"左辅星从辰宫起始，正月顺行，如正月出生的人，就将左辅星安在辰宫，二月出生的人，就将左辅星安在巳宫。\"},{\"logicSentenceId\":\"7580337795085271092\",\"content\":\"右弼从戌宫开始逆时针转动，比如正月出生的人就在戌宫安置右弼，二月出生的就在酉宫安置。\"},{\"logicSentenceId\":\"7580337795085287476\",\"content\":\"其他月份以此类推。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1045,"chapterOrder":14,"inChapterOrder":16,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474056243","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"50\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安天魁天鉞訣 \",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"51\",\"lineNum\":0,\"lineType\":2,\"content\":\"論本生年干\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343178275","endPageId":"7330176346343178275","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":208,"chapterOrder":14,"inChapterOrder":17,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474072627","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"52\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲戊庚牛羊，乙巳䑕㺅郷。\",\"logicSentenceId\":\"7580337795085303860\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"53\",\"lineNum\":0,\"lineType\":1,\"content\":\"六辛逢馬虎，壬癸兎蛇藏。\",\"logicSentenceId\":\"7580337795085320244\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"54\",\"lineNum\":0,\"lineType\":1,\"content\":\"丙丁猪鷄位，此是貴人方。\",\"logicSentenceId\":\"7580337795085336628\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"55\",\"lineNum\":0,\"lineType\":1,\"content\":\"二星主科甲。\",\"logicSentenceId\":\"7580337795085353012\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"56\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命若逢之，金榜題名客。\",\"logicSentenceId\":\"7580337795085369396\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343178275","endPageId":"7330176346343178275","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085303860\",\"content\":\"甲、戊、庚年出生的人，贵人在丑牛、未羊；乙、巳年出生的人，贵人在子鼠、申猴。\"},{\"logicSentenceId\":\"7580337795085320244\",\"content\":\"辛年出生的人，贵人在马、虎的方位。壬、癸年出生的人，贵人在兔、蛇的方位。\"},{\"logicSentenceId\":\"7580337795085336628\",\"content\":\"丙日和丁日出生的人，贵人在猪和鸡对应的方位，这就是贵人所在的方位。\"},{\"logicSentenceId\":\"7580337795085353012\",\"content\":\"这两颗星主管科举功名。\"},{\"logicSentenceId\":\"7580337795085369396\",\"content\":\"身宫、命宫如果遇到这两颗星，就会成为金榜题名之人。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1532,"chapterOrder":14,"inChapterOrder":18,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474089011","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"57\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安天馬星訣 \",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"58\",\"lineNum\":0,\"lineType\":2,\"content\":\"論本生年支\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343178275","endPageId":"7330176346343178275","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":205,"chapterOrder":14,"inChapterOrder":19,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474105395","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"59\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176365976813578\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"60\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅午戍人馬居申，申子辰人馬居寅，巳酉丑人馬在亥，亥卯未人馬在巳。\",\"logicSentenceId\":\"7580337795085385780\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176365976813578","endPageId":"7330176365976813578","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085385780\",\"content\":\"出生在寅年、午年、戌年的人，驿马星在申宫；出生在申年、子年、辰年的人，驿马星在寅宫；出生在巳年、酉年、丑年的人，驿马星在亥宫；出生在亥年、卯年、未年的人，驿马星在巳宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":677,"chapterOrder":14,"inChapterOrder":20,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474121779","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"61\",\"lineNum\":0,\"lineType\":1,\"content\":\"如安命在辰戌丑未，遇夫妻宫在寅申，巳亥有天馬。\",\"logicSentenceId\":\"7580337795085402164\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"62\",\"lineNum\":0,\"lineType\":1,\"content\":\"若得同位，或三方照臨，必主男為官，女封贈，不然得禄馬交馳，亦吉。\",\"logicSentenceId\":\"7580337795085418548\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176365976813578","endPageId":"7330176365976813578","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085418548\",\"content\":\"如果星曜处于同位，或者三方有星曜照临，必定主男子为官、女子受封赠，即使没有这种情况，若能形成禄马交驰的格局，也是吉利的。\"},{\"logicSentenceId\":\"7580337795085402164\",\"content\":\"如果命宫落在辰、戌、丑、未这四个宫位，遇到夫妻宫落在寅、申宫位，那么巳、亥宫位有天马星。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":872,"chapterOrder":14,"inChapterOrder":21,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474138163","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"63\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安禄存星訣 \",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"64\",\"lineNum\":0,\"lineType\":2,\"content\":\"論本生年干\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176365976813578","endPageId":"7330176365976813578","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":205,"chapterOrder":14,"inChapterOrder":22,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474154547","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"65\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲生禄存在寅官，乙生在卯，丙戊巳，丁巳禄存停午方，庚禄居申，辛禄酉，壬禄在亥，癸禄子。\",\"logicSentenceId\":\"7580337795085434932\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176365976813578","endPageId":"7330176365976813578","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085434932\",\"content\":\"甲生禄存在寅宫，乙生禄存在卯宫，丙、戊生禄存在巳宫，丁生禄存在午宫，庚生禄存在申宫，辛生禄存在酉宫，壬生禄存在亥宫，癸生禄存在子宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":540,"chapterOrder":14,"inChapterOrder":23,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474170931","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"66\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安擎羊、陀羅二星訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176365976813578","endPageId":"7330176365976813578","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":132,"chapterOrder":14,"inChapterOrder":24,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474187315","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"67\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄前擎羊後陀羅，夾限逢㐫禍患多。\",\"logicSentenceId\":\"7580337795085451316\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"68\",\"lineNum\":0,\"lineType\":1,\"content\":\"𡻕限逢之多不利，\",\"logicSentenceId\":\"7580337795085467700\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"69\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176346343243811\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"70\",\"lineNum\":0,\"lineType\":1,\"content\":\"人生遇此莫蹉陀。\",\"logicSentenceId\":\"7580337795085467700\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176365976813578","endPageId":"7330176346343243811","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085467700\",\"content\":\"岁限逢到这种情况多有不利，人生遇到这种情况不要虚度光阴。\"},{\"logicSentenceId\":\"7580337795085451316\",\"content\":\"禄存星前面是擎羊星，后面是陀罗星，星曜夹限遇到凶象，祸患就多。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":892,"chapterOrder":14,"inChapterOrder":25,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474203699","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"71\",\"lineNum\":0,\"lineType\":1,\"content\":\"此二星隨禄存安之，禄前安擎羊，禄後安陀羅。\",\"logicSentenceId\":\"7580337795085484084\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"72\",\"lineNum\":0,\"lineType\":1,\"content\":\"假如癸禄在子丑宫安擎羊，亥宫安陀羅。\",\"logicSentenceId\":\"7580337795085500468\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"73\",\"lineNum\":0,\"lineType\":1,\"content\":\"餘倣此。\",\"logicSentenceId\":\"7580337795085516852\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343243811","endPageId":"7330176346343243811","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085500468\",\"content\":\"例如癸的禄存在子宫，在丑宫安置擎羊，在亥宫安置陀罗。\"},{\"logicSentenceId\":\"7580337795085516852\",\"content\":\"其余仿照此例。\"},{\"logicSentenceId\":\"7580337795085484084\",\"content\":\"擎羊星和陀罗星是随着禄存星来确定位置的，禄存星前面安放擎羊星，禄存星后面安放陀罗星。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":931,"chapterOrder":14,"inChapterOrder":26,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158873474220083","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"74\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安火鈴二星訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343243811","endPageId":"7330176346343243811","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":123,"chapterOrder":14,"inChapterOrder":27,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369734182","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"75\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅午戌人丑卯方，申子辰人寅戌塲，巳酉丑人卯戌位，亥卯未人酉戌房。\",\"logicSentenceId\":\"7580337795085533236\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343243811","endPageId":"7330176346343243811","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085533236\",\"content\":\"寅年、午年、戌年出生的人，擎羊星在丑宫、陀罗星在卯宫；申年、子年、辰年出生的人，擎羊星在寅宫、陀罗星在戌宫；巳年、酉年、丑年出生的人，擎羊星在卯宫、陀罗星在戌宫；亥年、卯年、未年出生的人，擎羊星在酉宫、陀罗星在戌宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":633,"chapterOrder":14,"inChapterOrder":28,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369750566","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"76\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安禄權科忌四星變化訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343243811","endPageId":"7330176346343243811","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":135,"chapterOrder":14,"inChapterOrder":29,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369766950","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"77\",\"lineNum\":0,\"lineType\":1,\"content\":\" \",\"logicSentenceId\":\"7580337795085549620\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"78\",\"lineNum\":0,\"lineType\":2,\"content\":\"論生年，干挾火而化\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343243811","endPageId":"7330176346343243811","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085549620\",\"content\":\" \"}]}","chapterId":"1jvzooy7dkbhh","dataSize":311,"chapterOrder":14,"inChapterOrder":30,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369783334","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"79\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲𤎉破武陽為伴，乙機梁紫月交侵。\",\"logicSentenceId\":\"7580337795085566004\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"80\",\"lineNum\":0,\"lineType\":1,\"content\":\"丙同機昌𤎉貞位，丁月同機巨門尋。\",\"logicSentenceId\":\"7580337795085582388\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"81\",\"lineNum\":0,\"lineType\":1,\"content\":\"戊貪月弼機為主，巳武貪梁曲最平。\",\"logicSentenceId\":\"7580337795085598772\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"82\",\"lineNum\":0,\"lineType\":1,\"content\":\"庚日武同相為首，辛巨陽曲昌至臨，壬梁紫府武宿是，\",\"logicSentenceId\":\"7580337795085615156\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"83\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176436109606921\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"84\",\"lineNum\":0,\"lineType\":1,\"content\":\"癸破巨隂貪狼停。\",\"logicSentenceId\":\"7580337795085615156\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343243811","endPageId":"7330176436109606921","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085566004\",\"content\":\"甲年出生的人廉贞、破军、武曲、太阳为伴，乙年出生的人天机、天梁、紫微、太阴相互影响。\"},{\"logicSentenceId\":\"7580337795085582388\",\"content\":\"丙年出生的人，天同、天机、文昌、廉贞同宫；丁年出生的人，太阴、天同、天机、巨门相随。\"},{\"logicSentenceId\":\"7580337795085598772\",\"content\":\"戊年出生以贪狼、太阴、右弼、天机为主星，巳年出生武曲、贪狼、天梁、文昌最为平和。\"},{\"logicSentenceId\":\"7580337795085615156\",\"content\":\"庚日以武曲、天同、天相三星为首，辛日巨门、太阳、文昌、文曲四星降临，壬日是天梁、紫微、天府、武曲星宿，癸日破军、巨门、太阴、贪狼星停留。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1800,"chapterOrder":14,"inChapterOrder":31,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369799718","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"85\",\"lineNum\":0,\"lineType\":1,\"content\":\"如甲生人，𤎉貞化禄，破軍化權，武曲化科，太陽化忌是也。\",\"logicSentenceId\":\"7580337795085631540\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"86\",\"lineNum\":0,\"lineType\":1,\"content\":\"餘倣此。\",\"logicSentenceId\":\"7580337795085647924\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176436109606921","endPageId":"7330176436109606921","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085647924\",\"content\":\"其余的情况仿照这样处理。\"},{\"logicSentenceId\":\"7580337795085631540\",\"content\":\"比如甲年出生的人，廉贞化禄、破军化权、武曲化科、太阳化忌，就是这样。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":627,"chapterOrder":14,"inChapterOrder":32,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369816102","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"87\",\"lineNum\":0,\"lineType\":10,\"content\":\"○天空地刼訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176436109606921","endPageId":"7330176436109606921","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":120,"chapterOrder":14,"inChapterOrder":33,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369832486","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"88\",\"lineNum\":0,\"lineType\":1,\"content\":\" \",\"logicSentenceId\":\"7580337795085664308\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"89\",\"lineNum\":0,\"lineType\":2,\"content\":\"論本生時\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176436109606921","endPageId":"7330176436109606921","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085664308\",\"content\":\" \"}]}","chapterId":"1jvzooy7dkbhh","dataSize":296,"chapterOrder":14,"inChapterOrder":34,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369848870","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"90\",\"lineNum\":0,\"lineType\":1,\"content\":\"亥上起子順安刼，逆囬便是天空郷。\",\"logicSentenceId\":\"7580337795085680692\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176436109606921","endPageId":"7330176436109606921","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085680692\",\"content\":\"从亥宫起子位顺着排布劫煞星，反向排布就是天空星所在之处。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":345,"chapterOrder":14,"inChapterOrder":35,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369865254","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"91\",\"lineNum\":0,\"lineType\":1,\"content\":\"如子時生者，刼空俱在亥宫；若丑時生者，刼順在子宮，空逆在戌宫；若午時生者，刼空俱在巳上安之，餘倣此。\",\"logicSentenceId\":\"7580337795085697076\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176436109606921","endPageId":"7330176436109606921","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085697076\",\"content\":\"如果是子时出生的人，劫煞和天空都在亥宫；如果是丑时出生的人，劫煞顺行在子宫，天空逆行在戌宫；如果是午时出生的人，劫煞和天空都安在巳宫，其余情况以此类推。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":591,"chapterOrder":14,"inChapterOrder":36,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369881638","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"92\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安天傷天使訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176436109606921","endPageId":"7330176436109606921","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":123,"chapterOrder":14,"inChapterOrder":37,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369898022","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"93\",\"lineNum\":0,\"lineType\":1,\"content\":\"命前六位是天傷，命後六位，天使當順数。\",\"logicSentenceId\":\"7580337795085713460\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"94\",\"lineNum\":0,\"lineType\":1,\"content\":\"命前六位是天傷，逆数，命後六宫是天使。\",\"logicSentenceId\":\"7580337795085729844\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"95\",\"lineNum\":0,\"lineType\":1,\"content\":\"天傷安在\",\"logicSentenceId\":\"7580337795085746228\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"96\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176346343358499\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"97\",\"lineNum\":0,\"lineType\":1,\"content\":\"奴僕宫，天使安在疾厄。\",\"logicSentenceId\":\"7580337795085746228\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"98\",\"lineNum\":0,\"lineType\":1,\"content\":\"官。\",\"logicSentenceId\":\"7580337795085762612\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"99\",\"lineNum\":0,\"lineType\":1,\"content\":\"身與歳限夾在傷使中間，謂之奴夾地，更加𢙣矅，多㐫。\",\"logicSentenceId\":\"7580337795085778996\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176436109606921","endPageId":"7330176346343358499","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085762612\",\"content\":\"官。\"},{\"logicSentenceId\":\"7580337795085778996\",\"content\":\"身宫与岁限夹在天伤和天使中间，这叫做奴夹地，再加上恶煞，大多会有凶险。\"},{\"logicSentenceId\":\"7580337795085713460\",\"content\":\"命宫往前数六位是天伤星，命宫往后数六位，应顺着数出天使星。\"},{\"logicSentenceId\":\"7580337795085729844\",\"content\":\"从命宫向前数六位是天伤星，按逆时针数，从命宫向后数六宫是天使星。\"},{\"logicSentenceId\":\"7580337795085746228\",\"content\":\"天伤星安置在奴仆宫，天使星安置在疾厄宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1759,"chapterOrder":14,"inChapterOrder":38,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369914406","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"100\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安十二宫太𡻕殺禄神歌訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343358499","endPageId":"7330176346343358499","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":140,"chapterOrder":14,"inChapterOrder":39,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369930790","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"101\",\"lineNum\":0,\"lineType\":1,\"content\":\"慱士力士青龍續，小耗將軍及奏書。\",\"logicSentenceId\":\"7580337795085795380\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"102\",\"lineNum\":0,\"lineType\":1,\"content\":\"蜚𤎉喜神病符録，大耗處兵至官府。\",\"logicSentenceId\":\"7580337795085811764\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"103\",\"lineNum\":0,\"lineType\":1,\"content\":\"吉㐫從此尋。\",\"logicSentenceId\":\"7580337795085828148\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"104\",\"lineNum\":0,\"lineType\":1,\"content\":\"禍福要知，不拘男女命尋禄存星起，陽男隂女順推輪，隂男陽女逆流行。\",\"logicSentenceId\":\"7580337795085844532\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343358499","endPageId":"7330176346343358499","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085844532\",\"content\":\"要知晓祸福，不论男女命都从禄存星开始推算，阳男阴女顺推，阴男阳女逆推。\"},{\"logicSentenceId\":\"7580337795085795380\",\"content\":\"博士、力士、青龙依次排列，接着是小耗、将军和奏书。\"},{\"logicSentenceId\":\"7580337795085811764\",\"content\":\"蜚廉、喜神、病符录，大耗、处兵、官府。\"},{\"logicSentenceId\":\"7580337795085828148\",\"content\":\"吉凶从此推断。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1232,"chapterOrder":14,"inChapterOrder":40,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369947174","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"105\",\"lineNum\":0,\"lineType\":1,\"content\":\"愽士聦明力士權，青龍喜氣小耗錢，將軍威武奏書福，蜚𤎉主孤喜神延。\",\"logicSentenceId\":\"7580337795085860916\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"106\",\"lineNum\":0,\"lineType\":1,\"content\":\"病符𢃄疾耗退祖，伏兵官府口舌纒。\",\"logicSentenceId\":\"7580337795085877300\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"107\",\"lineNum\":0,\"lineType\":1,\"content\":\"生年坐守十二殺，方敢断人禍福源。\",\"logicSentenceId\":\"7580337795085893684\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176346343358499","endPageId":"7330176346343358499","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795085893684\",\"content\":\"根据出生年份坐守十二宫神煞的情况，才敢推断人的祸福根源。\"},{\"logicSentenceId\":\"7580337795085860916\",\"content\":\"博士星代表聪明，力士星象征权力，青龙星带来喜气，小耗星损钱财，将军星体现威武，奏书星赐福运，蜚廉星主孤独，喜神星延续吉祥。\"},{\"logicSentenceId\":\"7580337795085877300\",\"content\":\"病符带来疾病，大耗导致祖业衰退；伏兵星和官府星导致口舌是非缠身。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1137,"chapterOrder":14,"inChapterOrder":41,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875369963558","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"108\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176436109819913\"},\"logicSentenceId\":\"0\",\"ma 83873074","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"171\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅午戌人起辰宫，申子辰人起戌宫，巳酉丑人起未宫，亥卯未人起丑宫。\",\"logicSentenceId\":\"7580337795086417972\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911314959","endPageId":"7330176536911314959","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795086417972\",\"content\":\"出生年份地支为寅、午、戌的人从辰宫开始推算，出生年份地支为申、子、辰的人从戌宫开始推算，出生年份地支为巳、酉、丑的人从未宫开始推算，出生年份地支为亥、卯、未的人从丑宫开始推算。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":574,"chapterOrder":14,"inChapterOrder":82,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875583889458","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"172\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安童限訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911314959","endPageId":"7330176536911314959","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":118,"chapterOrder":14,"inChapterOrder":83,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875583905842","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"173\",\"lineNum\":0,\"lineType\":1,\"content\":\"一命二財三疾厄，四妻五福六官禄。\",\"logicSentenceId\":\"7580337795086434356\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"174\",\"lineNum\":0,\"lineType\":1,\"content\":\"餘年一泒順流行，十五命宫㸔端的。\",\"logicSentenceId\":\"7580337795086450740\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911314959","endPageId":"7330176536911314959","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795086434356\",\"content\":\"第一个宫位是命宫，第二个是财帛宫，第三个是疾厄宫，第四个是妻妾宫，第五个是福德宫，第六个是官禄宫。\"},{\"logicSentenceId\":\"7580337795086450740\",\"content\":\"余下的宫位依次顺流行进，到第十五宫命宫时需详察其究竟。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":721,"chapterOrder":14,"inChapterOrder":84,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875583922226","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"175\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安命主\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911314959","endPageId":"7330176536911314959","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":115,"chapterOrder":14,"inChapterOrder":85,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875583938610","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"176\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼子宫，巨門，亥丑二宫，禄存，寅戍宫，文曲，卯酉宫，破軍午宫，𤎉貞申辰宫，武曲未巳宫。\",\"logicSentenceId\":\"7580337795086467124\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911314959","endPageId":"7330176536911314959","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580337795086467124\",\"content\":\"贪狼星在子宫，巨门星在亥宫和丑宫，禄存星在寅宫和戌宫，文曲星在卯宫和酉宫，破军星在午宫，廉贞星在申宫和辰宫，武曲星在未宫和巳宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":539,"chapterOrder":14,"inChapterOrder":86,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875583954994","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"177\",\"lineNum\":0,\"lineType\":1,\"content\":\"假如午宫安命，尋破軍星在何宫，卯命主星也。\",\"logicSentenceId\":\"7580338556200026152\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"178\",\"lineNum\":0,\"lineType\":1,\"content\":\"子宫安命，\",\"logicSentenceId\":\"7580338556200042536\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"179\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176554300981298\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"180\",\"lineNum\":0,\"lineType\":1,\"content\":\"尋貪狼星，即命主也。\",\"logicSentenceId\":\"7580338556200042536\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"181\",\"lineNum\":0,\"lineType\":1,\"content\":\"左輔隨丑至午，右弼隨亥至午。\",\"logicSentenceId\":\"7580338556200058920\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911314959","endPageId":"7330176554300981298","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556200026152\",\"content\":\"假如在午宫安命，查找破军星在哪个宫，卯宫的星就是命主星。\"},{\"logicSentenceId\":\"7580338556200042536\",\"content\":\"在子宫定位命宫，寻找贪狼星，贪狼星就是命主星。\"},{\"logicSentenceId\":\"7580338556200058920\",\"content\":\"左辅星从丑宫顺行到午宫，右弼星从亥宫顺行到午宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1180,"chapterOrder":14,"inChapterOrder":87,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600420873","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"182\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安身主\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176554300981298","endPageId":"7330176554300981298","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":115,"chapterOrder":14,"inChapterOrder":88,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600437257","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"183\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午人火鈴星，丑未人天相星，寅申人天梁星，辰戍人文昌星，已亥人天機主，卯酉人天同星。\",\"logicSentenceId\":\"7580338556200075304\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176554300981298","endPageId":"7330176554300981298","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556200075304\",\"content\":\"子年、午年出生的人，火铃星是命主星；丑年、未年出生的人，天相星是命主星；寅年、申年出生的人，天梁星是命主星；辰年、戌年出生的人，文昌星是命主星；巳年、亥年出生的人，天机星是命主星；卯年、酉年出生的人，天同星是命主星。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":664,"chapterOrder":14,"inChapterOrder":89,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600453641","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"184\",\"lineNum\":0,\"lineType\":10,\"content\":\"論安金鎻鉄蛇関\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176554300981298","endPageId":"7330176554300981298","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":90,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600470025","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"185\",\"lineNum\":0,\"lineType\":1,\"content\":\"當從戌上起子年，順数行年月逆推，日又順数時又逆，小見夀夭可先知。\",\"logicSentenceId\":\"7580338556200091688\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176554300981298","endPageId":"7330176554300981298","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556200091688\",\"content\":\"应当从戌宫起子年，年份顺数、月份逆推，日期再顺数、时辰又逆推，稍微推算就能预先知晓寿命长短。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":448,"chapterOrder":14,"inChapterOrder":91,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600486409","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"186\",\"lineNum\":0,\"lineType\":1,\"content\":\"此法從戌上起年，順行至本生年，年上起月，逆数至本生月，月上起日，日上起時，逆至本生時。\",\"logicSentenceId\":\"7580338556200108072\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"187\",\"lineNum\":0,\"lineType\":1,\"content\":\"遇丑未宫病，有救，辰戍宫死。\",\"logicSentenceId\":\"7580338556200124456\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176554300981298","endPageId":"7330176554300981298","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556200108072\",\"content\":\"这个方法从戌宫开始起算年份，顺行到出生的年份，再从该年位起算月份，逆着顺序数到出生的月份，接着从该月位起算日期，再从该日位起算时辰，逆着顺序数到出生的时辰。\"},{\"logicSentenceId\":\"7580338556200124456\",\"content\":\"当推到丑宫、未宫时代表生病，有救；推到辰宫、戌宫时代表死亡。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":892,"chapterOrder":14,"inChapterOrder":92,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600502793","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"188\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176536911446031\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"189\",\"lineNum\":0,\"lineType\":10,\"content\":\"○定男女竹羅三限\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911446031","endPageId":"7330176536911446031","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":244,"chapterOrder":14,"inChapterOrder":93,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600519177","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"190\",\"lineNum\":0,\"lineType\":1,\"content\":\"法曰：同前帝星局例，只是逆行，以上此二数逆排定，只把三方四正，七殺破軍，佳作竹蘿三限。\",\"logicSentenceId\":\"7580338556200140840\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"191\",\"lineNum\":0,\"lineType\":1,\"content\":\"若再加巨暗㐫星，便作三方四正定議。\",\"logicSentenceId\":\"7580338556200157224\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"192\",\"lineNum\":0,\"lineType\":1,\"content\":\"若大小二限相遇，作死限断。\",\"logicSentenceId\":\"7580338556200173608\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911446031","endPageId":"7330176536911446031","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556200140840\",\"content\":\"方法是：和前面帝星局的例子相同，只是逆行，以上这两个数按逆序排定，只看三方四正，七杀、破军，可作为竹萝三限。\"},{\"logicSentenceId\":\"7580338556200157224\",\"content\":\"如果再加上巨暗凶星，就按照三方四正的规则来确定论断。\"},{\"logicSentenceId\":\"7580338556200173608\",\"content\":\"如果大限和小限相遇，就判定为死限。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1090,"chapterOrder":14,"inChapterOrder":94,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600535561","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"193\",\"lineNum\":0,\"lineType\":10,\"content\":\"○定十二宫弱強\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911446031","endPageId":"7330176536911446031","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":95,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600551945","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"194\",\"lineNum\":0,\"lineType\":1,\"content\":\"男命：財帛、官祿、福徳，遷移、田宅為強宫，子女、奴僕、兄弟、父母為弱宫。\",\"logicSentenceId\":\"7580338556200189992\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911446031","endPageId":"7330176536911446031","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556200189992\",\"content\":\"男命：财帛宫、官禄宫、福德宫、迁移宫、田宅宫为强宫，子女宫、奴仆宫、兄弟宫、父母宫为弱宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":457,"chapterOrder":14,"inChapterOrder":96,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600568329","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"195\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命：夫君、子息、財帛、田宅、福徳為強，餘宫皆弱。\",\"logicSentenceId\":\"7580338556200206376\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911446031","endPageId":"7330176536911446031","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556200206376\",\"content\":\"女命：夫妻宫、子女宫、财帛宫、田宅宫、福德宫为强宫，其余宫位都为弱宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":394,"chapterOrder":14,"inChapterOrder":97,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600584713","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"196\",\"lineNum\":0,\"lineType\":10,\"content\":\"○定十二宫星辰落閑宫\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911446031","endPageId":"7330176536911446031","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":133,"chapterOrder":14,"inChapterOrder":98,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600601097","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"197\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫㣲在子，辰亥為閑宫，貪狼在寅申為閑宫，天相在辰\",\"logicSentenceId\":\"7580338556200222760\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"198\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176554301145138\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"199\",\"lineNum\":0,\"lineType\":1,\"content\":\"戌為閑宫，七殺在辰亥為閑宫，天梁在己酉為閑官，天機在巳為閑宫，破軍在巳申為閑宫，武曲在申為閑宫。\",\"logicSentenceId\":\"7580338556200222760\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176536911446031","endPageId":"7330176554301145138","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556200222760\",\"content\":\"紫微在子，辰宫和亥宫为闲宫；贪狼在寅宫和申宫为闲宫；天相在辰宫和戌宫为闲宫；七杀在辰宫和亥宫为闲宫；天梁在己酉位为闲官；天机在巳宫为闲宫；破军在巳宫和申宫为闲宫；武曲在申宫为闲宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":925,"chapterOrder":14,"inChapterOrder":99,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875600617481","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"200\",\"lineNum\":0,\"lineType\":10,\"content\":\"○安流禄、流羊、流陀訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176554301145138","endPageId":"7330176554301145138","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":136,"chapterOrder":14,"inChapterOrder":100,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875898429477","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"201\",\"lineNum\":0,\"lineType\":1,\"content\":\"論流年太𡻕，假如巳丑年，𣴑禄在午，流羊在未，流陀在己。\",\"logicSentenceId\":\"7580338556200239144\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"202\",\"lineNum\":0,\"lineType\":1,\"content\":\"如甲子生人安命在巳，小限又行在亥，或七殺坐小限，擎羊又在卯宫却\",\"logicSentenceId\":\"7580338556200255528\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"203\",\"lineNum\":0,\"lineType\":2,\"content\":\"。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"204\",\"lineNum\":0,\"lineType\":1,\"content\":\"是，三方四正俱見擎羊、流羊、流陀，又七殺重逢，必𮞸毒禍。\",\"logicSentenceId\":\"7580338556200255528\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"205\",\"lineNum\":0,\"lineType\":1,\"content\":\"此乃余試之騐訣也。\",\"logicSentenceId\":\"7580338556200271912\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176554301145138","endPageId":"7330176554301145138","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556200239144\",\"content\":\"论流年太岁，假如巳丑年，流年禄存星在午宫，流年擎羊星在未宫，流陀在己宫。\"},{\"logicSentenceId\":\"7580338556200255528\",\"content\":\"例如甲子年出生的人，命宫在巳宫，小限又运行到亥宫，或者七杀星坐落在小限宫，擎羊星又在卯宫确实如此，而且三方四正的宫位都出现擎羊星、流羊星、流陀星，又与七杀星重逢，必定会遭遇凶险灾祸。\"},{\"logicSentenceId\":\"7580338556200271912\",\"content\":\"这就是我经过验证的口诀。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1466,"chapterOrder":14,"inChapterOrder":101,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158875898445861","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"206\",\"lineNum\":0,\"lineType\":10,\"content\":\"○論星辰生尅制化\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176554301145138","endPageId":"7330176554301145138","contentEncryptType":0,"translateC eId\":\"7580338556201549864\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"322\",\"lineNum\":0,\"lineType\":1,\"content\":\"月禄馬三合，極吉，食禄千鍾，巨冨大貴，與禄存同，竒特不入庙，無左右為孤君，亦清閑。\",\"logicSentenceId\":\"7580338556201566248\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"323\",\"lineNum\":0,\"lineType\":1,\"content\":\"僧道與破軍同，為胥吏，與羊陀火鈴冲合，吉多，亦發財。\",\"logicSentenceId\":\"7580338556201582632\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"324\",\"lineNum\":0,\"lineType\":1,\"content\":\"常庶人吉。\",\"logicSentenceId\":\"7580338556201599016\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"325\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命㑹吉星淸秀，旺夫益子。\",\"logicSentenceId\":\"7580338556201615400\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176777697968128","endPageId":"7330176777697968128","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556201582632\",\"content\":\"僧人道士与破军星同宫，会成为小官吏；与擎羊、陀罗、火星、铃星相冲或相合，吉兆居多，也会发财。\"},{\"logicSentenceId\":\"7580338556201599016\",\"content\":\"普通百姓吉利。\"},{\"logicSentenceId\":\"7580338556201615400\",\"content\":\"女性命盘若会合吉星，则容貌清秀，能使丈夫兴旺，子女受益。\"},{\"logicSentenceId\":\"7580338556201533480\",\"content\":\"紫微属土，在南北斗化为帝座，是官禄主星，主星是紫微，脸色呈紫色，或者白皙清透，腰背丰满，为人忠厚、成熟稳重，谦逊恭敬且正直，其威严能制伏七杀星，降伏火星、铃星。\"},{\"logicSentenceId\":\"7580338556201549864\",\"content\":\"如果与天府星、左辅星、右弼星、文昌星、文曲星、太阳星相遇。\"},{\"logicSentenceId\":\"7580338556201566248\",\"content\":\"与太阴、禄存、天马三星三合，极为吉利，能享受千钟俸禄，大富大贵，与禄存星同宫，情况奇特，若不在庙旺之地，又没有左辅星、右弼星相伴，就如同孤立无援的君主，但也能过得清闲。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2393,"chapterOrder":14,"inChapterOrder":167,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877076815910","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"326\",\"lineNum\":0,\"lineType\":1,\"content\":\"子宫喜丁巳庚生人貴格，壬癸人不耐乆。\",\"logicSentenceId\":\"7580338556201631784\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textInde 、庚年出生的人富贵不能长久。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":604,"chapterOrder":14,"inChapterOrder":170,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877076865062","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"331\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176803270639643\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"332\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅申宫旺地，與天府同。\",\"logicSentenceId\":\"7580338556304932916\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"333\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲庚、丁巳生人，財官格。\",\"logicSentenceId\":\"7580338556304949300\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176803270639643","endPageId":"7330176803270639643","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556304932916\",\"content\":\"寅申宫是旺地，与天府星同宫。\"},{\"logicSentenceId\":\"7580338556304949300\",\"content\":\"甲年、庚年、丁巳年出生的人，是有财有官的命格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":694,"chapterOrder":14,"inChapterOrder":171,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877076881446","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"334\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳亥宫旺地，與七殺同。\",\"logicSentenceId\":\"7580338556304965684\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"335\",\"lineNum\":0,\"lineType\":1,\"content\":\"乙戊生人，財官格。\",\"logicSentenceId\":\"7580338556304982068\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176803270639643","endPageId":"7330176803270639643","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556304965684\",\"content\":\"在巳亥宫是旺地，与七杀星同宫。\"},{\"logicSentenceId\":\"7580338556304982068\",\"content\":\"乙年和戊年出生的人，有财富和官职的命格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":562,"chapterOrder":14,"inChapterOrder":172,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877076897830","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"336\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戌宫得地，與天相同。\",\"logicSentenceId\":\"7580338556304998452\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"337\",\"lineNum\":0,\"lineType\":1,\"content\":\"乙巳、甲庚癸人，財官格。\",\"logicSentenceId\":\"7580338556305014836\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176803270639643","endPageId":"7330176803270639643","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305014836\",\"content\":\"乙巳年、甲年、庚年、癸年出生的人，是财官格。\"},{\"logicSentenceId\":\"7580338556304998452\",\"content\":\"辰戌宫处于有利位置，与天相星同宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":583,"chapterOrder":14,"inChapterOrder":173,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877076914214","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"338\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑未入庙，與破軍同。\",\"logicSentenceId\":\"7580338556305031220\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"339\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲庚、丁巳、乙壬人，財官格。\",\"logicSentenceId\":\"7580338556305047604\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176803270639643","endPageId":"7330176803270639643","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305031220\",\"content\":\"在丑宫和未宫处于入庙的状态，与破军星同宫。\"},{\"logicSentenceId\":\"7580338556305047604\",\"content\":\"出生年份天干为甲或庚、年柱为丁巳、或者出生年份天干为乙或壬的人，是有财官之命的格局。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":658,"chapterOrder":14,"inChapterOrder":174,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877076930598","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"340\",\"lineNum\":0,\"lineType\":10,\"content\":\"紫㣲入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176803270639643","endPageId":"7330176803270639643","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":175,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877076946982","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"341\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫㣲天中第一星，命身相遇福財興。\",\"logicSentenceId\":\"7580338556305063988\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"342\",\"lineNum\":0,\"lineType\":1,\"content\":\"若還相佐宫中㑹，冨貴双全播令名。\",\"logicSentenceId\":\"7580338556305080372\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"343\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫㣲守命最為良，二殺逢之夀不長。\",\"logicSentenceId\":\"7580338556305096756\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"344\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀火鈴來相㑹，只好空門禮梵王。\",\"logicSentenceId\":\"7580338556305113140\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"345\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫㣲辰戌遇破軍，冨而不貴有虛名。\",\"logicSentenceId\":\"7580338556305129524\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"346\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176777698131968\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"347\",\"lineNum\":0,\"lineType\":1,\"content\":\"若逢貪狼在卯酉，為臣失義不相應。\",\"logicSentenceId\":\"7580338556305145908\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"348\",\"lineNum\":0,\"lineType\":1,\"content\":\"火鈴羊陀來加㑹，七殺同宫多不貴，斯人孤獨更刑傷。\",\"logicSentenceId\":\"7580338556305162292\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"349\",\"lineNum\":0,\"lineType\":1,\"content\":\"若是空門為吉利。\",\"logicSentenceId\":\"7580338556305178676\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176803270639643","endPageId":"7330176777698131968","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305178676\",\"content\":\"如果进入空门则吉利。\"},{\"logicSentenceId\":\"7580338556305063988\",\"content\":\"紫微星是天空中第一的星，命宫和身宫与它相遇，福气和财运就会兴盛。\"},{\"logicSentenceId\":\"7580338556305080372\",\"content\":\"如果紫微星与其他星曜在宫中相会辅佐，就会富贵双全，传扬美名。\"},{\"logicSentenceId\":\"7580338556305096756\",\"content\":\"紫微星坐守命宫是非常好的，若与擎羊、陀罗二杀星相遇则寿命不会长久。\"},{\"logicSentenceId\":\"7580338556305113140\",\"content\":\"如果与擎羊、陀罗、火星、铃星相会，就只能出家到寺庙礼佛了。\"},{\"logicSentenceId\":\"7580338556305129524\",\"content\":\"紫微星在辰宫、戌宫遇到破军星，会富裕但没有显贵身份，只有虚名。\"},{\"logicSentenceId\":\"7580338556305145908\",\"content\":\"如果遇到贪狼星在卯酉宫位，作为臣子会丧失道义，行事不恰当。\"},{\"logicSentenceId\":\"7580338556305162292\",\"content\":\"火星、铃星、擎羊星、陀罗星加会在一起，又与七杀星同在一宫，命主大多难以富贵，此人会孤独且遭遇刑伤。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2725,"chapterOrder":14,"inChapterOrder":176,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877076963366","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"350\",\"lineNum\":0,\"lineType\":10,\"content\":\"紫㣲入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176777698131968","endPageId":"7330176777698131968","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":177,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877076979750","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"351\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫㣲女命守身宫，天府尊星同到宫。\",\"logicSentenceId\":\"7580338556305195060\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"352\",\"lineNum\":0,\"lineType\":1,\"content\":\"更得吉星同主照，金冠封贈福㴞㴞。\",\"logicSentenceId\":\"7580338556305211444\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"353\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫㣲女命守夫宫，三方吉拱便為荣。\",\"logicSentenceId\":\"7580338556305227828\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"354\",\"lineNum\":0,\"lineType\":1,\"content\":\"若逢殺破來冲破，衣禄盈餘滛巧容。\",\"logicSentenceId\":\"7580338556305244212\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176777698131968","endPageId":"7330176777698131968","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305244212\",\"content\":\"如果遇到七杀、破军等凶星来冲克，即使衣食富足，也会有举止轻佻、行为不端的倾向。\"},{\"logicSentenceId\":\"7580338556305195060\",\"content\":\"女性命盘中紫微星坐守身宫，同时天府这颗尊贵的星也同宫。\"},{\"logicSentenceId\":\"7580338556305211444\",\"content\":\"再得到吉祥星宿一同照临，能获金冠封赠福运连绵。\"},{\"logicSentenceId\":\"7580338556305227828\",\"content\":\"紫微星在女命盘中守护夫妻宫，三方遇吉星拱照就会尊贵荣显。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1306,"chapterOrder":14,"inChapterOrder":178,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877076996134","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"355\",\"lineNum\":0,\"lineType\":10,\"content\":\"紫㣲入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176777698131968","endPageId":"7330176777698131968","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":179,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877077012518","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"356\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微垣内吉星臨，二限相逢福禄興。\",\"logicSentenceId\":\"7580338556305260596\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"357\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176803270721563\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"358\",\"lineNum\":0,\"lineType\":1,\"content\":\"常人得遇多財冨，官貴逢之職位陞。\",\"logicSentenceId\":\"7580338556305276980\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"359\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫㣲入限本為祥，只恐三方殺破狼。\",\"logicSentenceId\":\"7580338556305293364\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"360\",\"lineNum\":0,\"lineType\":1,\"content\":\"常庶逢之多不利，官員降謫有驚傷。\",\"logicSentenceId\":\"7580338556305309748\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176777698131968","endPageId":"7330176803270721563","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305309748\",\"content\":\"普通百姓遇到这种情况大多不顺利，官员会遭遇降职贬谪，担惊受怕、受到伤害。\"},{\"logicSentenceId\":\"7580338556305260596\",\"content\":\"紫微垣内有吉星降临，大运和小运交会时福禄兴盛。\"},{\"logicSentenceId\":\"7580338556305276980\",\"content\":\"普通人遇到会获得很多财富，当官显贵的人遇到会职位升迁。\"},{\"logicSentenceId\":\"7580338556305293364\",\"content\":\"紫微星进入运势本是吉祥之事，只担心三方会有七杀、破军、贪狼三星。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1426,"chapterOrder":14,"inChapterOrder":180,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877077028902","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"361\",\"lineNum\":0,\"lineType\":1,\"content\":\"天機属木，南斗化善星爲兄弟主入庙身長肥胖，性急心慈機謀多變。\",\"logicSentenceId\":\"7580338556305326132\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"362\",\"lineNum\":0,\"lineType\":1,\"content\":\"與天梁㑹合善談兵。\",\"logicSentenceId\":\"7580338556305342516\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"363\",\"lineNum\":0,\"lineType\":1,\"content\":\"乙丙丁生人遇之，入庙化吉，得左右昌曲魁鉞、太隂凑合，生於巳酉丑亥卯未宫，𫞐禄不小、文武皆大貴、極品。\",\"logicSentenceId\":\"7580338556305358900\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"364\",\"lineNum\":0,\"lineType\":1,\"content\":\"加巨門羊火陀忌巳酉丑亥，為下局、孤窮、縱有財官貴顕亦不耐乆、只冝經啇巧藝之輩耳。\",\"logicSentenceId\":\"7580338556305375284\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176803270721563","endPageId":"7330176803270721563","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305358900\",\"content\":\"乙、丙、丁年出生的人遇到天机星，天机星入庙化吉，与左辅、右弼、文昌、文曲、天魁、天钺、太阴星会合，出生在巳、酉、丑、亥、卯、未宫的人，会有不小的官禄，文、武方面都能有大的显贵，达到极品。\"},{\"logicSentenceId\":\"7580338556305375284\",\"content\":\"天机星加上巨门星、擎羊星、火星、陀罗星、忌星，且位于巳、酉、丑、亥宫位时，便是下等格局，命主会孤独穷困，即便有财富、官位、显贵也难以长久，只适合从事精巧技艺的人。\"},{\"logicSentenceId\":\"7580338556305326132\",\"content\":\"天机星属木，是南斗化成的善星，作为兄弟宫的主星，当入庙时，命主身材高大肥胖，性格急躁但心地仁慈，机智多谋且变化多端。\"},{\"logicSentenceId\":\"7580338556305342516\",\"content\":\"与天梁星会合时善于谈论军事谋略。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1895,"chapterOrder":14,"inChapterOrder":181,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877077045286","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"365\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命入庙，性剛機巧，有𫞐柄幹家，助夫益子。\",\"logicSentenceId\":\"7580338556305391668\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"366\",\"lineNum\":0,\"lineType\":1,\"content\":\"天梁、太隂、巨\",\"logicSentenceId\":\"7580338556305408052\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"367\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176868856954880\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"368\",\"lineNum\":0,\"lineType\":1,\"content\":\"門同見羊火忌冲合，則淫賎、偏房、娼婢，否則傷夫尅子。\",\"logicSentenceId\":\"7580338556305408052\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176803270721563","endPageId":"7330176868856954880","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305408052\",\"content\":\"天梁、太阴、巨门同时出现与羊火忌相冲相合，那么命主就会淫荡卑贱，成为偏房、娼妓婢女，否则就会克伤丈夫和子女。\"},{\"logicSentenceId\":\"7580338556305391668\",\"content\":\"女命入庙，性格刚强、机智灵巧，有能力操持家业，能帮助丈夫、有益子女。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1049,"chapterOrder":14,"inChapterOrder":182,"volumeId":"7330176386001862710","volu
