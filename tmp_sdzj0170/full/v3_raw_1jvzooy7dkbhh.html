{\"sentences\":[{\"logicSentenceId\":\"7580338559711494196\",\"content\":\"文昌星在寅、午、戌宫陷地，丁巳年、甲年、庚年出生的人，属于财官格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":371,"chapterOrder":14,"inChapterOrder":361,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702679602","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"875\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177429132328970\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"876\",\"lineNum\":0,\"lineType\":1,\"content\":\"申子辰宫得地，癸庚甲生人貴格。\",\"logicSentenceId\":\"7580338559711510580\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132328970","endPageId":"7330177429132328970","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711510580\",\"content\":\"申子辰宫位置有利，癸、庚、甲年出生的人有显贵的命格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":454,"chapterOrder":14,"inChapterOrder":362,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702695986","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"877\",\"lineNum\":0,\"lineType\":1,\"content\":\"己酉丑宫入庙，乙戊、辛生人大貴。\",\"logicSentenceId\":\"7580338559711526964\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132328970","endPageId":"7330177429132328970","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711526964\",\"content\":\"文昌星在己酉丑宫入庙，乙、戊、辛年出生的人有大贵之命。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":343,"chapterOrder":14,"inChapterOrder":363,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702712370","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"878\",\"lineNum\":0,\"lineType\":1,\"content\":\"亥卯未宫利益，乙戊生人財官格。\",\"logicSentenceId\":\"7580338559711543348\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132328970","endPageId":"7330177429132328970","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711543348\",\"content\":\"在亥卯未宫有利，乙年和戊年出生的人有财官格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":325,"chapterOrder":14,"inChapterOrder":364,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702728754","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"879\",\"lineNum\":0,\"lineType\":10,\"content\":\"文昌入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132328970","endPageId":"7330177429132328970","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":365,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702745138","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"880\",\"lineNum\":0,\"lineType\":1,\"content\":\"文昌坐命旺宫臨，志大財高抵萬金。\",\"logicSentenceId\":\"7580338559711559732\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"881\",\"lineNum\":0,\"lineType\":1,\"content\":\"文藝精華心壮大，湏教平歩上靑雲。\",\"logicSentenceId\":\"7580338559711576116\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"882\",\"lineNum\":0,\"lineType\":1,\"content\":\"文昌守命亦非常，限不天傷福夀長。\",\"logicSentenceId\":\"7580338559711592500\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"883\",\"lineNum\":0,\"lineType\":1,\"content\":\"只怕限冲逢火忌，湏教夭折𢃄刑傷。\",\"logicSentenceId\":\"7580338559711608884\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132328970","endPageId":"7330177429132328970","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711592500\",\"content\":\"文昌星坐守命宫也不同寻常，行运时不会遭遇夭折、伤残等灾祸，一生福寿绵长。\"},{\"logicSentenceId\":\"7580338559711608884\",\"content\":\"只怕在大限冲克时遇上火星、忌星，定会导致夭折并遭受刑罚伤病。\"},{\"logicSentenceId\":\"7580338559711559732\",\"content\":\"文昌星坐守命宫且处于旺宫，志向远大且财富丰厚价值万金。\"},{\"logicSentenceId\":\"7580338559711576116\",\"content\":\"文学艺术造诣精深且胸怀大志，定能平稳顺利地登上高位取得成功。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1325,"chapterOrder":14,"inChapterOrder":366,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702761522","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"884\",\"lineNum\":0,\"lineType\":10,\"content\":\"文昌入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132328970","endPageId":"7330177429132328970","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":367,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394510345","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"885\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人身命值文昌，秀䴡淸竒福更長。\",\"logicSentenceId\":\"7580338559711625268\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"886\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177518315733026\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"887\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫府對冲三合照，𬋩教冨貴着霞裳。\",\"logicSentenceId\":\"7580338559711641652\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"888\",\"lineNum\":0,\"lineType\":1,\"content\":\"文昌女命遇亷軍，𨺻地擎羊火忌星。\",\"logicSentenceId\":\"7580338559711658036\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"889\",\"lineNum\":0,\"lineType\":1,\"content\":\"若不為娼終夀夭，偏房猶得主人輕。\",\"logicSentenceId\":\"7580338559711674420\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132328970","endPageId":"7330177518315733026","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711674420\",\"content\":\"如果不会成为娼妓，最终会早夭；即使做妾室，也会被丈夫轻视。\"},{\"logicSentenceId\":\"7580338559711625268\",\"content\":\"女人的身宫、命宫有文昌星坐守，会容貌秀丽、气质清奇，福气也会更加深厚长久。\"},{\"logicSentenceId\":\"7580338559711641652\",\"content\":\"紫微星和天府星从相对方向对冲且三方会合照耀，必定能富贵并身着华丽服饰。\"},{\"logicSentenceId\":\"7580338559711658036\",\"content\":\"女命文昌星与廉贞星相遇，又落在陷地，再加上擎羊、火星、忌星。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1467,"chapterOrder":14,"inChapterOrder":368,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394526729","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"890\",\"lineNum\":0,\"lineType\":10,\"content\":\"文昌入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177518315733026","endPageId":"7330177518315733026","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":369,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394543113","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"891\",\"lineNum\":0,\"lineType\":1,\"content\":\"文昌之宿最為清，斗数之中第二星。\",\"logicSentenceId\":\"7580338559711690804\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"892\",\"lineNum\":0,\"lineType\":1,\"content\":\"若遇太歳與二限，士人值此占科名。\",\"logicSentenceId\":\"7580338559711707188\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"893\",\"lineNum\":0,\"lineType\":1,\"content\":\"限遇文昌不得地，更有羊陀火鈴忌，官非口舌破家財，未免刑傷多晦滯。\",\"logicSentenceId\":\"7580338559711723572\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177518315733026","endPageId":"7330177518315733026","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711723572\",\"content\":\"运势中遇到文昌星处于不利之地，并且还有擎羊星、陀罗星、火星、铃星等凶星相伴，就会遇到官司、口舌之争，导致家财受损，难免遭受刑伤且多有困顿不顺。\"},{\"logicSentenceId\":\"7580338559711690804\",\"content\":\"文昌星最为清雅，在斗数中位居第二。\"},{\"logicSentenceId\":\"7580338559711707188\",\"content\":\"若遇到太岁和二限，读书人碰到这种情况能在科举中取得功名。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1120,"chapterOrder":14,"inChapterOrder":370,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394559497","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"894\",\"lineNum\":0,\"lineType\":1,\"content\":\"文曲水北斗司科甲星與文昌逢吉，主科第单居。\",\"logicSentenceId\":\"7580338559711739956\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"895\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命更逢𢙣殺凑合，無名便倿之人喜。\",\"logicSentenceId\":\"7580338559711756340\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"896\",\"lineNum\":0,\"lineType\":1,\"content\":\"六甲生人，己酉丑宫，侯伯貴，\",\"logicSentenceId\":\"7580338559711772724\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"897\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177512875638822\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"898\",\"lineNum\":0,\"lineType\":1,\"content\":\"與貪狼火星同垣。\",\"logicSentenceId\":\"7580338559711772724\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"899\",\"lineNum\":0,\"lineType\":1,\"content\":\"三合者，将相之命。\",\"logicSentenceId\":\"7580338559711789108\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"900\",\"lineNum\":0,\"lineType\":1,\"content\":\"武貞羊破殺，狼居𨺻地，則䘮命殀折。\",\"logicSentenceId\":\"7580338559711805492\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"901\",\"lineNum\":0,\"lineType\":1,\"content\":\"若與同梁武曲會旺宫，聦明果决，如羊陀火鈴冲破，只冝空門，旺有暗痣，𨺻有班痕。\",\"logicSentenceId\":\"7580338559711821876\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177518315733026","endPageId":"7330177512875638822","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711821876\",\"content\":\"若与天同、天梁、武曲在旺宫相会，其人聪明果决；若被擎羊、陀罗、火星、铃星冲破，只适合出家；命宫处于旺地有暗痣，处于陷地有斑痕。\"},{\"logicSentenceId\":\"7580338559711739956\",\"content\":\"文曲星属水，是北斗掌管科举功名的星，与文昌星相遇且呈吉祥之象时，主能在科举中独占鳌头。\"},{\"logicSentenceId\":\"7580338559711756340\",\"content\":\"如果身命宫又与恶煞星会合，那些无名的奸佞小人就会欢喜。\"},{\"logicSentenceId\":\"7580338559711772724\",\"content\":\"六甲年出生的人，命宫在己酉丑三宫，有侯伯一样的尊贵地位，且命盘中贪狼星与火星同在一个宫位。\"},{\"logicSentenceId\":\"7580338559711789108\",\"content\":\"能形成三合格局的人，有成为将相的命数。\"},{\"logicSentenceId\":\"7580338559711805492\",\"content\":\"武曲、天贞、擎羊、破军、七杀，贪狼处于陷地，就会丧命夭折。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2407,"chapterOrder":14,"inChapterOrder":371,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394575881","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"902\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命入庙淸秀，𨺻地與巨火忌機㑹，及貪狼破軍同垣，冲破，則下賎孤寒滛慾。\",\"logicSentenceId\":\"7580338559711838260\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177512875638822","endPageId":"7330177512875638822","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711838260\",\"content\":\"女性命格入庙则容貌清秀，若处于陷地，与巨门、火星、忌星会合，以及与贪狼、破军同处一宫且被冲破，就会出身低贱、孤独贫寒、淫荡纵欲。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":512,"chapterOrder":14,"inChapterOrder":372,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394592265","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"903\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅宫平和，午戌宫𨺻地，甲庚生人財官格。\",\"logicSentenceId\":\"7580338559711854644\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177512875638822","endPageId":"7330177512875638822","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711854644\",\"content\":\"寅宫运势平和，在午宫、戌宫则处于不利境地，甲年、庚年出生的人有获得财利和官位的命格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":398,"chapterOrder":14,"inChapterOrder":373,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394608649","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"904\",\"lineNum\":0,\"lineType\":1,\"content\":\"申子辰宫得地，丁癸辛庚生人福厚。\",\"logicSentenceId\":\"7580338559711871028\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177512875638822","endPageId":"7330177512875638822","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711871028\",\"content\":\"申子辰宫处于得地势态，丁、癸、辛、庚年出生的人福泽深厚。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":346,"chapterOrder":14,"inChapterOrder":374,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394625033","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"905\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳酉丑宫入庙，辛生人遇紫微同，大冨貴。\",\"logicSentenceId\":\"7580338559711887412\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177512875638822","endPageId":"7330177512875638822","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711887412\",\"content\":\"命宫在巳、酉、丑宫且处于入庙状态，辛年出生的人若与紫微星同宫，会有大富贵。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":382,"chapterOrder":14,"inChapterOrder":375,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394641417","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"906\",\"lineNum\":0,\"lineType\":1,\"content\":\"卯亥未宫旺地，辛丙壬戊生人財官格。\",\"logicSentenceId\":\"7580338559711903796\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177512875638822","endPageId":"7330177512875638822","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711903796\",\"content\":\"卯、亥、未这三个宫位处于旺盛之地，辛年、丙年、壬年、戊年出生的人有财禄和官运的命格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":391,"chapterOrder":14,"inChapterOrder":376,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394657801","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"907\",\"lineNum\":0,\"lineType\":10,\"content\":\"文曲入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177512875638822","endPageId":"7330177512875638822","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":377,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394674185","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"908\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177573466505250\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"909\",\"lineNum\":0,\"lineType\":1,\"content\":\"文曲守命最為良，相貌堂堂志氣昂。\",\"logicSentenceId\":\"7580338559711920180\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"910\",\"lineNum\":0,\"lineType\":1,\"content\":\"士庶逢之應福厚，丈夫得此受金章。\",\"logicSentenceId\":\"7580338559711936564\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"911\",\"lineNum\":0,\"lineType\":1,\"content\":\"文曲守垣逢火忌，不喜三方𢙣殺聚。\",\"logicSentenceId\":\"7580338559711952948\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"912\",\"lineNum\":0,\"lineType\":1,\"content\":\"此人𨿽巧口能言，惟在空門可遇貴。\",\"logicSentenceId\":\"7580338559711969332\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177573466505250","endPageId":"7330177573466505250","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711969332\",\"content\":\"此人虽然能说会道，但只有在佛门才能遇到贵人。\"},{\"logicSentenceId\":\"7580338559711920180\",\"content\":\"文曲星坐守命宫最为吉利，相貌堂堂，意气风发。\"},{\"logicSentenceId\":\"7580338559711936564\",\"content\":\"士人和庶民遇到它会福气丰厚，男子得到这种情况能获得官职和荣耀。\"},{\"logicSentenceId\":\"7580338559711952948\",\"content\":\"文曲坐守命宫，与火星、化忌星同宫，不喜欢三方有恶煞会聚。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1383,"chapterOrder":14,"inChapterOrder":378,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394690569","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"913\",\"lineNum\":0,\"lineType\":10,\"content\":\"文曲入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177573466505250","endPageId":"7330177573466505250","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":379,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394706953","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"914\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人命裡逢文曲，相貌淸竒多有福。\",\"logicSentenceId\":\"7580338559711985716\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"915\",\"lineNum\":0,\"lineType\":1,\"content\":\"聦明伶俐不尋常，有殺偏房也滛慾。\",\"logicSentenceId\":\"7580338559712002100\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177573466505250","endPageId":"7330177573466505250","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559712002100\",\"content\":\"聪明伶俐不同寻常，命里有煞星的话，就会成为偏房，也会淫荡放纵。\"},{\"logicSentenceId\":\"7580338559711985716\",\"content\":\"女人命里有文曲星，容貌出众且多有福气。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":643,"chapterOrder":14,"inChapterOrder":380,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394723337","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"916\",\"lineNum\":0,\"lineType\":10,\"content\":\"文曲入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177573466505250","endPageId":"7330177573466505250","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":381,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394739721","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"917\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限若逢文曲星，士庶斯年湏發福。\",\"logicSentenceId\":\"7580338559712018484\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"918\",\"lineNum\":0,\"lineType\":1,\"content\":\"更添左右㑹天同，財禄㴞㴞為上局。\",\"logicSentenceId\":\"7580338559712034868\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"919\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177512875753510\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"920\",\"lineNum\":0,\"lineType\":1,\"content\":\"文曲限遇𤎉陀羊，𨺻地非災惹禍殃。\",\"logicSentenceId\":\"7580338559712051252\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"921\",\"lineNum\":0,\"lineType\":1,\"content\":\"更兼命裡星辰弱，湏知此嵗入泉郷。\",\"logicSentenceId\":\"7580338559712067636\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177573466505250","endPageId":"7330177512875753510","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559712051252\",\"content\":\"文曲星所在限运遇到廉贞、陀罗、擎羊三星，处于陷地时会招来灾祸。\"},{\"logicSentenceId\":\"7580338559712067636\",\"content\":\"再加上命里星辰衰弱，须知这一年会去世。\"},{\"logicSentenceId\":\"7580338559712018484\",\"content\":\"大限小限如果遇到文曲星，平民百姓这一年定能得到福运。\"},{\"logicSentenceId\":\"7580338559712034868\",\"content\":\"若再加上左辅右弼与天同星会合，财禄源源不断，是非常好的格局。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1392,"chapterOrder":14,"inChapterOrder":382,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394756105","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"922\",\"lineNum\":0,\"lineType\":1,\"content\":\"左輔圡南北斗善星佐帝令，尤佳𠰥府相機昌。\",\"logicSentenceId\":\"7580338559712084020\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"923\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼武曲㑹，更右弼同垣，冨貴不小，財官𩀱羙。\",\"logicSentenceId\":\"7580338559712100404\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"924\",\"lineNum\":0,\"lineType\":1,\"content\":\"若見羊陀火忌，中局旺宫，有暗痣班痕，如𨺻地，加巨門七殺，天機下局。\",\"logicSentenceId\":\"7580338559712116788\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177512875753510","endPageId":"7330177512875753510","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559712084020\",\"content\":\"左辅属土，是南斗和北斗中的善星，能辅佐天帝发号施令；如果与天府、天相、天机、文昌同宫，那就再好不过了。\"},{\"logicSentenceId\":\"7580338559712100404\",\"content\":\"贪狼星和武曲星相会，再加上右弼星同宫，富贵不小，财富和官位两方面都美好。\"},{\"logicSentenceId\":\"7580338559712116788\",\"content\":\"若遇见擎羊、陀罗、火星、忌星，处于中局旺宫时，身上会有暗痣瘢痕；若处于陷地，再加上巨门、七杀两颗主星，就是天机星的下等格局。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1255,"chapterOrder":14,"inChapterOrder":383,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394772489","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"925\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命㑹吉星，旺夫益子，僧道淸㓗。\",\"logicSentenceId\":\"7580338559712133172\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177512875753510","endPageId":"7330177512875753510","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559712133172\",\"content\":\"女命如果遇到吉星，能够使丈夫兴旺、对子女有益，若为僧道之人则品行高洁。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":367,"chapterOrder":14,"inChapterOrder":384,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394788873","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"926\",\"lineNum\":0,\"lineType\":10,\"content\":\"左輔入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177512875753510","endPageId":"7330177512875753510","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":385,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394805257","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"927\",\"lineNum\":0,\"lineType\":1,\"content\":\"左輔尊星能𨹓福，風流敦厚通今古。\",\"logicSentenceId\":\"7580338559712149556\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"928\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫府禄權貪武㑹，文官武職多清貴。\",\"logicSentenceId\":\"7580338559712165940\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"929\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀火鈴三方照，縱有財官非吉兆。\",\"logicSentenceId\":\"7580338559712182324\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"930\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177573466685474\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"931\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉貞破巨更來冲，𠰥不傷殘終是殀。\",\"logicSentenceId\":\"7580338559712198708\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177512875753510","endPageId":"7330177573466685474","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559712182324\",\"content\":\"如果羊陀火铃这四颗星从三方照命，即使有财星和官星，也不是好兆头。\"},{\"logicSentenceId\":\"7580338559712198708\",\"content\":\"廉贞星、破军星、巨门星再来相冲，如果不伤残，最终也会夭折。\"},{\"logicSentenceId\":\"7580338559712149556\",\"content\":\"左辅尊星能够降下福泽，风度潇洒、为人忠厚，博古通今。\"},{\"logicSentenceId\":\"7580338559712165940\",\"content\":\"紫微、天府、禄存、权星、贪狼、武曲六星相会，文官武将大多清廉高贵。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1435,"chapterOrder":14,"inChapterOrder":386,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880394821641","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"932\",\"lineNum\":0,\"lineType\":10,\"content\":\"左輔入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177573466685474","endPageId":"7330177573466685474","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":387,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499367945","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"933\",\"lineNum\":0,\"lineType\":1,\"content\":\"女逢左輔主賢豪，能幹能為又氣高。\",\"logicSentenceId\":\"7580338559712215092\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"934\",\"lineNum\":0,\"lineType\":1,\"content\":\"更與紫㣲天府合，金冠封贈福㴞㴞。\",\"logicSentenceId\":\"7580338559712231476\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"935\",\"lineNum\":0,\"lineType\":1,\"content\":\"火陀相㑹不為良，七殺破軍夀不長。\",\"logicSentenceId\":\"7580338559712247860\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"936\",\"lineNum\":0,\"lineType\":1,\"content\":\"只可偏房方冨足，聦明得寵過時光。\",\"logicSentenceId\":\"7580338559712264244\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177573466685474","endPageId":"7330177573466685474","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559712247860\",\"content\":\"火星与陀罗星相会不吉利，七杀星与破军星相会寿命不长。\"},{\"logicSentenceId\":\"7580338559712264244\",\"content\":\"只能做偏房才能富足，凭借聪明得宠度过时光。\"},{\"logicSentenceId\":\"7580338559712215092\",\"content\":\"女子的命盘中遇到左辅星，预示着她贤良豪迈，有能力、有作为，而且志向高远。\"},{\"logicSentenceId\":\"7580338559712231476\",\"content\":\"若再与紫微、天府二星会合，能获金冠封赠，福泽深厚连绵不绝。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1291,"chapterOrder":14,"inChapterOrder":388,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499384329","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"937\",\"lineNum\":0,\"lineType\":10,\"content\":\"左輔入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177573466685474","endPageId":"7330177573466685474","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":389,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499400713","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"938\",\"lineNum\":0,\"lineType\":1,\"content\":\"左輔限行福氣深，常人冨足累千金。\",\"logicSentenceId\":\"7580338559712280628\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"939\",\"lineNum\":0,\"lineType\":1,\"content\":\"官員更得科𫞐照，職位高遷佐聖君。\",\"logicSentenceId\":\"7580338560364970036\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"940\",\"lineNum\":0,\"lineType\":1,\"content\":\"左輔之星入限來，不冝殺凑主悲哀。\",\"logicSentenceId\":\"7580338560364986420\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177573466685474","endPageId":"7330177573466685474","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559712280628\",\"content\":\"行运遇到左辅星时福气深厚，即使是普通人也能生活富足、积累千金财富。\"},{\"logicSentenceId\":\"7580338560364970036\",\"content\":\"官员若再得科魁星照耀，职位高升辅佐圣明君主。\"},{\"logicSentenceId\":\"7580338560364986420\",\"content\":\"左辅星进入命限时，不宜与煞星会合，否则会带来悲哀之事。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":971,"chapterOrder":14,"inChapterOrder":390,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499417097","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"941\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177589887172618\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"942\",\"lineNum\":0,\"lineType\":1,\"content\":\"火鈴空刼來相凑，財破人亡事事衰。\",\"logicSentenceId\":\"7580338560365002804\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177589887172618","endPageId":"7330177589887172618","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365002804\",\"content\":\"火星、铃星、天空、劫煞同时出现，就会钱财破败、人亡，做什么事情都衰败不顺。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":490,"chapterOrder":14,"inChapterOrder":391,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499433481","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"943\",\"lineNum\":0,\"lineType\":1,\"content\":\"右弼圡南北斗善星佐帝令，入庙厚重淸秀，耿直心懐寛恕。\",\"logicSentenceId\":\"7580338560365019188\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"944\",\"lineNum\":0,\"lineType\":1,\"content\":\"好施濟，有机謀，諸宫𨹓福，四墓尤佳。\",\"logicSentenceId\":\"7580338560365035572\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"945\",\"lineNum\":0,\"lineType\":1,\"content\":\"若㑹紫㣲府相昌曲，終身福夀。\",\"logicSentenceId\":\"7580338560365051956\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"946\",\"lineNum\":0,\"lineType\":1,\"content\":\"若與諸殺同緾，及羊陀火忌冲合者，則福薄，亦不為㐫。\",\"logicSentenceId\":\"7580338560365068340\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"947\",\"lineNum\":0,\"lineType\":1,\"content\":\"有暗痣班痕，傷殘𢃄疾。\",\"logicSentenceId\":\"7580338560365084724\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177589887172618","endPageId":"7330177589887172618","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365035572\",\"content\":\"喜好施舍救济他人，有智谋，能给各宫带来福泽，在四墓之地尤为吉利。\"},{\"logicSentenceId\":\"7580338560365051956\",\"content\":\"如果右弼与紫微、天府、天相、文昌、文曲相会，一生都会福寿双全。\"},{\"logicSentenceId\":\"7580338560365068340\",\"content\":\"如果与各种煞星相互缠绕，以及与擎羊、陀罗、火星、忌星相冲会合，那么福气浅薄，但也不算凶险。\"},{\"logicSentenceId\":\"7580338560365084724\",\"content\":\"身上有暗痣、斑点疤痕，身体有伤残和疾病。\"},{\"logicSentenceId\":\"7580338560365019188\",\"content\":\"右弼属土，是南斗和北斗的善星，辅佐天帝之令，入庙时厚重清秀，性格耿直，心怀宽恕。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1734,"chapterOrder":14,"inChapterOrder":392,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499449865","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"948\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命㑹士星，旺夫益子，僧道淸㓗。\",\"logicSentenceId\":\"7580338560365101108\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177589887172618","endPageId":"7330177589887172618","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365101108\",\"content\":\"女性命盘与士星相会，能旺夫益子，若是出家为僧道则能保持清净。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":352,"chapterOrder":14,"inChapterOrder":393,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499466249","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"949\",\"lineNum\":0,\"lineType\":10,\"content\":\"右弼入男女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177589887172618","endPageId":"7330177589887172618","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":130,"chapterOrder":14,"inChapterOrder":394,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499482633","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"950\",\"lineNum\":0,\"lineType\":1,\"content\":\"右弼天樞上宰星，命逢重厚最聦明。\",\"logicSentenceId\":\"7580338560365117492\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"951\",\"lineNum\":0,\"lineType\":1,\"content\":\"若無火忌羊陀㑹，加吉財官冠世英。\",\"logicSentenceId\":\"7580338560365133876\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"952\",\"lineNum\":0,\"lineType\":1,\"content\":\"右弼尊星入命宫，若還殺凑主常庸。\",\"logicSentenceId\":\"7580338560365150260\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"953\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177628906864655\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"954\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀空刼三方凑，湏知𢃄疾免災㐫。\",\"logicSentenceId\":\"7580338560365166644\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177589887172618","endPageId":"7330177628906864655","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365133876\",\"content\":\"如果没有火星、忌星、擎羊星、陀罗星会合，再加上吉星相助，那么在财富和官职方面会成为世间杰出之人。\"},{\"logicSentenceId\":\"7580338560365150260\",\"content\":\"右弼这一尊贵之星进入命宫，如果还有凶星汇聚，命主就会一生平庸。\"},{\"logicSentenceId\":\"7580338560365166644\",\"content\":\"如果羊陀、空劫在三方会合，须知带有疾病反而能避免灾祸。\"},{\"logicSentenceId\":\"7580338560365117492\",\"content\":\"右弼是天枢星的上宰星，命里逢此星的人稳重敦厚且极为聪明。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1475,"chapterOrder":14,"inChapterOrder":395,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499499017","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"955\",\"lineNum\":0,\"lineType\":10,\"content\":\"右弼入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177628906864655","endPageId":"7330177628906864655","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":396,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499515401","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"956\",\"lineNum\":0,\"lineType\":1,\"content\":\"右弼入限最為荣，人財興旺必多能，官員迁擢僧道喜，士子攻書必題名。\",\"logicSentenceId\":\"7580338560365183028\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"957\",\"lineNum\":0,\"lineType\":1,\"content\":\"右弼主限遇㐫星，掃盡家資百不成。\",\"logicSentenceId\":\"7580338560365199412\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"958\",\"lineNum\":0,\"lineType\":1,\"content\":\"士遭傷敗奴欺主，更教家破主伶仃。\",\"logicSentenceId\":\"7580338560365215796\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177628906864655","endPageId":"7330177628906864655","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365183028\",\"content\":\"右弼星进入命限最为荣耀，人丁和财富都会兴旺，必定多才多能，官员会得到升迁，僧人、道士会感到欢喜，士子读书必定能金榜题名。\"},{\"logicSentenceId\":\"7580338560365199412\",\"content\":\"右弼星在主限期间遇到凶星，会将家中资财耗尽，做什么都不会成功。\"},{\"logicSentenceId\":\"7580338560365215796\",\"content\":\"读书人遭遇挫折失败，奴仆欺辱主人，更导致家业破败主人孤苦伶仃。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1138,"chapterOrder":14,"inChapterOrder":397,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499531785","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"959\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄存土北斗司爵貴星持重，心慈耿直，有机變，多學多能。\",\"logicSentenceId\":\"7580338560365232180\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"960\",\"lineNum\":0,\"lineType\":1,\"content\":\"命遇主冨貴，文人有声名。\",\"logicSentenceId\":\"7580338560365248564\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"961\",\"lineNum\":0,\"lineType\":1,\"content\":\"諸宫降福，消災，棄祖重拜父母喜紫微府相同鿄日月武曲同宫為妙。\",\"logicSentenceId\":\"7580338560365264948\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"962\",\"lineNum\":0,\"lineType\":1,\"content\":\"单守身命看財之虜，怕火鈴空刼冲照下局，巧藝多精之人。\",\"logicSentenceId\":\"7580338560365281332\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"963\",\"lineNum\":0,\"lineType\":1,\"content\":\"𨺻地减福。\",\"logicSentenceId\":\"7580338560365297716\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"964\",\"lineNum\":0,\"lineType\":1,\"content\":\"在命宫\",\"logicSentenceId\":\"7580338560365314100\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"965\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177589887287306\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"966\",\"lineNum\":0,\"lineType\":1,\"content\":\"官禄、田宅為福。\",\"logicSentenceId\":\"7580338560365314100\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177628906864655","endPageId":"7330177589887287306","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365232180\",\"content\":\"禄存属土，是北斗掌管爵位的贵星，为人持重，心地仁慈、性格耿直，能随机应变，学识广博、多才多艺。\"},{\"logicSentenceId\":\"7580338560365248564\",\"content\":\"命盘中遇到禄存星主一生富贵，文人会有好名声。\"},{\"logicSentenceId\":\"7580338560365264948\",\"content\":\"各个宫位降下福泽，消除灾祸，离开祖业重新拜认父母会有喜事，与紫微府相同，和日月、武曲同处一宫最为美妙。\"},{\"logicSentenceId\":\"7580338560365281332\",\"content\":\"如果禄存星单独守在身宫或命宫，就会成为只看重钱财的人。如果火铃、空劫冲照，则是下局，这类人会是技艺精湛的人。\"},{\"logicSentenceId\":\"7580338560365297716\",\"content\":\"禄存星落在陷地，福气会减少。\"},{\"logicSentenceId\":\"7580338560365314100\",\"content\":\"禄存星在命宫、官禄宫、田宅宫时是有福的。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2309,"chapterOrder":14,"inChapterOrder":398,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499548169","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"967\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命淸白秀䴡，有男子之志。\",\"logicSentenceId\":\"7580338560365330484\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177589887287306","endPageId":"7330177589887287306","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365330484\",\"content\":\"女子命格纯洁美好、容貌秀丽，有男子般的志向。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":319,"chapterOrder":14,"inChapterOrder":399,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158880499564553","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"968\",\"lineNum\":0,\"lineType\":10,\"content\":\"禄存入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177589887287306","endPageId":"7330177589887287306","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":400,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881128726579","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"969\",\"lineNum\":0,\"lineType\":1,\"content\":\"人生若遇禄存星，性格剛強百事成。\",\"logicSentenceId\":\"7580338560365346868\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"970\",\"lineNum\":0,\"lineType\":1,\"content\":\"左右逢兮昌曲㑹，㴞㴞衣禄顕門庭。\",\"logicSentenceId\":\"7580338560365363252\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"971\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄存守命莫逢冲，陀火交加福不全。\",\"logicSentenceId\":\"7580338560365379636\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"972\",\"lineNum\":0,\"lineType\":1,\"content\":\"天機空刼忌相㑹，空門僧道得淸閑。\",\"logicSentenceId\":\"7580338560365396020\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177589887287306","endPageId":"7330177589887287306","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365396020\",\"content\":\"如果天机星、空劫星、忌星相会，命主可能会出家做和尚或道士，过上清闲的生活。\"},{\"logicSentenceId\":\"7580338560365346868\",\"content\":\"人这一生如果遇到禄存星，就会性格刚强，所有事情都能成功。\"},{\"logicSentenceId\":\"7580338560365363252\",\"content\":\"左辅右弼相逢，文昌文曲相会，衣食俸禄源源不断，家族门庭显耀。\"},{\"logicSentenceId\":\"7580338560365379636\",\"content\":\"禄存星守命宫时不要遇到冲煞，陀罗星、火星如果同时出现，就会福运不全。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1342,"chapterOrder":14,"inChapterOrder":401,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881128742963","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"973\",\"lineNum\":0,\"lineType\":10,\"content\":\"禄存入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177589887287306","endPageId":"7330177589887287306","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":402,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881128759347","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"974\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命若遇禄存星，紫府加臨百事寕。\",\"logicSentenceId\":\"7580338560365412404\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"975\",\"lineNum\":0,\"lineType\":1,\"content\":\"更遇同貞相凑合，必然註定是夫人。\",\"logicSentenceId\":\"7580338560365428788\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"976\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177683537526799\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"977\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄存入命𨺻宫來，空刼鈴火必為災。\",\"logicSentenceId\":\"7580338560365445172\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"978\",\"lineNum\":0,\"lineType\":1,\"content\":\"若無吉曜來相凑，夫婦分離永不諧。\",\"logicSentenceId\":\"7580338560365461556\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177589887287306","endPageId":"7330177683537526799","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365428788\",\"content\":\"若再遇到天同廉贞相互配合，必然注定是夫人。\"},{\"logicSentenceId\":\"7580338560365445172\",\"content\":\"禄存星落入命宫的陷宫，天空、劫煞、铃星、火星必然会带来灾祸。\"},{\"logicSentenceId\":\"7580338560365461556\",\"content\":\"如果没有吉祥的星曜来相配合，夫妇就会分离且永远不能和谐。\"},{\"logicSentenceId\":\"7580338560365412404\",\"content\":\"女性命盘中如果有禄存星，又有紫微星、天府星照临，诸事都会安宁。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1403,"chapterOrder":14,"inChapterOrder":403,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881128775731","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"979\",\"lineNum\":0,\"lineType\":10,\"content\":\"禄存入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177683537526799","endPageId":"7330177683537526799","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":404,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881128792115","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"980\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄存主限最為良，作事求謀𥁞吉祥。\",\"logicSentenceId\":\"7580338560365477940\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"981\",\"lineNum\":0,\"lineType\":1,\"content\":\"仕禄逢之多轉職，庶人遇此足錢粮。\",\"logicSentenceId\":\"7580338560365494324\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"982\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄存主限夀延長，作事营謀萬事昌。\",\"logicSentenceId\":\"7580338560365510708\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"983\",\"lineNum\":0,\"lineType\":1,\"content\":\"更有科𫞐兼左右，定知此限冨倉廂。\",\"logicSentenceId\":\"7580338560365527092\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"984\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄存禄主多冨足，婚姻嫁娶添嗣續，更𠔥科禄又同宫，必主荣華享厚福。\",\"logicSentenceId\":\"7580338560365543476\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"985\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄馬交馳限歩逢，最怕刼空相遇同。\",\"logicSentenceId\":\"7580338560365559860\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"986\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177673374744627\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"987\",\"lineNum\":0,\"lineType\":1,\"content\":\"更𠔥太𡻕𢙣星冲，限倒其年入墓中。\",\"logicSentenceId\":\"7580338560365576244\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177683537526799","endPageId":"7330177673374744627","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365527092\",\"content\":\"如果还遇到文昌、文曲星，以及左辅、右弼星，那一定能知道在这个运势期间会家财万贯、富裕充实。\"},{\"logicSentenceId\":\"7580338560365543476\",\"content\":\"禄存星作为禄主多富足，婚姻嫁娶会增添子嗣，若再加上科星和禄星同在一宫，必定能荣华享有厚福。\"},{\"logicSentenceId\":\"7580338560365559860\",\"content\":\"禄马交驰的运势阶段遇到时，最害怕的是劫星和空星一同相遇。\"},{\"logicSentenceId\":\"7580338560365576244\",\"content\":\"再加上太岁恶星相冲，在这个限运年就会去世。\"},{\"logicSentenceId\":\"7580338560365477940\",\"content\":\"禄存星坐守大限时最为良好，做事情、谋划事务都会很吉祥顺遂。\"},{\"logicSentenceId\":\"7580338560365494324\",\"content\":\"当官的遇到禄存主限大多会转换官职，平民百姓遇到禄存主限则钱粮充足。\"},{\"logicSentenceId\":\"7580338560365510708\",\"content\":\"禄存星在主限的时候，命主的寿命会延长，做事和谋划都会万事昌盛。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2515,"chapterOrder":14,"inChapterOrder":405,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881128808499","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"988\",\"lineNum\":0,\"lineType\":1,\"content\":\"魁鉞火即天乙貴人，若人身命逢之，更得諸吉加臨，三合吉星守照，必少年登科及第。\",\"logicSentenceId\":\"7580338560365592628\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"989\",\"lineNum\":0,\"lineType\":1,\"content\":\"逢㐫忌，不為文章秀士，可為弟子之師。\",\"logicSentenceId\":\"7580338560365609012\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"990\",\"lineNum\":0,\"lineType\":1,\"content\":\"限歩逢之，必主淸高，名成利就。\",\"logicSentenceId\":\"7580338560365625396\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"991\",\"lineNum\":0,\"lineType\":1,\"content\":\"大抵此星若身命逢之，雖不冨貴，亦主聦明，為人秀䴡清白，有威可畏，有儀可象。\",\"logicSentenceId\":\"7580338560365641780\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374744627","endPageId":"7330177673374744627","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365641780\",\"content\":\"大体来说，如果魁钺星落在人的命宫或者身宫，即便不能大富大贵，也会聪明伶俐，容貌秀丽、品行高洁，有威严让人敬畏，有仪态可供人效仿。\"},{\"logicSentenceId\":\"7580338560365592628\",\"content\":\"魁钺火就是天乙贵人，如果人的命宫或身宫遇到它，再加上众多吉星降临，三合方位有吉星守护照耀，必定少年时就能科举考中。\"},{\"logicSentenceId\":\"7580338560365609012\",\"content\":\"遇到凶星忌星，虽不能成为文章出众的优秀人才，但可以做学生的老师。\"},{\"logicSentenceId\":\"7580338560365625396\",\"content\":\"行运遇到魁钺火，必定会为人清高，名利双收。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1609,"chapterOrder":14,"inChapterOrder":406,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881128824883","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"992\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命逢吉，多為宰相；婦逢㐫殺，也主冨貴。\",\"logicSentenceId\":\"7580338560365658164\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374744627","endPageId":"7330177673374744627","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365658164\",\"content\":\"女子命盘逢吉星，大多能成为宰相；妇人命盘遇凶煞，也会享有富贵。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":367,"chapterOrder":14,"inChapterOrder":407,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367588915","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"993\",\"lineNum\":0,\"lineType\":10,\"content\":\"魁鉞入命限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374744627","endPageId":"7330177673374744627","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":408,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367605299","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"994\",\"lineNum\":0,\"lineType\":1,\"content\":\"魁鉞命身限遇昌，常人得此足錢粮，官員遇此高遷擢，必定當年面帝王。\",\"logicSentenceId\":\"7580338560365674548\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374744627","endPageId":"7330177673374744627","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365674548\",\"content\":\"魁钺星在身命宫或限运中遇到文昌星，普通人得到这种星象能使钱粮充足，官员遇到则会获得高升提拔，必定在当年能面见帝王。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":481,"chapterOrder":14,"inChapterOrder":409,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367621683","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"995\",\"lineNum\":0,\"lineType\":1,\"content\":\"擎羊火金北斗浮星，化刑入庙權貴身旺，形麄破相，剛強果\",\"logicSentenceId\":\"7580338560365690932\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"996\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177683537756175\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"997\",\"lineNum\":0,\"lineType\":1,\"content\":\"决，好勇闘狠，机謀矯詐，横立功名，能奪君子之𫞐。\",\"logicSentenceId\":\"7580338560365690932\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"998\",\"lineNum\":0,\"lineType\":1,\"content\":\"喜西北生人為福，冝命在四墓宫庙地，亦喜四墓生人會日月，男尅妻而女尅夫，會昌曲左右有暗痣班痕。\",\"logicSentenceId\":\"7580338560365707316\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"999\",\"lineNum\":0,\"lineType\":1,\"content\":\"若卯酉𨺻宫，作禍傷残𢃄自渺。\",\"logicSentenceId\":\"7580338560365723700\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1000\",\"lineNum\":0,\"lineType\":1,\"content\":\"六甲六戊寅申生人守命，其人孤单不守祖業，二姓延生，巧藝為活，𤎉貞火巨忌星同𨺻地，則𢃄暗疾，或面手足有傷残，且不善終，一生多招刑禍，否則為僧道。\",\"logicSentenceId\":\"7580338560365740084\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374744627","endPageId":"7330177683537756175","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365707316\",\"content\":\"对西北出生的人有福气，适宜命宫在四墓宫庙地，也喜欢四墓宫出生的人会合日月，男命克妻而女命克夫，若会合文昌、文曲、左辅、右弼，身上会有暗痣和斑痕。\"},{\"logicSentenceId\":\"7580338560365723700\",\"content\":\"如果处于卯酉陷宫，就会带来灾祸，导致伤残并带有自身渺小的迹象。\"},{\"logicSentenceId\":\"7580338560365740084\",\"content\":\"六甲六戊寅申年出生的人守命宫，其人孤单，不会守住祖业，要依托两姓生存，以精巧技艺谋生，廉贞星、火星、巨门星、忌星同时落入陷地，就会身患隐疾，或者面部、手足有伤残，而且不得善终，一生多遭遇刑罚灾祸，不然就会成为僧道。\"},{\"logicSentenceId\":\"7580338560365690932\",\"content\":\"擎羊星属火金，是北斗浮星，化刑入庙时，主人权贵且身旺，外形粗陋、面容有破损，性格刚强果决，喜好勇猛斗狠，善用机谋、为人狡诈，能够凭借非常规的方式建立功名，还能夺取君子的荣耀。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2429,"chapterOrder":14,"inChapterOrder":410,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367638067","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1001\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命入庙𫞐貴，𨺻地傷夫尅子，孤刑破相下滛。\",\"logicSentenceId\":\"7580338560365756468\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177683537756175","endPageId":"7330177683537756175","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365756468\",\"content\":\"女性命格若星曜入庙则显贵，若星曜陷地则会克伤丈夫和子女，孤独受刑、容貌破损且行为放荡。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":409,"chapterOrder":14,"inChapterOrder":411,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367654451","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1002\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戌丑未入庙，亦冝。\",\"logicSentenceId\":\"7580338560365772852\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1003\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戌丑未生人，財官格。\",\"logicSentenceId\":\"7580338560365789236\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177683537756175","endPageId":"7330177683537756175","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365772852\",\"content\":\"在辰、戌、丑、未宫入庙，也适宜。\"},{\"logicSentenceId\":\"7580338560365789236\",\"content\":\"出生在辰、戌、丑、未年的人，有财官的命格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":573,"chapterOrder":14,"inChapterOrder":412,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367670835","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1004\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午卯酉𨺻地，寅宮得地。\",\"logicSentenceId\":\"7580338560365805620\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177683537756175","endPageId":"7330177683537756175","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365805620\",\"content\":\"子午卯酉宫位处于不利境地，寅宫处于有利境地。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":318,"chapterOrder":14,"inChapterOrder":413,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367687219","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1005\",\"lineNum\":0,\"lineType\":10,\"content\":\"擎羊入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177683537756175","endPageId":"7330177683537756175","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":128,"chapterOrder":14,"inChapterOrder":414,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367703603","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1006\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177673374875699\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1007\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄前一位安擎羊，上将逢之福禄加。\",\"logicSentenceId\":\"7580338560365822004\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1008\",\"lineNum\":0,\"lineType\":1,\"content\":\"更得貴人相守照，兵權萬里壮皇家。\",\"logicSentenceId\":\"7580338560365838388\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1009\",\"lineNum\":0,\"lineType\":1,\"content\":\"擎羊守命性剛強，四墓生人福夀長。\",\"logicSentenceId\":\"7580338560365854772\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1010\",\"lineNum\":0,\"lineType\":1,\"content\":\"𠰥得紫府來會合，湏知財谷冨倉廂。\",\"logicSentenceId\":\"7580338560365871156\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1011\",\"lineNum\":0,\"lineType\":1,\"content\":\"擎羊一矅落閑宫，陀火冲𠔃便是㐫。\",\"logicSentenceId\":\"7580338560365887540\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1012\",\"lineNum\":0,\"lineType\":1,\"content\":\"更若身命同刼殺，定然天絶在途中。\",\"logicSentenceId\":\"7580338560365903924\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374875699","endPageId":"7330177673374875699","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365871156\",\"content\":\"如果能与紫府星相会合，须知财富谷物堆满仓库。\"},{\"logicSentenceId\":\"7580338560365887540\",\"content\":\"擎羊星单独落在闲宫，陀罗星、火星相冲克便是凶兆。\"},{\"logicSentenceId\":\"7580338560365903924\",\"content\":\"如果身宫和命宫与劫杀同宫，必定在途中夭折。\"},{\"logicSentenceId\":\"7580338560365822004\",\"content\":\"擎羊星位于禄存星前一位，若与上将星相逢，就会增添福禄。\"},{\"logicSentenceId\":\"7580338560365838388\",\"content\":\"若再得到贵人守护照临，便能掌握万里兵权，为皇家增添荣耀。\"},{\"logicSentenceId\":\"7580338560365854772\",\"content\":\"擎羊星坐守命宫的人性格刚强，在辰、戌、丑、未四宫出生的人福寿绵长。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2008,"chapterOrder":14,"inChapterOrder":415,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367719987","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1013\",\"lineNum\":0,\"lineType\":10,\"content\":\"擎羊入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374875699","endPageId":"7330177673374875699","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":128,"chapterOrder":14,"inChapterOrder":416,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367736371","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1014\",\"lineNum\":0,\"lineType\":1,\"content\":\"北斗浮星女命逢，火機巨忌必常庸。\",\"logicSentenceId\":\"7580338560365920308\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1015\",\"lineNum\":0,\"lineType\":1,\"content\":\"三方㐫殺𠔥來凑，不夭終湏浪滚濤。\",\"logicSentenceId\":\"7580338560365936692\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374875699","endPageId":"7330177673374875699","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365936692\",\"content\":\"三方的凶煞星一起凑来，即便不夭折最终也必将历经波折。\"},{\"logicSentenceId\":\"7580338560365920308\",\"content\":\"女性命盘中遇到北斗浮星，又碰上火星、天机星、巨门星处于忌位，必定一生平凡。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":685,"chapterOrder":14,"inChapterOrder":417,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367752755","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1016\",\"lineNum\":0,\"lineType\":10,\"content\":\"擎羊入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374875699","endPageId":"7330177673374875699","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":125,"chapterOrder":14,"inChapterOrder":418,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367769139","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1017\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177739183423528\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1018\",\"lineNum\":0,\"lineType\":1,\"content\":\"擎羊守限細推詳，四墓生人免禍殃。\",\"logicSentenceId\":\"7580338560365953076\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1019\",\"lineNum\":0,\"lineType\":1,\"content\":\"若遇紫㣲昌府㑹，財官顕逹福悠長。\",\"logicSentenceId\":\"7580338560365969460\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1020\",\"lineNum\":0,\"lineType\":1,\"content\":\"天羅地網遇擎羊，二限冲𠔃禍患戕。\",\"logicSentenceId\":\"7580338560365985844\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1021\",\"lineNum\":0,\"lineType\":1,\"content\":\"若是命中主星弱，定教一疾夣黄梁。\",\"logicSentenceId\":\"7580338560366002228\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1022\",\"lineNum\":0,\"lineType\":1,\"content\":\"擎羊加殺最爲㐫，二限休教落𨺻逢。\",\"logicSentenceId\":\"7580338560366018612\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1023\",\"lineNum\":0,\"lineType\":1,\"content\":\"尅子刑妻賣田屋，徒流貶配去從戎。\",\"logicSentenceId\":\"7580338560366034996\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177739183423528","endPageId":"7330177739183423528","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560365953076\",\"content\":\"当擎羊星守限时要仔细推究，辰戌丑未四墓宫出生的人可免除祸殃。\"},{\"logicSentenceId\":\"7580338560365969460\",\"content\":\"若遇到紫微、文昌、天府星相会，财富和官职显赫发达，福泽长久。\"},{\"logicSentenceId\":\"7580338560365985844\",\"content\":\"天罗地网遇到擎羊星，大运和流年冲克时就会遭遇灾祸的侵害。\"},{\"logicSentenceId\":\"7580338560366002228\",\"content\":\"如果命中主星弱，一定会因为一场疾病而去世。\"},{\"logicSentenceId\":\"7580338560366018612\",\"content\":\"擎羊星与煞星会合最为凶险，行运和流年运势千万不能遇到擎羊星处于落陷的位置。\"},{\"logicSentenceId\":\"7580338560366034996\",\"content\":\"克子、刑伤妻子、变卖田产房屋，会被处以徒刑、流放、贬谪发配而去从军。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2083,"chapterOrder":14,"inChapterOrder":419,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367785523","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1024\",\"lineNum\":0,\"lineType\":1,\"content\":\"陀羅火金北斗浮星，化忌入庙身雄形麄賦性剛強，破相氣高，横發横破，不守祖業為人，飄蓬不作本處民，作事退悔，有始無終。\",\"logicSentenceId\":\"7580338560366051380\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1025\",\"lineNum\":0,\"lineType\":1,\"content\":\"喜西北生人為福，及四墓生人，又坐四墓宫，吉星衆者為福。\",\"logicSentenceId\":\"7580338560366067764\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1026\",\"lineNum\":0,\"lineType\":1,\"content\":\"會日月忌宿，男尅妻而女尅夫，加忌且損目。\",\"logicSentenceId\":\"7580338560366084148\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1027\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177673374957619\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1028\",\"lineNum\":0,\"lineType\":1,\"content\":\"㑹左右昌曲有暗痣。\",\"logicSentenceId\":\"7580338560366100532\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1029\",\"lineNum\":0,\"lineType\":1,\"content\":\"𠰥無正星而獨守命者，孤单棄祖入贅，二姓延生，巧藝為活。\",\"logicSentenceId\":\"7580338560366116916\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1030\",\"lineNum\":0,\"lineType\":1,\"content\":\"若𨺻宫逢巨殺，必傷妻子，背六親，且傷残𢃄疾，僧道吉。\",\"logicSentenceId\":\"7580338560366133300\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177739183423528","endPageId":"7330177673374957619","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366133300\",\"content\":\"如果处于陷宫又遇到巨大煞星，必定会伤害妻子儿女，背弃六亲，而且自身会伤残患病，从事僧道职业则吉利。\"},{\"logicSentenceId\":\"7580338560366051380\",\"content\":\"陀罗、火星、金星、北斗浮星，化忌入庙的人身材雄伟、外形粗犷，性格刚强，面相有破损、心气高傲，财富突然暴发又突然破败，不能守住祖业，为人如飘蓬一般，不在本地居住，做事容易后悔，有开始却没有结局。\"},{\"logicSentenceId\":\"7580338560366067764\",\"content\":\"以出生在西北方向的人为有福，以及出生在四墓的人，又命坐四墓宫，吉星众多的人也有福。\"},{\"logicSentenceId\":\"7580338560366084148\",\"content\":\"与日、月以及忌星会合，男子会克妻而女子会克夫，再加上忌星就会损伤眼睛。\"},{\"logicSentenceId\":\"7580338560366100532\",\"content\":\"与左辅、右弼、文昌、文曲星相会则身上有暗痣。\"},{\"logicSentenceId\":\"7580338560366116916\",\"content\":\"如果没有正星而只有陀罗等星坐守命宫的人，会孤单、背弃祖先、入赘到女方家，依托两姓延续生命，靠精巧技艺谋生。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2642,"chapterOrder":14,"inChapterOrder":420,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367801907","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1031\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命内狠外虚，凌夫尅子，不和六親，又無𤎉耻。\",\"logicSentenceId\":\"7580338560366149684\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374957619","endPageId":"7330177673374957619","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366149684\",\"content\":\"女命主内心狠毒，外表虚伪，欺凌丈夫，克害子女，与六亲不和，并且没有廉耻之心。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":396,"chapterOrder":14,"inChapterOrder":421,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367818291","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1032\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戌丑未入庙，辰戍丑未生人利。\",\"logicSentenceId\":\"7580338560366166068\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374957619","endPageId":"7330177673374957619","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366166068\",\"content\":\"辰、戌、丑、未四宫入庙，辰、戌、丑、未年出生的人有利。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":341,"chapterOrder":14,"inChapterOrder":422,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367834675","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1033\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅申巳亥𨺻地。\",\"logicSentenceId\":\"7580338560366182452\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374957619","endPageId":"7330177673374957619","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366182452\",\"content\":\"在寅、申、巳、亥这些宫位处于陷地。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":288,"chapterOrder":14,"inChapterOrder":423,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367851059","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1034\",\"lineNum\":0,\"lineType\":10,\"content\":\"陀羅入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374957619","endPageId":"7330177673374957619","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":128,"chapterOrder":14,"inChapterOrder":424,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367867443","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1035\",\"lineNum\":0,\"lineType\":1,\"content\":\"陀羅命内坐中存，更喜人生四墓生，再得紫㣲昌府合，財禄豊盈逺播名。\",\"logicSentenceId\":\"7580338560366198836\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1036\",\"lineNum\":0,\"lineType\":1,\"content\":\"陀羅在𨺻不堪聞，口舌官災一世侵。\",\"logicSentenceId\":\"7580338560366215220\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1037\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177739183603752\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1038\",\"lineNum\":0,\"lineType\":1,\"content\":\"財散人離人孤獨，所為所作不如心。\",\"logicSentenceId\":\"7580338560366231604\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177673374957619","endPageId":"7330177739183603752","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366231604\",\"content\":\"钱财散尽、亲人分离，人孤独无依，所做的事情都不能称心如意。\"},{\"logicSentenceId\":\"7580338560366198836\",\"content\":\"陀罗星坐守命宫，如果命主出生于四墓宫位则更为吉利，若再与紫微星、文昌星、天府星会合，就会财禄丰厚、礼数周全，名声远扬。\"},{\"logicSentenceId\":\"7580338560366215220\",\"content\":\"陀罗星处于陷地的情况就很糟糕了，一生都会遭受口舌是非和官灾侵扰。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1254,"chapterOrder":14,"inChapterOrder":425,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367883827","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1039\",\"lineNum\":0,\"lineType\":10,\"content\":\"陀羅入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177739183603752","endPageId":"7330177739183603752","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":128,"chapterOrder":14,"inChapterOrder":426,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881367900211","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1040\",\"lineNum\":0,\"lineType\":1,\"content\":\"陀羅一曜女人逢，遇吉加臨滛蕩容。\",\"logicSentenceId\":\"7580338560366247988\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1041\",\"lineNum\":0,\"lineType\":1,\"content\":\"㐫殺三方相照破，湏防相别主人翁。\",\"logicSentenceId\":\"7580338560366264372\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177739183603752","endPageId":"7330177739183603752","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366247988\",\"content\":\"陀罗星出现在女人的命宫中，如果有吉星加临，容貌就会淫荡。\"},{\"logicSentenceId\":\"7580338560366264372\",\"content\":\"如果三方有凶煞之星相互冲破，必须防备与丈夫分离。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":651,"chapterOrder":14,"inChapterOrder":427,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917042714","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1042\",\"lineNum\":0,\"lineType\":10,\"content\":\"陀羅入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177739183603752","endPageId":"7330177739183603752","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":125,"chapterOrder":14,"inChapterOrder":428,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917059098","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1043\",\"lineNum\":0,\"lineType\":1,\"content\":\"限遇陀羅事亦多，必然忍耐要謙和。\",\"logicSentenceId\":\"7580338560366280756\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1044\",\"lineNum\":0,\"lineType\":1,\"content\":\"若無吉曜同相㑹，湏教一夣入南柯。\",\"logicSentenceId\":\"7580338560366297140\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1045\",\"lineNum\":0,\"lineType\":1,\"content\":\"夾身夾命有陀羊，火鈴空刼又來傷。\",\"logicSentenceId\":\"7580338560366313524\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1046\",\"lineNum\":0,\"lineType\":1,\"content\":\"天禄不逢生旺地，刑妻尅子不為良。\",\"logicSentenceId\":\"7580338560366329908\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177739183603752","endPageId":"7330177739183603752","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366297140\",\"content\":\"如果没有吉星同时相会，终将南柯一梦一场空。\"},{\"logicSentenceId\":\"7580338560366313524\",\"content\":\"陀罗星和擎羊星夹着身宫和命宫，火星、铃星、天空星、地劫星又来伤害。\"},{\"logicSentenceId\":\"7580338560366329908\",\"content\":\"天禄星没处在生旺的位置，会克害妻子和子女，这可不是好现象。\"},{\"logicSentenceId\":\"7580338560366280756\",\"content\":\"大运遇到陀罗星时也会有很多事情发生，一定要学会忍耐，保持谦和的态度。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1310,"chapterOrder":14,"inChapterOrder":429,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917075482","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1047\",\"lineNum\":0,\"lineType\":1,\"content\":\"火星南斗浮星，火性剛強，出衆唇齒四肢，有傷毛髪生異形。\",\"logicSentenceId\":\"7580338560366346292\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1048\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177753024626725\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1049\",\"lineNum\":0,\"lineType\":1,\"content\":\"容各别諸宫不羙，惟會貪狼庙旺，指日立邉功。\",\"logicSentenceId\":\"7580338560366362676\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1050\",\"lineNum\":0,\"lineType\":1,\"content\":\"為財官格利東南生人，不利西北，及喜寅卯己午生人，禍輕。\",\"logicSentenceId\":\"7580338560366379060\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1051\",\"lineNum\":0,\"lineType\":1,\"content\":\"更與擎羊同，則襁褓災厄孤尅。\",\"logicSentenceId\":\"7580338560366395444\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1052\",\"lineNum\":0,\"lineType\":1,\"content\":\"下局只冝過房，外家寄飬，重拜父母方可。\",\"logicSentenceId\":\"7580338560366411828\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177739183603752","endPageId":"7330177753024626725","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366379060\",\"content\":\"属于财官格，对东南方出生的人有利，对西北方出生的人不利，并且喜见寅、卯、己、午年出生的人，灾祸较轻。\"},{\"logicSentenceId\":\"7580338560366395444\",\"content\":\"如果再与擎羊星同宫，那么在襁褓中就会遭遇灾厄，孤独克害亲人。\"},{\"logicSentenceId\":\"7580338560366411828\",\"content\":\"命局不佳的人只适合过继给他人，到母亲的娘家寄养，重新拜认父母才可以。\"},{\"logicSentenceId\":\"7580338560366346292\",\"content\":\"火星是南斗的浮星，火性刚强，会使人口唇、牙齿、四肢出现异于常人的情况，毛发也会有损伤、形态异常。\"},{\"logicSentenceId\":\"7580338560366362676\",\"content\":\"火星在各宫位表现都不好，唯独与庙旺状态的贪狼星相会时，很快就能在边关建立功勋。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1996,"chapterOrder":14,"inChapterOrder":430,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917091866","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1053\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命心毒，内狼外虚，凌夫尅子，不守婦道，多是非滛慾下賎。\",\"logicSentenceId\":\"7580338560366428212\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024626725","endPageId":"7330177753024626725","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366428212\",\"content\":\"女命心地狠毒，内里如狼外表虚伪，欺凌丈夫、克害子女，不守妇道，多惹是非，沉迷淫欲且行为下贱。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":437,"chapterOrder":14,"inChapterOrder":431,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917108250","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1054\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅午戌人冝，申子辰𨺻災吝困，巳酉丑得地吉，亥卯未利益吉，多發福。\",\"logicSentenceId\":\"7580338560366444596\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024626725","endPageId":"7330177753024626725","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366444596\",\"content\":\"寅午戌出生的人适宜，申子辰出生者易陷灾祸困顿，巳酉丑出生的人诸事顺遂吉祥，亥卯未出生的人多获利益吉祥，多能发福。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":480,"chapterOrder":14,"inChapterOrder":432,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917124634","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1055\",\"lineNum\":0,\"lineType\":10,\"content\":\"火星入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024626725","endPageId":"7330177753024626725","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":125,"chapterOrder":14,"inChapterOrder":433,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917141018","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1056\",\"lineNum\":0,\"lineType\":1,\"content\":\"火星得地限宫逢，喜氣盈門百事通。\",\"logicSentenceId\":\"7580338560366460980\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1057\",\"lineNum\":0,\"lineType\":1,\"content\":\"仕宦逢之皆發福，常人得此財豊隆。\",\"logicSentenceId\":\"7580338560366477364\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1058\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177796800577588\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1059\",\"lineNum\":0,\"lineType\":1,\"content\":\"火星一宿最乖張，無事官災閙一塲。\",\"logicSentenceId\":\"7580338560366493748\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1060\",\"lineNum\":0,\"lineType\":1,\"content\":\"尅害六親應不免，破財艱苦免恓惶。\",\"logicSentenceId\":\"7580338560366510132\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024626725","endPageId":"7330177796800577588","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366460980\",\"content\":\"火星处于有利位置且与限宫相遇时，家中会充满喜气，所有事情都能顺利进行。\"},{\"logicSentenceId\":\"7580338560366477364\",\"content\":\"当官的人遇到处于得地状态的火星会仕途顺遂、收获福气，普通人遇到则会收获丰厚的钱财和礼物。\"},{\"logicSentenceId\":\"7580338560366493748\",\"content\":\"火星这颗星宿最为乖张，平白无故惹来官灾闹一场。\"},{\"logicSentenceId\":\"7580338560366510132\",\"content\":\"克害六亲是难以避免的，虽会破财、生活艰苦，但能免去悲伤。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1467,"chapterOrder":14,"inChapterOrder":434,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917157402","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1061\",\"lineNum\":0,\"lineType\":1,\"content\":\"鈴星火南斗浮星，性毒，形神破相，膽大出衆冝。\",\"logicSentenceId\":\"7580338560366526516\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1062\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅午戌生人權貴，亦利東南生人及限行福厚，西北人限行成敗，𨿽冨貴不乆。\",\"logicSentenceId\":\"7580338560366542900\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1063\",\"lineNum\":0,\"lineType\":1,\"content\":\"入庙遇貪狼武曲鎮邉夷，更㑹紫府左右，不貴即冨，如𨺻夭折，破相延夀，離祖重拜父毋。\",\"logicSentenceId\":\"7580338560366559284\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177796800577588","endPageId":"7330177796800577588","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366542900\",\"content\":\"出生在寅年、午年或戌年的人有权贵，对出生于东南方向的人也有利，而且运势顺畅，福气深厚；西北方向出生的人运势成败不定，即使富贵也不会长久。\"},{\"logicSentenceId\":\"7580338560366559284\",\"content\":\"入庙遇到贪狼、武曲镇守边疆之地，又与紫微、天府、左辅、右弼相会，不是显贵就是富有，如果处于陷地则会夭折，破相反而能延长寿命，离开祖籍重新拜认父母。\"},{\"logicSentenceId\":\"7580338560366526516\",\"content\":\"铃星和火星是南斗浮星，性情狠毒，会使人形体和精神受损而破相，适合胆子大且出众的人。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1419,"chapterOrder":14,"inChapterOrder":435,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917173786","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1064\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命性剛背六親傷，夫子遇吉豊足。\",\"logicSentenceId\":\"7580338560366575668\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177796800577588","endPageId":"7330177796800577588","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560366575668\",\"content\":\"女性命主性格刚强，背离六亲且有所损伤，若丈夫和子女遇到吉利之事则礼数周全。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":374,"chapterOrder":14,"inChapterOrder":436,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917190170","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1065\",\"lineNum\":0,\"lineType\":10,\"content\":\"鈴星入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177796800577588","endPageId":"7330177796800577588","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":125,"chapterOrder":14,"inChapterOrder":437,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917206554","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1066\",\"lineNum\":0,\"lineType\":1,\"content\":\"限至鈴星事若何，貪狼相遇福還多。\",\"logicSentenceId\":\"7580338560366592052\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1067\",\"lineNum\":0,\"lineType\":1,\"content\":\"更加入庙逢諸吉，冨貴声揚處處歌。\",\"logicSentenceId\":\"7580338560532742196\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1068\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177753024741413\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1069\",\"lineNum\":0,\"lineType\":1,\"content\":\"鈴星一宿不可當，守臨二限必顛狂。\",\"logicSentenceId\":\"7580338560532758580\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1070\",\"lineNum\":0,\"lineType\":1,\"content\":\"若無吉曜來相照，未免招災惹禍殃。\",\"logicSentenceId\":\"7580338560532774964\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177796800577588","endPageId":"7330177753024741413","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560532758580\",\"content\":\"铃星这个星宿不可阻挡，守临二限必然会癫狂。\"},{\"logicSentenceId\":\"7580338560532774964\",\"content\":\"如果没有吉星来照耀，就难免会招来灾祸。\"},{\"logicSentenceId\":\"7580338560366592052\",\"content\":\"行运到铃星时事情会怎样呢？若与贪狼星相遇福运还会很多。\"},{\"logicSentenceId\":\"7580338560532742196\",\"content\":\"若铃星入庙又遇到各种吉星，富贵双全，声名远扬，到处都有赞誉之声。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1374,"chapterOrder":14,"inChapterOrder":438,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917222938","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1071\",\"lineNum\":0,\"lineType\":10,\"content\":\"火鈴二星入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024741413","endPageId":"7330177753024741413","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":134,"chapterOrder":14,"inChapterOrder":439,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917239322","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1072\",\"lineNum\":0,\"lineType\":1,\"content\":\"火鈴二曜居庙地，貪狼紫府冝相㑹。\",\"logicSentenceId\":\"7580338560532791348\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1073\",\"lineNum\":0,\"lineType\":1,\"content\":\"為人性急有威權，鎮壓郷邦終有貴。\",\"logicSentenceId\":\"7580338560532807732\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1074\",\"lineNum\":0,\"lineType\":1,\"content\":\"火鈴在命落閑宫，西北生人作事庸。\",\"logicSentenceId\":\"7580338560532824116\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1075\",\"lineNum\":0,\"lineType\":1,\"content\":\"破盡家財終不乆，湏教𢃄疾免災㐫。\",\"logicSentenceId\":\"7580338560532840500\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024741413","endPageId":"7330177753024741413","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560532824116\",\"content\":\"火星和铃星在命盘中落在闲宫，西北方出生的人做事平庸。\"},{\"logicSentenceId\":\"7580338560532840500\",\"content\":\"耗尽家财终究不能长久，应该让其带点疾病来免除灾祸凶险。\"},{\"logicSentenceId\":\"7580338560532791348\",\"content\":\"火星和铃星这两颗星曜处于庙旺之地时，适合与贪狼星、紫微天府星相会。\"},{\"logicSentenceId\":\"7580338560532807732\",\"content\":\"为人性格急躁且有权威，能够镇服乡里，最终会有尊贵的地位。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1302,"chapterOrder":14,"inChapterOrder":440,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917255706","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1076\",\"lineNum\":0,\"lineType\":10,\"content\":\"火鈴二星入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024741413","endPageId":"7330177753024741413","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":134,"chapterOrder":14,"inChapterOrder":441,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917272090","paragraph
