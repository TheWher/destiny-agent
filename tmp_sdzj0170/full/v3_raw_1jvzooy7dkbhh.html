ntences\":[{\"logicSentenceId\":\"7580338557715365922\",\"content\":\"丙年、戊年、壬年出生的人，福气持续的时间不长。\"},{\"logicSentenceId\":\"7580338557715349538\",\"content\":\"巳亥宫落陷，与廉贞同宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":570,"chapterOrder":14,"inChapterOrder":285,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712889354","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"660\",\"lineNum\":0,\"lineType\":10,\"content\":\"貪狼入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177208310480930","endPageId":"7330177208310480930","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":286,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712905738","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"661\",\"lineNum\":0,\"lineType\":1,\"content\":\"四墓宫中福氣濃，提兵指日立邉功。\",\"logicSentenceId\":\"7580338557715382306\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"662\",\"lineNum\":0,\"lineType\":1,\"content\":\"火星拱㑹誠為貴，名震諸夷定有封。\",\"logicSentenceId\":\"7580338557715398690\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"663\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼守命同羊宫，陀殺交加必困窮。\",\"logicSentenceId\":\"7580338557715415074\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"664\",\"lineNum\":0,\"lineType\":1,\"content\":\"武破𤎉貞同殺刼，百藝防身度𡻕終。\",\"logicSentenceId\":\"7580338557715431458\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"665\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177093701255218\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"666\",\"lineNum\":0,\"lineType\":1,\"content\":\"四墓貪狼庙旺宫，加臨左右冨財翁。\",\"logicSentenceId\":\"7580338557715447842\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"667\",\"lineNum\":0,\"lineType\":1,\"content\":\"若然再化科𫞐禄，文武材能顕大功。\",\"logicSentenceId\":\"7580338557715464226\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177208310480930","endPageId":"7330177093701255218","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715398690\",\"content\":\"火星拱照会合确实可贵，名声震慑外族必将被封官。\"},{\"logicSentenceId\":\"7580338557715415074\",\"content\":\"贪狼星坐守命宫且与擎羊星同宫，陀罗星与煞星交相出现，其人必定穷困潦倒。\"},{\"logicSentenceId\":\"7580338557715431458\",\"content\":\"武曲、破军、廉贞三星与煞星、劫星同宫，只能依靠各种技艺来维持生计度过一生。\"},{\"logicSentenceId\":\"7580338557715447842\",\"content\":\"贪狼星在四墓宫处于庙旺的状态，又有左辅星、右弼星加临，命主会成为富有的财翁。\"},{\"logicSentenceId\":\"7580338557715464226\",\"content\":\"倘若再化出科、权、禄，文才武略能够立下大功。\"},{\"logicSentenceId\":\"7580338557715382306\",\"content\":\"四墓宫中福气深厚，统领军队能迅速立下边疆战功。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2071,"chapterOrder":14,"inChapterOrder":287,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779703346","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"668\",\"lineNum\":0,\"lineType\":10,\"content\":\"貪狼入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177093701255218","endPageId":"7330177093701255218","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":288,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779719730","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"669\",\"lineNum\":0,\"lineType\":1,\"content\":\"四墓宫中多吉利，更逢左右方為貴。\",\"logicSentenceId\":\"7580338557715480610\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"670\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄財豊冨旺夫君。\",\"logicSentenceId\":\"7580338557715496994\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"671\",\"lineNum\":0,\"lineType\":1,\"content\":\"性格剛強多志氣，貪狼𨺻地女非祥，衣食𨿽豊也不良。\",\"logicSentenceId\":\"7580338557715513378\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"672\",\"lineNum\":0,\"lineType\":1,\"content\":\"尅害良人并男女，又教衾枕守孤孀。\",\"logicSentenceId\":\"7580338557715529762\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177093701255218","endPageId":"7330177093701255218","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715496994\",\"content\":\"禄星、财星带来礼仪与富贵，能使夫君兴旺发达。\"},{\"logicSentenceId\":\"7580338557715513378\",\"content\":\"性格刚强志向远大，但若是贪狼星处于陷地，对女子来说不吉祥，即便衣食合乎礼仪也不算好。\"},{\"logicSentenceId\":\"7580338557715529762\",\"content\":\"会对丈夫和子女造成克害，还会让人独守空闺成为寡妇。\"},{\"logicSentenceId\":\"7580338557715480610\",\"content\":\"四墓宫中大多吉利，若再遇到左辅星和右弼星才称得上显贵。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1305,"chapterOrder":14,"inChapterOrder":289,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779736114","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"673\",\"lineNum\":0,\"lineType\":10,\"content\":\"貪狼入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177093701255218","endPageId":"7330177093701255218","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":290,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779752498","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"674\",\"lineNum\":0,\"lineType\":1,\"content\":\"北斗貪狼入限來，若還入庙事和諧，科𫞐仕路多成就，必主當年發横財。\",\"logicSentenceId\":\"7580338557715546146\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"675\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177208310612002\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"676\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼主限四庫臨，更喜人生四墓生，若見火星多横發，自然冨貴冠郷隣。\",\"logicSentenceId\":\"7580338557715562530\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"677\",\"lineNum\":0,\"lineType\":1,\"content\":\"限至貪狼𨺻不良，只冝節慾息災傷。\",\"logicSentenceId\":\"7580338557715578914\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"678\",\"lineNum\":0,\"lineType\":1,\"content\":\"賭蕩風流去財寳，吉矅三方可免灾。\",\"logicSentenceId\":\"7580338557715595298\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"679\",\"lineNum\":0,\"lineType\":1,\"content\":\"女限貪狼事不良，冝懐六甲免災殃。\",\"logicSentenceId\":\"7580338557715611682\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"680\",\"lineNum\":0,\"lineType\":1,\"content\":\"若無吉矅來相㑹，湏知一命入泉郷。\",\"logicSentenceId\":\"7580338557715628066\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177093701255218","endPageId":"7330177208310612002","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715562530\",\"content\":\"贪狼星主限运时遇到四库之地，更令人欣喜的是命主出生于四墓之时，若此时见到火星，大多能突然发迹，自然富贵冠绝乡邻。\"},{\"logicSentenceId\":\"7580338557715578914\",\"content\":\"行运到贪狼星处于陷地的情况不佳，只适合节制欲望来平息灾祸伤害。\"},{\"logicSentenceId\":\"7580338557715595298\",\"content\":\"因为赌博玩乐、风流放纵而损失钱财，吉星出现在三方可以避免灾祸。\"},{\"logicSentenceId\":\"7580338557715611682\",\"content\":\"女性行贪狼星运事情不顺利，应当怀有身孕免受灾殃。\"},{\"logicSentenceId\":\"7580338557715628066\",\"content\":\"如果没有吉星来相会，就知道将会命丧黄泉。\"},{\"logicSentenceId\":\"7580338557715546146\",\"content\":\"北斗贪狼星进入命限，如果进入庙旺之地，事情会顺遂和谐，遇到科星和禄星，仕途上会有很多成就，必定会在当年发横财。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2283,"chapterOrder":14,"inChapterOrder":291,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779768882","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"681\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門水北斗化暗，主是非。\",\"logicSentenceId\":\"7580338557715644450\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"682\",\"lineNum\":0,\"lineType\":1,\"content\":\"入庙身長肥胖，敦厚淸秀。\",\"logicSentenceId\":\"7580338557715660834\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"683\",\"lineNum\":0,\"lineType\":1,\"content\":\"不入庙五短瘦小，作事進退疑惑，多學少精，與人寡合，多是多非，奔波劳碌，喜左右禄存。\",\"logicSentenceId\":\"7580338557715677218\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"684\",\"lineNum\":0,\"lineType\":1,\"content\":\"六癸、六辛生人，坐子卯合局。\",\"logicSentenceId\":\"7580338557715693602\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"685\",\"lineNum\":0,\"lineType\":1,\"content\":\"六庚六丁生人，辰戌安命，却不冨貴；子午宫安命，丙戊生人，孤\",\"logicSentenceId\":\"7580338557715709986\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"686\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177203646316570\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"687\",\"lineNum\":0,\"lineType\":1,\"content\":\"寡殀折。\",\"logicSentenceId\":\"7580338557715709986\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"688\",\"lineNum\":0,\"lineType\":1,\"content\":\"六甲生人，而擎羊同入庙，在卯宫者破局，在子午宫，於身命為石中𨼆玉格。\",\"logicSentenceId\":\"7580338557715726370\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"689\",\"lineNum\":0,\"lineType\":1,\"content\":\"更㑹禄科權，福厚，㑹殺忌羊陀，𠰥不夭折，男女盗娼。\",\"logicSentenceId\":\"7580338557715742754\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177208310612002","endPageId":"7330177203646316570","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715660834\",\"content\":\"入庙时身体高大肥胖，性格敦厚，相貌清秀。\"},{\"logicSentenceId\":\"7580338557715677218\",\"content\":\"不在庙的位置则身材五短瘦小，做事犹豫不决，学得多但精通的少，与人难以相处，是非多，奔波劳碌，喜欢左右有禄存星。\"},{\"logicSentenceId\":\"7580338557715693602\",\"content\":\"出生在六癸、六辛年的人，命盘坐于子、卯位形成合局。\"},{\"logicSentenceId\":\"7580338557715709986\",\"content\":\"庚年、丁年出生的人，命宫安在辰宫、戌宫，却不富贵；命宫安在子宫、午宫，丙年、戊年出生的人，会孤寡夭折。\"},{\"logicSentenceId\":\"7580338557715726370\",\"content\":\"六甲年出生的人，如果擎羊星一同进入庙旺之地，在卯宫时会破坏格局，在子宫或午宫时，对于自身命运而言是石中隐玉格。\"},{\"logicSentenceId\":\"7580338557715742754\",\"content\":\"如果再遇到禄星、科星、权星，福气深厚；如果遇到杀星、忌星、擎羊星、陀罗星，若不夭折，男女会沦为盗贼娼妓。\"},{\"logicSentenceId\":\"7580338557715644450\",\"content\":\"巨门星属水，在北斗星象中化为暗星，主有是非之事。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2898,"chapterOrder":14,"inChapterOrder":292,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779785266","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"690\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命入庙，六癸、六辛生人享福，𨺻地傷尅，夫子丁人遇極滛。\",\"logicSentenceId\":\"7580338557715759138\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"691\",\"lineNum\":0,\"lineType\":1,\"content\":\"此星在女命，多有瑕玷。\",\"logicSentenceId\":\"7580338557715775522\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646316570","endPageId":"7330177203646316570","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715759138\",\"content\":\"女性的命盘中巨门星入庙，出生年份的天干是癸、辛的，会一生享福；如果巨门星处于陷地，则会有刑伤克害之事；出生年份天干是丁的女性遇到巨门星处于陷地时，会非常淫乱。\"},{\"logicSentenceId\":\"7580338557715775522\",\"content\":\"这颗星在女性命盘中，大多会有瑕疵污点。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":809,"chapterOrder":14,"inChapterOrder":293,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779801650","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"692\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午宫旺地，丁巳、癸辛生人福厚，丙戊生人主困。\",\"logicSentenceId\":\"7580338557715791906\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646316570","endPageId":"7330177203646316570","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715791906\",\"content\":\"在子午宫处于旺地时，丁巳、癸辛年出生的人福泽深厚，丙戊年出生的人则会陷入困境。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":400,"chapterOrder":14,"inChapterOrder":294,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779818034","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"693\",\"lineNum\":0,\"lineType\":1,\"content\":\"卯酉宫入庙，乙辛生人，財官格，丁戊生人有成敗。\",\"logicSentenceId\":\"7580338559081512994\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646316570","endPageId":"7330177203646316570","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559081512994\",\"content\":\"在卯宫和酉宫入庙，乙年、辛年出生的人，是有财有官的命格；丁年或戊年出生的人，人生则有成功也有失败。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":430,"chapterOrder":14,"inChapterOrder":295,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779834418","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"694\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅申宫入庙，太陽同。\",\"logicSentenceId\":\"7580338559081529378\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"695\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲庚、癸辛生人，財官格。\",\"logicSentenceId\":\"7580338559081545762\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646316570","endPageId":"7330177203646316570","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559081545762\",\"content\":\"甲年、庚年、癸年、辛年出生的人，为财官格。\"},{\"logicSentenceId\":\"7580338559081529378\",\"content\":\"在寅申宫入庙，与太阳同宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":565,"chapterOrder":14,"inChapterOrder":296,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779850802","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"696\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戍和平。\",\"logicSentenceId\":\"7580338559081562146\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"697\",\"lineNum\":0,\"lineType\":1,\"content\":\"癸辛生人貴，丁生人困。\",\"logicSentenceId\":\"7580338559081578530\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646316570","endPageId":"7330177203646316570","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559081562146\",\"content\":\"在辰宫和戌宫时状态较为平和。\"},{\"logicSentenceId\":\"7580338559081578530\",\"content\":\"癸年、辛年出生的人显贵，丁年出生的人困顿。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":550,"chapterOrder":14,"inChapterOrder":297,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779867186","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"698\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑未不得地。\",\"logicSentenceId\":\"7580338559081594914\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"699\",\"lineNum\":0,\"lineType\":1,\"content\":\"癸辛、丙生人，財官格。\",\"logicSentenceId\":\"7580338559081611298\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646316570","endPageId":"7330177203646316570","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559081611298\",\"content\":\"癸年、辛年、丙年出生的人，属于财官命格。\"},{\"logicSentenceId\":\"7580338559081594914\",\"content\":\"在丑宫和未宫不得地。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":538,"chapterOrder":14,"inChapterOrder":298,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779883570","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"700\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177268662288384\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"701\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳亥旺宫，癸辛生人，財官格。\",\"logicSentenceId\":\"7580338559081627682\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177268662288384","endPageId":"7330177268662288384","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559081627682\",\"content\":\"巳亥是旺盛的宫位，癸年或辛年出生的人，有财星和官星的格局。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":460,"chapterOrder":14,"inChapterOrder":299,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878779899954","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"702\",\"lineNum\":0,\"lineType\":10,\"content\":\"巨門入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177268662288384","endPageId":"7330177268662288384","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":300,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878794137650","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"703\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門子午二宫逢，局中得遇以為荣。\",\"logicSentenceId\":\"7580338559081644066\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"704\",\"lineNum\":0,\"lineType\":1,\"content\":\"三合化吉科𫞐禄，官高極品衣紫袍。\",\"logicSentenceId\":\"7580338559081660450\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"705\",\"lineNum\":0,\"lineType\":1,\"content\":\"此星化暗不冝逢，更㑹㐫星愈肆㐫。\",\"logicSentenceId\":\"7580338559081676834\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"706\",\"lineNum\":0,\"lineType\":1,\"content\":\"唇齒有傷𠔥性猛，若然入庙可和平。\",\"logicSentenceId\":\"7580338559081693218\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"707\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門守命遇擎羊，鈴火逢之事不祥。\",\"logicSentenceId\":\"7580338559081709602\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"708\",\"lineNum\":0,\"lineType\":1,\"content\":\"為人性急多顛倒，百事茫茫亂主張。\",\"logicSentenceId\":\"7580338559081725986\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177268662288384","endPageId":"7330177268662288384","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559081709602\",\"content\":\"巨门星坐守命宫遇到擎羊星，再遇上铃星、火星，事情就不吉利。\"},{\"logicSentenceId\":\"7580338559081725986\",\"content\":\"为人性情急躁，做事常常颠三倒四，面对各种事情茫然无措，胡乱拿主意。\"},{\"logicSentenceId\":\"7580338559081644066\",\"content\":\"巨门星在子午这两个宫位相逢，命局中遇到会认为是荣耀之事。\"},{\"logicSentenceId\":\"7580338559081660450\",\"content\":\"三合化出吉祥的科、权、禄，官位极高，身着紫袍。\"},{\"logicSentenceId\":\"7580338559081676834\",\"content\":\"巨门星化暗时不宜遇到，若再与凶星会合就会更加肆虐逞凶。\"},{\"logicSentenceId\":\"7580338559081693218\",\"content\":\"会有唇齿方面的损伤，且性格刚烈，若入庙则能趋于平和。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1917,"chapterOrder":14,"inChapterOrder":301,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878794154034","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"709\",\"lineNum\":0,\"lineType\":10,\"content\":\"巨門入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177268662288384","endPageId":"7330177268662288384","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":302,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878794170418","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"710\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門旺地多生吉，左右加臨夀更長。\",\"logicSentenceId\":\"7580338559081742370\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"711\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177203646398490\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"712\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人得此誠為貴，簾捲珍珠坐綉房。\",\"logicSentenceId\":\"7580338559081758754\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"713\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門命𨺻主滛娼，侍女偏房始免殃。\",\"logicSentenceId\":\"7580338559081775138\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"714\",\"lineNum\":0,\"lineType\":1,\"content\":\"相貌清竒多近寵，不然夀夭主㐫亡。\",\"logicSentenceId\":\"7580338559081791522\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177268662288384","endPageId":"7330177203646398490","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559081775138\",\"content\":\"巨门星在命宫陷地，命主会成为淫荡娼妇，成为侍女或偏房才能免除灾殃。\"},{\"logicSentenceId\":\"7580338559081791522\",\"content\":\"相貌清秀奇特之人多能得到宠爱，否则会寿命短遭遇凶亡。\"},{\"logicSentenceId\":\"7580338559081742370\",\"content\":\"巨门星处于旺地大多会带来吉利，若有左辅星和右弼星加临，命主会更加长寿。\"},{\"logicSentenceId\":\"7580338559081758754\",\"content\":\"女人有这样的星象格局确实尊贵，如同卷起珍珠帘坐在绣房里。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1439,"chapterOrder":14,"inChapterOrder":303,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878794186802","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"715\",\"lineNum\":0,\"lineType\":10,\"content\":\"巨門入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646398490","endPageId":"7330177203646398490","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":304,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878794203186","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"716\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門主限化𫞐星，最喜求謀大事成。\",\"logicSentenceId\":\"7580338559081807906\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"717\",\"lineNum\":0,\"lineType\":1,\"content\":\"𨿽有官災并口舌，㐫為吉兆得安寕。\",\"logicSentenceId\":\"7580338559081824290\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"718\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門入限動人愁，若遇喪門事不周。\",\"logicSentenceId\":\"7580338559081840674\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"719\",\"lineNum\":0,\"lineType\":1,\"content\":\"士庶逢之多惹訟，居官失職或丁憂。\",\"logicSentenceId\":\"7580338559081857058\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"720\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門限𨺻最𠂯張，無事官非閙一塲。\",\"logicSentenceId\":\"7580338559081873442\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"721\",\"lineNum\":0,\"lineType\":1,\"content\":\"哭泣䘮連終不免，破財嘔氣受凄凉。\",\"logicSentenceId\":\"7580338559081889826\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646398490","endPageId":"7330177203646398490","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559081840674\",\"content\":\"巨门星进入限运使人忧愁，如果遇到丧门星事情就不顺利。\"},{\"logicSentenceId\":\"7580338559081857058\",\"content\":\"普通人和读书人遇到这种情况容易招惹诉讼，官员则会失去职位或遭逢父母丧事。\"},{\"logicSentenceId\":\"7580338559081873442\",\"content\":\"巨门星在限运中处于陷地最为乖戾反常，即使没什么事也会引发一场官司是非。\"},{\"logicSentenceId\":\"7580338559081889826\",\"content\":\"哭泣和丧事接连不断终究难以避免，还会破财、憋气，遭受凄凉之苦。\"},{\"logicSentenceId\":\"7580338559081807906\",\"content\":\"巨门星在主限期间化𫞐星，最适合谋划大事并取得成功。\"},{\"logicSentenceId\":\"7580338559081824290\",\"content\":\"虽然会遭遇官灾和口舌是非，但凶险会转化为吉兆，最终能获得安宁。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1974,"chapterOrder":14,"inChapterOrder":305,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878794219570","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"722\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177268662419456\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"723\",\"lineNum\":0,\"lineType\":1,\"content\":\"天相水南斗化印為官禄，主為人相貌敦厚，持重淸白，好酒食，衣禄豊足，紫府左右昌曲。\",\"logicSentenceId\":\"7580338559081906210\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"724\",\"lineNum\":0,\"lineType\":1,\"content\":\"日月嘉㑹，財官𩀱羙，位至三公。\",\"logicSentenceId\":\"7580338559081922594\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"725\",\"lineNum\":0,\"lineType\":1,\"content\":\"與武破羊陀同行，則為巧藝，更加火鈴巨机，則傷刑不善終。\",\"logicSentenceId\":\"7580338559081938978\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"726\",\"lineNum\":0,\"lineType\":1,\"content\":\"天相又能化𤎉貞之悪。\",\"logicSentenceId\":\"7580338559081955362\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177268662419456","endPageId":"7330177268662419456","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559081906210\",\"content\":\"天相星属水，是南斗星曜，化印代表官禄，主人相貌忠厚，稳重清白，喜好酒食，衣食充足礼仪完备，有紫微星、天府星、左辅星、右弼星、文昌星、文曲星相伴。\"},{\"logicSentenceId\":\"7580338559081922594\",\"content\":\"太阳星和太阴星会合，财运和官运都很好，官位可至三公。\"},{\"logicSentenceId\":\"7580338559081938978\",\"content\":\"与武曲、破军、擎羊、陀罗同宫，就会有精巧技艺；再加上火星、铃星、巨门、天机，就会遭受刑伤不得善终。\"},{\"logicSentenceId\":\"7580338559081955362\",\"content\":\"天相星又能够化解廉贞星带来的凶煞。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1650,"chapterOrder":14,"inChapterOrder":306,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878794235954","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"727\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命入庙温和，衣禄遂心，僧道亦吉。\",\"logicSentenceId\":\"7580338559081971746\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177268662419456","endPageId":"7330177268662419456","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559081971746\",\"content\":\"女性命格入庙，性格温和，衣食俸禄称心如意，出家为僧道也吉利。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":355,"chapterOrder":14,"inChapterOrder":307,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878913921033","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"728\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午宫庙地，𤎉貞同丁巳癸甲人，財官格。\",\"logicSentenceId\":\"7580338559081988130\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177268662419456","endPageId":"7330177268662419456","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559081988130\",\"content\":\"子午宫的庙旺之地，廉贞星与丁巳年、癸年、甲年出生的人同宫，是有财有官的格局。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":386,"chapterOrder":14,"inChapterOrder":308,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878913937417","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"729\",\"lineNum\":0,\"lineType\":1,\"content\":\"卯酉𨺻宫，乙辛生人吉，甲庚人主困。\",\"logicSentenceId\":\"7580338559082004514\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177268662419456","endPageId":"7330177268662419456","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082004514\",\"content\":\"在卯酉二宫处于陷地时，乙年、辛年出生的人吉利，甲年、庚年出生的人主困顿。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":374,"chapterOrder":14,"inChapterOrder":309,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878913953801","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"730\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戌宫得地，紫微同財官格。\",\"logicSentenceId\":\"7580338559082020898\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177268662419456","endPageId":"7330177268662419456","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082020898\",\"content\":\"天相星落在辰宫、戌宫时处于得地的状态，与紫微星同宫时构成财官格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":349,"chapterOrder":14,"inChapterOrder":310,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878913970185","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"731\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑宫入庙，未宫得地，加吉星財官格。\",\"logicSentenceId\":\"7580338559082037282\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177268662419456","endPageId":"7330177268662419456","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082037282\",\"content\":\"天相星在丑宫入庙，在未宫得地，加吉星，为财官格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":337,"chapterOrder":14,"inChapterOrder":311,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878913986569","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"732\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅申宫入庙，武曲同丁甲庚生人，財官格。\",\"logicSentenceId\":\"7580338559082053666\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177268662419456","endPageId":"7330177268662419456","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082053666\",\"content\":\"寅申宫入庙，与武曲星同宫，丁、甲、庚年出生的人，是财官格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":358,"chapterOrder":14,"inChapterOrder":312,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914002953","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"733\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177203646480410\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"734\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳亥宫得地，丙戊壬生人為福。\",\"logicSentenceId\":\"7580338559082070050\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646480410","endPageId":"7330177203646480410","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082070050\",\"content\":\"在巳亥宫处于得地状态时，丙年、戊年、壬年出生的人会有福运。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":460,"chapterOrder":14,"inChapterOrder":313,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914019337","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"735\",\"lineNum\":0,\"lineType\":10,\"content\":\"天相入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646480410","endPageId":"7330177203646480410","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":314,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914035721","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"736\",\"lineNum\":0,\"lineType\":1,\"content\":\"天相星辰邁等倫，照守身命喜無垠。\",\"logicSentenceId\":\"7580338559082086434\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"737\",\"lineNum\":0,\"lineType\":1,\"content\":\"為官必主居元宰，三合相逢福不輕。\",\"logicSentenceId\":\"7580338559082102818\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"738\",\"lineNum\":0,\"lineType\":1,\"content\":\"天相吉星為命主，必定斯人多克巳。\",\"logicSentenceId\":\"7580338559082119202\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"739\",\"lineNum\":0,\"lineType\":1,\"content\":\"財官禄主旺家資，𫞐壓當時誰不羙。\",\"logicSentenceId\":\"7580338559082135586\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"740\",\"lineNum\":0,\"lineType\":1,\"content\":\"天相之星破武同，羊陀火鈴更為㐫。\",\"logicSentenceId\":\"7580338559082151970\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"741\",\"lineNum\":0,\"lineType\":1,\"content\":\"或作技術經啇軰，若在空門享福隆。\",\"logicSentenceId\":\"7580338559082168354\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646480410","endPageId":"7330177203646480410","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082119202\",\"content\":\"天相这颗吉星作为命主星，这个人必定会多克制自己。\"},{\"logicSentenceId\":\"7580338559082135586\",\"content\":\"财星、官星和禄星旺盛，能使家庭资财丰厚，此人在当时出类拔萃，谁不羡慕呢。\"},{\"logicSentenceId\":\"7580338559082151970\",\"content\":\"天相星与破军、武曲同宫，再逢擎羊、陀罗、火星、铃星则更凶。\"},{\"logicSentenceId\":\"7580338559082168354\",\"content\":\"或者成为技术精湛的人，如果在空门就会享受丰厚的福运。\"},{\"logicSentenceId\":\"7580338559082086434\",\"content\":\"天相星超凡出众，照耀守护人的身命宫，令人喜不自胜。\"},{\"logicSentenceId\":\"7580338559082102818\",\"content\":\"做官必定能官居宰相，三合相逢福分非轻。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1895,"chapterOrder":14,"inChapterOrder":315,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914052105","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"742\",\"lineNum\":0,\"lineType\":10,\"content\":\"天相入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646480410","endPageId":"7330177203646480410","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":316,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914068489","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"743\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人身命天相星，性格聦明百事残。\",\"logicSentenceId\":\"7580338559082184738\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"744\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177332642136116\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"745\",\"lineNum\":0,\"lineType\":1,\"content\":\"衣禄豊盈財帛足，旺夫貴子顕門庭。\",\"logicSentenceId\":\"7580338559082201122\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"746\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍七殺來相㑹，丑陀火鈴最所忌，孤刑尅害六親無，只可偏房與侍婢。\",\"logicSentenceId\":\"7580338559082217506\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177203646480410","endPageId":"7330177332642136116","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082217506\",\"content\":\"破军星和七杀星相会，遇上擎羊星、陀罗星、火星、铃星最为忌讳，会孤独、刑克伤害亲人，六亲缘薄，这样的女性只适合做偏房或侍婢。\"},{\"logicSentenceId\":\"7580338559082184738\",\"content\":\"女人的命宫、身宫有天相星坐守，性格聪明，但做很多事情都难以圆满。\"},{\"logicSentenceId\":\"7580338559082201122\",\"content\":\"衣食俸禄丰厚，礼数周全，钱财富足，能够旺夫益子，使家族门庭荣耀显赫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1270,"chapterOrder":14,"inChapterOrder":317,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914084873","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"747\",\"lineNum\":0,\"lineType\":10,\"content\":\"天相入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177332642136116","endPageId":"7330177332642136116","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":318,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914101257","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"748\",\"lineNum\":0,\"lineType\":1,\"content\":\"天相之星最主財，照臨二限悉無灾。\",\"logicSentenceId\":\"7580338559082233890\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"749\",\"lineNum\":0,\"lineType\":1,\"content\":\"動作謀為皆遂意，優游享福自然來。\",\"logicSentenceId\":\"7580338559082250274\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"750\",\"lineNum\":0,\"lineType\":1,\"content\":\"天相之星有幾般，三方不喜悪星纒。\",\"logicSentenceId\":\"7580338559082266658\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"751\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀空刼重相曽，口舌宫災禍亦連。\",\"logicSentenceId\":\"7580338559082283042\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"752\",\"lineNum\":0,\"lineType\":1,\"content\":\"限臨天相遇擎羊，作禍興殃不可當。\",\"logicSentenceId\":\"7580338559082299426\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"753\",\"lineNum\":0,\"lineType\":1,\"content\":\"更有火鈴諸殺凑，湏教一命入泉郷。\",\"logicSentenceId\":\"7580338559082315810\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177332642136116","endPageId":"7330177332642136116","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082299426\",\"content\":\"行运到天相星时遇到擎羊星，所引发的灾祸难以抵挡。\"},{\"logicSentenceId\":\"7580338559082315810\",\"content\":\"再加上火星、铃星等凶煞聚集，定会让人一命归西。\"},{\"logicSentenceId\":\"7580338559082233890\",\"content\":\"天相星最主管财运，照临大运和小运都不会有灾祸。\"},{\"logicSentenceId\":\"7580338559082250274\",\"content\":\"做事情、谋划事务都能顺遂心意，悠闲自在享受福气自然到来。\"},{\"logicSentenceId\":\"7580338559082266658\",\"content\":\"天相星有多种情况，三方不喜被恶星缠绕。\"},{\"logicSentenceId\":\"7580338559082283042\",\"content\":\"羊陀星、空劫星重重相遇，口舌方面的灾祸也会接连不断。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1846,"chapterOrder":14,"inChapterOrder":319,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914117641","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"754\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177319484538918\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"755\",\"lineNum\":0,\"lineType\":1,\"content\":\"天梁圡南斗化䕃主夀星。\",\"logicSentenceId\":\"7580338559082332194\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"756\",\"lineNum\":0,\"lineType\":1,\"content\":\"厚重清秀，聦明耿直，心無私曲，好施濟，有夀與天機同行，居翰苑善談兵，左右昌曲嘉㑹則出将入相，要入庙方冨貴。\",\"logicSentenceId\":\"7580338559082348578\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"757\",\"lineNum\":0,\"lineType\":1,\"content\":\"𨺻地遇火羊破局，則下賎孤寒夭折。\",\"logicSentenceId\":\"7580338559082364962\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"758\",\"lineNum\":0,\"lineType\":1,\"content\":\"逢天机耗殺清閑，僧道受制誥。\",\"logicSentenceId\":\"7580338559082381346\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"759\",\"lineNum\":0,\"lineType\":1,\"content\":\"六壬生人，亥卯未上安命者，冨貴雙全。\",\"logicSentenceId\":\"7580338559082397730\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484538918","endPageId":"7330177319484538918","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082364962\",\"content\":\"天梁星处于陷地，遇到火星、擎羊星破局，就会地位低下、孤独贫寒且早年夭折。\"},{\"logicSentenceId\":\"7580338559082381346\",\"content\":\"遇到天机星和耗杀星时清闲自在，僧侣道士能够接受朝廷诰封。\"},{\"logicSentenceId\":\"7580338559082397730\",\"content\":\"六壬年出生的人，如果命宫在亥、卯、未宫位，会富贵双全。\"},{\"logicSentenceId\":\"7580338559082332194\",\"content\":\"天梁星属土，为南斗星中化荫、主管长寿的星。\"},{\"logicSentenceId\":\"7580338559082348578\",\"content\":\"气质厚重、容貌清秀，聪明且为人正直，内心没有私心杂念，喜欢施舍救济他人，有长寿的运势。如果与天机星同行，能在翰林院任职且擅长谈论兵法，与左辅、右弼、文昌、文曲星美好相会时则能出将入相，但要入庙才能有富贵的运势。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2051,"chapterOrder":14,"inChapterOrder":320,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914134025","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"760\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命有男子之志，入庙冨貴。\",\"logicSentenceId\":\"7580338559082414114\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"761\",\"lineNum\":0,\"lineType\":1,\"content\":\"𨺻地加殺傷尅夫子又賎滛。\",\"logicSentenceId\":\"7580338559082430498\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484538918","endPageId":"7330177319484538918","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082414114\",\"content\":\"女性命格有男子般的志向，入庙则富贵。\"},{\"logicSentenceId\":\"7580338559082430498\",\"content\":\"处于陷地再加上煞星，就会克伤丈夫和子女，而且身份低贱、作风淫乱。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":623,"chapterOrder":14,"inChapterOrder":321,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914150409","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"762\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午宫入庙，丁己、癸生人福厚財官格。\",\"logicSentenceId\":\"7580338559082446882\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484538918","endPageId":"7330177319484538918","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082446882\",\"content\":\"在子午宫进入庙旺状态时，丁年、己年、癸年出生的人福泽深厚，有财有官运。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":373,"chapterOrder":14,"inChapterOrder":322,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914166793","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"763\",\"lineNum\":0,\"lineType\":1,\"content\":\"卯宫入庙，酉宫得地，太陽同。\",\"logicSentenceId\":\"7580338559082463266\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"764\",\"lineNum\":0,\"lineType\":1,\"content\":\"乙、壬辛生人，財官格。\",\"logicSentenceId\":\"7580338559082479650\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484538918","endPageId":"7330177319484538918","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082479650\",\"content\":\"乙、壬、辛年出生的人，是有财有官的命格。\"},{\"logicSentenceId\":\"7580338559082463266\",\"content\":\"卯宫入庙，酉宫得地，与太阳同宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":580,"chapterOrder":14,"inChapterOrder":323,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914183177","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"765\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅宫入庙，申宫𨺻地，天同同丁巳甲庚生人，財官格。\",\"logicSentenceId\":\"7580338559082496034\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484538918","endPageId":"7330177319484538918","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082496034\",\"content\":\"寅宫处于庙旺状态，申宫处于陷弱状态，若与天同星同宫，丁巳、甲、庚年出生的人，是有财富和官运的格局。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":434,"chapterOrder":14,"inChapterOrder":324,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914199561","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"766\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戌宫入庙，天机同。\",\"logicSentenceId\":\"7580338559082512418\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"767\",\"lineNum\":0,\"lineType\":1,\"content\":\"丁巳壬庚生人，財官格。\",\"logicSentenceId\":\"7580338559082528802\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484538918","endPageId":"7330177319484538918","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082512418\",\"content\":\"在辰宫和戌宫入庙，且与天机星同宫。\"},{\"logicSentenceId\":\"7580338559082528802\",\"content\":\"丁巳年、壬年、庚年出生的人，有财富和官位的格局。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":583,"chapterOrder":14,"inChapterOrder":325,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914215945","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"768\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177332642332724\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"769\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑未宫入庙，壬乙生人，財官格，六戊生人大貴。\",\"logicSentenceId\":\"7580338559082545186\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177332642332724","endPageId":"7330177332642332724","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082545186\",\"content\":\"在丑未宫入庙时，壬年和乙年出生的人，是财官格，戊年出生的人极为显贵。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":499,"chapterOrder":14,"inChapterOrder":326,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878914232329","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"770\",\"lineNum\":0,\"lineType\":10,\"content\":\"天梁入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177332642332724","endPageId":"7330177332642332724","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":327,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985224229","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"771\",\"lineNum\":0,\"lineType\":1,\"content\":\"天梁之曜数中強，形神𥡷重性温良。\",\"logicSentenceId\":\"7580338559082561570\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"772\",\"lineNum\":0,\"lineType\":1,\"content\":\"左右曲昌來㑹合，𬋩教冨貴列朝綱。\",\"logicSentenceId\":\"7580338559082577954\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"773\",\"lineNum\":0,\"lineType\":1,\"content\":\"天梁星宿夀星逢，机日文昌左右同。\",\"logicSentenceId\":\"7580338559082594338\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"774\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午寅申為入庙，官資淸顕至三公。\",\"logicSentenceId\":\"7580338559082610722\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"775\",\"lineNum\":0,\"lineType\":1,\"content\":\"天梁遇火落閑宫，陀殺重逢愈是㐫。\",\"logicSentenceId\":\"7580338559082627106\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"776\",\"lineNum\":0,\"lineType\":1,\"content\":\"孤刑𢃄疾破家財，空門技藝可营工。\",\"logicSentenceId\":\"7580338559082643490\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"777\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戍機鿄非小補，破軍卯酉不為良。\",\"logicSentenceId\":\"7580338559082659874\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"778\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人得此為孤獨，尅子刑夫守冷房。\",\"logicSentenceId\":\"7580338559082676258\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177332642332724","endPageId":"7330177332642332724","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082610722\",\"content\":\"在子午寅申宫位是入庙状态，官位清贵可至三公。\"},{\"logicSentenceId\":\"7580338559082627106\",\"content\":\"天梁星与火星相遇且落在闲弱的宫位，如果再遇到陀罗星和煞星，就会更加凶险。\"},{\"logicSentenceId\":\"7580338559082643490\",\"content\":\"会遭遇孤独、刑克，还会身患疾病、破败家财，从事宗教或技艺方面的工作可以谋生。\"},{\"logicSentenceId\":\"7580338559082659874\",\"content\":\"天梁星在辰宫、戌宫与天机星同宫，能带来不小的助益；在卯宫和酉宫与破军同宫则不太好。\"},{\"logicSentenceId\":\"7580338559082676258\",\"content\":\"女人有此星象会孤独，克害子女、刑伤丈夫，独守空房。\"},{\"logicSentenceId\":\"7580338559082561570\",\"content\":\"天梁这颗星曜在星数中力量较强，其对应的人形态神情稳重、性格温和善良。\"},{\"logicSentenceId\":\"7580338559082577954\",\"content\":\"如果左辅、右弼、文昌、文曲来会合，定能让其富贵并位列朝廷高官。\"},{\"logicSentenceId\":\"7580338559082594338\",\"content\":\"天梁星与寿星相遇，天机、太阳、文昌以及左辅右弼会合。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2641,"chapterOrder":14,"inChapterOrder":328,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985256997","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"779\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177319484637222\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"780\",\"lineNum\":0,\"lineType\":10,\"content\":\"天梁入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484637222","endPageId":"7330177319484637222","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":241,"chapterOrder":14,"inChapterOrder":329,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985273381","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"781\",\"lineNum\":0,\"lineType\":1,\"content\":\"天梁化䕃言星和，二限逢之禍必多。\",\"logicSentenceId\":\"7580338559082692642\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"782\",\"lineNum\":0,\"lineType\":1,\"content\":\"若加吉曜逢庙地，貴極一品輔山河。\",\"logicSentenceId\":\"7580338559082709026\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"783\",\"lineNum\":0,\"lineType\":1,\"content\":\"限至天梁最是良，猶如秋菊吐馨香。\",\"logicSentenceId\":\"7580338559082725410\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"784\",\"lineNum\":0,\"lineType\":1,\"content\":\"加官進職迎新禄，常庶逢之也足粮。\",\"logicSentenceId\":\"7580338559082741794\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"785\",\"lineNum\":0,\"lineType\":1,\"content\":\"天梁守限壽延長，作事求謀更吉昌。\",\"logicSentenceId\":\"7580338559082758178\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"786\",\"lineNum\":0,\"lineType\":1,\"content\":\"𠰥遇火鈴羊陀合，湏防一厄與家亡。\",\"logicSentenceId\":\"7580338559082774562\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484637222","endPageId":"7330177319484637222","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082725410\",\"content\":\"行运走到天梁星时最为良好，就如同秋菊吐露芬芳。\"},{\"logicSentenceId\":\"7580338559082741794\",\"content\":\"加官升职迎来新的俸禄，普通百姓遇到这种情况也能衣食充足。\"},{\"logicSentenceId\":\"7580338559082758178\",\"content\":\"天梁星坐守大运时，寿命会延长，做事和谋划都会更加吉祥昌盛。\"},{\"logicSentenceId\":\"7580338559082774562\",\"content\":\"如果遇到火星、铃星、擎羊星、陀罗星会合，必须防备一场灾祸和家破人亡。\"},{\"logicSentenceId\":\"7580338559082692642\",\"content\":\"天梁星化出荫星，虽然说是祥和的星象，但是行运和流年遇到天梁化荫，一定会有很多灾祸。\"},{\"logicSentenceId\":\"7580338559082709026\",\"content\":\"若加上吉星且处于庙地，尊贵至极位至一品辅佐国家。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1955,"chapterOrder":14,"inChapterOrder":330,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985289765","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"787\",\"lineNum\":0,\"lineType\":1,\"content\":\"七殺火、金，南斗，将星，遇帝為𫞐，餘宫皆殺。\",\"logicSentenceId\":\"7580338559082790946\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"788\",\"lineNum\":0,\"lineType\":1,\"content\":\"目大、性急不常、喜怒不一，作事進退沉吟。\",\"logicSentenceId\":\"7580338559082807330\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"789\",\"lineNum\":0,\"lineType\":1,\"content\":\"庙旺有謀畧，遇紫㣲掌生殺之𫞐，武職最利。\",\"logicSentenceId\":\"7580338559082823714\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"790\",\"lineNum\":0,\"lineType\":1,\"content\":\"加左右、昌曲、魁鉞㑹合，位至一品。\",\"logicSentenceId\":\"7580338559082840098\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"791\",\"lineNum\":0,\"lineType\":1,\"content\":\"落空亡無威\",\"logicSentenceId\":\"7580338559082856482\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"792\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177404146663459\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"793\",\"lineNum\":0,\"lineType\":1,\"content\":\"力，遇㐫矅於生郷，定為屠宰，㑹刑囚傷尅。\",\"logicSentenceId\":\"7580338559082856482\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"794\",\"lineNum\":0,\"lineType\":1,\"content\":\"安命寅亥子午宫，丁巳生人，合局辰宫，六庚人吉，若坐子午寅申，却不喜。\",\"logicSentenceId\":\"7580338559082872866\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"795\",\"lineNum\":0,\"lineType\":1,\"content\":\"壬庚午戌，六丙六戊中平。\",\"logicSentenceId\":\"7580338559082889250\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"796\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀火鈴冲㑹，又在𨺻地，残疾下局，𨿽冨貴不乆。\",\"logicSentenceId\":\"7580338559082905634\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484637222","endPageId":"7330177404146663459","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082905634\",\"content\":\"羊陀火铃四颗星冲克会合，又处于陷地，命主会残疾且命局下等，即使富贵也不会长久。\"},{\"logicSentenceId\":\"7580338559082790946\",\"content\":\"七杀属火、金，是南斗星，为将星，遇到帝星则为祥瑞，在其他宫位则都主凶煞。\"},{\"logicSentenceId\":\"7580338559082807330\",\"content\":\"眼睛大，性情急躁且多变，喜怒无常，做事犹豫不决。\"},{\"logicSentenceId\":\"7580338559082823714\",\"content\":\"处于庙旺状态时具有谋略，遇到紫微星则执掌生杀大权，从事武职最为有利。\"},{\"logicSentenceId\":\"7580338559082840098\",\"content\":\"如果与左辅、右弼、文昌、文曲、天魁、天钺会合，能位居一品高官。\"},{\"logicSentenceId\":\"7580338559082856482\",\"content\":\"落入空亡之地就没有威力，在生乡之地遇到凶煞，必定是从事屠宰行业，若会合刑囚星就会有伤害克应。\"},{\"logicSentenceId\":\"7580338559082872866\",\"content\":\"命宫在寅、亥、子、午宫，若是丁巳年出生的人，与辰宫合局；六庚年出生的人遇此则为吉兆；但若命宫在子、午、寅、申宫，则不吉利。\"},{\"logicSentenceId\":\"7580338559082889250\",\"content\":\"如果是壬年、庚年、午月、戌月出生的人，以及六丙年、六戊年出生的人，命运处于中等水平。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":3182,"chapterOrder":14,"inChapterOrder":331,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985306149","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"797\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人入庙加權，禄旺夫益子。\",\"logicSentenceId\":\"7580338559082922018\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"798\",\"lineNum\":0,\"lineType\":1,\"content\":\"𨺻地遇羊火，則傷尅下賎。\",\"logicSentenceId\":\"7580338559082938402\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177404146663459","endPageId":"7330177404146663459","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082922018\",\"content\":\"女子星曜入庙又有权星加临，禄星旺夫益子。\"},{\"logicSentenceId\":\"7580338559082938402\",\"content\":\"处于陷地，又遇到擎羊星、火星，就会对自身有刑伤克害，一生低贱困苦。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":632,"chapterOrder":14,"inChapterOrder":332,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985322533","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"799\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午宫旺地，丁巳甲生人，財官格。\",\"logicSentenceId\":\"7580338559082954786\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177404146663459","endPageId":"7330177404146663459","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082954786\",\"content\":\"子午宫是旺地，丁巳年、甲年出生的人，是财官格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":331,"chapterOrder":14,"inChapterOrder":333,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985338917","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"800\",\"lineNum\":0,\"lineType\":1,\"content\":\"卯酉宫旺地，武曲同。\",\"logicSentenceId\":\"7580338559082971170\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"801\",\"lineNum\":0,\"lineType\":1,\"content\":\"乙辛生人福厚，財官格。\",\"logicSentenceId\":\"7580338559082987554\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177404146663459","endPageId":"7330177404146663459","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559082987554\",\"content\":\"乙年、辛年出生的人福泽深厚，是有财有官的命格。\"},{\"logicSentenceId\":\"7580338559082971170\",\"content\":\"卯酉宫是旺地，武曲星与之同宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":574,"chapterOrder":14,"inChapterOrder":334,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985355301","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"802\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅申宫入庙，甲庚、丁巳人財官格。\",\"logicSentenceId\":\"7580338559083003938\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177404146663459","endPageId":"7330177404146663459","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559083003938\",\"content\":\"寅申宫入庙，甲年、庚年出生以及丁巳年出生的人是有财运和官运的命格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":361,"chapterOrder":14,"inChapterOrder":335,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985371685","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"803\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳亥宫和平，紫㣲同。\",\"logicSentenceId\":\"7580338559083020322\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"804\",\"lineNum\":0,\"lineType\":1,\"content\":\"丙、戊、壬生人福厚。\",\"logicSentenceId\":\"7580338559083036706\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177404146663459","endPageId":"7330177404146663459","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559083020322\",\"content\":\"命宫在巳亥宫的情况较为平和，与紫微星同宫。\"},{\"logicSentenceId\":\"7580338559083036706\",\"content\":\"丙年、戊年、壬年出生的人福分深厚。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":571,"chapterOrder":14,"inChapterOrder":336,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985388069","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"805\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戍宫入庙，加吉星財官格。\",\"logicSentenceId\":\"7580338559083053090\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177404146663459","endPageId":"7330177404146663459","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559083053090\",\"content\":\"命宫在辰宫、戌宫且星曜入庙，加上吉星汇聚，就是有财有官的命格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":346,"chapterOrder":14,"inChapterOrder":337,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985404453","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"806\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177319484768294\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"807\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑未入庙，亷貞同，加吉星財官格。\",\"logicSentenceId\":\"7580338559083069474\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484768294","endPageId":"7330177319484768294","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559083069474\",\"content\":\"命宫在丑宫或未宫入庙，与廉贞星同宫，再加上有吉星，便构成财官格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":475,"chapterOrder":14,"inChapterOrder":338,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985420837","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"808\",\"lineNum\":0,\"lineType\":10,\"content\":\"七殺入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484768294","endPageId":"7330177319484768294","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":339,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985437221","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"809\",\"lineNum\":0,\"lineType\":1,\"content\":\"七殺寅申子午宫，西夷拱手服英雄。\",\"logicSentenceId\":\"7580338559083085858\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"810\",\"lineNum\":0,\"lineType\":1,\"content\":\"魁鉞左右文昌會，權禄名高食萬鍾。\",\"logicSentenceId\":\"7580338559083102242\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"811\",\"lineNum\":0,\"lineType\":1,\"content\":\"殺居𨺻地不堪言，㐫禍猶如抱虎眠。\",\"logicSentenceId\":\"7580338559083118626\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"812\",\"lineNum\":0,\"lineType\":1,\"content\":\"若是殺強無制伏，少年𢙣死在黄泉。\",\"logicSentenceId\":\"7580338559083135010\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"813\",\"lineNum\":0,\"lineType\":1,\"content\":\"七殺坐命落閑宫，巨宿羊陀更照冲，若不傷肢必損目，空門僧道可興隆。\",\"logicSentenceId\":\"7580338559710658612\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484768294","endPageId":"7330177319484768294","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559083135010\",\"content\":\"如果七杀星力量强大却没有被制伏，年少时就会遭遇横祸死于黄泉之下。\"},{\"logicSentenceId\":\"7580338559710658612\",\"content\":\"七杀星坐守命宫落在闲宫，巨门星、擎羊星、陀罗星又来照会冲克，如果不损伤肢体就必定损害眼睛，若出家做僧道可以兴旺发达。\"},{\"logicSentenceId\":\"7580338559083085858\",\"content\":\"七杀星位于寅申子午宫时，西方外族会拱手拜服英雄。\"},{\"logicSentenceId\":\"7580338559083102242\",\"content\":\"魁钺、左辅右弼、文昌星相会，有权有禄声名高，享受丰厚俸禄。\"},{\"logicSentenceId\":\"7580338559083118626\",\"content\":\"七杀星处于陷地的情况难以言说，遭遇的凶险灾祸就像抱着老虎睡觉一样危险。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1770,"chapterOrder":14,"inChapterOrder":340,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985453605","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"814\",\"lineNum\":0,\"lineType\":10,\"content\":\"七殺入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484768294","endPageId":"7330177319484768294","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":341,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985469989","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"815\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命愁逢七殺星，平生作事果聦明。\",\"logicSentenceId\":\"7580338559710674996\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"816\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177404146843683\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"817\",\"lineNum\":0,\"lineType\":1,\"content\":\"氣高志大無男女，不免刑夫歷苦辛。\",\"logicSentenceId\":\"7580338559710691380\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"818\",\"lineNum\":0,\"lineType\":1,\"content\":\"七殺孤星貪宿逢，火陀凑合非為貴。\",\"logicSentenceId\":\"7580338559710707764\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"819\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人得此性不良，只好偏房為使婢。\",\"logicSentenceId\":\"7580338559710724148\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177319484768294","endPageId":"7330177404146843683","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559710691380\",\"content\":\"志向高远不输男子，难免克夫历经艰辛。\"},{\"logicSentenceId\":\"7580338559710707764\",\"content\":\"七杀星与孤星、贪狼星相遇，火星、陀罗星会合，并非贵格。\"},{\"logicSentenceId\":\"7580338559710724148\",\"content\":\"女人得此性情不良，只适合做偏房或当婢女。\"},{\"logicSentenceId\":\"7580338559710674996\",\"content\":\"女性命盘遇到七杀星会忧愁，一生做事确实聪明。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1333,"chapterOrder":14,"inChapterOrder":342,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985486373","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"820\",\"lineNum\":0,\"lineType\":10,\"content\":\"七殺入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177404146843683","endPageId":"7330177404146843683","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":343,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985502757","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"821\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限雖然逢七殺，從容和緩家道發。\",\"logicSentenceId\":\"7580338559710740532\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"822\",\"lineNum\":0,\"lineType\":1,\"content\":\"對宫天府正來朝，仕宦逢之名顕逹。\",\"logicSentenceId\":\"7580338559710756916\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"823\",\"lineNum\":0,\"lineType\":1,\"content\":\"七殺之星主啾唧，作事艱難多有失，更加𢙣曜在限中，主有官災多病疾。\",\"logicSentenceId\":\"7580338559710773300\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177404146843683","endPageId":"7330177404146843683","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559710740532\",\"content\":\"大运流年中虽然遇到七杀星，但只要从容不迫、处事和缓，家庭就会兴旺发达。\"},{\"logicSentenceId\":\"7580338559710756916\",\"content\":\"如果七杀坐命的对宫正好有天府星前来朝拱，当官的人遇到这种情况会声名显扬、仕途发达。\"},{\"logicSentenceId\":\"7580338559710773300\",\"content\":\"七杀星预示着琐碎的烦恼，做事艰难且多有失误，若再加上恶星出现在命限中，就会有官灾和诸多疾病。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1139,"chapterOrder":14,"inChapterOrder":344,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985519141","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"824\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍水。\",\"logicSentenceId\":\"7580338559710789684\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"825\",\"lineNum\":0,\"lineType\":1,\"content\":\"北斗化耗星，主妻子奴僕，形五短，背厚，眉寛腰斜，性剛寡合争強，棄祖發福，好摶禽捕獵，喜紫㣲，有威𫞐天梁。\",\"logicSentenceId\":\"7580338559710806068\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"826\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177429132034058\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"827\",\"lineNum\":0,\"lineType\":1,\"content\":\"天府能制其𢙣，文曲一生貧士，更入水郷残疾，雖冨貴，不乆夭折。\",\"logicSentenceId\":\"7580338559710822452\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"828\",\"lineNum\":0,\"lineType\":1,\"content\":\"六癸甲生人，坐子午宫者，位至三公。\",\"logicSentenceId\":\"7580338559710838836\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"829\",\"lineNum\":0,\"lineType\":1,\"content\":\"若丙戊寅申生人，坐子午，則孤单残疾，雖冨貴，不乆夭折。\",\"logicSentenceId\":\"7580338559710855220\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"830\",\"lineNum\":0,\"lineType\":1,\"content\":\"丙戊生人，坐辰戍丑未，紫㣲同垣，冨貴不小。\",\"logicSentenceId\":\"7580338559710871604\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"831\",\"lineNum\":0,\"lineType\":1,\"content\":\"遇𤎉貞羊陀火鈴於𨺻宫争鬪，疾病，僧道冝之。\",\"logicSentenceId\":\"7580338559710887988\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177404146843683","endPageId":"7330177429132034058","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559710887988\",\"content\":\"遇到廉贞、擎羊、陀罗、火星、铃星在陷宫，会有争斗、疾病，适合出家为僧道。\"},{\"logicSentenceId\":\"7580338559710789684\",\"content\":\"破军星属水。\"},{\"logicSentenceId\":\"7580338559710806068\",\"content\":\"破军星为北斗化耗星，主妻子、奴仆之事。身材五短，背部厚实，眉毛宽，腰倾斜，性格刚强、不合群且争强好胜，离开祖业才能发福，喜好捕捉飞禽、打猎，遇紫微星则吉，遇天梁星则显权威。\"},{\"logicSentenceId\":\"7580338559710822452\",\"content\":\"天府星能够克制破军星的凶恶，文曲星入命的人一生是贫穷之士，若再进入水乡则会导致残疾，即便富贵也会不久后夭折。\"},{\"logicSentenceId\":\"7580338559710838836\",\"content\":\"癸年或甲年出生的人，命宫落在子午宫的，能位至三公。\"},{\"logicSentenceId\":\"7580338559710855220\",\"content\":\"如果是出生年天干为丙、戊，出生年地支为寅、申的人，破军星落在子午宫位，那么命主会孤独、身体有残疾，即便能够富贵，也不会长寿，很快就会夭折。\"},{\"logicSentenceId\":\"7580338559710871604\",\"content\":\"丙年、戊年出生的人，命宫落在辰、戌、丑、未这四个宫位，与紫微星同宫，会有不小的富贵。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2903,"chapterOrder":14,"inChapterOrder":345,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878985535525","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"832\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人子午入庙，有權柄，𨺻地加殺，下賎滛𣣔。\",\"logicSentenceId\":\"7580338559710904372\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132034058","endPageId":"7330177429132034058","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559710904372\",\"content\":\"女子命宫在子或午且处于旺庙之地，会有权力和地位；若处于陷地又遇煞星，就会品格低下、淫荡贪欢。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":417,"chapterOrder":14,"inChapterOrder":346,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879002001459","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"833\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午宫入庙。\",\"logicSentenceId\":\"7580338559710920756\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"834\",\"lineNum\":0,\"lineType\":1,\"content\":\"丁巳癸生人福厚，丙戊人主困。\",\"logicSentenceId\":\"7580338559710937140\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132034058","endPageId":"7330177429132034058","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559710937140\",\"content\":\"丁巳年和癸年出生的人福分深厚，丙年和戊年的人主困顿。\"},{\"logicSentenceId\":\"7580338559710920756\",\"content\":\"破军星在子午宫处于入庙的状态。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":580,"chapterOrder":14,"inChapterOrder":347,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879002034227","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"835\",\"lineNum\":0,\"lineType\":1,\"content\":\"卯酉宫𨺻地。\",\"logicSentenceId\":\"7580338559710953524\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"836\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉貞同乙、辛癸生人利，甲庚丙人不耐乆。\",\"logicSentenceId\":\"7580338559710969908\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132034058","endPageId":"7330177429132034058","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559710969908\",\"content\":\"廉贞同宫，对乙、辛、癸年出生的人有利，对甲、庚、丙年出生的人来说福泽不会长久。\"},{\"logicSentenceId\":\"7580338559710953524\",\"content\":\"卯酉宫为陷地。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":612,"chapterOrder":14,"inChapterOrder":348,"volumeId":"7330176 ":1,\"content\":\"紫微同丙戊乙生人，財官格。\",\"logicSentenceId\":\"7580338559711051828\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177461434089506","endPageId":"7330177461434089506","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711051828\",\"content\":\"紫微星与丙年、戊年、乙年出生的人同宫，是能获得财富和官职的命格。\"},{\"logicSentenceId\":\"7580338559711035444\",\"content\":\"丑未宫是旺地。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":688,"chapterOrder":14,"inChapterOrder":351,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702515762","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"843\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳亥和平。\",\"logicSentenceId\":\"7580338559711068212\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"844\",\"lineNum\":0,\"lineType\":1,\"content\":\"武曲同丙戊生人福厚。\",\"logicSentenceId\":\"7580338559711084596\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177461434089506","endPageId":"7330177461434089506","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711084596\",\"content\":\"武曲星与丙年、戊年出生的人同宫，此人福泽深厚。\"},{\"logicSentenceId\":\"7580338559711068212\",\"content\":\"巳亥宫的情况比较平和。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":544,"chapterOrder":14,"inChapterOrder":352,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702532146","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"845\",\"lineNum\":0,\"lineType\":10,\"content\":\"破軍入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177461434089506","endPageId":"7330177461434089506","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":353,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702548530","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"846\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍七殺與貪狼，入庙英雄不可當。\",\"logicSentenceId\":\"7580338559711100980\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"847\",\"lineNum\":0,\"lineType\":1,\"content\":\"関羽命逢為上将，庶人冨足置田庒。\",\"logicSentenceId\":\"7580338559711117364\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"848\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍子午㑹文昌，左右𩀱𩀱入庙鄉。\",\"logicSentenceId\":\"7580338559711133748\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"849\",\"lineNum\":0,\"lineType\":1,\"content\":\"財帛豊盈多慷慨，財官昭著佐君王。\",\"logicSentenceId\":\"7580338559711150132\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"850\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍一曜最難當，化禄科權喜異常。\",\"logicSentenceId\":\"7580338559711166516\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"851\",\"lineNum\":0,\"lineType\":1,\"content\":\"𠰥還𨺻地乃加殺，破祖離宗出逺郷。\",\"logicSentenceId\":\"7580338559711182900\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"852\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍不喜在身宫，𤎉巨火羊陀㑹㐫。\",\"logicSentenceId\":\"7580338559711199284\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"853\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177429132165130\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"854\",\"lineNum\":0,\"lineType\":1,\"content\":\"不見傷残的夀夭，只冝僧道度平生。\",\"logicSentenceId\":\"7580338559711215668\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177461434089506","endPageId":"7330177429132165130","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711150132\",\"content\":\"钱财礼物充裕，为人多慷慨大方；在财和官方面声名显著，可辅佐君王。\"},{\"logicSentenceId\":\"7580338559711166516\",\"content\":\"破军这颗星曜最难应对，若化为禄、科、权星则会有异常的喜事。\"},{\"logicSentenceId\":\"7580338559711182900\",\"content\":\"如果处于陷地再加上煞星，就会破败祖业、离开宗族到远方去。\"},{\"logicSentenceId\":\"7580338559711199284\",\"content\":\"破军星不适合落在身宫，若与廉贞星、巨门星、火星、擎羊星、陀罗星相会则为凶兆。\"},{\"logicSentenceId\":\"7580338559711215668\",\"content\":\"即便没有身体伤残也会早夭寿短，只适合出家当和尚、道士度过一生。\"},{\"logicSentenceId\":\"7580338559711100980\",\"content\":\"破军、七杀和贪狼三星入庙，命主成为英雄势不可挡。\"},{\"logicSentenceId\":\"7580338559711117364\",\"content\":\"关羽命中遇到这种星象格局成为上将，普通人遇到则能富足并购置田庄。\"},{\"logicSentenceId\":\"7580338559711133748\",\"content\":\"破军星在子午宫位与文昌星相会，左辅星和右弼星双双进入庙旺的宫位。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2739,"chapterOrder":14,"inChapterOrder":354,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702564914","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"855\",\"lineNum\":0,\"lineType\":10,\"content\":\"破軍入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132165130","endPageId":"7330177429132165130","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":355,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702581298","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"856\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍子午為入庙，女命逢之冨夀昌。\",\"logicSentenceId\":\"7580338559711232052\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"857\",\"lineNum\":0,\"lineType\":1,\"content\":\"性格有能偏出衆，旺宫益子姓名香。\",\"logicSentenceId\":\"7580338559711248436\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"858\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍女命不冝逢，擎羊加𨺻便為㐫。\",\"logicSentenceId\":\"7580338559711264820\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"859\",\"lineNum\":0,\"lineType\":1,\"content\":\"尅害良人非一次，湏教悲哭度朝昏。\",\"logicSentenceId\":\"7580338559711281204\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132165130","endPageId":"7330177429132165130","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711281204\",\"content\":\"多次克害丈夫，只能在悲伤哭泣中度过每一天。\"},{\"logicSentenceId\":\"7580338559711232052\",\"content\":\"破军星在子、午宫为入庙，女性命主遇此会富贵长寿且昌盛。\"},{\"logicSentenceId\":\"7580338559711248436\",\"content\":\"性格有才能且特别出众，处于旺宫能使子女受益、声名远扬。\"},{\"logicSentenceId\":\"7580338559711264820\",\"content\":\"女性命盘中不宜遇到破军星，若再加上擎羊星处于陷地就会有凶灾。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1271,"chapterOrder":14,"inChapterOrder":356,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702597682","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"860\",\"lineNum\":0,\"lineType\":10,\"content\":\"破軍入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132165130","endPageId":"7330177429132165130","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":357,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702614066","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"861\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍入限要推詳，庙地方知福禄昌。\",\"logicSentenceId\":\"7580338559711297588\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"862\",\"lineNum\":0,\"lineType\":1,\"content\":\"更遇文昌同魁鉞，限臨此地極風光。\",\"logicSentenceId\":\"7580338559711313972\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"863\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍入限要推詳，庙地無㐫少損傷。\",\"logicSentenceId\":\"7580338559711330356\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"864\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177518315503650\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"865\",\"lineNum\":0,\"lineType\":1,\"content\":\"殺凑𨺻宫防破耗，更防妻子自身亡。\",\"logicSentenceId\":\"7580338559711346740\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"866\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍主限多膿血，失脫𠂯張不可說。\",\"logicSentenceId\":\"7580338559711363124\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"867\",\"lineNum\":0,\"lineType\":1,\"content\":\"更值女人主孝服，血光産難災殃節。\",\"logicSentenceId\":\"7580338559711379508\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177429132165130","endPageId":"7330177518315503650","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711313972\",\"content\":\"若再遇到文昌与魁钺，行运到此地极为风光。\"},{\"logicSentenceId\":\"7580338559711330356\",\"content\":\"破军星进入限运需要详细推算，在庙旺之地没有凶星则很少有损伤。\"},{\"logicSentenceId\":\"7580338559711346740\",\"content\":\"煞星聚集在陷宫要防备破败损耗，还要防备妻子和自身死亡。\"},{\"logicSentenceId\":\"7580338559711363124\",\"content\":\"破军星主限运时，多有脓血之灾，还会有失物、行为乖张等情况，难以尽述。\"},{\"logicSentenceId\":\"7580338559711379508\",\"content\":\"若是女性遇上，主会有孝服之事，还会遭遇血光、难产等灾殃。\"},{\"logicSentenceId\":\"7580338559711297588\",\"content\":\"破军星入命限需要仔细推详，处于庙旺之地才能知晓福禄昌盛。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2037,"chapterOrder":14,"inChapterOrder":358,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702630450","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"868\",\"lineNum\":0,\"lineType\":1,\"content\":\"文昌金，南北斗，乃文魁星。\",\"logicSentenceId\":\"7580338559711395892\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"869\",\"lineNum\":0,\"lineType\":1,\"content\":\"眉目淸秀、分明机巧、多學多能。\",\"logicSentenceId\":\"7580338559711412276\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"870\",\"lineNum\":0,\"lineType\":1,\"content\":\"㑹陽鿄禄存，財官，昭著冨貴，先難後易。\",\"logicSentenceId\":\"7580338559711428660\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"871\",\"lineNum\":0,\"lineType\":1,\"content\":\"𨺻地加羊火，巧藝之人。\",\"logicSentenceId\":\"7580338559711445044\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"872\",\"lineNum\":0,\"lineType\":1,\"content\":\"𨺻地獨守，加殺擎火陀鈴，𢃄疾亦能延夀，旺有暗痣，𨺻有班痕。\",\"logicSentenceId\":\"7580338559711461428\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177518315503650","endPageId":"7330177518315503650","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711445044\",\"content\":\"文昌星处于陷地，又遇到擎羊星和火星，是掌握精巧技艺的人。\"},{\"logicSentenceId\":\"7580338559711461428\",\"content\":\"文昌星在陷地独坐，加会擎羊、火星、陀罗、铃星等煞星，即使身上有疾病也能长寿，处于旺地时会有暗痣，处于陷地时会有斑痕。\"},{\"logicSentenceId\":\"7580338559711395892\",\"content\":\"文昌星属金，分属南斗和北斗，是文魁星。\"},{\"logicSentenceId\":\"7580338559711412276\",\"content\":\"眉毛和眼睛清秀，头脑清晰灵活、机智巧妙，学得多且能力多样。\"},{\"logicSentenceId\":\"7580338559711428660\",\"content\":\"与阳鿄、禄存会合，财星和官星显现，富贵昭著，先经历困难后变得容易。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1712,"chapterOrder":14,"inChapterOrder":359,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702646834","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"873\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命入廟平常，加吉矅冨貴；𨺻地遇火羊巨機殺忌，則下賎滛娼使婢。\",\"logicSentenceId\":\"7580338559711477812\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177518315503650","endPageId":"7330177518315503650","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338559711477812\",\"content\":\"女性命格在庙旺宫位属平常，若加上吉星就会富贵；处于陷地，又遇到火星、羊刃、巨门、天机、煞星、忌星，则会沦为下贱的淫娼或使婢。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":494,"chapterOrder":14,"inChapterOrder":360,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158879702663218","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"874\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅午戌宫𨺻地，丁巳甲、庚生人，財官格。\",\"logicSentenceId\":\"7580338559711494196\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177518315503650","endPageId":"7330177518315503650","contentEncryptType":0,"translateContent":"
