Type":1,"content":"{\"lines\":[{\"lineId\":\"1077\",\"lineNum\":0,\"lineType\":1,\"content\":\"鈴火之星入命來，貪狼相㑹得和諧。\",\"logicSentenceId\":\"7580338560532856884\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1078\",\"lineNum\":0,\"lineType\":1,\"content\":\"三方無殺諸般羙，坐守香閨得遂懷。\",\"logicSentenceId\":\"7580338560532873268\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1079\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177796800774196\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1080\",\"lineNum\":0,\"lineType\":1,\"content\":\"火鈴二矅最難當，女命单逢必主傷。\",\"logicSentenceId\":\"7580338560532889652\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1081\",\"lineNum\":0,\"lineType\":1,\"content\":\"若更三方加殺凑，湏防目下入泉郷。\",\"logicSentenceId\":\"7580338560532906036\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024741413","endPageId":"7330177796800774196","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560532889652\",\"content\":\"火星和铃星这两颗星曜最难应对，女性命盘中单独遇到其中一颗必定会有损伤灾祸。\"},{\"logicSentenceId\":\"7580338560532906036\",\"content\":\"如果再加上三方有煞星汇聚，必须提防眼下就要命丧黄泉。\"},{\"logicSentenceId\":\"7580338560532856884\",\"content\":\"铃星和火星落入命宫，与贪狼星相会会和谐顺遂。\"},{\"logicSentenceId\":\"7580338560532873268\",\"content\":\"三方没有煞星则诸事美好，女子坐守香闺也能心想事成。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1407,"chapterOrder":14,"inChapterOrder":442,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917288474","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1082\",\"lineNum\":0,\"lineType\":10,\"content\":\"火鈴二星入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177796800774196","endPageId":"7330177796800774196","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":131,"chapterOrder":14,"inChapterOrder":443,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917304858","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1083\",\"lineNum\":0,\"lineType\":1,\"content\":\"火矅二星事若何，貪狼相㑹福還多。\",\"logicSentenceId\":\"7580338560532922420\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1084\",\"lineNum\":0,\"lineType\":1,\"content\":\"更加吉曜多權柄，冨貴声揚處處歌。\",\"logicSentenceId\":\"7580338560532938804\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1085\",\"lineNum\":0,\"lineType\":1,\"content\":\"火鈴限𨺻血膿侵，失脫時常不可尋。\",\"logicSentenceId\":\"7580338560532955188\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1086\",\"lineNum\":0,\"lineType\":1,\"content\":\"口舌官災應不免，湏防無妄禍來臨。\",\"logicSentenceId\":\"7580338560532971572\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177796800774196","endPageId":"7330177796800774196","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560532955188\",\"content\":\"火星和铃星在限运中陷入不利位置，会有血脓之疾侵扰，物品丢失也是常事且难以寻回。\"},{\"logicSentenceId\":\"7580338560532971572\",\"content\":\"口舌是非和官司灾祸应该难以避免，必须防备意外的灾祸降临。\"},{\"logicSentenceId\":\"7580338560532922420\",\"content\":\"火铃二星的情况怎么样呢？与贪狼相会，福气还会很多。\"},{\"logicSentenceId\":\"7580338560532938804\",\"content\":\"再加上吉祥的星曜，就会更有权力和地位，富贵声名远扬，处处都有赞歌。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1335,"chapterOrder":14,"inChapterOrder":444,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917321242","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1087\",\"lineNum\":0,\"lineType\":1,\"content\":\"地刼火乃刼殺之神，性重，作事踈狂，動静増𢙣，不行正道，為邪僻之事，有吉禍輕。\",\"logicSentenceId\":\"7580338560532987956\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1088\",\"lineNum\":0,\"lineType\":1,\"content\":\"三方四正加殺，少者平等論。\",\"logicSentenceId\":\"7580338560533004340\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177796800774196","endPageId":"7330177796800774196","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560532987956\",\"content\":\"地劫火是劫杀之神，性情沉重，行事狂放不羁，一举一动都会增添恶果，不走正道，专做邪恶不正之事，若有吉星相伴则灾祸较轻。\"},{\"logicSentenceId\":\"7580338560533004340\",\"content\":\"如果三方四正有煞星加临，年轻的人也按相同情况论断。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":802,"chapterOrder":14,"inChapterOrder":445,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917337626","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1089\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命只可為偏房妓婢而巳。\",\"logicSentenceId\":\"7580338560533020724\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177796800774196","endPageId":"7330177796800774196","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533020724\",\"content\":\"女命只能做妾室、妓女、婢女罢了。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":299,"chapterOrder":14,"inChapterOrder":446,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881917354010","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1090\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177753024872485\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1091\",\"lineNum\":0,\"lineType\":10,\"content\":\"地刼入命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024872485","endPageId":"7330177753024872485","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":243,"chapterOrder":14,"inChapterOrder":447,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881938014246","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1092\",\"lineNum\":0,\"lineType\":1,\"content\":\"地刼從來生發疾，命中相遇多啾唧。\",\"logicSentenceId\":\"7580338560533037108\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1093\",\"lineNum\":0,\"lineType\":1,\"content\":\"若還羊火在其中，辛苦持家防内室。\",\"logicSentenceId\":\"7580338560533053492\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024872485","endPageId":"7330177753024872485","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533053492\",\"content\":\"如果命盘中碰到擎羊星和火星，持家会很辛苦，还要防备家中内部出事。\"},{\"logicSentenceId\":\"7580338560533037108\",\"content\":\"地劫星向来会引发疾病，命盘中与之相遇会多有不顺和麻烦。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":672,"chapterOrder":14,"inChapterOrder":448,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881938030630","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1094\",\"lineNum\":0,\"lineType\":10,\"content\":\"地刼入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024872485","endPageId":"7330177753024872485","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":125,"chapterOrder":14,"inChapterOrder":449,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158881938047014","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1095\",\"lineNum\":0,\"lineType\":1,\"content\":\"刼星二限若逢之，未免當年無禍危。\",\"logicSentenceId\":\"7580338560533069876\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1096\",\"lineNum\":0,\"lineType\":1,\"content\":\"太𡻕殺臨多疾厄，官符星遇有官府。\",\"logicSentenceId\":\"7580338560533086260\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024872485","endPageId":"7330177753024872485","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533086260\",\"content\":\"太岁杀星降临会遭遇很多疾病灾难，遇到官符星会遇到官府之事。\"},{\"logicSentenceId\":\"7580338560533069876\",\"content\":\"如果大运和流年遇到劫星，那这一年难免会有灾祸危险。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":658,"chapterOrder":14,"inChapterOrder":450,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055503910","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1097\",\"lineNum\":0,\"lineType\":1,\"content\":\"天空乃空亡之神，性重，作事虚空，不行正道，成敗多端，不聚財退祖，荣昌空。\",\"logicSentenceId\":\"7580338560533102644\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1098\",\"lineNum\":0,\"lineType\":1,\"content\":\"多不吉，名曰断橋，有吉禍輕。\",\"logicSentenceId\":\"7580338560533119028\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1099\",\"lineNum\":0,\"lineType\":1,\"content\":\"四殺加少者平等論，多者下賎。\",\"logicSentenceId\":\"7580338560533135412\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1100\",\"lineNum\":0,\"lineType\":1,\"content\":\"太嵗二限，遇有正矅星加吉者平安。\",\"logicSentenceId\":\"7580338560533151796\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1101\",\"lineNum\":0,\"lineType\":1,\"content\":\"經云：項羽英雄，限到天空而䘮國。\",\"logicSentenceId\":\"7580338560533168180\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177753024872485","endPageId":"7330177753024872485","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533151796\",\"content\":\"在太岁二限的运程中，若遇到正𬺟星且有吉星加临，就会平安。\"},{\"logicSentenceId\":\"7580338560533168180\",\"content\":\"经书上说：项羽是英雄，运限遇到天空星而丧失了国家。\"},{\"logicSentenceId\":\"7580338560533102644\",\"content\":\"天空星是空亡之神，性质严重，做事不切实际，不走正道，成败多变，不聚财，祖业衰退，繁荣昌盛成空。\"},{\"logicSentenceId\":\"7580338560533119028\",\"content\":\"大多不吉利，名为断桥，有吉星则灾祸较轻。\"},{\"logicSentenceId\":\"7580338560533135412\",\"content\":\"如果命盘中四杀星加会的情况较少，那么可以按一般情况论断；如果加会较多，则命主会地位低下、命运不佳。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1747,"chapterOrder":14,"inChapterOrder":451,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055520294","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1102\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177852723265570\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1103\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命单守，只可為偏房妓婢。\",\"logicSentenceId\":\"7580338560533184564\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177852723265570","endPageId":"7330177852723265570","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533184564\",\"content\":\"女性命局中只有天空星单独坐守，只能做偏房、妓婢。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":444,"chapterOrder":14,"inChapterOrder":452,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055536678","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1104\",\"lineNum\":0,\"lineType\":10,\"content\":\"天空入命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177852723265570","endPageId":"7330177852723265570","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":125,"chapterOrder":14,"inChapterOrder":453,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055553062","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1105\",\"lineNum\":0,\"lineType\":1,\"content\":\"命坐天空定出家，文昌天相實堪誇。\",\"logicSentenceId\":\"7580338560533200948\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1106\",\"lineNum\":0,\"lineType\":1,\"content\":\"若逢四殺同身命，受䕃承恩福可佳。\",\"logicSentenceId\":\"7580338560533217332\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177852723265570","endPageId":"7330177852723265570","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533217332\",\"content\":\"如果遇到四杀同身命，受到荫庇、蒙受恩泽，福气就会很好。\"},{\"logicSentenceId\":\"7580338560533200948\",\"content\":\"命宫落在天空星的人注定会出家，命有文昌星和天相星确实值得夸赞。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":669,"chapterOrder":14,"inChapterOrder":454,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055569446","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1107\",\"lineNum\":0,\"lineType\":10,\"content\":\"天空入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177852723265570","endPageId":"7330177852723265570","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":125,"chapterOrder":14,"inChapterOrder":455,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055585830","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1108\",\"lineNum\":0,\"lineType\":1,\"content\":\"空亡入限破田庄，妻子湏防有損傷。\",\"logicSentenceId\":\"7580338560533233716\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1109\",\"lineNum\":0,\"lineType\":1,\"content\":\"財帛不為多敗失，更憂夀命入泉郷。\",\"logicSentenceId\":\"7580338560533250100\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177852723265570","endPageId":"7330177852723265570","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533233716\",\"content\":\"空亡星进入命限会破败田庄，还需防备妻子和儿女受到损伤。\"},{\"logicSentenceId\":\"7580338560533250100\",\"content\":\"钱财不会大量损失，更应担忧性命归九泉。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":633,"chapterOrder":14,"inChapterOrder":456,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055602214","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1110\",\"lineNum\":0,\"lineType\":10,\"content\":\"地刼天空同入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177852723265570","endPageId":"7330177852723265570","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":134,"chapterOrder":14,"inChapterOrder":457,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055618598","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1111\",\"lineNum\":0,\"lineType\":1,\"content\":\"極居卯酉刼空臨，為僧為道福興隆，樂享山林有師號，福夀雙全到右齡。\",\"logicSentenceId\":\"7580338560533266484\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1112\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177837309198362\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1113\",\"lineNum\":0,\"lineType\":1,\"content\":\"刼空二限最乖張，夫子在陳也絶粮。\",\"logicSentenceId\":\"7580338560533282868\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1114\",\"lineNum\":0,\"lineType\":1,\"content\":\"項羽英雄曽䘮國，緑珠逢此墜楼亡。\",\"logicSentenceId\":\"7580338560533299252\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177852723265570","endPageId":"7330177837309198362","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533299252\",\"content\":\"项羽这位英雄曾经丧失国家，绿珠遭遇此事而坠楼身亡。\"},{\"logicSentenceId\":\"7580338560533266484\",\"content\":\"极星位于卯酉二宫，劫煞和天空星临照，命主会成为和尚或道士，福分兴盛，能在山林中安享生活且有师父赐号，福泽与寿命两全直至高龄。\"},{\"logicSentenceId\":\"7580338560533282868\",\"content\":\"劫煞和空亡这两个限运最为不顺，就连孔子被困陈国时也断了粮食。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1244,"chapterOrder":14,"inChapterOrder":458,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055634982","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1115\",\"lineNum\":0,\"lineType\":1,\"content\":\"天傷水乃虚耗之神，守臨二限，太嵗不問得地，只要吉衆可獲善。\",\"logicSentenceId\":\"7580338560533315636\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1116\",\"lineNum\":0,\"lineType\":1,\"content\":\"若無正星，又羊火、巨机，必主官災喪亡，破財横事相侵。\",\"logicSentenceId\":\"7580338560533332020\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1117\",\"lineNum\":0,\"lineType\":1,\"content\":\"夫子絶粮，限到天傷之内。\",\"logicSentenceId\":\"7580338560533348404\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177837309198362","endPageId":"7330177837309198362","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533315636\",\"content\":\"天伤水是虚耗之神，当它降临大小运限时，即使太岁星未处有利位置，只要吉星众多就能获得好结果。\"},{\"logicSentenceId\":\"7580338560533332020\",\"content\":\"如果没有正星，又遇到了擎羊星、火星、巨门星、天机星，必定会遭遇官灾、丧亡，还会有破财和意外灾祸侵扰。\"},{\"logicSentenceId\":\"7580338560533348404\",\"content\":\"孔子在陈国断粮，行运到天伤星的范围之内。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1129,"chapterOrder":14,"inChapterOrder":459,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055651366","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1118\",\"lineNum\":0,\"lineType\":1,\"content\":\"天使水乃傳使之星，務審人間禍福之由。\",\"logicSentenceId\":\"7580338560533364788\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1119\",\"lineNum\":0,\"lineType\":1,\"content\":\"若二限太𡻕臨有吉星，衆者禍輕。\",\"logicSentenceId\":\"7580338560533381172\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1120\",\"lineNum\":0,\"lineType\":1,\"content\":\"若無正星，又值巨忌、羊火，則官災䘮亡，横事破家。\",\"logicSentenceId\":\"7580338560533397556\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177837309198362","endPageId":"7330177837309198362","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533397556\",\"content\":\"如果没有正星，又遇上了巨门化忌、擎羊星和火星，就会导致官灾、丧亡，还会遭遇意外灾祸导致家庭破败。\"},{\"logicSentenceId\":\"7580338560533364788\",\"content\":\"天使水是传使之星，一定要审察人间祸福的缘由。\"},{\"logicSentenceId\":\"7580338560533381172\",\"content\":\"如果在二限中，太岁遇到吉星，并且吉星众多，灾祸就会减轻。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1049,"chapterOrder":14,"inChapterOrder":460,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055667750","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1121\",\"lineNum\":0,\"lineType\":10,\"content\":\"傷使入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177837309198362","endPageId":"7330177837309198362","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":125,"chapterOrder":14,"inChapterOrder":461,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055684134","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1122\",\"lineNum\":0,\"lineType\":1,\"content\":\"天耗守限號天傷，夫子在陳也絶粮。\",\"logicSentenceId\":\"7580338560533413940\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1123\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177852723462178\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1124\",\"lineNum\":0,\"lineType\":1,\"content\":\"天使限臨人共忌，石崇豪冨破家亡。\",\"logicSentenceId\":\"7580338560533430324\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177837309198362","endPageId":"7330177852723462178","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533430324\",\"content\":\"天使星临限，人人都忌讳，像石崇那样豪富的人也会家破人亡。\"},{\"logicSentenceId\":\"7580338560533413940\",\"content\":\"天耗星守限称为天伤，孔子在陈国也断绝了粮食。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":763,"chapterOrder":14,"inChapterOrder":462,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055700518","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1125\",\"lineNum\":0,\"lineType\":1,\"content\":\"天馬火最喜㑹禄存，極忌截路空亡。\",\"logicSentenceId\":\"7580338560533446708\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1126\",\"lineNum\":0,\"lineType\":1,\"content\":\"如命在辰戌丑未，遇寅申已亥，有天馬在夫妻宫，加吉㑹者，冨貴。\",\"logicSentenceId\":\"7580338560533463092\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1127\",\"lineNum\":0,\"lineType\":1,\"content\":\"加殺不羙，加權禄照臨，必主男為官，女封贈。\",\"logicSentenceId\":\"7580338560533479476\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177852723462178","endPageId":"7330177852723462178","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533479476\",\"content\":\"如果遇到煞星就不吉利，若有权星和禄星照耀，必定会使男子做官，女子受封赠。\"},{\"logicSentenceId\":\"7580338560533446708\",\"content\":\"天马火最喜欢与禄存相会，最忌讳截路空亡。\"},{\"logicSentenceId\":\"7580338560533463092\",\"content\":\"如果命宫在辰、戌、丑、未这四个宫位，遇到寅、申、巳、亥的宫位，且天马星在夫妻宫，再有吉星会合的，会富贵。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1108,"chapterOrder":14,"inChapterOrder":463,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055716902","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1128\",\"lineNum\":0,\"lineType\":10,\"content\":\"天馬入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177852723462178","endPageId":"7330177852723462178","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":125,"chapterOrder":14,"inChapterOrder":464,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055733286","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1129\",\"lineNum\":0,\"lineType\":1,\"content\":\"天馬臨限最為良，紫府禄存遇非常。\",\"logicSentenceId\":\"7580338560533495860\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1130\",\"lineNum\":0,\"lineType\":1,\"content\":\"官宦逢之應顕逹，士人遇此赴科塲。\",\"logicSentenceId\":\"7580338560533512244\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1131\",\"lineNum\":0,\"lineType\":1,\"content\":\"天馬守限不得住，又怕刼空來相遇。\",\"logicSentenceId\":\"7580338560533528628\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1132\",\"lineNum\":0,\"lineType\":1,\"content\":\"更𠔥太𡻕坐宫中，限到其人尋死路。\",\"logicSentenceId\":\"7580338560533545012\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177852723462178","endPageId":"7330177852723462178","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533545012\",\"content\":\"再加上太岁坐入宫位中，命限到来时此人会走上绝路。\"},{\"logicSentenceId\":\"7580338560533495860\",\"content\":\"天马星临限最为吉利，紫微天府禄存星相遇形成特殊吉兆。\"},{\"logicSentenceId\":\"7580338560533512244\",\"content\":\"官员遇到这种情况会变得显达，读书人遇到这种情况会赶赴考场。\"},{\"logicSentenceId\":\"7580338560533528628\",\"content\":\"天马守限不能停留，又怕劫煞和空亡来相遇。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1258,"chapterOrder":14,"inChapterOrder":465,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882055749670","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1133\",\"lineNum\":0,\"lineType\":1,\"content\":\"化禄星圡為福徳之神，守身命官禄之位，科權相遇，必作大\",\"logicSentenceId\":\"7580338560533561396\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1134\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177837309313050\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1135\",\"lineNum\":0,\"lineType\":1,\"content\":\"臣之職。\",\"logicSentenceId\":\"7580338560533561396\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1136\",\"lineNum\":0,\"lineType\":1,\"content\":\"小限逢之，主進財入仕之喜。\",\"logicSentenceId\":\"7580338560533577780\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1137\",\"lineNum\":0,\"lineType\":1,\"content\":\"大限十年，吉慶𢙣矅來臨，并陀羊火忌冲照，亦不為害。\",\"logicSentenceId\":\"7580338560533594164\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177852723462178","endPageId":"7330177837309313050","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533561396\",\"content\":\"化禄星属土，是福德之神，守身宫、命宫、官禄宫之位，与科星、权星相遇，命主必定能担任大臣之职。\"},{\"logicSentenceId\":\"7580338560533577780\",\"content\":\"小限遇到化禄星，预示着会有进财、入仕的喜事。\"},{\"logicSentenceId\":\"7580338560533594164\",\"content\":\"大限的十年里，无论吉庆之事还是凶恶之事来临，即便遇到陀罗、擎羊、火星、忌星相冲照，也不会造成危害。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1366,"chapterOrde ":\"1168\",\"lineNum\":0,\"lineType\":1,\"content\":\"守身命。\",\"logicSentenceId\":\"7580338560533987380\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1169\",\"lineNum\":0,\"lineType\":1,\"content\":\"權禄相逢，主人聦明通逹，最喜逢魁鉞，必中科第，作宰臣之職。\",\"logicSentenceId\":\"7580338560534003764\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1170\",\"lineNum\":0,\"lineType\":1,\"content\":\"如遇𢙣星，亦為文章秀士，可作群英師範。\",\"logicSentenceId\":\"7580338560534020148\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1171\",\"lineNum\":0,\"lineType\":1,\"content\":\"但嫌截路空亡，旬空天空\",\"logicSentenceId\":\"7580338560534036532\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1172\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177966598520867\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1173\",\"lineNum\":0,\"lineType\":1,\"content\":\"亦畏忌。\",\"logicSentenceId\":\"7580338560534036532\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177912936611866","endPageId":"7330177966598520867","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560533987380\",\"content\":\"守护身宫和命宫。\"},{\"logicSentenceId\":\"7580338560534003764\",\"content\":\"权星和禄星相遇，命主聪明通达，最喜遇到魁星钺星，必定科举高中，担任宰臣之职。\"},{\"logicSentenceId\":\"7580338560534020148\",\"content\":\"如果遇到恶星，也能成为有才华的文人，可以做众人的榜样。\"},{\"logicSentenceId\":\"7580338560534036532\",\"content\":\"只是忌讳截路空亡，旬空、天空也忌讳。\"},{\"logicSentenceId\":\"7580338560533970996\",\"content\":\"化科星在水上界参加考试，是掌管文墨的神。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1761,"chapterOrder":14,"inChapterOrder":480,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882114388005","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1174\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命吉星拱守，作公卿婦。\",\"logicSentenceId\":\"7580338560534052916\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1175\",\"lineNum\":0,\"lineType\":1,\"content\":\"雖四殺冲破，也主冨貴。\",\"logicSentenceId\":\"7580338560534069300\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177966598520867","endPageId":"7330177966598520867","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560534069300\",\"content\":\"即使被四煞冲破，也预示富贵。\"},{\"logicSentenceId\":\"7580338560534052916\",\"content\":\"女子命盘有吉星环绕守护，可成为公卿的妻子。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":573,"chapterOrder":14,"inChapterOrder":481,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882114404389","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1176\",\"lineNum\":0,\"lineType\":10,\"content\":\"科星入男命訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177966598520867","endPageId":"7330177966598520867","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":122,"chapterOrder":14,"inChapterOrder":482,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882114420773","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1177\",\"lineNum\":0,\"lineType\":1,\"content\":\"科星文宿最為竒，包藏錦鏽羙文章。\",\"logicSentenceId\":\"7580338560534085684\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1178\",\"lineNum\":0,\"lineType\":1,\"content\":\"一躍禹門龍變化，管教声譽達朝堂。\",\"logicSentenceId\":\"7580338560534102068\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1179\",\"lineNum\":0,\"lineType\":1,\"content\":\"科星入命豈尋常，錦鏽材華展庙廊。\",\"logicSentenceId\":\"7580338560534118452\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1180\",\"lineNum\":0,\"lineType\":1,\"content\":\"更遇曲昌魁龯宿，龍門一躍姓名揚。\",\"logicSentenceId\":\"7580338560534134836\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177966598520867","endPageId":"7330177966598520867","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560534102068\",\"content\":\"一旦跃过龙门化身为龙，定能让声誉传至朝堂。\"},{\"logicSentenceId\":\"7580338560534118452\",\"content\":\"科星入命并非寻常之事，锦绣才华能在朝廷施展。\"},{\"logicSentenceId\":\"7580338560534134836\",\"content\":\"若再遇到文昌、文曲、天魁、天钺等星宿，便能在科举中一举成名、声名远扬。\"},{\"logicSentenceId\":\"7580338560534085684\",\"content\":\"科星和文宿最为奇特，蕴含着如锦绣般美妙的文章。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1262,"chapterOrder":14,"inChapterOrder":483,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882114437157","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1181\",\"lineNum\":0,\"lineType\":10,\"content\":\"科星入女命訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177966598520867","endPageId":"7330177966598520867","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":122,"chapterOrder":14,"inChapterOrder":484,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882114453541","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1182\",\"lineNum\":0,\"lineType\":1,\"content\":\"化科女命是良星，四徳𠔥全性格清。\",\"logicSentenceId\":\"7580338560534151220\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1183\",\"lineNum\":0,\"lineType\":1,\"content\":\"更遇吉星權禄凑，夫荣子貴作夫人。\",\"logicSentenceId\":\"7580338560534167604\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177966598520867","endPageId":"7330177966598520867","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560534151220\",\"content\":\"化科星对女性命盘而言是颗好星，四德俱全且性格清正。\"},{\"logicSentenceId\":\"7580338560534167604\",\"content\":\"若再遇到吉祥之星与权星、禄星汇聚，就会丈夫荣耀、子女显贵而成为夫人。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":673,"chapterOrder":14,"inChapterOrder":485,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882114469925","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1184\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177912936759322\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1185\",\"lineNum\":0,\"lineType\":10,\"content\":\"科星入限訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177912936759322","endPageId":"7330177912936759322","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":237,"chapterOrder":14,"inChapterOrder":486,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882114486309","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1186\",\"lineNum\":0,\"lineType\":1,\"content\":\"科星二限遇文昌，士子逢之姓名香。\",\"logicSentenceId\":\"7580338560534183988\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1187\",\"lineNum\":0,\"lineType\":1,\"content\":\"僧道庶人多冨貴，百謀百遂事英揚。\",\"logicSentenceId\":\"7580338560534200372\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177912936759322","endPageId":"7330177912936759322","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560534183988\",\"content\":\"科星在大小二限遇到文昌星，读书人逢此运程必能声名远扬。\"},{\"logicSentenceId\":\"7580338560534200372\",\"content\":\"僧人、道士、平民大多富贵，各种谋划都能顺遂成功，事业声名远扬。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":669,"chapterOrder":14,"inChapterOrder":487,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882164506650","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1188\",\"lineNum\":0,\"lineType\":1,\"content\":\"化忌星水為多管之神，守身命，一生不順，招是非。\",\"logicSentenceId\":\"7580338560534216756\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1189\",\"lineNum\":0,\"lineType\":1,\"content\":\"小限逢之，一年不足；大限相遇，十年悔吝。\",\"logicSentenceId\":\"7580338560534233140\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1190\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限并太𡻕交臨，断然蹭蹬。\",\"logicSentenceId\":\"7580338560534249524\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1191\",\"lineNum\":0,\"lineType\":1,\"content\":\"文人不耐乆，武人縱有官災，口舌不妨。\",\"logicSentenceId\":\"7580338560534265908\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1192\",\"lineNum\":0,\"lineType\":1,\"content\":\"雖啇賈藝人，在𠙚不冝，難立脚。\",\"logicSentenceId\":\"7580338560534282292\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1193\",\"lineNum\":0,\"lineType\":1,\"content\":\"如㑹紫府、昌曲左右科。\",\"logicSentenceId\":\"7580338560534298676\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1194\",\"lineNum\":0,\"lineType\":1,\"content\":\"權禄與忌同宫，又𠔥羊火鈴空，作事進退，横發横破，始終不得乆遠，即係發不住財是也。\",\"logicSentenceId\":\"7580338560534315060\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1195\",\"lineNum\":0,\"lineType\":1,\"content\":\"一生奔波劳碌，或𢃄疾貧夭，僧道逢亦流移還俗。\",\"logicSentenceId\":\"7580338560534331444\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1196\",\"lineNum\":0,\"lineType\":1,\"content\":\"然天同在戌，化忌丁人遇吉；巨門在辰，化忌，辛人返\",\"logicSentenceId\":\"7580338560534347828\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1197\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177966598717475\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1198\",\"lineNum\":0,\"lineType\":1,\"content\":\"佳。\",\"logicSentenceId\":\"7580338560534347828\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1199\",\"lineNum\":0,\"lineType\":1,\"content\":\"及太陽在寅卯辰巳午化忌，太隂在酉戌亥子化忌，反為福論。\",\"logicSentenceId\":\"7580338560534364212\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1200\",\"lineNum\":0,\"lineType\":1,\"content\":\"若日月𨺻地化忌，主大㐫。\",\"logicSentenceId\":\"7580338561069613071\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1201\",\"lineNum\":0,\"lineType\":1,\"content\":\"如𤎉貞在亥化忌，是為火入水郷，又逢水命人化忌，也不為害。\",\"logicSentenceId\":\"7580338561069629455\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177912936759322","endPageId":"7330177966598717475","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338560534282292\",\"content\":\"即使是商贾艺人，无论在哪里都不合适，难以立足。\"},{\"logicSentenceId\":\"7580338560534347828\",\"content\":\"然而天同星在戌宫，化忌，丁年出生的人遇到反而吉利；巨门星在辰宫，化忌，辛年出生的人遇到反而佳。\"},{\"logicSentenceId\":\"7580338560534249524\",\"content\":\"大小二限与太岁同时交临，必定会遭遇挫折困顿。\"},{\"logicSentenceId\":\"7580338560534364212\",\"content\":\"以及太阳在寅、卯、辰、巳、午宫位化忌，太阴在酉、戌、亥、子宫位化忌，反而要当作有福运来看待。\"},{\"logicSentenceId\":\"7580338561069629455\",\"content\":\"如果廉贞星在亥宫化忌，这是火入水乡的格局，又遇到水命人化忌，也不会造成危害。\"},{\"logicSentenceId\":\"7580338560534216756\",\"content\":\"化忌星属水，是爱多管闲事之神，坐守身宫或命宫，一生不顺，招惹是非。\"},{\"logicSentenceId\":\"7580338560534233140\",\"content\":\"行小限时遇到化忌星，这一年会诸事不顺；行大限时遇到化忌星，这十年都会充满悔恨和遗憾。\"},{\"logicSentenceId\":\"7580338560534298676\",\"content\":\"如果遇到紫微、天府，文昌、文曲，左辅、右弼和化科星。\"},{\"logicSentenceId\":\"7580338560534331444\",\"content\":\"一生奔波劳碌，或者患病、贫穷、早逝，僧人道士遇到这种情况也会流离失所、还俗。\"},{\"logicSentenceId\":\"7580338560534315060\",\"content\":\"权星、禄星与化忌星同在一宫，又加上擎羊星、火星、铃星、天空星，做事进退两难，财富突然获得又突然失去，始终不能长久，也就是发了财也守不住的意思。\"},{\"logicSentenceId\":\"7580338561069613071\",\"content\":\"如果太阳和太阴处于陷地且化忌，主大凶。\"},{\"logicSentenceId\":\"7580338560534265908\",\"content\":\"文人难以长久顺遂，武人纵然遭遇官灾、口舌是非也无妨。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":4530,"chapterOrder":14,"inChapterOrder":488,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882164523034","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1202\",\"lineNum\":0,\"lineType\":10,\"content\":\"忌星入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177966598717475","endPageId":"7330177966598717475","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":128,"chapterOrder":14,"inChapterOrder":489,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882164539418","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1203\",\"lineNum\":0,\"lineType\":1,\"content\":\"諸星化忌不冝逢，更會㐫星愈肆㐫。\",\"logicSentenceId\":\"7580338561069645839\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1204\",\"lineNum\":0,\"lineType\":1,\"content\":\"若得吉星來助救，縱然冨貴不豊隆。\",\"logicSentenceId\":\"7580338561069662223\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1205\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼破軍居陷地，遇吉化忌終不利，男為奸盗女滛娼，加殺照命無眠睡。\",\"logicSentenceId\":\"7580338561069678607\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177966598717475","endPageId":"7330177966598717475","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338561069662223\",\"content\":\"如果能得到吉星来救助，就算能够获得富贵，也不会是非常尊崇显贵的大富大贵。\"},{\"logicSentenceId\":\"7580338561069678607\",\"content\":\"贪狼星和破军星处于陷地，即使遇到吉星化忌终究不利，男子会成为奸盗之人，女子会沦为淫娼，若再加上煞星照命，就会不得安宁。\"},{\"logicSentenceId\":\"7580338561069645839\",\"content\":\"各个星曜化忌时不宜遇到，若再会合凶星就会更加肆意逞凶。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1141,"chapterOrder":14,"inChapterOrder":490,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882164555802","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1206\",\"lineNum\":0,\"lineType\":10,\"content\":\"忌星入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177966598717475","endPageId":"7330177966598717475","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":128,"chapterOrder":14,"inChapterOrder":491,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882164572186","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1207\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人化忌本非竒，更遇㐫星是禍基。\",\"logicSentenceId\":\"7580338561069694991\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1208\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177912936857626\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1209\",\"lineNum\":0,\"lineType\":1,\"content\":\"衣食艱辛貧賤甚，吉星凑合减災危。\",\"logicSentenceId\":\"7580338561069711375\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177966598717475","endPageId":"7330177912936857626","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338561069694991\",\"content\":\"对女子来说命中出现化忌星本就不稀奇，再遇到凶星就是灾祸的根源。\"},{\"logicSentenceId\":\"7580338561069711375\",\"content\":\"生活中穿衣吃饭艰难，贫困到了极点，若有吉星会合在一起，就能减轻灾祸和危险。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":817,"chapterOrder":14,"inChapterOrder":492,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882164588570","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1210\",\"lineNum\":0,\"lineType\":10,\"content\":\"忌星入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177912936857626","endPageId":"7330177912936857626","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":125,"chapterOrder":14,"inChapterOrder":493,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882164604954","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1211\",\"lineNum\":0,\"lineType\":1,\"content\":\"忌星入庙反為佳，縱有官災亦不傷。\",\"logicSentenceId\":\"7580338561069727759\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1212\",\"lineNum\":0,\"lineType\":1,\"content\":\"一進一退名不遂，更𠔥遇吉保安康。\",\"logicSentenceId\":\"7580338561069744143\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1213\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限宫中見忌星，致災為禍必家傾。\",\"logicSentenceId\":\"7580338561069760527\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1214\",\"lineNum\":0,\"lineType\":1,\"content\":\"為官退職遭賍濫，胥吏湏防禁杖刑。\",\"logicSentenceId\":\"7580338561069776911\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1215\",\"lineNum\":0,\"lineType\":1,\"content\":\"忌星落𨺻在閑宫，惡殺加臨作禍㐫。\",\"logicSentenceId\":\"7580338561069793295\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1216\",\"lineNum\":0,\"lineType\":1,\"content\":\"財散人離多疾苦，傷官退職孝重逢。\",\"logicSentenceId\":\"7580338561069809679\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177912936857626","endPageId":"7330177912936857626","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338561069793295\",\"content\":\"忌星落在陷地且处于闲宫，再有恶煞星加临就会造成凶险灾祸。\"},{\"logicSentenceId\":\"7580338561069809679\",\"content\":\"会遭遇钱财散尽、亲人分离的情况，生活充满疾苦，还会有伤害官运、失去职位、家中有人去世的事情发生。\"},{\"logicSentenceId\":\"7580338561069727759\",\"content\":\"忌星进入庙旺之地反而好，即使遭遇官灾也不会受伤害。\"},{\"logicSentenceId\":\"7580338561069744143\",\"content\":\"运势会时进时退，难以功成名就，若能遇到吉星相助，便可以保全安康。\"},{\"logicSentenceId\":\"7580338561069760527\",\"content\":\"二限宫中有忌星，会造成灾难，必然会导致倾家荡产。\"},{\"logicSentenceId\":\"7580338561069776911\",\"content\":\"为官者会因贪赃枉法而被罢官，小吏则需提防被囚禁和受杖刑。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1980,"chapterOrder":14,"inChapterOrder":494,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882164621338","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1217\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄㑹禄存冨貴權。\",\"logicSentenceId\":\"7580338561069826063\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1218\",\"lineNum\":0,\"lineType\":1,\"content\":\"㑹巨武英揚，科㑹魁鉞貴𩔰，忌㑹身命招是非。\",\"logicSentenceId\":\"7580338561069842447\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177912936857626","endPageId":"7330177912936857626","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338561069826063\",\"content\":\"禄星与禄存星会合，主拥有富贵和权势。\"},{\"logicSentenceId\":\"7580338561069842447\",\"content\":\"与巨门、武曲相会则声名远扬，与化科、天魁、天钺相会则尊贵显达，忌星与身宫命宫相会则招惹是非。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":679,"chapterOrder":14,"inChapterOrder":495,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882164637722","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1219\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330178019178348584\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1220\",\"lineNum\":0,\"lineType\":1,\"content\":\"歳君火乃流年太嵗星君與諸㐫神相遇，皆與不謀。\",\"logicSentenceId\":\"7580338561069858831\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1221\",\"lineNum\":0,\"lineType\":1,\"content\":\"忌與大小二限相冲，若逢大限，遇紫府昌曲左右魁龯吉星扶救，災少，亦防六畜死失。\",\"logicSentenceId\":\"7580338561069875215\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1222\",\"lineNum\":0,\"lineType\":1,\"content\":\"若遇羊陀火鈴刼空傷使財破身亡。\",\"logicSentenceId\":\"7580338561069891599\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178019178348584","endPageId":"7330178019178348584","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338561069891599\",\"content\":\"如果遇到擎羊星、陀罗星、火星、铃星、劫杀星、天空星、伤使星，就会导致钱财散尽、自身死亡。\"},{\"logicSentenceId\":\"7580338561069858831\",\"content\":\"岁君火是指流年太岁星君与各个凶神相遇，都是意想不到的情况。\"},{\"logicSentenceId\":\"7580338561069875215\",\"content\":\"如果忌星与大限、小限相冲，如果遇到大限，有紫微星、府星、文昌星、文曲星、左辅星、右弼星、魁星、钺星等吉星救助，灾祸减少，但也要防止六畜死亡或丢失。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1364,"chapterOrder":14,"inChapterOrder":496,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882164654106","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1223\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命逢之，防産難之厄。\",\"logicSentenceId\":\"7580338561069907983\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1224\",\"lineNum\":0,\"lineType\":1,\"content\":\"若有救，可免死亡。\",\"logicSentenceId\":\"7580338561069924367\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178019178348584","endPageId":"7330178019178348584","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338561069907983\",\"content\":\"女性命格遇到这种情况，要防备难产的灾厄。\"},{\"logicSentenceId\":\"7580338561069924367\",\"content\":\"如果有解救之法，就可以避免死亡。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":567,"chapterOrder":14,"inChapterOrder":497,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882164670490","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1225\",\"lineNum\":0,\"lineType\":1,\"content\":\"太嵗之星不可當，守臨宫限要推詳。\",\"logicSentenceId\":\"7580338561069940751\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1226\",\"lineNum\":0,\"lineType\":1,\"content\":\"若無吉矅來相𦔳，未免官災閙一塲。\",\"logicSentenceId\":\"7580338561069957135\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178019178348584","endPageId":"7330178019178348584","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338561069940751\",\"content\":\"太岁之星不可抵挡，守临宫限时要仔细推究端详。\"},{\"logicSentenceId\":\"7580338561069957135\",\"content\":\"如果没有吉星来相助，难免会有一场官灾。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":619,"chapterOrder":14,"inChapterOrder":498,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158882164686874","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1227\",\"lineNum\":0,\"lineType\":1,\"content\":\"斗君正月初一日管事，遇吉断吉，遇㐫断㐫。\",\"logicSentenceId\":\"7580338561069973519\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1228\",\"lineNum\":0,\"lineType\":1,\"content\":\"如太𡻕二限羙，若斗君正月初一日值在厶宫過度，逢㐫殺也，主其年有得失災病官非，依月限断之。\",\"logicSentenceId\":\"7580338561069989903\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7
