es\":[{\"logicSentenceId\":\"7580338556305604660\",\"content\":\"散尽全部的家财，还会寿命短暂、早早离世，如飘蓬般做僧道住在山中。\"},{\"logicSentenceId\":\"7580338556305555508\",\"content\":\"天机、太阴、天梁三星与太阳星会合，普通人也能富足并购置田庄。\"},{\"logicSentenceId\":\"7580338556305571892\",\"content\":\"官员若能遇到科星、权星、禄星，就会职位高升，得以面见帝王。\"},{\"logicSentenceId\":\"7580338556305588276\",\"content\":\"天机星化忌落入闲宫，即使有财帛宫最终也难以长久。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1418,"chapterOrder":14,"inChapterOrder":190,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877584375845","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"383\",\"lineNum\":0,\"lineType\":10,\"content\":\"天機入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176803270819867","endPageId":"7330176803270819867","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":191,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877584392229","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"384\",\"lineNum\":0,\"lineType\":1,\"content\":\"天機女命吉星扶，作事操持過丈夫。\",\"logicSentenceId\":\"7580338556305621044\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"385\",\"lineNum\":0,\"lineType\":1,\"content\":\"𫞐禄宫中逢守照，荣膺誥命貴如何。\",\"logicSentenceId\":\"7580338556305637428\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"386\",\"lineNum\":0,\"lineType\":1,\"content\":\"天機若與太隂同，女命逢之必巧容。\",\"logicSentenceId\":\"7580338556305653812\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"387\",\"lineNum\":0,\"lineType\":1,\"content\":\"衣禄𧯮饒終不羙，為娼為妾主滛風。\",\"logicSentenceId\":\"7580338556305670196\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176803270819867","endPageId":"7330176803270819867","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305670196\",\"content\":\"即使衣食俸禄富足，人生最终也不会美满，会沦为娼妓或妾室，预示着有淫荡的风气。\"},{\"logicSentenceId\":\"7580338556305621044\",\"content\":\"命盘中有天机星的女性若得吉星扶持，做事操持能力超过丈夫。\"},{\"logicSentenceId\":\"7580338556305637428\",\"content\":\"在𫞐禄宫中有星曜守照，能荣膺诰命是何等尊贵啊。\"},{\"logicSentenceId\":\"7580338556305653812\",\"content\":\"天机星如果与太阴星同宫，女性命盘遇到这种情况必定容貌灵巧美丽。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1318,"chapterOrder":14,"inChapterOrder":192,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877584408613","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"388\",\"lineNum\":0,\"lineType\":10,\"content\":\"天機入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176803270819867","endPageId":"7330176803270819867","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":193,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877584424997","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"389\",\"lineNum\":0,\"lineType\":1,\"content\":\"男女二限值天機，禄主科𫞐大有為。\",\"logicSentenceId\":\"7580338556305686580\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"390\",\"lineNum\":0,\"lineType\":1,\"content\":\"出入經营多遇貴，發財𤼵福少人知。\",\"logicSentenceId\":\"7580338556305702964\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"391\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176868857118720\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"392\",\"lineNum\":0,\"lineType\":1,\"content\":\"天機照限不安寕，家事紛紛外事多。\",\"logicSentenceId\":\"7580338556305719348\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"393\",\"lineNum\":0,\"lineType\":1,\"content\":\"更遇羊陀併巨暗，湏知此𡻕入南柯。\",\"logicSentenceId\":\"7580338556305735732\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176803270819867","endPageId":"7330176868857118720","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305719348\",\"content\":\"天机星照命限不安宁，家中事务繁杂，外界事务也很多。\"},{\"logicSentenceId\":\"7580338556305735732\",\"content\":\"如果再遇到擎羊星、陀罗星以及巨门化忌，就需要知道这一年会遭遇灾祸，生活不如意，甚至可能遭遇生死之事。\"},{\"logicSentenceId\":\"7580338556305686580\",\"content\":\"男女在大运或流年遇到天机星，若再遇到禄、科、权等吉星，就会大有作为。\"},{\"logicSentenceId\":\"7580338556305702964\",\"content\":\"外出经营常常遇到贵人，发财享福却少有人知道。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1468,"chapterOrder":14,"inChapterOrder":194,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877584441381","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"394\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽火南北斗化貴為官禄，主太陽入庙，形貌堂堂雄壮，靣方圓滿。\",\"logicSentenceId\":\"7580338556305752116\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"395\",\"lineNum\":0,\"lineType\":1,\"content\":\"夜生𨺻，日生，庙旺心慈，面紫色，好施濟。\",\"logicSentenceId\":\"7580338556305768500\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"396\",\"lineNum\":0,\"lineType\":1,\"content\":\"若㑹左右昌曲魁鉞，太隂禄存守照，官祿財官昭着，極品之論，文武皆冝之。\",\"logicSentenceId\":\"7580338556305784884\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"397\",\"lineNum\":0,\"lineType\":1,\"content\":\"身逢吉聚貴人門下客，否則公卿走卒。\",\"logicSentenceId\":\"7580338556305801268\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"398\",\"lineNum\":0,\"lineType\":1,\"content\":\"六庚生人，命坐卯宫，第一庙所，六壬人次之，命在亥甲生人下局，否則天夀貧窮，雖發不乆，庙旺終身冨貴。\",\"logicSentenceId\":\"7580338556305817652\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"399\",\"lineNum\":0,\"lineType\":1,\"content\":\"𨺻地𨿽化，權禄也㐫，官禄亦不顕，先𠢄終懶，成敗不一，出外離祖，可吉，與羊陀冲破，又𨺻下局，横發撗破，不耐乆。\",\"logicSentenceId\":\"7580338556305834036\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"400\",\"lineNum\":0,\"lineType\":1,\"content\":\"若經啇巧藝，辛苦劳\",\"logicSentenceId\":\"7580338556305850420\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"401\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176888184274970\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"402\",\"lineNum\":0,\"lineType\":1,\"content\":\"力，而禍輕延生矣。\",\"logicSentenceId\":\"7580338556305850420\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"403\",\"lineNum\":0,\"lineType\":1,\"content\":\"加㐫殺𢃄疾化，忌目疾。\",\"logicSentenceId\":\"7580338556305866804\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176868857118720","endPageId":"7330176888184274970","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305784884\",\"content\":\"如果与左辅、右弼、文昌、文曲、天魁、天钺会合，又有太阴、禄存守照，那么官禄和财运都十分显著，可称得上是极品命格，无论是从文还是从武都很合适。\"},{\"logicSentenceId\":\"7580338556305801268\",\"content\":\"命身宫遇到吉星汇聚，会成为贵人门下的宾客，否则就是公卿的走卒。\"},{\"logicSentenceId\":\"7580338556305817652\",\"content\":\"六庚年出生的人，命宫落在卯宫，这是最佳的庙旺位置；六壬年出生的人次一等；出生年天干为甲且命宫在亥的人处于下等格局，不然就会短寿贫穷，即使一时发达也不会长久，若命宫处于庙旺状态则终身富贵。\"},{\"logicSentenceId\":\"7580338556305834036\",\"content\":\"处于陷地时，即使化出权禄也是凶险的，官禄也不显著，起初勤勉最终懒惰，成败不定，外出离开祖籍地可能吉利，若与羊陀星相冲克破坏，又处于陷地下局，会突然发达又突然破败，难以长久。\"},{\"logicSentenceId\":\"7580338556305850420\",\"content\":\"若从事精巧技艺，辛苦劳作，就能减轻灾祸、延长寿命了。\"},{\"logicSentenceId\":\"7580338556305866804\",\"content\":\"加上凶煞会带有疾病的变化，忌讳眼睛方面的疾病。\"},{\"logicSentenceId\":\"7580338556305752116\",\"content\":\"太阳星属火，在南北斗中化身为贵星，对应命盘中的官禄宫，代表着太阳星落入庙旺之地，命主的容貌气质会显得仪表堂堂、雄壮威武，脸型方正圆满。\"},{\"logicSentenceId\":\"7580338556305768500\",\"content\":\"夜晚出生处于陷地，白天出生处于庙旺之地则心地慈善，面色发紫，喜好施舍救济。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":3724,"chapterOrder":14,"inChapterOrder":195,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877584457765","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"404\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命入廟，旺夫益子，若𨺻地又見羊陀火鈴忌刼，貧賤殘疾，亦為貞潔之婦，僧道亦淸潔。\",\"logicSentenceId\":\"7580338556305883188\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184274970","endPageId":"7330176888184274970","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305883188\",\"content\":\"女性命格处于庙旺状态，能旺丈夫、利于子女；如果处于陷地的状态，又遇见擎羊星、陀罗星、火星、铃星、化忌星、劫煞星，就会贫贱又身有残疾，也是贞洁的妇女，若是出家为僧道，也能保持清净高洁。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":608,"chapterOrder":14,"inChapterOrder":196,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877584474149","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"405\",\"lineNum\":0,\"lineType\":1,\"content\":\"子宫𨺻，午宫旺，丁巳生人財官格，壬丙戊生人悔吝。\",\"logicSentenceId\":\"7580338556305899572\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184274970","endPageId":"7330176888184274970","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305899572\",\"content\":\"命在子宫为陷地，在午宫为旺地，丁巳年出生的人是财官格局，壬年、丙年、戊年出生的人会有悔恨、不如意的事情。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":443,"chapterOrder":14,"inChapterOrder":197,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877584490533","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"406\",\"lineNum\":0,\"lineType\":1,\"content\":\"卯宫庙酉和平，乙辛生人財官格，甲庚人困。\",\"logicSentenceId\":\"7580338556305915956\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184274970","endPageId":"7330176888184274970","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305915956\",\"content\":\"在卯宫处于庙的状态，在酉宫处于和平状态，乙年和辛年出生的人有财官之格局，甲年和庚年出生的人会陷入困境。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":427,"chapterOrder":14,"inChapterOrder":198,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877584506917","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"407\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅宫旺，申得地，巨門同。\",\"logicSentenceId\":\"7580338556305932340\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"408\",\"lineNum\":0,\"lineType\":1,\"content\":\"丁巳甲庚人，財官格。\",\"logicSentenceId\":\"7580338556305948724\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184274970","endPageId":"7330176888184274970","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305948724\",\"content\":\"出生年的干支是丁巳、甲庚的人，命主有财星和官星入格的运势。\"},{\"logicSentenceId\":\"7580338556305932340\",\"content\":\"在寅宫为旺，在申宫为得地，与巨门星同宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":610,"chapterOrder":14,"inChapterOrder":199,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877584523301","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"409\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳宫旺，財官格。\",\"logicSentenceId\":\"7580338556305965108\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"410\",\"lineNum\":0,\"lineType\":1,\"content\":\"亥宫𨺻，逢殺，孤寡貧窮。\",\"logicSentenceId\":\"7580338556305981492\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184274970","endPageId":"7330176888184274970","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305965108\",\"content\":\"在巳宫时处于旺盛状态，属于财官格。\"},{\"logicSentenceId\":\"7580338556305981492\",\"content\":\"亥宫落陷，如果遇到煞星，会孤独无依、贫困潦倒。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":578,"chapterOrder":14,"inChapterOrder":200,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877752311817","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"411\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰宫旺，財官格，戌宫𨺻，反背孤寡。\",\"logicSentenceId\":\"7580338556305997876\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184274970","endPageId":"7330176888184274970","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556305997876\",\"content\":\"在辰宫是旺盛的状态，属于财官格；在戌宫则是陷落的状态，命主会遭遇诸事不顺、孤独无依的情况。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":401,"chapterOrder":14,"inChapterOrder":201,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877752328201","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"412\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑宫𨺻，未宫得地，太隂同，加吉星財官格。\",\"logicSentenceId\":\"7580338556306014260\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184274970","endPageId":"7330176888184274970","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556306014260\",\"content\":\"在丑宫时处于陷地，在未宫时处于得地的状态，与太阴星同宫，如果再加上吉星，就是有财运和官运的格局。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":419,"chapterOrder":14,"inChapterOrder":202,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877752344585","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"413\",\"lineNum\":0,\"lineType\":10,\"content\":\"太陽入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184274970","endPageId":"7330176888184274970","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":203,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877752360969","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"414\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176952189353999\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"415\",\"lineNum\":0,\"lineType\":1,\"content\":\"命裡陽逢福夀濃，更𠔥𫞐禄两相逢。\",\"logicSentenceId\":\"7580338556306030644\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"416\",\"lineNum\":0,\"lineType\":1,\"content\":\"魁昌左右來相凑，冨貴双全比石祟。\",\"logicSentenceId\":\"7580338556306047028\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"417\",\"lineNum\":0,\"lineType\":1,\"content\":\"日月丑未命中逢，三方無化福難豊，便有吉星終不美，若逢殺凑一生窮。\",\"logicSentenceId\":\"7580338556306063412\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"418\",\"lineNum\":0,\"lineType\":1,\"content\":\"失𨺻太陽居反背，化忌逢之多蹇昧，又招横事破家財。\",\"logicSentenceId\":\"7580338556306079796\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"419\",\"lineNum\":0,\"lineType\":1,\"content\":\"命強化禄也無害。\",\"logicSentenceId\":\"7580338556306096180\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176952189353999","endPageId":"7330176952189353999","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556306047028\",\"content\":\"魁星、文昌星、左辅星、右弼星来相凑，富贵双全堪比石崇。\"},{\"logicSentenceId\":\"7580338556306063412\",\"content\":\"命盘中日月出现在丑宫或未宫，三方没有化曜则福气难全，就算有吉星也终究不会太好，若再遇到煞星凑在一起则一生穷困。\"},{\"logicSentenceId\":\"7580338556306079796\",\"content\":\"失陷的太阳星处于反背状态，遇到化忌会多有困顿、糊涂之事，还会招来意外灾祸而破散家财。\"},{\"logicSentenceId\":\"7580338556306096180\",\"content\":\"命格强势，即使化禄也无妨。\"},{\"logicSentenceId\":\"7580338556306030644\",\"content\":\"命里遇到太阳星则福气和寿命都很浓厚，再加上𫞐星和禄星同时出现。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1859,"chapterOrder":14,"inChapterOrder":204,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877752377353","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"420\",\"lineNum\":0,\"lineType\":10,\"content\":\"太陽入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176952189353999","endPageId":"7330176952189353999","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":205,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877752393737","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"421\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽正照婦人身，姿貌殊常性格貞。\",\"logicSentenceId\":\"7580338556306112564\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"422\",\"lineNum\":0,\"lineType\":1,\"content\":\"更得吉星同主照，金冠封贈作夫人。\",\"logicSentenceId\":\"7580338556306128948\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"423\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽女命有竒能，𨺻地湏防要殺凌。\",\"logicSentenceId\":\"7580338556306145332\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"424\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176888184373274\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"425\",\"lineNum\":0,\"lineType\":1,\"content\":\"作事沉吟多進退，辛勤度日免家傾。\",\"logicSentenceId\":\"7580338556306161716\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"426\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽反照主心忙，衣禄平常壽不長。\",\"logicSentenceId\":\"7580338556306178100\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"427\",\"lineNum\":0,\"lineType\":1,\"content\":\"尅過良人還尅子，只冝隂下作偏房。\",\"logicSentenceId\":\"7580338556306194484\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176952189353999","endPageId":"7330176888184373274","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556306128948\",\"content\":\"若再得到吉星一同照命，能获金冠封赠成为夫人。\"},{\"logicSentenceId\":\"7580338556306145332\",\"content\":\"太阳星在女性命盘中有非凡才能，若处于失陷宫位则须防备煞星侵扰。\"},{\"logicSentenceId\":\"7580338556306161716\",\"content\":\"做事犹豫不决，进退不定；辛勤度日，避免家业衰败。\"},{\"logicSentenceId\":\"7580338556306178100\",\"content\":\"太阳反照时，命主心里忙乱，衣禄平常，寿命不长。\"},{\"logicSentenceId\":\"7580338556306194484\",\"content\":\"克死了丈夫还会克子女，只适合在别人家中做偏房。\"},{\"logicSentenceId\":\"7580338556306112564\",\"content\":\"太阳正照在妇人身上，容貌非凡性格坚贞。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1961,"chapterOrder":14,"inChapterOrder":206,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877752410121","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"428\",\"lineNum\":0,\"lineType\":10,\"content\":\"太陽入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184373274","endPageId":"7330176888184373274","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":207,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877768876082","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"429\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限偏冝見太陽，添才進業福非常。\",\"logicSentenceId\":\"7580338556306210868\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"430\",\"lineNum\":0,\"lineType\":1,\"content\":\"婚𡛸和合添嗣續，仕者高遷坐庙堂。\",\"logicSentenceId\":\"7580338556306227252\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"431\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽守限有多般，𨺻地湏防𢙣殺侵。\",\"logicSentenceId\":\"7580338556306243636\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"432\",\"lineNum\":0,\"lineType\":1,\"content\":\"加忌逢㐫多阻滯，横事破財家伶仃。\",\"logicSentenceId\":\"7580338556306260020\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184373274","endPageId":"7330176888184373274","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556306210868\",\"content\":\"青少年和中年时期遇到太阳星是非常适宜的，增加财富、事业发达，福运非常好。\"},{\"logicSentenceId\":\"7580338556306227252\",\"content\":\"婚姻和睦美满并增添子嗣，做官的人高升坐朝堂。\"},{\"logicSentenceId\":\"7580338556306243636\",\"content\":\"太阳星守限的情况多种多样，处于陷地时必须防范恶煞侵扰。\"},{\"logicSentenceId\":\"7580338556306260020\",\"content\":\"如果遇到化忌和凶星，就会有很多阻碍，遭遇意外之事导致破财，家庭陷入孤苦伶仃的境地。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1336,"chapterOrder":14,"inChapterOrder":208,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877768892466","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"433\",\"lineNum\":0,\"lineType\":1,\"content\":\"武曲金北斗化財為財帛，主武曲性㓻果决，心直無毒，形小聲高而量大。\",\"logicSentenceId\":\"7580338556306276404\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"434\",\"lineNum\":0,\"lineType\":1,\"content\":\"最喜甲巳生人，福厚，有毛髮之異，入庙與昌\",\"logicSentenceId\":\"7580338556306292788\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"435\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176952189550607\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"436\",\"lineNum\":0,\"lineType\":1,\"content\":\"曲同。\",\"logicSentenceId\":\"7580338556306292788\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"437\",\"lineNum\":0,\"lineType\":1,\"content\":\"行則出將入相，武職最旺，文人多學多能，會貪遇火化吉為上格。\",\"logicSentenceId\":\"7580338556306309172\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"438\",\"lineNum\":0,\"lineType\":1,\"content\":\"丙丁、庚辛壬癸中格，断與府相梁。\",\"logicSentenceId\":\"7580338556306325556\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"439\",\"lineNum\":0,\"lineType\":1,\"content\":\"月禄馬㑹主貴，西北人為福，東南人平常。\",\"logicSentenceId\":\"7580338556306341940\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"440\",\"lineNum\":0,\"lineType\":1,\"content\":\"𨺻地，巧藝之人及僧道。\",\"logicSentenceId\":\"7580338556306358324\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"441\",\"lineNum\":0,\"lineType\":1,\"content\":\"更遇𤎉貞破軍，羊忌空刼，冲破下局，破祖敗家。\",\"logicSentenceId\":\"7580338556306374708\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184373274","endPageId":"7330176952189550607","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556306276404\",\"content\":\"武曲星属金，是北斗星之一，化财为掌管财帛之星，代表着武曲星性格刚硬果决，心地正直没有歹毒之心，身形瘦小但是声音洪亮，度量很大。\"},{\"logicSentenceId\":\"7580338556306292788\",\"content\":\"最喜甲年、巳年出生的人，福泽深厚，有毛发方面的特殊之处，入庙时与文昌星、文曲星同宫。\"},{\"logicSentenceId\":\"7580338556306309172\",\"content\":\"若能发展则可出将入相，担任武职最为兴旺，文人学识丰富且能力出众，若会合贪狼星、遇火星则化为吉利之象，属于上佳格局。\"},{\"logicSentenceId\":\"7580338556306325556\",\"content\":\"丙丁、庚辛壬癸年出生的人属于中等格局，推断时可参照天府、天相、天梁三星。\"},{\"logicSentenceId\":\"7580338556306341940\",\"content\":\"月禄、天马会合主显贵，西北方位的人得福泽，东南方位的人命运平常。\"},{\"logicSentenceId\":\"7580338556306358324\",\"content\":\"武曲星处于陷地的时候，命主可能会成为有精巧技艺的人或者僧人、道士。\"},{\"logicSentenceId\":\"7580338556306374708\",\"content\":\"如果再遇到廉贞星、破军星，以及擎羊星、忌星、天空星、地劫星，冲破下等格局，就会破败祖业、家道衰落。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2931,"chapterOrder":14,"inChapterOrder":209,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877768908850","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"442\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命入庙𫞐貴，𨺻地值殺孤单，刑夫尅子，且不正。\",\"logicSentenceId\":\"7580338556306391092\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176952189550607","endPageId":"7330176952189550607","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556306391092\",\"content\":\"女性命格中武曲星入庙则显贵，处于陷地又遇到煞星则会孤单，克害丈夫和子女，且行为不端。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":411,"chapterOrder":14,"inChapterOrder":210,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877768925234","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"443\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午宫，旺地，天府同。\",\"logicSentenceId\":\"7580338556306407476\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"444\",\"lineNum\":0,\"lineType\":1,\"content\":\"丁巳庚生人，財官格。\",\"logicSentenceId\":\"7580338556306423860\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176952189550607","endPageId":"7330176952189550607","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338556306407476\",\"content\":\"子午宫，是旺盛之地，与天府星同宫。\"},{\"logicSentenceId\":\"7580338556306423860\",\"content\":\"丁巳年、庚年出生的人，是有财有官的命格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":571,"chapterOrder":14,"inCha enceId\":\"7580338557231972404\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184487962","endPageId":"7330176888184487962","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557231939636\",\"content\":\"志向高远，大多出类拔萃，超越凡人、达到圣人境界，在众人面前崭露头角。\"},{\"logicSentenceId\":\"7580338557231956020\",\"content\":\"武曲星坐守命宫，有吉星守护照耀才能昌盛繁荣。\"},{\"logicSentenceId\":\"7580338557231972404\",\"content\":\"如果再加上耗星、杀星以及四煞星，即使财富再多，最终也会落空。\"},{\"logicSentenceId\":\"7580338557231923252\",\"content\":\"武曲星坐守命宫化为𫞐星，吉祥的星曜降临则福寿双全。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1290,"chapterOrder":14,"inChapterOrder":218,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877769056306","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"462\",\"lineNum\":0,\"lineType\":10,\"content\":\"武曲入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184487962","endPageId":"7330176888184487962","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":219,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877769072690","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"463\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人武曲命中逢，天府加之志氣雄。\",\"logicSentenceId\":\"7580338557231988788\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"464\",\"lineNum\":0,\"lineType\":1,\"content\":\"左右再來相逢聚，雙全冨貴美無窮。\",\"logicSentenceId\":\"7580338557232005172\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"465\",\"lineNum\":0,\"lineType\":1,\"content\":\"将星一宿最㓻強，女命逢之性異常。\",\"logicSentenceId\":\"7580338557232021556\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"466\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177014571270159\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"467\",\"lineNum\":0,\"lineType\":1,\"content\":\"衣禄㴞㴞終有破，不然壽夭主㐫亡。\",\"logicSentenceId\":\"7580338557232037940\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176888184487962","endPageId":"7330177014571270159","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557231988788\",\"content\":\"女性命中遇到武曲星，再加上天府星，就会很有志向和气魄。\"},{\"logicSentenceId\":\"7580338557232005172\",\"content\":\"如果左辅星、右弼星再来相聚，便会富贵双全，美好无穷。\"},{\"logicSentenceId\":\"7580338557232021556\",\"content\":\"将星这一宿最为刚强，女性命盘中遇到它性格会与众不同。\"},{\"logicSentenceId\":\"7580338557232037940\",\"content\":\"衣食丰足源源不断终将遭遇破耗，否则会早夭遭遇凶亡。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1384,"chapterOrder":14,"inChapterOrder":220,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877769089074","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"468\",\"lineNum\":0,\"lineType\":10,\"content\":\"武曲入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177014571270159","endPageId":"7330177014571270159","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":221,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877769105458","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"469\",\"lineNum\":0,\"lineType\":1,\"content\":\"大小限逢武曲星，若還入庙主財興。\",\"logicSentenceId\":\"7580338557232054324\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"470\",\"lineNum\":0,\"lineType\":1,\"content\":\"更加文昌臨左右，福禄𩀱全得稱心。\",\"logicSentenceId\":\"7580338557232070708\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"471\",\"lineNum\":0,\"lineType\":1,\"content\":\"武曲臨限化權星，最利求謀事有成。\",\"logicSentenceId\":\"7580338557232087092\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"472\",\"lineNum\":0,\"lineType\":1,\"con 947\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"479\",\"lineNum\":0,\"lineType\":1,\"content\":\"非小可。\",\"logicSentenceId\":\"7580338557232185396\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"480\",\"lineNum\":0,\"lineType\":1,\"content\":\"未宫次之。\",\"logicSentenceId\":\"7580338557232201780\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"481\",\"lineNum\":0,\"lineType\":1,\"content\":\"午𨺻，丁生人冝之。\",\"logicSentenceId\":\"7580338557232218164\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"482\",\"lineNum\":0,\"lineType\":1,\"content\":\"𠰥在亥地，庚生人下局。\",\"logicSentenceId\":\"7580338557232234548\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"483\",\"lineNum\":0,\"lineType\":1,\"content\":\"更使羊陀、鈴、忌冲合，則孤单、破相、目疾。\",\"logicSentenceId\":\"7580338557232250932\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177014571270159","endPageId":"7330176990273617947","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557232169012\",\"content\":\"天同星入庙，命主体态丰腴饱满、面容清朗，为人仁慈且正直坦率。\"},{\"logicSentenceId\":\"7580338557232185396\",\"content\":\"天同星与天梁星、左辅星、右弼星美好会合，丙年出生的人在巳宫、亥宫、酉宫安命，财禄和官职都很美好，福气不小。\"},{\"logicSentenceId\":\"7580338557232201780\",\"content\":\"天同在未宫的情况次之。\"},{\"logicSentenceId\":\"7580338557232218164\",\"content\":\"天同星在午宫处于陷地，丁年出生的人适宜这种情况。\"},{\"logicSentenceId\":\"7580338557232234548\",\"content\":\"如果在亥宫，庚年出生的人是下等格局。\"},{\"logicSentenceId\":\"7580338557232250932\",\"content\":\"若再让擎羊、陀罗、铃星、忌星相冲会合，就会孤单、破相、患眼疾。\"},{\"logicSentenceId\":\"7580338557232152628\",\"content\":\"天同星属水，在南斗化为福星，为福德之主。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2422,"chapterOrder":14,"inChapterOrder":223,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877769138226","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"484\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命㑹吉星作命，婦旺夫益子極賢能。\",\"logicSentence ntent\":\"乙、壬、甲、丙、辛、庚年出生的人，有财星和官星的格局。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":622,"chapterOrder":14,"inChapterOrder":230,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957685285","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"499\",\"lineNum\":0,\"lineType\":10,\"content\":\"天同入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273617947","endPageId":"7330176990273617947","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":231,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957701669","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"500\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177014571384847\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"501\",\"lineNum\":0,\"lineType\":1,\"content\":\"天同坐命性温良，福禄悠悠夀更長。\",\"logicSentenceId\":\"7580338557232513076\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"502\",\"lineNum\":0,\"lineType\":1,\"content\":\"若是福人居庙旺，定教食禄譽傳揚。\",\"logicSentenceId\":\"7580338557232529460\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"503\",\"lineNum\":0,\"lineType\":1,\"content\":\"天同𠰥與吉星逢，性格聦明百事通。\",\"logicSentenceId\":\"7580338557232545844\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"504\",\"lineNum\":0,\"lineType\":1,\"content\":\"男子定然食天禄，女人樂守綉房中。\",\"logicSentenceId\":\"7580338557232562228\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"505\",\"lineNum\":0,\"lineType\":1,\"content\":\"天同守命落閑宫，火陀殺合更為㐫。\",\"logicSentenceId\":\"7580338557232578612\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"506\",\"lineNum\":0,\"lineType\":1,\"content\":\"天機梁月來相㑹，只好空門度𡻕中。\",\"logicSentenceId\":\"7580338557232594996\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177014571384847","endPageId":"7330177014571384847","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557232594996\",\"content\":\"天机、天梁、太阴相会，就只能在寺庙中度过一生了。\"},{\"logicSentenceId\":\"7580338557232513076\",\"content\":\"天同星坐守命宫的人性格温和善良，福泽与禄运长久绵延，寿命也更长。\"},{\"logicSentenceId\":\"7580338557232529460\",\"content\":\"如果是有福之人居于庙旺之地，必定能享受俸禄且声誉远扬。\"},{\"logicSentenceId\":\"7580338557232545844\",\"content\":\"天同星如果与吉星相遇，命主性格聪明，百事通晓。\"},{\"logicSentenceId\":\"7580338557232562228\",\"content\":\"男子必定能享受朝廷俸禄，女子乐于守在绣房之中。\"},{\"logicSentenceId\":\"7580338557232578612\",\"content\":\"天同星坐守命宫且落在闲宫，又与火星、陀罗星等煞星会合，就更加凶险。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2022,"chapterOrder":14,"inChapterOrder":232,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957718053","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"507\",\"lineNum\":0,\"lineType\":10,\"content\":\"天同入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177014571384847","endPageId":"7330177014571384847","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":233,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957734437","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"508\",\"lineNum\":0,\"lineType\":1,\"content\":\"天同守命婦人貞，性格聦明伶俐人，昌曲更來相會處，悠悠財福自天申。\",\"logicSentenceId\":\"7580338557232611380\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"509\",\"lineNum\":0,\"lineType\":1,\"content\":\"天同𠰥與太隂同，女命逢之滛巧容，\",\"logicSentenceId\":\"7580338557232627764\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"510\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176990273699867\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"511\",\"lineNum\":0,\"lineType\":1,\"content\":\"衣禄雖豊終不美，偏房侍妾與人通。\",\"logicSentenceId\":\"7580338557232627764\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177014571384847","endPageId":"7330176990273699867","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557232627764\",\"content\":\"天同星如果与太阴星同宫，女性命盘遇到这种情况会有淫荡取巧的容貌，衣食俸禄虽然合乎礼仪但终究不美满，会成为偏房侍妾与人私通。\"},{\"logicSentenceId\":\"7580338557232611380\",\"content\":\"天同星坐守命宫的妇人贞洁，是性格聪明伶俐之人，文昌星和文曲星若再与之相会，源源不断的财运和福气从天而降。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1154,"chapterOrder":14,"inChapterOrder":234,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957750821","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"512\",\"lineNum\":0,\"lineType\":10,\"content\":\"天同入限吉云訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273699867","endPageId":"7330176990273699867","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":235,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957767205","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"513\",\"lineNum\":0,\"lineType\":1,\"content\":\"人生二限值天同，喜氣盈門萬事荣。\",\"logicSentenceId\":\"7580338557232644148\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"514\",\"lineNum\":0,\"lineType\":1,\"content\":\"財禄増添宜創造，從今家道得豊隆。\",\"logicSentenceId\":\"7580338557232660532\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"515\",\"lineNum\":0,\"lineType\":1,\"content\":\"流年二限值天同，𨺻地湏防𢙣殺冲。\",\"logicSentenceId\":\"7580338557232676916\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"516\",\"lineNum\":0,\"lineType\":1,\"content\":\"作事羙中還未羙，惟防官破及家傾。\",\"logicSentenceId\":\"7580338557232693300\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273699867","endPageId":"7330176990273699867","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557232693300\",\"content\":\"做事虽好但仍有不足之处，要防备官司、破财以及家业倾颓。\"},{\"logicSentenceId\":\"7580338557232644148\",\"content\":\"人生在二限遇到天同星，喜气充满家门，万事繁荣。\"},{\"logicSentenceId\":\"7580338557232660532\",\"content\":\"财禄增加适宜去创造，从此家庭的礼仪和门风会变得隆盛。\"},{\"logicSentenceId\":\"7580338557232676916\",\"content\":\"流年和小限遇到天同星，若处于陷地则必须防备恶煞星冲克。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1266,"chapterOrder":14,"inChapterOrder":236,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957783589","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"517\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉貞属火，北斗化次桃花殺、囚星，為官禄主。\",\"logicSentenceId\":\"7580338557232709684\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"518\",\"lineNum\":0,\"lineType\":1,\"content\":\"為人身長躰壮，眼露神光，眉丰口大，喉骨亦露，性硬浮蕩，好忿争。\",\"logicSentenceId\":\"7580338557232726068\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"519\",\"lineNum\":0,\"lineType\":1,\"content\":\"入庙武職貴，遇府相、左右有威𫞐，禄存同冨貴。\",\"logicSentenceId\":\"7580338557232742452\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"520\",\"lineNum\":0,\"lineType\":1,\"content\":\"昌曲七殺立武功，與擎陀同是非，日有破軍、火鈴同，狗倖狼心。\",\"logicSentenceId\":\"7580338557232758836\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"521\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳亥𨺻宫，棄\",\"logicSentenceId\":\"7580338557232775220\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"522\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177074021285903\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"523\",\"lineNum\":0,\"lineType\":1,\"content\":\"祖、孤单、巧㙯、僧道、軍旅之流。\",\"logicSentenceId\":\"7580338557232775220\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"524\",\"lineNum\":0,\"lineType\":1,\"content\":\"六甲生人，命坐寅申者上格，丁巳人次之。\",\"logicSentenceId\":\"7580338557232791604\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"525\",\"lineNum\":0,\"lineType\":1,\"content\":\"六丙人坐子午卯酉宫，横發横破，不耐乆。\",\"logicSentenceId\":\"7580338557232807988\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"526\",\"lineNum\":0,\"lineType\":1,\"content\":\"六甲生人坐四墓宫，財官格。\",\"logicSentenceId\":\"7580338557232824372\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"527\",\"lineNum\":0,\"lineType\":1,\"content\":\"若丙戊生人，招非，有成敗。\",\"logicSentenceId\":\"7580338557232840756\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"528\",\"lineNum\":0,\"lineType\":1,\"content\":\"若與昌曲忌星同在巳亥宫，六丙生人有禍，六甲人亦不宜也。\",\"logicSentenceId\":\"7580338557232857140\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"529\",\"lineNum\":0,\"lineType\":1,\"content\":\"未申生人，在未申宫，化禄逢吉，冨貴必矣。\",\"logicSentenceId\":\"7580338557232873524\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"530\",\"lineNum\":0,\"lineType\":1,\"content\":\"若在諸宫逢羊陀火忌冲破，主残疾。\",\"logicSentenceId\":\"7580338557232889908\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273699867","endPageId":"7330177074021285903","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557232791604\",\"content\":\"六甲年出生的人，命宫落在寅位或申位的是上等命格，丁巳年出生的人稍次一些。\"},{\"logicSentenceId\":\"7580338557232873524\",\"content\":\"出生在未时或申时的人，命宫落在未宫或申宫，遇到化禄且逢吉星，必定富贵。\"},{\"logicSentenceId\":\"7580338557232775220\",\"content\":\"在巳亥宫处于陷地的情况下，命主会抛弃祖业、孤独无依，从事一些精巧的技艺工作，或者成为僧人道士、军人之类。\"},{\"logicSentenceId\":\"7580338557232807988\",\"content\":\"六丙年出生的人，命宫落在子午卯酉宫位，会突然发达又突然破败，难以长久保持。\"},{\"logicSentenceId\":\"7580338557232742452\",\"content\":\"廉贞星入庙时，主武职显贵，遇到天府星、天相星、左辅星、右弼星时会有威严和权势，与禄存星同宫则主富贵。\"},{\"logicSentenceId\":\"7580338557232758836\",\"content\":\"文昌、文曲与七杀同宫，能立武功；与擎羊、陀罗同宫，易生是非；与破军、火星、铃星同宫，便如狗般侥幸狼般狠毒。\"},{\"logicSentenceId\":\"7580338557232840756\",\"content\":\"如果是丙年或戊年出生的人，会招来是非，有成功也有失败。\"},{\"logicSentenceId\":\"7580338557232889908\",\"content\":\"如果在各个宫位遇到擎羊、陀罗、火星、忌星冲破，主人有残疾。\"},{\"logicSentenceId\":\"7580338557232709684\",\"content\":\"廉贞属火，在北斗星中化身为次要的桃花杀、囚星，是官禄的主星。\"},{\"logicSentenceId\":\"7580338557232726068\",\"content\":\"这个人身材高大、体格健壮，眼神炯炯有神，眉毛浓密、嘴巴宽大，喉结也很突出，性格强硬、举止轻浮，喜欢与人争吵。\"},{\"logicSentenceId\":\"7580338557232857140\",\"content\":\"如果与文昌、文曲及忌星同在巳亥宫，六丙年出生的人会有灾祸，六甲年出生的人也不合适。\"},{\"logicSentenceId\":\"7580338557232824372\",\"content\":\"六甲年出生的人，命宫落在四墓宫，属于有财有官的命格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":4621,"chapterOrder":14,"inChapterOrder":237,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957799973","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"531\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人三合吉拱，主封贈，雖𢙣殺冲，不為下局。\",\"logicSentenceId\":\"7580338557232906292\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"532\",\"lineNum\":0,\"lineType\":1,\"content\":\"若入庙逢化禄，剛烈机巧淸秀，旺夫益子，僧道有吉拱，有師號。\",\"logicSentenceId\":\"7580338557232922676\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"533\",\"lineNum\":0,\"lineType\":1,\"content\":\"此星最喜天相同，能化其𢙣。\",\"logicSentenceId\":\"7580338557232939060\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177074021285903","endPageId":"7330177074021285903","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557232906292\",\"content\":\"女子命局有三合吉星拱照，主能获得封赠，纵有凶煞冲克，也不算下等格局。\"},{\"logicSentenceId\":\"7580338557232922676\",\"content\":\"如果入庙又逢化禄，性格刚烈、心灵手巧且容貌清秀，能旺夫益子；若是僧道之人有吉星拱照，会有师号。\"},{\"logicSentenceId\":\"7580338557232939060\",\"content\":\"这颗星最喜欢与天相星同宫，能够化解它的凶煞。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1080,"chapterOrder":14,"inChapterOrder":238,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957816357","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"534\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午宫和平，天相同。\",\"logicSentenceId\":\"7580338557232955444\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"535\",\"lineNum\":0,\"lineType\":1,\"content\":\"丁巳甲生人，財官格。\",\"logicSentenceId\":\"7580338557232971828\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177074021285903","endPageId":"7330177074021285903","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557232971828\",\"content\":\"丁巳年和甲年出生的人，是财官的格局。\"},{\"logicSentenceId\":\"7580338557232955444\",\"content\":\"在子午宫时情况平和，与天相星同宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":562,"chapterOrder":14,"inChapterOrder":239,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957832741","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"536\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176990273781787\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"537\",\"lineNum\":0,\"lineType\":1,\"content\":\"卯酉宫和平。\",\"logicSentenceId\":\"7580338557232988212\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"538\",\"lineNum\":0,\"lineType\":1,\"content\":\"乙辛生人，癸生人，破軍同吉。\",\"logicSentenceId\":\"7580338557233004596\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273781787","endPageId":"7330176990273781787","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557233004596\",\"content\":\"乙年、辛年、癸年出生的人与破军星同宫则吉利。\"},{\"logicSentenceId\":\"7580338557232988212\",\"content\":\"卯酉宫的情况比较平和。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":673,"chapterOrder":14,"inChapterOrder":240,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957849125","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"539\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅宫和平。\",\"logicSentenceId\":\"7580338557233020980\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"540\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲庚巳生人為貴格。\",\"logicSentenceId\":\"7580338557233037364\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273781787","endPageId":"7330176990273781787","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557233037364\",\"content\":\"甲年、庚年、巳年出生的人是贵格。\"},{\"logicSentenceId\":\"7580338557233020980\",\"content\":\"在寅宫时情况平稳。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":514,"chapterOrder":14,"inChapterOrder":241,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957865509","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"541\",\"lineNum\":0,\"lineType\":1,\"content\":\"申宫入庙。\",\"logicSentenceId\":\"7580338557233053748\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"542\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲庚戊生人為貴格，丙生人次之。\",\"logicSentenceId\":\"7580338557233070132\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273781787","endPageId":"7330176990273781787","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557233053748\",\"content\":\"在申宫入庙。\"},{\"logicSentenceId\":\"7580338557233070132\",\"content\":\"甲年、庚年、戊年出生的人是贵格，丙年出生的人稍次一等。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":556,"chapterOrder":14,"inChapterOrder":242,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957881893","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"543\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑未宫利益，七殺同加吉星，財官格。\",\"logicSentenceId\":\"7580338557233086516\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273781787","endPageId":"7330176990273781787","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557233086516\",\"content\":\"丑未宫吉利，与七杀星同宫且加上吉星，属财官格局。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":337,"chapterOrder":14,"inChapterOrder":243,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957898277","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"544\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戌宫利益，天府同。\",\"logicSentenceId\":\"7580338557233102900\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"545\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲庚生人，財官格。\",\"logicSentenceId\":\"7580338557233119284\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273781787","endPageId":"7330176990273781787","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557233102900\",\"content\":\"在辰宫和戌宫有好处，与天府星同宫。\"},{\"logicSentenceId\":\"7580338557233119284\",\"content\":\"甲年、庚年出生的人，有财官格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":550,"chapterOrder":14,"inChapterOrder":244,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957914661","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"546\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳亥宫𨺻地，甲巳丙戊人，福不耐乆。\",\"logicSentenceId\":\"7580338557233135668\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273781787","endPageId":"7330176990273781787","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557233135668\",\"content\":\"在巳亥宫落陷，甲、巳、丙、戊年出生的人，福气不能长久。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":347,"chapterOrder":14,"inChapterOrder":245,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877957931045","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"547\",\"lineNum\":0,\"lineType\":10,\"content\":\"𤎉貞入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273781787","endPageId":"7330176990273781787","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":128,"chapterOrder":14,"inChapterOrder":246,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877961814054","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"548\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉貞守命亦非常，賦性巍巍志氣㓻。\",\"logicSentenceId\":\"7580338557233152052\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"549\",\"lineNum\":0,\"lineType\":1,\"content\":\"革故𪔂新冝大貴，為官淸顕姓名香。\",\"logicSentenceId\":\"7580338557233168436\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"550\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉貞坐命號閑宫，貪破擎羊火更冲。\",\"logicSentenceId\":\"7580338557233184820\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"551\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177074021449743\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"552\",\"lineNum\":0,\"lineType\":1,\"content\":\"縱有財官為不美，平生何以得從容。\",\"logicSentenceId\":\"7580338557233201204\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"553\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉貞落𨺻入閑宫，吉曜相逢也有㐫。\",\"logicSentenceId\":\"7580338557233217588\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"554\",\"lineNum\":0,\"lineType\":1,\"content\":\"腰足災残難脱免，更加𢙣殺命該終。\",\"logicSentenceId\":\"7580338557233233972\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273781787","endPageId":"7330177074021449743","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557233184820\",\"content\":\"廉贞星坐守命宫被称为闲宫，若再与贪狼、破军、擎羊、火星相遇则更有冲克。\"},{\"logicSentenceId\":\"7580338557233201204\",\"content\":\"即使拥有财官格局也不算好，一生怎么能过得从容自在呢。\"},{\"logicSentenceId\":\"7580338557233217588\",\"content\":\"廉贞星落入闲宫且处于陷地，即使吉星相遇也有凶险。\"},{\"logicSentenceId\":\"7580338557233233972\",\"content\":\"腰和脚会遭受灾祸伤残难以幸免，再加上遇到恶煞就命该终结了。\"},{\"logicSentenceId\":\"7580338557233152052\",\"content\":\"廉贞星坐守命宫也不寻常，其人天性高大威严、志气刚强。\"},{\"logicSentenceId\":\"7580338557233168436\",\"content\":\"革除旧制建立新制适宜获得大富贵，担任官职清正显赫名声传扬。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2047,"chapterOrder":14,"inChapterOrder":247,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877961846822","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"555\",\"lineNum\":0,\"lineType\":10,\"content\":\"𤎉貞入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177074021449743","endPageId":"7330177074021449743","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":128,"chapterOrder":14,"inChapterOrder":248,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877961863206","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"556\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人身命值𤎉貞，内政淸𤎉格局新。\",\"logicSentenceId\":\"7580338557233250356\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"557\",\"lineNum\":0,\"lineType\":1,\"content\":\"諸吉拱照無殺破，定教封贈在靑春。\",\"logicSentenceId\":\"7580338557233266740\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"558\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉貞貪破曲相逢，陀火交加極賤慵。\",\"logicSentenceId\":\"7580338557233283124\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"559\",\"lineNum\":0,\"lineType\":1,\"content\":\"定主刑夫并尅子，只好通房娼婢容。\",\"logicSentenceId\":\"7580338557233299508\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177074021449743","endPageId":"7330177074021449743","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557233266740\",\"content\":\"诸多吉星环绕照临，没有煞星冲破，必定能在年轻时获得封赠。\"},{\"logicSentenceId\":\"7580338557233283124\",\"content\":\"廉贞星与贪狼星、破军星、文昌星或文曲星相逢，陀罗星和火星交加，命主极为低贱慵懒。\"},{\"logicSentenceId\":\"7580338557233299508\",\"content\":\"必定会克夫克子，只能做通房丫鬟或娼妓。\"},{\"logicSentenceId\":\"7580338557233250356\",\"content\":\"女性的身宫或命宫中有廉贞星坐守，治理家中事务公正廉明，命格有新颖独特之处。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1330,"chapterOrder":14,"inChapterOrder":249,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158877961879590","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"560\",\"lineNum\":0,\"lineType\":10,\"content\":\"𤎉貞入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177074021449743","endPageId":"7330177074021449743","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":125,"chapterOrder":14,"inChapterOrder":250,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878339350538","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"561\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉貞入限旺宫臨，喜逢吉矅福駢臻。\",\"logicSentenceId\":\"7580338557233315892\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"562\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330176990273880091\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"563\",\"lineNum\":0,\"lineType\":1,\"content\":\"財物自然多蓄積，任人得意位高陞。\",\"logicSentenceId\":\"7580338557233332276\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"564\",\"lineNum\":0,\"lineType\":1,\"content\":\"大小二限遇𤎉貞。\",\"logicSentenceId\":\"7580338557233348660\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"565\",\"lineNum\":0,\"lineType\":1,\"content\":\"更有天刑忌刄侵。\",\"logicSentenceId\":\"7580338557233365044\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"566\",\"lineNum\":0,\"lineType\":1,\"content\":\"膿血刑災逃不得，破軍貪殺赴幽冥。\",\"logicSentenceId\":\"7580338557233381428\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177074021449743","endPageId":"7330176990273880091","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557233348660\",\"content\":\"大小二限遇到廉贞星。\"},{\"logicSentenceId\":\"7580338557233365044\",\"content\":\"还会有天刑星、忌星和刃星侵扰。\"},{\"logicSentenceId\":\"7580338557233381428\",\"content\":\"脓血之灾和刑罚之祸难以逃脱，要是遇到破军、贪狼，就会面临死亡的厄运。\"},{\"logicSentenceId\":\"7580338557233315892\",\"content\":\"廉贞星进入大运时处于旺宫，喜遇吉祥星曜，福气便会接连到来。\"},{\"logicSentenceId\":\"7580338557233332276\",\"content\":\"财富自然会不断积累增加，能够随心如意地升职、地位得到提升。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1608,"chapterOrder":14,"inChapterOrder":251,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878339366922","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"567\",\"lineNum\":0,\"lineType\":1,\"content\":\"天府圡，南斗，化令星，為財帛主。\",\"logicSentenceId\":\"7580338557233397812\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"568\",\"lineNum\":0,\"lineType\":1,\"content\":\"為人面方圓，容紅齒白，心性温和，聦明淸秀，學多机變，能觧一切厄。\",\"logicSentenceId\":\"7580338557233414196\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"569\",\"lineNum\":0,\"lineType\":1,\"content\":\"喜紫㣲、昌曲、左右、禄存、魁鉞、𫞐禄居庙旺，必中高第。\",\"logicSentenceId\":\"7580338557233430580\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"570\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀火鈴㑹合好詐。\",\"logicSentenceId\":\"7580338557233446964\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"571\",\"lineNum\":0,\"lineType\":1,\"content\":\"命坐寅午戌、亥卯未，六巳生人𫞐貴。\",\"logicSentenceId\":\"7580338557714169890\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"572\",\"lineNum\":0,\"lineType\":1,\"content\":\"若巳酉丑乙丙戊辛人文武財官格，加亥卯未、辰酉上安命者，甲庚人不貴，先大後小，有始無終。\",\"logicSentenceId\":\"7580338557714186274\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273880091","endPageId":"7330176990273880091","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557233446964\",\"content\":\"擎羊、陀罗、火星、铃星会合，其人好欺诈。\"},{\"logicSentenceId\":\"7580338557714169890\",\"content\":\"命宫位于寅、午、戌、亥、卯、未这几个宫位，六巳生人最为显贵。\"},{\"logicSentenceId\":\"7580338557714186274\",\"content\":\"如果出生年支是巳、酉、丑，出生年干是乙、丙、戊、辛的人，会形成文武财官格，再加上命宫落在亥卯未、辰酉宫，那么甲庚年出生者不显贵，运势先好后差，有始无终。\"},{\"logicSentenceId\":\"7580338557233397812\",\"content\":\"天府星属土，是南斗星，化为令星，作为财帛的主星。\"},{\"logicSentenceId\":\"7580338557233414196\",\"content\":\"这人脸呈方圆状，面容红润、牙齿洁白，心性温和，聪明且容貌清秀，学识丰富、机智善变，能化解一切厄运。\"},{\"logicSentenceId\":\"7580338557233430580\",\"content\":\"天府星喜欢紫微、文昌文曲、左辅右弼、禄存、天魁天钺、𫞐禄处于庙旺宫位，必定能在科举中取得优异成绩。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2308,"chapterOrder":14,"inChapterOrder":252,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878339383306","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"573\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命淸白机巧，旺夫貴子，遇紫㣲左右同垣，極羙，作命婦。\",\"logicSentenceId\":\"7580338557714202658\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330176990273880091","endPageId":"7330176990273880091","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557714202658\",\"content\":\"女性命格清纯自守、灵巧聪慧，能旺夫益子，若遇上紫微、左辅、右弼同处一宫，极其美好，可成为有封号的贵妇。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":448,"chapterOrder":14,"inChapterOrder":253,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878339399690","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"574\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177074021580815\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"575\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午宫旺地，武曲同丁巳癸生人為福財官格。\",\"logicSentenceId\":\"7580338557714219042\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177074021580815","endPageId":"7330177074021580815","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557714219042\",\"content\":\"在子午宫的旺地，武曲星与丁巳年、癸年出生的人形成福财官格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":478,"cha 4284578\",\"content\":\"甲年、庚年、壬年出生的人，为财官格。\"},{\"logicSentenceId\":\"7580338557714268194\",\"content\":\"在辰宫、戌宫处于入庙的状态，并且和廉贞星同宫。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":578,"chapterOrder":14,"inChapterOrder":257,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878339465226","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"580\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑未入庙，加吉星財官格。\",\"logicSentenceId\":\"7580338557714300962\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177074021580815","endPageId":"7330177074021580815","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557714300962\",\"content\":\"命宫在丑位或未位且处于入庙的状态，再加上有吉星，就是财官格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":340,"chapterOrder":14,"inChapterOrder":258,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878339481610","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"581\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳亥宫得地，乙丙戊辛生人財官格。\",\"logicSentenceId\":\"7580338557714317346\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177074021580815","endPageId":"7330177074021580815","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557714317346\",\"content\":\"巳亥宫处于得地的状态，乙、丙、戊、辛年出生的人有财官之格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":349,"chapterOrder":14,"inChapterOrder":259,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878339497994","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"582\",\"lineNum\":0,\"lineType\":10,\"content\":\"天府入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177074021580815","endPageId":"7330177074021580815","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOr "lineType\":1,\"content\":\"限臨天府能司禄，士庶逢之多發福，添財進喜𣱵無灾。\",\"logicSentenceId\":\"7580338557714448418\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"594\",\"lineNum\":0,\"lineType\":1,\"content\":\"且也潤身并潤屋。\",\"logicSentenceId\":\"7580338557714464802\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"595\",\"lineNum\":0,\"lineType\":1,\"content\":\"南斗尊星入限來，所為謀事稱心懐。\",\"logicSentenceId\":\"7580338557714481186\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"596\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177143739187200\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"597\",\"lineNum\":0,\"lineType\":1,\"content\":\"𠰥還又化科𫞐禄，指日欣然展大材。\",\"logicSentenceId\":\"7580338557714497570\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177093701009458","endPageId":"7330177143739187200","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557714464802\",\"content\":\"而且还能够让自身生活滋润、家中富足。\"},{\"logicSentenceId\":\"7580338557714481186\",\"content\":\"南斗的尊贵星宿进入运势，所谋划的事情都能称心如意。\"},{\"logicSentenceId\":\"7580338557714497570\",\"content\":\"如果还能化科权禄，很快就能愉快地施展大才。\"},{\"logicSentenceId\":\"7580338557714448418\",\"content\":\"大运走到天府星坐守的宫位时能够掌管福禄，普通人遇到这样的大运大多会福气旺盛，能够增加财富、收获喜事，永远不会遇到灾祸。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1444,"chapterOrder":14,"inChapterOrder":265,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878339596298","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"598\",\"lineNum\":0,\"lineType\":1,\"content\":\"太隂水而北斗化冨為母宿，又為妻星，為田宅主。\",\"logicSentenceId\":\"7580338557714513954\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"599\",\"lineNum\":0,\"lineType\":1,\"content\":\"太隂面方圓、心性温和淸秀、耿直聦明、花酒、文章愽學，橫立功名。\",\"logicSentenceId\":\"7580338557714530338\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"600\",\"lineNum\":0,\"lineType\":1,\"conten 0,\"textIndent\":false}","startPageId":"7330177143739187200","endPageId":"7330177143739187200","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557714694178\",\"content\":\"太阴星在卯、辰、巳这三个宫位处于陷地。\"},{\"logicSentenceId\":\"7580338557714710562\",\"content\":\"乙年、壬年、戊年出生的人，孤寡之命难以长久维持。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":584,"chapterOrder":14,"inChapterOrder":269,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712627210","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"611\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177093701107762\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"612\",\"lineNum\":0,\"lineType\":1,\"content\":\"午宫𨺻未，申宫利益。\",\"logicSentenceId\":\"7580338557714726946\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"613\",\"lineNum\":0,\"lineType\":1,\"content\":\"丁庚甲生人財官格。\",\"logicSentenceId\":\"7580338557714743330\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177093701107762","endPageId":"7330177093701107762","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557714726946\",\"content\":\"午宫在未位陷落，申宫则会有收益和好处。\"},{\"logicSentenceId\":\"7580338557714743330\",\"content\":\"丁年、庚年、甲年出生的人，会形成财官格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":689,"chapterOrder":14,"inChapterOrder":270,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712643594","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"614\",\"lineNum\":0,\"lineType\":1,\"content\":\"酉戌亥宫入庙。\",\"logicSentenceId\":\"7580338557714759714\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"615\",\"lineNum\":0,\"lineType\":1,\"content\":\"丙丁人財官格吉星衆大貴。\",\"logicSentenceId\":\"7580338557714776098\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177093701107762","endPageId":"7330177093701107762","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557714759714\",\"content\":\"在酉宫、戌宫、亥宫为入庙。\"},{\"logicSentenceId\":\"7580338557714776098\",\"content\":\"丙丁生人财官格，吉星众多，大贵。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":541,"chapterOrder":14,"inChapterOrder":271,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712659978","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"616\",\"lineNum\":0,\"lineType\":10,\"content\":\"太隂入男命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177093701107762","endPageId":"7330177093701107762","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":272,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712676362","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"617\",\"lineNum\":0,\"lineType\":1,\"content\":\"太隂原是水之精，身命逢之福自生。\",\"logicSentenceId\":\"7580338557714792482\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"618\",\"lineNum\":0,\"lineType\":1,\"content\":\"酉戌亥垣爲得地，光輝楊顕姓名亨。\",\"logicSentenceId\":\"7580338557714808866\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"619\",\"lineNum\":0,\"lineType\":1,\"content\":\"太隂入庙化𫞐星，清秀聦明邁等倫。\",\"logicSentenceId\":\"7580338557714825250\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"620\",\"lineNum\":0,\"lineType\":1,\"content\":\"禀性温良恭儉讓，為官淸顕列朝紳。\",\"logicSentenceId\":\"7580338557714841634\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"621\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅上機昌曲月逢，縱然吉拱不豊隆。\",\"logicSentenceId\":\"7580338557714858018\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"622\",\"lineNum\":0,\"lineType\":1,\"content\":\"男為僕從女為妓，加殺冲殺到老窮。\",\"logicSentenceId\":\"7580338557714874402\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"623\",\"lineNum\":0,\"lineType\":2,\"content\":\"申宫次之。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"624\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽𨺻地𢙣星冲，陀火相逢定困窮。\",\"logicSentenceId\":\"7580338557714890786\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"625\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177208310333474\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"626\",\"lineNum\":0,\"lineType\":1,\"content\":\"此命只冝僧與道，空門出入得從容。\",\"logicSentenceId\":\"7580338557714907170\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177093701107762","endPageId":"7330177208310333474","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557714907170\",\"content\":\"这种命格的人只适合出家做和尚或者道士，在寺庙道观中生活能过得从容自在。\"},{\"logicSentenceId\":\"7580338557714792482\",\"content\":\"太阴原本是水的精华，身宫和命宫遇到它福气自然产生。\"},{\"logicSentenceId\":\"7580338557714808866\",\"content\":\"在酉、戌、亥宫处于有利位置，能够声名显赫、运势亨通。\"},{\"logicSentenceId\":\"7580338557714825250\",\"content\":\"太阴星入庙化𫞐星，命主容貌清秀、聪明过人，远超同辈。\"},{\"logicSentenceId\":\"7580338557714841634\",\"content\":\"其本性温和善良、恭敬节俭、谦逊忍让，做官时清正显达，位列朝廷大臣。\"},{\"logicSentenceId\":\"7580338557714858018\",\"content\":\"太阴星在寅宫，与天机星、文昌星、文曲星相会，即使有吉星拱照，也不会有特别尊崇显达的礼数和地位。\"},{\"logicSentenceId\":\"7580338557714874402\",\"content\":\"男人会成为仆人，女人会沦为娼妓，若再加上煞星冲克，一生都会穷困潦倒。\"},{\"logicSentenceId\":\"7580338557714890786\",\"content\":\"太阳落陷时遭遇恶星冲犯，与陀罗星、火星相遇必定穷困潦倒。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":2847,"chapterOrder":14,"inChapterOrder":273,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712692746","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"627\",\"lineNum\":0,\"lineType\":10,\"content\":\"太隂入女命吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177208310333474","endPageId":"7330177208310333474","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":127,"chapterOrder":14,"inChapterOrder":274,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712709130","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"628\",\"lineNum\":0,\"lineType\":1,\"content\":\"月㑹同陽在命宫，三方吉拱必盈豊。\",\"logicSentenceId\":\"7580338557714923554\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"629\",\"lineNum\":0,\"lineType\":1,\"content\":\"不見㐫殺來冲㑹，冨貴雙全保到終。\",\"logicSentenceId\":\"7580338557714939938\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"630\",\"lineNum\":0,\"lineType\":1,\"content\":\"太隂𨺻在命和身，不喜三方𢙣殺侵。\",\"logicSentenceId\":\"7580338557714956322\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"631\",\"lineNum\":0,\"lineType\":1,\"content\":\"尅害夫君夀又殀，更虚血氣少精神。\",\"logicSentenceId\":\"7580338557714972706\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177208310333474","endPageId":"7330177208310333474","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557714923554\",\"content\":\"太阴星和太阳星同在命宫，并且三方宫位有吉星拱照，命主一定会富足且知礼守礼。\"},{\"logicSentenceId\":\"7580338557714939938\",\"content\":\"如果没有凶煞星来冲克会合，富贵双全保全直至生命尽头。\"},{\"logicSentenceId\":\"7580338557714956322\",\"content\":\"太阴星在命宫和身宫陷落时，不宜有三方恶煞侵袭。\"},{\"logicSentenceId\":\"7580338557714972706\",\"content\":\"伤害丈夫的寿命使其夭折，气血更虚弱精神不足。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1281,"chapterOrder":14,"inChapterOrder":275,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712725514","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"632\",\"lineNum\":0,\"lineType\":10,\"content\":\"太隂入限吉㐫訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177208310333474","endPageId":"7330177208310333474","contentEncryptType":0,"translateContent":"","chapterId":"1jvzooy7dkbhh","dataSize":124,"chapterOrder":14,"inChapterOrder":276,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712741898","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"633\",\"lineNum\":0,\"lineType\":1,\"content\":\"太隂星矅限中逢，財禄豊盈百事通。\",\"logicSentenceId\":\"7580338557714989090\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"634\",\"lineNum\":0,\"lineType\":1,\"content\":\"嫁娶親迎添嗣續，常人得此旺門風。\",\"logicSentenceId\":\"7580338557715005474\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"635\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限偏冝見太隂，添進財産福非輕。\",\"logicSentenceId\":\"7580338557715021858\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"636\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177093701173298\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"637\",\"lineNum\":0,\"lineType\":1,\"content\":\"火鈴若也來相凑，未免官災病患臨。\",\"logicSentenceId\":\"7580338557715038242\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"638\",\"lineNum\":0,\"lineType\":1,\"content\":\"限至太隂居反背，不喜羊陀三殺㑹，火鈴二限最為㐫，若不官災多破悔。\",\"logicSentenceId\":\"7580338557715054626\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177208310333474","endPageId":"7330177093701173298","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715005474\",\"content\":\"举行嫁娶迎亲之礼会增添子嗣，普通人遇到这种情况能使家族门风兴旺。\"},{\"logicSentenceId\":\"7580338557715021858\",\"content\":\"大运和小运遇到太阴星是非常合适的，会增添财产，福气也十分深厚。\"},{\"logicSentenceId\":\"7580338557715038242\",\"content\":\"如果火星、铃星也来相会，难免会有官司和疾病降临。\"},{\"logicSentenceId\":\"7580338557715054626\",\"content\":\"行运到太阴星处于反背状态时，不喜欢与擎羊、陀罗及三杀相会，火星、铃星这二限最为凶险，若没有官灾也会有很多破耗和悔恨。\"},{\"logicSentenceId\":\"7580338557714989090\",\"content\":\"太阴星在运限中遇到，财禄丰盈且礼数周全，百事亨通。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1861,"chapterOrder":14,"inChapterOrder":277,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712758282","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"639\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼水北斗化桃花殺。\",\"logicSentenceId\":\"7580338557715071010\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"640\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼入庙長聳肥胖，𨺻宫形小声高而量大，性格不常，心多計較，作事急速不耐静，作巧成拙，好賭賻花酒。\",\"logicSentenceId\":\"7580338557715087394\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"641\",\"lineNum\":0,\"lineType\":1,\"content\":\"𨺻地加羊陀、忌星，則孤貧、破相、殘疾，有班痕、疤痣。\",\"logicSentenceId\":\"7580338557715103778\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"642\",\"lineNum\":0,\"lineType\":1,\"content\":\"入庙多居武藝之中。\",\"logicSentenceId\":\"7580338557715120162\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"643\",\"lineNum\":0,\"lineType\":1,\"content\":\"遇火鈴，喜戊巳生人，合局垣；不喜六癸生人，不耐乆長。\",\"logicSentenceId\":\"7580338557715136546\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177093701173298","endPageId":"7330177093701173298","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715120162\",\"content\":\"贪狼星入庙，命主大多从事武艺相关的行业。\"},{\"logicSentenceId\":\"7580338557715136546\",\"content\":\"遇到火星、铃星，喜出生年天干为戊、己之人，能形成完整格局；不喜出生年天干为癸之人，运势不能长久。\"},{\"logicSentenceId\":\"7580338557715071010\",\"content\":\"贪狼星属水，是北斗星之一，化为桃花煞。\"},{\"logicSentenceId\":\"7580338557715087394\",\"content\":\"贪狼星落入庙旺的宫位时，对应的人身材高大魁梧、体型肥胖；贪狼星落入陷弱的宫位时，对应的人身材矮小、声音洪亮且气量很大，性格多变，心思多爱计较，做事风风火火、耐不住安静，弄巧成拙，喜欢赌博、花天酒地。\"},{\"logicSentenceId\":\"7580338557715103778\",\"content\":\"处于陷地再加上羊陀、忌星，就会孤独贫困、容貌受损、身体残疾，身上有斑痕、疤痣。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":1980,"chapterOrder":14,"inChapterOrder":278,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712774666","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"644\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命平常，若𨺻地，傷夫尅子，且不正大，多爲娼婢。\",\"logicSentenceId\":\"7580338557715152930\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"645\",\"lineNum\":0,\"lineType\":2,\"content\":\"僧道亦不絜。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177093701173298","endPageId":"7330177093701173298","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715152930\",\"content\":\"女性命盘平常，若处于陷地，会克伤丈夫和子女，而且为人不正派，大多会成为娼妓或婢女。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":498,"chapterOrder":14,"inChapterOrder":279,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712791050","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"646\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午宫旺地，丁巳生人福厚。\",\"logicSentenceId\":\"7580338557715169314\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"647\",\"lineNum\":0,\"lineType\":1,\"content\":\"丙戊庚生寅申人，下局。\",\"logicSentenceId\":\"7580338557715185698\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177093701173298","endPageId":"7330177093701173298","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715169314\",\"content\":\"子午宫是旺盛之地，丁巳年出生的人福泽深厚。\"},{\"logicSentenceId\":\"7580338557715185698\",\"content\":\"丙年、戊年、庚年出生，贪狼星在寅宫、申宫的人，命局是下等格局。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":625,"chapterOrder":14,"inChapterOrder":280,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712807434","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"648\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330177208310480930\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"649\",\"lineNum\":0,\"lineType\":1,\"content\":\"卯酉宫利益。\",\"logicSentenceId\":\"7580338557715202082\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"650\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫㣲同見火星貴。\",\"logicSentenceId\":\"7580338557715218466\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"651\",\"lineNum\":0,\"lineType\":1,\"content\":\"乙辛巳人冝之，財官格。\",\"logicSentenceId\":\"7580338557715234850\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177208310480930","endPageId":"7330177208310480930","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715218466\",\"content\":\"紫微星与火星一同出现，主人富贵。\"},{\"logicSentenceId\":\"7580338557715234850\",\"content\":\"乙年、辛年出生的巳时人适合这种情况，属于财官格局。\"},{\"logicSentenceId\":\"7580338557715202082\",\"content\":\"贪狼星在卯酉宫有利益。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":928,"chapterOrder":14,"inChapterOrder":281,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712823818","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"652\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅申宫和平。\",\"logicSentenceId\":\"7580338557715251234\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"653\",\"lineNum\":0,\"lineType\":1,\"content\":\"庚生人，財官格。\",\"logicSentenceId\":\"7580338557715267618\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177208310480930","endPageId":"7330177208310480930","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715267618\",\"content\":\"庚年出生的人，有财星和官星的格局。\"},{\"logicSentenceId\":\"7580338557715251234\",\"content\":\"贪狼星在寅申宫时情况较为平和。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":535,"chapterOrder":14,"inChapterOrder":282,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712840202","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"654\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑未宫入庙，武曲同見火星。\",\"logicSentenceId\":\"7580338557715284002\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"655\",\"lineNum\":0,\"lineType\":1,\"content\":\"戊巳庚生人，貴格。\",\"logicSentenceId\":\"7580338557715300386\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177208310480930","endPageId":"7330177208310480930","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715284002\",\"content\":\"在丑未宫入庙，武曲星和火星同宫。\"},{\"logicSentenceId\":\"7580338557715300386\",\"content\":\"戊年、巳年、庚年出生的人，是显贵的命格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":571,"chapterOrder":14,"inChapterOrder":283,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712856586","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"656\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戌入庙。\",\"logicSentenceId\":\"7580338557715316770\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"657\",\"lineNum\":0,\"lineType\":1,\"content\":\"戊己生人，財官格。\",\"logicSentenceId\":\"7580338557715333154\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177208310480930","endPageId":"7330177208310480930","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580338557715316770\",\"content\":\"在辰宫和戌宫处于入庙的状态。\"},{\"logicSentenceId\":\"7580338557715333154\",\"content\":\"戊年、己年出生的人，是财官格。\"}]}","chapterId":"1jvzooy7dkbhh","dataSize":526,"chapterOrder":14,"inChapterOrder":284,"volumeId":"7330176386001862710","volumeVersion":45},{"paragraphId":"7356158878712872970","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"658\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳亥宫𨺻地，𤎉貞同。\",\"logicSentenceId\":\"7580338557715349538\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"659\",\"lineNum\":0,\"lineType\":1,\"content\":\"丙戊壬生人，為福不耐乆。\",\"logicSentenceId\":\"7580338557715365922\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330177208310480930","endPageId":"7330177208310480930","contentEncryptType":0,"translateContent":"{\"se
