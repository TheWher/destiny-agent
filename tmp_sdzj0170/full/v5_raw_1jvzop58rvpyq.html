chapterOrder":28,"inChapterOrder":76,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891920736307","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"267\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳年太嵗所值吉㐫星：紫微、太陽、天同、天府、天梁、禄存，便断其年人財稱意，喜事重重。\",\"logicSentenceId\":\"7580381858358214697\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"268\",\"lineNum\":0,\"lineType\":1,\"content\":\"若遇武曲、𤎉貞、太隂、貪狼、巨門、天相、破軍忌星，便断其年人財損失，官災口舌，本身病患，减半論之。\",\"logicSentenceId\":\"7580381858358231081\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179395857940534","endPageId":"7330179395857940534","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358214697\",\"content\":\"巳年太岁所对应的吉凶星为：紫微、太阳、天同、天府、天梁、禄存，就可推断这一年人财两得、称心如意，喜事不断。\"},{\"logicSentenceId\":\"7580381858358231081\",\"content\":\"如果遇到武曲、廉贞、太阴、贪狼、巨门、天相、破军这些忌星，就可以推断这一年会有人财损失，会有官场灾祸、口舌是非，自身有病患，不过这些灾祸的程度会减半来论断。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1064,"chapterOrder":28,"inChapterOrder":77,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891920752691","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"269\",\"lineNum\":0,\"lineType\":1,\"content\":\"午年太嵗併小限到午宫，入庙化吉。\",\"logicSentenceId\":\"7580381858358247465\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"270\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微\",\"logicSentenceId\":\"7580381858358263849\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"271\",\"lineNum\":0,\"lineType\":2,\"content\":\"太陽武。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"272\",\"lineNum\":0,\"lineType\":1,\"content\":\"曲、天同、天梁、㢘貞、七殺、破軍。\",\"logicSentenceId\":\"7580381858358263849\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"273\",\"lineNum\":0,\"lineType\":1,\"content\":\"丁已、甲癸生人進財遂心。\",\"logicSentenceId\":\"7580381858358280233\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179395857940534","endPageId":"7330179395857940534","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358247465\",\"content\":\"午年的太岁和小限到了午宫，进入庙旺状态而化为吉祥。\"},{\"logicSentenceId\":\"7580381858358263849\",\"content\":\"紫微曲、天同、天梁、廉贞、七杀、破军。\"},{\"logicSentenceId\":\"7580381858358280233\",\"content\":\"丁巳年、甲年和癸年出生的人进财顺遂心意。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1103,"chapterOrder":28,"inChapterOrder":78,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891920769075","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"274\",\"lineNum\":0,\"lineType\":1,\"content\":\"午年太歲併小限到午宫，不入庙化㐫。\",\"logicSentenceId\":\"7580381858358296617\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"275\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼在午，丙壬癸生人破財，官災口舌。\",\"logicSentenceId\":\"7580381858358313001\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179395857940534","endPageId":"7330179395857940534","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358296617\",\"content\":\"午年太岁和小限到午宫，不在庙旺位置就会化为凶象。\"},{\"logicSentenceId\":\"7580381858358313001\",\"content\":\"贪狼星在午宫，丙年、壬年、癸年出生的人会破财，会有官灾和口舌。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":667,"chapterOrder":28,"inChapterOrder":79,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970789426","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"276\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179441789878306\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"277\",\"lineNum\":0,\"lineType\":1,\"content\":\"午年太嵗所值吉㐫星：紫微、天府、天機、太陽、武曲、𤎉貞、天相、巨門、天鿄、破軍、祿存，使断其年人財興旺，婚姻喜事重見。\",\"logicSentenceId\":\"7580381858358329385\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"278\",\"lineNum\":0,\"lineType\":1,\"content\":\"若值太隂、貪狼、天同、羊陀忌星，便断其年人財破敗，官災、口舌，孝服本身灾見可免。\",\"logicSentenceId\":\"7580381858358345769\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179441789878306","endPageId":"7330179441789878306","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358329385\",\"content\":\"午年太岁所对应的吉凶星有：紫微、天府、天机、太阳、武曲、廉贞、天相、巨门、天鿄、破军、禄存，据此可判断这一年人财兴旺，婚姻喜事再度出现。\"},{\"logicSentenceId\":\"7580381858358345769\",\"content\":\"若遇到太阴、贪狼、天同、羊陀等忌星，便可推断该年人丁与财物皆遭破败，官非纠纷、口舌之争难免，但守孝丧服与自身灾祸或可幸免。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1199,"chapterOrder":28,"inChapterOrder":80,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970805810","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"279\",\"lineNum\":0,\"lineType\":1,\"content\":\"未年太歲併小限到未宫，入庙化吉。\",\"logicSentenceId\":\"7580381858358362153\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"280\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微、天機、天府、天相、天梁、壬乙生人發福，太隂庚壬人發福生財。\",\"logicSentenceId\":\"7580381858358378537\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179441789878306","endPageId":"7330179441789878306","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358362153\",\"content\":\"未年的太岁和小限到达未宫，入庙化为吉祥。\"},{\"logicSentenceId\":\"7580381858358378537\",\"content\":\"遇到紫微、天机、天府、天相、天梁这些星，出生年天干为壬、乙的人会福气降临，遇到太阴星，出生年天干为庚、壬的人会福气降临并且发财。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":793,"chapterOrder":28,"inChapterOrder":81,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970822194","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"281\",\"lineNum\":0,\"lineType\":1,\"content\":\"未年太嵗併小限到未宫，不入庙化㐫。\",\"logicSentenceId\":\"7580381858358394921\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"282\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽甲乙生人多灾悔，天同、丁庚生人多灾。\",\"logicSentenceId\":\"7580381858358411305\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"283\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179395858038838\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"284\",\"lineNum\":0,\"lineType\":1,\"content\":\"武曲壬癸生人生災，招官非横禍。\",\"logicSentenceId\":\"7580381858358427689\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179441789878306","endPageId":"7330179395858038838","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358394921\",\"content\":\"未年太岁和小限运行到未宫，若不在庙旺状态则会化为凶象。\"},{\"logicSentenceId\":\"7580381858358411305\",\"content\":\"太阳星照临时，甲年或乙年出生的人会有很多灾祸和悔恨；天同星照临时，丁年或庚年出生的人会有很多灾祸。\"},{\"logicSentenceId\":\"7580381858358427689\",\"content\":\"遇到武曲星且出生年份天干是壬、癸的人会遭遇灾祸，招来官司和飞来横祸。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1183,"chapterOrder":28,"inChapterOrder":82,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970838578","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"285\",\"lineNum\":0,\"lineType\":1,\"content\":\"未年太嵗所值吉㐫星：紫微、天府、𤎉貞、天機、破軍、天相，便断其年人財増益，作事如意，婚如産育之喜。\",\"logicSentenceId\":\"7580381858358444073\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"286\",\"lineNum\":0,\"lineType\":1,\"content\":\"若遇太隂、太陽、武曲、天同、貪狼、巨門、擎陀忌宿，便断其年人財耗散，孝服官災，隂人小口不寧，本身灾厄。\",\"logicSentenceId\":\"7580381858358460457\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179395858038838","endPageId":"7330179395858038838","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358460457\",\"content\":\"若遇到太阴、太阳、武曲、天同、贪狼、巨门、擎羊、陀罗等忌星，便可推断这一年人财耗散，有丧孝之事和官讼之灾，家中女性和小孩不得安宁，自身也有灾厄。\"},{\"logicSentenceId\":\"7580381858358444073\",\"content\":\"未年太岁所值的吉凶星有：紫微、天府、廉贞、天机、破军、天相，便推断这一年里人丁和财物都会增加，做事如意，有婚姻和生育的喜事。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1100,"chapterOrder":28,"inChapterOrder":83,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970854962","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"287\",\"lineNum\":0,\"lineType\":1,\"content\":\"申年太嵗併小限到申宫，入庙化吉。\",\"logicSentenceId\":\"7580381858358476841\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"288\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉貞、破軍。\",\"logicSentenceId\":\"7580381858358493225\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"289\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微甲庚、癸生人發福，天機丁、甲癸生人發福，庚生人亦發財福。\",\"logicSentenceId\":\"7580381858358509609\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"290\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門、甲癸庚辛人發福。\",\"logicSentenceId\":\"7580381858358525993\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179395858038838","endPageId":"7330179395858038838","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358525993\",\"content\":\"巨门星，甲、癸、庚、辛年出生的人会获得福运。\"},{\"logicSentenceId\":\"7580381858358476841\",\"content\":\"申年太岁和小限到申宫，进入庙旺状态而化为吉祥。\"},{\"logicSentenceId\":\"7580381858358493225\",\"content\":\"廉贞、破军。\"},{\"logicSentenceId\":\"7580381858358509609\",\"content\":\"紫微星下，甲年、庚年或癸年出生的人会获得福气；天机星下，丁年、甲年或癸年出生的人会获得福气；庚年出生的人也会获得财富和福气。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1292,"chapterOrder":28,"inChapterOrder":84,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970871346","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"291\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179441790025762\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"292\",\"lineNum\":0,\"lineType\":1,\"content\":\"申年太嵗併小限到申，不入庙化㐫。\",\"logicSentenceId\":\"7580381858358542377\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"293\",\"lineNum\":0,\"lineType\":1,\"content\":\"天機乙戊生人災悔，巨門、丁生人不冝。\",\"logicSentenceId\":\"7580381858358558761\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"294\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉貞丙壬生人有災。\",\"logicSentenceId\":\"7580381858358575145\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"295\",\"lineNum\":0,\"lineType\":1,\"content\":\"天同甲庚生人灾禍，貪狼癸丙生人有灾禍。\",\"logicSentenceId\":\"7580381858358591529\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179441790025762","endPageId":"7330179441790025762","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358558761\",\"content\":\"对于乙年、戊年出生的人，遇到天机星就会有灾祸和悔恨之事；对于丁年出生的人，遇到巨门星会诸事不宜。\"},{\"logicSentenceId\":\"7580381858358575145\",\"content\":\"丙年和壬年出生的人遇到廉贞星会有灾祸。\"},{\"logicSentenceId\":\"7580381858358591529\",\"content\":\"天同，甲年、庚年出生的人有灾祸；贪狼，癸年、丙年出生的人有灾祸。\"},{\"logicSentenceId\":\"7580381858358542377\",\"content\":\"申年太岁和小限同时到达申宫，若星辰不入庙就会化为凶象。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1445,"chapterOrder":28,"inChapterOrder":85,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970887730","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"296\",\"lineNum\":0,\"lineType\":1,\"content\":\"申年太嵗所值吉㐫星：紫微太陽𤎉貞、天府、巨門、七殺、文昌、武曲禄存便断，其年人財利益，喜事重重。\",\"logicSentenceId\":\"7580381858358607913\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"297\",\"lineNum\":0,\"lineType\":1,\"content\":\"若遇天機、天同、天梁、天相、太隂、破軍忌宿便断，其年人財散失，官非、孝服災病。\",\"logicSentenceId\":\"7580381858358624297\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179441790025762","endPageId":"7330179441790025762","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358607913\",\"content\":\"申年太岁所值吉凶星为：紫微、太阳、廉贞、天府、巨门、七杀、文昌、武曲、禄存，据此可推断，这一年在人丁和钱财方面都会有利益，喜事不断。\"},{\"logicSentenceId\":\"7580381858358624297\",\"content\":\"如果遇到天机、天同、天梁、天相、太阴、破军这些忌星，就可以推断，这一年人财散失，有官司、丧事、灾祸和疾病。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1016,"chapterOrder":28,"inChapterOrder":86,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970904114","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"298\",\"lineNum\":0,\"lineType\":1,\"content\":\"酉年太嵗併小限到酉，入庙化吉。\",\"logicSentenceId\":\"7580381858358640681\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"299\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微天機太隂在酉守命，丙戊、乙、辛生人，進財吉利。\",\"logicSentenceId\":\"7580381858358657065\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"300\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179395858137142\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"301\",\"lineNum\":0,\"lineType\":1,\"content\":\"酉年太嵗併小限到酉宫，不入庙化㐫。\",\"logicSentenceId\":\"7580381858358673449\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"302\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽、天同，甲乙生人，不冝武曲，庚壬生人，不宜𤎉貞，甲庚、丙生人，不冝天府，甲庚壬生人，不宜天相，甲庚生人，不宜。\",\"logicSentenceId\":\"7580381858358689833\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179441790025762","endPageId":"7330179395858137142","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358673449\",\"content\":\"酉年太岁和小限到达酉宫，如果星曜不入庙就会化为凶象。\"},{\"logicSentenceId\":\"7580381858358689833\",\"content\":\"太阳、天同，甲年、乙年出生的人，不宜武曲星；庚年、壬年出生的人，不宜廉贞星；甲年、庚年、丙年出生的人，不宜天府星；甲年、庚年、壬年出生的人，不宜天相星；甲年、庚年出生的人，不宜。\"},{\"logicSentenceId\":\"7580381858358640681\",\"content\":\"酉年太岁和小限都运行到酉位，入庙后转化为吉利。\"},{\"logicSentenceId\":\"7580381858358657065\",\"content\":\"紫微、天机、太阴在酉宫坐守命宫，丙、戊、乙、辛年出生的人，进财吉利。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1739,"chapterOrder":28,"inChapterOrder":87,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970920498","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"303\",\"lineNum\":0,\"lineType\":1,\"content\":\"酉年太嵗所值吉㐫星：祿存、太隂、紫微、天府、昌曲、左右，便断其年人財興旺，作事遂心。\",\"logicSentenceId\":\"7580381858358706217\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"304\",\"lineNum\":0,\"lineType\":1,\"content\":\"若值天机、巨門、武曲、𤎉貞、擎羊、陀、忌，便断其年人離財散、口舌官災。\",\"logicSentenceId\":\"7580381858358722601\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179395858137142","endPageId":"7330179395858137142","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358722601\",\"content\":\"如果遇到天机、巨门、武曲、廉贞、擎羊、陀罗、忌，就推断这一年会人离财散、有口舌是非和官司灾祸。\"},{\"logicSentenceId\":\"7580381858358706217\",\"content\":\"酉年太岁所值遇的吉凶星：禄存、太阴、紫微、天府、文昌和文曲、左辅和右弼，就可以推断这一年人丁兴旺、钱财充裕，做事情也能顺心如意。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":962,"chapterOrder":28,"inChapterOrder":88,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970936882","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"305\",\"lineNum\":0,\"lineType\":1,\"content\":\"戍年太嵗併小限到戍宫，入庙化吉。\",\"logicSentenceId\":\"7580381858358738985\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"306\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微壬甲、丁巳生人進財，\",\"logicSentenceId\":\"7580381858358755369\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"307\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179514749763618\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"308\",\"lineNum\":0,\"lineType\":2,\"content\":\"天机甲\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"309\",\"lineNum\":0,\"lineType\":1,\"content\":\"乙丁巳生人發福。\",\"logicSentenceId\":\"7580381858358755369\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"310\",\"lineNum\":0,\"lineType\":1,\"content\":\"武曲丁已甲庚生人吉慶。\",\"logicSentenceId\":\"7580381858358771753\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"311\",\"lineNum\":0,\"lineType\":1,\"content\":\"天同、亷貞、破軍、七殺，丁、己、甲生人發財。\",\"logicSentenceId\":\"7580381858358788137\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"312\",\"lineNum\":0,\"lineType\":1,\"content\":\"太隂丁、己生人吉慶。\",\"logicSentenceId\":\"7580381858358804521\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"313\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門丁、己、辛、癸生人發福。\",\"logicSentenceId\":\"7580381858358820905\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"314\",\"lineNum\":0,\"lineType\":1,\"content\":\"戍年太嵗併小限，不入庙化㐫。\",\"logicSentenceId\":\"7580381858358837289\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"315\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼，癸生人不冝；天同，庚生人不冝；天機，戍生人不冝；巨門，丁生人不宜；太陽，甲生人不冝；𤎉貞，丙生人不宜；武曲，壬生人不冝。\",\"logicSentenceId\":\"7580381858358853673\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179395858137142","endPageId":"7330179514749763618","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358853673\",\"content\":\"贪狼，癸年出生的人不宜；天同，庚年出生的人不宜；天机，戍年出生的人不宜；巨门，丁年出生的人不宜；太阳，甲年出生的人不宜；廉贞，丙年出生的人不宜；武曲，壬年出生的人不宜。\"},{\"logicSentenceId\":\"7580381858358738985\",\"content\":\"戌年太岁与小限同时到达戌宫，进入庙旺状态则化为吉利之事。\"},{\"logicSentenceId\":\"7580381858358755369\",\"content\":\"在紫微星影响下，壬年、甲年生人以及丁巳年生人能够获得财富，乙年生人和丁巳年生人能够获得福气。\"},{\"logicSentenceId\":\"7580381858358771753\",\"content\":\"丁巳年、甲年、庚年出生的人遇到武曲星会有吉庆之事。\"},{\"logicSentenceId\":\"7580381858358788137\",\"content\":\"天同、廉贞、破军、七杀这几种星宿，对于年干为丁、己或甲的人来说会发财。\"},{\"logicSentenceId\":\"7580381858358804521\",\"content\":\"太阴星，丁年、己年出生的人有吉庆之事。\"},{\"logicSentenceId\":\"7580381858358820905\",\"content\":\"丁、己、辛、癸年出生的人，命遇巨门星会福运降临。\"},{\"logicSentenceId\":\"7580381858358837289\",\"content\":\"戌年太岁和小限，若不入庙则化为凶兆。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":3147,"chapterOrder":28,"inChapterOrder":89,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970953266","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"316\",\"lineNum\":0,\"lineType\":1,\"content\":\"戍年太𡻕所值吉㐫星：天機、太隂、天梁、天府、武曲、七殺、貪犯左右、天同便断，其年\",\"logicSentenceId\":\"7580381858358870057\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"317\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179395858235446\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"318\",\"lineNum\":0,\"lineType\":1,\"content\":\"人財利益，作事遂心，家道興隆。\",\"logicSentenceId\":\"7580381858358870057\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"319\",\"lineNum\":0,\"lineType\":1,\"content\":\"如遇巨門、太陽、破軍、紫㣲、天相忌宿便断，其年人財退失，孝服官災，本身見病，减半論之。\",\"logicSentenceId\":\"7580381858358886441\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179514749763618","endPageId":"7330179395858235446","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358886441\",\"content\":\"如果遇到巨门、太阳、破军、紫微、天相这些忌星，就可推断那一年人丁财产损失，会有丧事、官司之灾，自身生病，应减半论断。\"},{\"logicSentenceId\":\"7580381858358870057\",\"content\":\"戍年太岁所值吉凶星：天机、太阴、天梁、天府、武曲、七杀、贪狼左右、天同，据此推断，这一年会收获人丁和财富，做事能称心如意，家道兴旺。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1289,"chapterOrder":28,"inChapterOrder":90,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970969650","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"320\",\"lineNum\":0,\"lineType\":1,\"content\":\"亥年太嵗併小限到亥宫，入庙化吉。\",\"logicSentenceId\":\"7580381858358902825\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"321\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫㣲天同、巨門、天梁，壬癸戊生人，天機、壬生人吉羙。\",\"logicSentenceId\":\"7580381858358919209\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"322\",\"lineNum\":0,\"lineType\":1,\"content\":\"太隂戊巳生人，財官雙羙；天相丁巳生人，及丙戌生人發福。\",\"logicSentenceId\":\"7580381858358935593\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179395858235446","endPageId":"7330179395858235446","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358935593\",\"content\":\"太阴星照命，戊年或巳年出生的人，财路和官运都很美好；天相星照命，丁巳年出生的人以及丙戌年出生的人，会福运亨通。\"},{\"logicSentenceId\":\"7580381858358902825\",\"content\":\"亥年的太岁和小限到了亥宫，进入庙旺状态化为吉祥。\"},{\"logicSentenceId\":\"7580381858358919209\",\"content\":\"紫微、天同、巨门、天梁这些星宿，壬、癸或戊年出生的人吉利；天机星，壬年出生的人非常美好。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1156,"chapterOrder":28,"inChapterOrder":91,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891970986034","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"323\",\"lineNum\":0,\"lineType\":1,\"content\":\"亥年太歳併小限到亥宫，不入庙化㐫。\",\"logicSentenceId\":\"7580381858358951977\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"324\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽，甲生人不宜；武曲，壬丙生人不宜；𤎉貞，丙壬癸生人不宜。\",\"logicSentenceId\":\"7580381858358968361\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179395858235446","endPageId":"7330179395858235446","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358968361\",\"content\":\"太阳，甲年出生的人运势不佳；武曲，壬年、丙年出生的人运势不佳；廉贞，丙年、壬年、癸年出生的人运势不佳。\"},{\"logicSentenceId\":\"7580381858358951977\",\"content\":\"亥年太岁与小限同至亥宫，若不入庙则转为凶兆。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":758,"chapterOrder":28,"inChapterOrder":92,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891971002418","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"325\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179514749927458\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"326\",\"lineNum\":0,\"lineType\":1,\"content\":\"亥年太歲所值吉㐫星，天同太隂、天梁、紫㣲、天府、昌曲禄存，使断其年，人財進益，喜氣重重，謀事俱稱心懷。\",\"logicSentenceId\":\"7580381858358984745\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"327\",\"lineNum\":0,\"lineType\":1,\"content\":\"若遇貪狼、𤎉貞、破軍七殺，便断其年，人財耗散，小口死亡，本身灾悔。\",\"logicSentenceId\":\"7580381858359001129\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"328\",\"lineNum\":0,\"lineType\":1,\"content\":\"論諸星同位垣，各司所冝分别冨貴貧賤夭夀。\",\"logicSentenceId\":\"7580381858359017513\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179514749927458","endPageId":"7330179514749927458","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858358984745\",\"content\":\"亥年太岁所对应的吉凶星有天同、太阴、天梁、紫微、天府、文昌、文曲、禄存，据此推断这一年，人丁和财气都会增长，喜事连连，谋划事情都能称心如意。\"},{\"logicSentenceId\":\"7580381858359001129\",\"content\":\"如果遇到贪狼、廉贞、破军、七杀这些星，就可推断这一年，会出现钱财损耗、人口离散的情况，家中小孩会死亡，自身也会遭遇灾祸和悔恨。\"},{\"logicSentenceId\":\"7580381858359017513\",\"content\":\"论各星同在一个宫垣时，各自依据适宜的情况来区分人的富贵、贫贱、夭折、长寿。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1520,"chapterOrder":28,"inChapterOrder":93,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891971018802","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"329\",\"lineNum\":0,\"lineType\":10,\"content\":\"紫㣲\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179514749927458","endPageId":"7330179514749927458","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":109,"chapterOrder":28,"inChapterOrder":94,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891971035186","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"330\",\"lineNum\":0,\"lineType\":1,\"content\":\"庙\",\"logicSentenceId\":\"7580381858359033897\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"331\",\"lineNum\":0,\"lineType\":2,\"content\":\"寅午丑未旺申亥卯巳平子。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"332\",\"lineNum\":0,\"lineType\":1,\"content\":\"無𨺻\",\"logicSentenceId\":\"7580381858359033897\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179514749927458", tent\":\"紫㣲天府，全依輔弼之功。紫府得輔弼同垣，及三方拱照嘉會，終身富貴。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179520625950783","endPageId":"7330179520625950783","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":201,"chapterOrder":28,"inChapterOrder":100,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158892578979877","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"344\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫府同宫無殺凑，甲人享福終身。\",\"logicSentenceId\":\"7580381858359132201\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"345\",\"lineNum\":0,\"lineType\":2,\"content\":\"紫府同在寅申宫，守命，六甲人冨貴。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179520625950783","endPageId":"7330179520625950783","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858359132201\",\"content\":\"紫微星和天府星同在一宫且没有煞星汇聚，甲年出生的人终身享福。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":470,"chapterOrder":28,"inChapterOrder":101,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158892578996261","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"346\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫府朝垣活禄逢，終身福厚至三公。\",\"logicSentenceId\":\"7580381858359148585\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"347\",\"lineNum\":0,\"lineType\":2,\"content\":\"命坐寅申，𠕂加吉星，妙。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179520625950783","endPageId":"7330179520625950783","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858359148585\",\"content\":\"紫微星和天府星朝拱垣局又遇到活禄星，一生福泽深厚能官至三公。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":459,"chapterOrder":28,"inChapterOrder":102,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158892579012645","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"348\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫府同臨巳亥，一朝冨貴雙全，\",\"logicSentenceId\":\"7580381858359164969\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"349\",\"lineNum\":0,\"lineType\":2,\"content\":\"紫府曰月。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"350\",\"lineNum\":0,\"lineType\":1,\"content\":\"居旺地，必定出仕公卿噐。\",\"logicSentenceId\":\"7580381858359164969\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"351\",\"lineNum\":0,\"lineType\":2,\"content\":\"紫午府丑無殺，加又化禄是也。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179520625950783","endPageId":"7330179520625950783","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858359164969\",\"content\":\"紫微星和天府星同时出现在巳宫或亥宫，一旦时来运转便能富贵双全，若处于旺地，必定能入朝为官成为公卿之才。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":750,"chapterOrder":28,"inChapterOrder":103,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158892579029029","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"352\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫府武曲臨財宅，更𠔥權禄冨奢翁得左右禄存，亦可\",\"logicSentenceId\":\"7580381858359181353\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"353\",\"lineNum\":0,\"lineType\":2,\"content\":\"紫㣲輔弼，同宫一呼。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"354\",\"lineNum\":0,\"lineType\":1,\"content\":\"百諾居上品。\",\"logicSentenceId\":\"7580381858359181353\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"355\",\"lineNum\":0,\"lineType\":2,\"content\":\"或在三方為次吉，在財帛宫，為財賦之官。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179520625950783","endPageId":"7330179520625950783","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858359181353\",\"content\":\"紫微星、天府星、武曲星降临财帛宫和田宅宫，再加上化权星、化禄星照临，则会成为富贵奢侈的人。若再加上左辅星、右弼星、禄存星，也能百事顺遂，处于上等命格。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":862,"chapterOrder":28,"inChapterOrder":104,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158892579045413","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"356\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫府擎羊在巨啇。\",\"logicSentenceId\":\"7580381858359197737\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"357\",\"lineNum\":0,\"lineType\":2,\"content\":\"得武曲居，遷移者多。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179520625950783","endPageId":"7330179520625950783","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858359197737\",\"content\":\"紫微、天府和擎羊星在巨门宫位。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":383,"chapterOrder":28,"inChapterOrder":105,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158892579061797","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"358\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫府夾命為貴格。\",\"logicSentenceId\":\"7580381858359214121\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179520625950783","endPageId":"7330179520625950783","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381858359214121\",\"content\":\"紫微天府夹命宫是高贵的格局。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":280,"chapterOrder":28,"inChapterOrder":106,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158892579078181","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"359\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179586388426792\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"360\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫禄同宫，日月照，貴不可言。\",\"logicSenten ":"1jvzop58rvpyq","dataSize":340,"chapterOrder":28,"inChapterOrder":389,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897704402954","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"880\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179986214830134\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"881\",\"lineNum\":0,\"lineType\":1,\"content\":\"生處刼空，猶如半天折趐；\",\"logicSentenceId\":\"7580381859319316543\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179986214830134","endPageId":"7330179986214830134","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319316543\",\"content\":\"出生时遇到劫空，就像鸟在半空中折断了翅膀。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":430,"chapterOrder":28,"inChapterOrder":390,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897704435722","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"882\",\"lineNum\":0,\"lineType\":1,\"content\":\"刼空臨財福之鄉，生來貧賤。\",\"logicSentenceId\":\"7580381859319332927\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179986214830134","endPageId":"7330179986214830134","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319332927\",\"content\":\"劫煞和空亡出现在财帛宫和福德宫的人，生来贫贱。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":322,"chapterOrder":28,"inChapterOrder":391,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897704452106","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"883\",\"lineNum\":0,\"lineType\":10,\"content\":\"傷使\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179986214830134","endPageId":"7330179986214830134","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":109,"chapterOrder":28,"inChapterOrder":392,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897704468490","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"884\",\"lineNum\":0,\"lineType\":1,\"content\":\"天傷加惡曜，仲尼絶粮鄧通亡。\",\"logicSentenceId\":\"7580381859319349311\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179986214830134","endPageId":"7330179986214830134","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319349311\",\"content\":\"天伤星加恶曜，孔子绝粮，邓通亡身。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":307,"chapterOrder":28,"inChapterOrder":393,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897704484874","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"885\",\"lineNum\":0,\"lineType\":10,\"content\":\"命宫\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179986214830134","endPageId":"7330179986214830134","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":109,"chapterOrder":28,"inChapterOrder":394,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897704501258","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"886\",\"lineNum\":0,\"lineType\":2,\"content\":\"三夾命㐫，六夾吉。三夾是刼空、火鈴、羊陀是也。六夾是紫府左右昌、曲、魁、鉞、科、權、禄、日月命是㐫多吉少，雖吉也在也㐫，吉多㐫少。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"887\",\"lineNum\":0,\"lineType\":1,\"content\":\"雖㐫也吉，身命三方，仍看庙旺。\",\"logicSentenceId\":\"7580381859319365695\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179986214830134","endPageId":"7330179986214830134","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319365695\",\"content\":\"虽然看似凶险但也有吉利之处，身宫、命宫及三方，仍需看星曜是否处于庙旺状态。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":635,"chapterOrder":28,"inChapterOrder":395,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897704517642","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"888\",\"lineNum\":0,\"lineType\":1,\"content\":\"命無正曜，二姓延生。\",\"logicSentenceId\":\"7580381859319382079\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"889\",\"lineNum\":0,\"lineType\":2,\"content\":\"或過房出維，隨母継拜入贅，或又是庶毋所生者\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179986214830134","endPageId":"7330179986214830134","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319382079\",\"content\":\"命盘中没有正曜星，会过继给其他姓氏延续香火。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":443,"chapterOrder":28,"inChapterOrder":396,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897704534026","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"890\",\"lineNum\":0,\"lineType\":2,\"content\":\"命逢吉曜，松靑柏秀以難凋。身命官有吉星，太嵗大小二限不利，未為㐫。必太逢嵗二㐫，又且本限生\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"891\",\"lineNum\":0,\"lineType\":1,\"content\":\"人所忌方㐫\",\"logicSentenceId\":\"7580381859319398463\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179986214830134","endPageId":"7330179986214830134","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319398463\",\"content\":\"人们所忌讳的地方就会有凶险。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":476,"chapterOrder":28,"inChapterOrder":397,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897704550410","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"892\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330180076795052066\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"893\",\"lineNum\":0,\"lineType\":1,\"content\":\"限逢㐫曜，柳縁桃紅而易謝。\",\"logicSentenceId\":\"7580381859319414847\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"894\",\"lineNum\":0,\"lineType\":2,\"content\":\"命逢㐫限，庙旺猶發逹，限㐫星陥，必㐫\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330180076795052066","endPageId":"7330180076795052066","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319414847\",\"content\":\"命限逢凶星，就像柳绿桃红容易凋谢。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":545,"chapterOrder":28,"inChapterOrder":398,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897704566794","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"895\",\"lineNum\":0,\"lineType\":1,\"content\":\"命實\",\"logicSentenceId\":\"7580381859319431231\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"896\",\"lineNum\":0,\"lineType\":1,\"content\":\"運生，如旱苗而得雨。\",\"logicSentenceId\":\"7580381859319431231\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"897\",\"lineNum\":0,\"lineType\":2,\"content\":\"如命𨺻平常，三方有吉星照限，行羙地為福。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330180076795052066","endPageId":"7330180076795052066","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319431231\",\"content\":\"行运顺遂的时候就如同干旱的禾苗得到雨水的滋润；。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":561,"chapterOrder":28,"inChapterOrder":399,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897943642122","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"898\",\"lineNum\":0,\"lineType\":1,\"content\":\"命衰運弱，如嫩草而遭霜。\",\"logicSentenceId\":\"7580381859319447615\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"899\",\"lineNum\":0,\"lineType\":2,\"content\":\"如命坐𨺻忌歳限，又逢悪曜，必刑傷死亡。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330180076795052066","endPageId":"7330180076795052066","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319447615\",\"content\":\"命数衰败、运势衰弱，就像娇嫩的小草遭遇寒霜。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":444,"chapterOrder":28,"inChapterOrder":400,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897943658506","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"900\",\"lineNum\":0,\"lineType\":1,\"content\":\"命有吉星官殺重，縱有財官也苦辛。\",\"logicSentenceId\":\"7580381859319463999\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330180076795052066","endPageId":"7330180076795052066","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319463999\",\"content\":\"命盘中有吉星，但是官星和杀星力量很重的话，就算命中有财运和官运，人生也会过得辛苦。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":385,"chapterOrder":28,"inChapterOrder":401,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897943674890","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"901\",\"lineNum\":0,\"lineType\":10,\"content\":\"身宫\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330180076795052066","endPageId":"7330180076795052066","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":109,"chapterOrder":28,"inChapterOrder":402,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897943691274","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"902\",\"lineNum\":0,\"lineType\":1,\"content\":\"三夾身㐫六夾吉。\",\"logicSentenceId\":\"7580381859319480383\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"903\",\"lineNum\":0,\"lineType\":2,\"content\":\"夾忌刼空、火鈴、羊陀㐫。六夾貴逢吉，甚妙。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330180076795052066","endPageId":"7330180076795052066","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319480383\",\"content\":\"如果三方宫位都夹身宫，就是凶相；如果六方宫位都夹身宫，就是吉相。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":467,"chapterOrder":28,"inChapterOrder":403,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897943707658","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"904\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命俱吉，富貴雙全；身吉命㐫，亦爲羙論。\",\"logicSentenceId\":\"7580381859319496767\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"905\",\"lineNum\":0,\"lineType\":1,\"content\":\"命強身弱，財源不聚；貪武守身無吉命，反不為良。\",\"logicSentenceId\":\"7580381859319513151\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330180076795052066","endPageId":"7330180076795052066","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319496767\",\"content\":\"身宫和命宫都吉利，则富贵双全；身宫吉利但命宫凶险，也算是不错的说法。\"},{\"logicSentenceId\":\"7580381859319513151\",\"content\":\"命宫强而身宫弱，即使拥有财源也难以聚集；贪狼星和武曲星坐守身宫，命盘中没有吉星，反而不是好的命局。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":775,"chapterOrder":28,"inChapterOrder":404,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897943724042","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"906\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179986214912054\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"907\",\"lineNum\":0,\"lineType\":10,\"content\":\"納音\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179986214912054","endPageId":"7330179986214912054","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":226,"chapterOrder":28,"inChapterOrder":405,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897943740426","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"908\",\"lineNum\":0,\"lineType\":1,\"content\":\"納音墓庫，看何宫，\",\"logicSentenceId\":\"7580381859319529535\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"909\",\"lineNum\":0,\"lineType\":2,\"content\":\"如水生人庫辰，遇財官或禄存尤妙。遇遷移耗殺同不美，生逢敗地，發也虚花。如年納音水土長生居申，申乃金星，為本宫之主，若安命在耗殺酉敗地，又羊同不美。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"910\",\"lineNum\":0,\"lineType\":1,\"content\":\"得禄存吉\",\"logicSentenceId\":\"7580381859319529535\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179986214912054","endPageId":"7330179986214912054","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381859319529535\",\"content\":\"纳音对应的墓库，要查看在哪个宫位，这个宫位如果有禄存星就是吉利的。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":749,"chapterOrder":28,"inChapterOrder":406,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897943756810","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"911\",\"lineNum\":0,\"lineType\":2,\"content\":\"絶處逢生，花而不敗。如水土絶在巳，安命在巳為絶地，却得金星在得已生水，佳禄，不主禄絶方，餘倣此。吉同吉\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179986214912054","endPageId":"7330179986214912054","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":255,"chapterOrder":28,"inChapterOrder":407,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158897943773194","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"912\",\"lineNum\":0,\"lineType\":10,\"content\":\"財帛\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179986214912054","endPageId":"7330179986214912054","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":109,"chapterOrder":28,"inChapterOrder":408,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"73561588
