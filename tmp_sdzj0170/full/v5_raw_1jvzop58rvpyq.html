"pageId":"7330174059281416233","picUrl":"https:\u002F\u002Fp3-ancientlib-sign.byteimg.com\u002Ftos-cn-i-ceu0di7tn2\u002Fread\u002FSDZJ0170\u002F1\u002Fpage\u002F1jw0g5g5qg2sz\u002F1jovtuauqfvop-SDZJ0170_00001_00006B.webp~tplv-ceu0di7tn2-png.png?lk3s=e5c95217&x-expires=1788480000&x-signature=a6B7T4dTp89wdGHLlR3%2BUg3HnSk%3D","urlEncryptType":0,"pageNum":12,"thumbUrl":"https:\u002F\u002Fp3-ancientlib-sign.byteimg.com\u002Ftos-cn-i-ceu0di7tn2\u002Fread\u002FSDZJ0170\u002F1\u002Fpage\u002F1jw0g5g5qg2sz\u002F1jovtuauqfvop-SDZJ0170_00001_00006B.webp~tplv-ceu0di7tn2-png.png?lk3s=e5c95217&x-expires=1788480000&x-signature=a6B7T4dTp89wdGHLlR3%2BUg3HnSk%3D","volumeId":"7330168671848890377","uri":"read\u002FSDZJ0170\u002F1\u002Fpage\u002F1jw0g5g5qg2sz\u002F1jovtuauqfvop-SDZJ0170_00001_00006B.webp"},{"pageId":"7330174059281514537","picUrl":"https:\u002F\u002Fp9-ancientlib-sign.byteimg.com\u002Ftos-cn-i-ceu0di7tn2\u002Fread\u002FSDZJ0170\u002F1\u002Fpage\u002F1jw0g5g5qgfg3\u002F1jovtuauqhzjd-SDZJ0170_00001_00007A.webp~tplv-ceu0di7tn2-png.png?lk3s=e5c95217&x-expires=1788480000&x-signature=D8SmkmAn7gwWKzQN1bYcCYmnueY%3D","urlEncryptType":0,"pageNum":13,"thumbUrl":"https:\u002F\u002Fp9-ancientlib-sign.byteimg.com\u002Ftos-cn-i-ceu0di7tn2\u002Fread\u002FSDZJ0170\u002F1\u002Fpage\u002F1jw0g5g5qgfg3\u002F1jovtuauqhzjd-SDZJ0170_00001_00007A.webp~tplv-ceu0di7tn2-png.png?lk3s=e5c95217&x-expires=1788480000&x-signature=D8SmkmAn7gwWKzQN1bYcCYmnueY%3D","volumeId":"7330168671848890377","uri":"read\u002FSDZJ0170\u002F1\u002Fpage\u002F1jw0g5g5qgfg3\u002F1jovtuauqhzjd-SDZJ0170_00001_00007A.webp"}],"isListeningSupported":true,"isPodcastSupported":false,"pinYinVersion":20100001},"paragraphList":[{"paragraphId":"7356158890129506341","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"3\",\"lineNum\":0,\"lineType\":9,\"content\":\"譚星要論\",\"logicSentenceId\":\"7580380898680848447\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178794898276406","endPageId":"7330178794898276406","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":150,"chapterOrder":28,"inChapterOrder":1,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129522725","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"4\",\"lineNum\":0,\"lineType\":1,\"content\":\"先㸔身命祿馬，不落空亡，天空、截空最緊，旬空次之。\",\"logicSentenceId\":\"7580380898680864831\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"5\",\"lineNum\":0,\"lineType\":1,\"content\":\"第一看命主吉㐫庙旺，化吉化忌生尅；次看身主吉㐫生尅，三看遷移、財帛、官祿三方星辰刑冲尅破；四看福徳宫權禄刼空庙陷，以福徳對財帛宫也。\",\"logicSentenceId\":\"7580380898680881215\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"6\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命遷移、財官、福徳六宫，名曰八座，俱在庙旺，聚吉化吉，富貴高壽。\",\"logicSentenceId\":\"7580380898680897599\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"7\",\"lineNum\":0,\"lineType\":1,\"content\":\"六宫俱陥，聚㐫化忌，夭壽貧孤。\",\"logicSentenceId\":\"7580380898680913983\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"8\",\"lineNum\":0,\"lineType\":1,\"content\":\"若卯酉時生人者尤緊。\",\"logicSentenceId\":\"7580380898680930367\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"9\",\"lineNum\":0,\"lineType\":1,\"content\":\"外有田宅疾厄，已録于后。\",\"logicSentenceId\":\"7580380898680946751\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"10\",\"lineNum\":0,\"lineType\":1,\"content\":\"又看父母妻子三宫俱有刼空殺忌，則僧之命，否則孤獨貧窮。\",\"logicSentenceId\":\"7580380898680963135\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"11\",\"lineNum\":0,\"lineType\":1,\"content\":\"若命宫無正曜者，財官二宫有吉星拱照，富貴\",\"logicSentenceId\":\"7580380898680979519\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"12\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330178972552036386\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"13\",\"lineNum\":0,\"lineType\":1,\"content\":\"全羙；或偏房庶母所生，三方有𢙣星冲照，或二姓可延生離祖，可保成家。\",\"logicSentenceId\":\"7580380898680979519\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"14\",\"lineNum\":0,\"lineType\":1,\"content\":\"如命官有正曜吉星，庙旺化吉，三方又有吉宿㑹合，上上之命；如無正曜吉星，三方有吉，上次之命。\",\"logicSentenceId\":\"7580380898680995903\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"15\",\"lineNum\":0,\"lineType\":1,\"content\":\"命宮星辰無吉無凶，或吉凶相半者，如三方亦有中等星辰，為中格。\",\"logicSentenceId\":\"7580380898681012287\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"16\",\"lineNum\":0,\"lineType\":1,\"content\":\"及命宫星辰入庙旺，三方有悪星守照破格，及命星陥背，加羊火化忌，却得十干禄元來相守化吉，亦為中等之命。\",\"logicSentenceId\":\"7580380898681028671\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"17\",\"lineNum\":0,\"lineType\":1,\"content\":\"若命無吉星，返有凶殺化忌，無禄落陷，為下格之命。\",\"logicSentenceId\":\"7580380898681045055\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"18\",\"lineNum\":0,\"lineType\":1,\"content\":\"三方有吉星，亦可為中等，先小後大，不能乆逺，終為成敗夭折論。\",\"logicSentenceId\":\"7580380898681061439\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"19\",\"lineNum\":0,\"lineType\":1,\"content\":\"若安命星緾陥地，又加㐫殺化忌，三方又㑹羊陀火鈴空刼，為下格，貧賤二姓延生，奴僕之命，否則夭\",\"logicSentenceId\":\"7580380898681077823\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"20\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330178794898358326\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"21\",\"lineNum\":0,\"lineType\":1,\"content\":\"拆六畜之命\",\"logicSentenceId\":\"7580380898681077823\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178794898276406","endPageId":"7330178794898358326","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898680979519\",\"content\":\"如果命宫没有正曜，财帛宫和官禄宫有吉星拱照，富贵双全；如果是偏房或庶母所生，三方有恶星冲照，或者认两姓可延长生命、离开祖业，这样可以保其成家。\"},{\"logicSentenceId\":\"7580380898680946751\",\"content\":\"除此之外还有田宅宫、疾厄宫，已经记录在后面了。\"},{\"logicSentenceId\":\"7580380898680881215\",\"content\":\"第一看命主的吉凶、庙旺状态，以及化吉、化忌和生克；其次看身主的吉凶生克；第三查看迁移宫、财帛宫、官禄宫这三方星辰的刑冲克破情况；第四看福德宫的权禄劫空和庙陷情况，要把福德宫与财帛宫对照起来看。\"},{\"logicSentenceId\":\"7580380898681012287\",\"content\":\"命宫的星辰既没有吉星也没有凶星，或者吉星和凶星数量大致相当，如果三方宫位也有处于中等水平的星辰，那就是中等命格。\"},{\"logicSentenceId\":\"7580380898681061439\",\"content\":\"三方有吉星，也可算作中等命格，前期发展较小、后期发展较大，但不能长久，最终仍以成败夭折论。\"},{\"logicSentenceId\":\"7580380898681045055\",\"content\":\"如果命宫没有吉星，反而有凶煞化忌，又无禄星且星辰落陷，就是下等命格。\"},{\"logicSentenceId\":\"7580380898680913983\",\"content\":\"这六个宫位都处于陷落的状态，汇聚了凶星且产生了化忌的情况，命主就会夭折早逝、贫穷困苦、孤独无依。\"},{\"logicSentenceId\":\"7580380898680963135\",\"content\":\"再看父母、妻子、子女三宫都有劫空、杀忌等煞星，那就是出家为僧的命，否则就是孤独贫穷的命。\"},{\"logicSentenceId\":\"7580380898680930367\",\"content\":\"如果是卯时或酉时出生的人，尤其关键。\"},{\"logicSentenceId\":\"7580380898681028671\",\"content\":\"如果命宫的星辰处于庙旺状态，但三方有恶星守照破坏格局，或者命星处于陷背状态，加上擎羊星、火星化忌，然而能得到十干禄元来守护化解为吉，也属于中等命运。\"},{\"logicSentenceId\":\"7580380898680995903\",\"content\":\"如果命宫有正曜吉星，星曜处于庙旺状态且化吉，三方又有吉宿会合，就是上上等的命格；如果命宫没有正曜吉星，但三方有吉星，则是次等命格。\"},{\"logicSentenceId\":\"7580380898681077823\",\"content\":\"如果安命的主星落入陷地，又遇到了凶煞星和化忌星，三方宫位还会合了擎羊、陀罗、火星、铃星、天空、地劫，属于下等命格，会出身贫贱、父母姓氏不同，是奴仆之命，不然就会夭折，或者和六畜的命运一样（命运悲惨）。\"},{\"logicSentenceId\":\"7580380898680864831\",\"content\":\"首先看身命禄马，不能落入空亡之位，天空、截空最为关键，旬空次之。\"},{\"logicSentenceId\":\"7580380898680897599\",\"content\":\"身宫、命宫、迁移宫、财帛宫、官禄宫、福德宫这六宫，叫做八座，都处于庙旺状态，汇聚吉祥之气并转化为吉运，会富贵且高寿。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":6722,"chapterOrder":28,"inChapterOrder":2,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129539109","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"22\",\"lineNum\":0,\"lineType\":10,\"content\":\"論人命入格\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178794898358326","endPageId":"7330178794898358326","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":117,"chapterOrder":28,"inChapterOrder":3,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129555493","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"23\",\"lineNum\":0,\"lineType\":1,\"content\":\"如命入格，庙旺聚吉，科權禄守上上之。\",\"logicSentenceId\":\"7580380898681094207\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"24\",\"lineNum\":0,\"lineType\":1,\"content\":\"命不入庙，加吉化吉科權禄上次之。\",\"logicSentenceId\":\"7580380898681110591\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"25\",\"lineNum\":0,\"lineType\":1,\"content\":\"命不入庙，不加吉，平常命入庙不加吉，中等若居陷地，又加殺化忌，為下格之命，不以入格而論也。\",\"logicSentenceId\":\"7580380898681126975\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"26\",\"lineNum\":0,\"lineType\":1,\"content\":\"又入格不化吉而化㐫，只以本命吉㐫多寡而断之。\",\"logicSentenceId\":\"7580380898681143359\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178794898358326","endPageId":"7330178794898358326","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681110591\",\"content\":\"命星没有入庙，但是有吉星、化吉、化科、化权、化禄等情况，属于次一等的上等命格。\"},{\"logicSentenceId\":\"7580380898681126975\",\"content\":\"命宫不在庙旺之地，又没有吉星相助，是平常之命；命宫在庙旺之地但无吉星，为中等之命；若命宫处于陷地，又有凶煞星、化忌星，就是下格之命，不能以入格来论。\"},{\"logicSentenceId\":\"7580380898681143359\",\"content\":\"再者，命格符合入格条件却不化吉反而化凶，只能依据本命所带吉凶的多少来判断。\"},{\"logicSentenceId\":\"7580380898681094207\",\"content\":\"如果命局符合格局，星曜处于庙旺之地且汇聚吉祥之星，又有科、权、禄三星守护，那就是上上之命。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1647,"chapterOrder":28,"inChapterOrder":4,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129571877","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"27\",\"lineNum\":0,\"lineType\":10,\"content\":\"論格星数髙下\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178794898358326","endPageId":"7330178794898358326","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":120,"chapterOrder":28,"inChapterOrder":5,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129588261","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"28\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫府與数相合何如？\",\"logicSentenceId\":\"7580380898681159743\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"29\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微南北斗中天帝王，天府乃南斗主，又有隂陽相半者。\",\"logicSentenceId\":\"7580380898681176127\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"30\",\"lineNum\":0,\"lineType\":1,\"content\":\"若隂陽不相半，又数不相生，為下格，隂陽純一為中格，又三方四正皆吉星為上格；吉㐫相半守\",\"logicSentenceId\":\"7580380898681192511\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"31\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330178972552151074\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"32\",\"lineNum\":0,\"lineType\":1,\"content\":\"照為中格，純是𢙣殺，為下格，㐫徒論。\",\"logicSentenceId\":\"7580380898681192511\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"33\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡星得上格而数得上格為第一，人臣星得上格而数得中格，為第二，位至三公；星得上格而数得下格，爲第三，位至六卿，皆為上格。\",\"logicSentenceId\":\"7580380898681208895\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"34\",\"lineNum\":0,\"lineType\":1,\"content\":\"上夀之人，星得中格而数得上格為第四，位至監司，星中数中為第五，位至縣令，星中数下為第六。\",\"logicSentenceId\":\"7580380898681225279\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"35\",\"lineNum\":0,\"lineType\":1,\"content\":\"異路前程、貴題，皆為中等享福之人也。\",\"logicSentenceId\":\"7580380898681241663\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"36\",\"lineNum\":0,\"lineType\":1,\"content\":\"又星得下格而数得上格為第七，衣禄豐足，富比陶朱，子孫蕃盛，壽享遐齡，以星雖㐫，而又入格合局故也耳。\",\"logicSentenceId\":\"7580380898681258047\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"37\",\"lineNum\":0,\"lineType\":1,\"content\":\"否虚名虚利，星下数中為第八，衣食無𧇊，星下数下為第九。\",\"logicSentenceId\":\"7580380898681274431\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"38\",\"lineNum\":0,\"lineType\":1,\"content\":\"辛苦奔波，貧窮夭折。\",\"logicSentenceId\":\"7580380898681290815\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"39\",\"lineNum\":0,\"lineType\":1,\"content\":\"上中下三等，依理而断也，則上可以知祖宗之源流，下可以知子孫之昌盛。\",\"logicSentenceId\":\"7580380898681307199\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178794898358326","endPageId":"7330178972552151074","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681290815\",\"content\":\"辛苦地四处奔波，贫穷且过早去世。\"},{\"logicSentenceId\":\"7580380898681258047\",\"content\":\"再者，星象处于下格但气数处于上格的为第七等，衣食丰足，财富堪比陶朱公，子孙繁盛，能享高寿，这是因为星象虽凶，但又入格合局的缘故。\"},{\"logicSentenceId\":\"7580380898681307199\",\"content\":\"上中下三等，根据命理来推断，则向上可以了解祖宗的源流，向下可以知晓子孙的昌盛。\"},{\"logicSentenceId\":\"7580380898681159743\",\"content\":\"紫微星、天府星与命数相合会怎么样呢？\"},{\"logicSentenceId\":\"7580380898681192511\",\"content\":\"若阴阳不均衡，且数之间无相生关系，为下等命格；阴阳单一为中等命格；三方四正都有吉星为上等命格；吉凶参半守照为中等命格；全是恶煞，为下等命格，按凶徒论断。\"},{\"logicSentenceId\":\"7580380898681208895\",\"content\":\"凡是星曜得上等格局而命数也得上等格局为第一等，人臣星得上等格局而命数得中等格局为第二等，官位可至三公；星曜得上等格局而命数得下等格局为第三等，官位可至六卿，都属于上等格局。\"},{\"logicSentenceId\":\"7580380898681274431\",\"content\":\"否则只有虚名虚利，星相下等而气数中等为第八等，衣食无忧，星相下等而气数下等为第九等。\"},{\"logicSentenceId\":\"7580380898681176127\",\"content\":\"紫微星是南北斗星中的中天帝王星，天府星是南斗星的主星，又有阴阳各半的情况。\"},{\"logicSentenceId\":\"7580380898681241663\",\"content\":\"通过不同途径获得的前程、显贵的职位，都是中等享福的人。\"},{\"logicSentenceId\":\"7580380898681225279\",\"content\":\"长寿之人，星象处于中格而气数处于上格的为第四等，官位可至监司；星象和气数都处于中格的为第五等，官位可至县令；星象处于中格而气数处于下格的为第六等。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":4512,"chapterOrder":28,"inChapterOrder":6,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129604645","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"40\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330178992400318518\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"41\",\"lineNum\":0,\"lineType\":10,\"content\":\"論人性格何如\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178992400318518","endPageId":"7330178992400318518","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":236,"chapterOrder":28,"inChapterOrder":7,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129621029","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"42\",\"lineNum\":0,\"lineType\":1,\"content\":\"如身命一星緊一星。\",\"logicSentenceId\":\"7580380898681323583\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"43\",\"lineNum\":0,\"lineType\":1,\"content\":\"緩則禀性不常，喜怒不一，善悪隨風，逐波若善星，守命則賦。\",\"logicSentenceId\":\"7580380898681339967\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"44\",\"lineNum\":0,\"lineType\":1,\"content\":\"性仁慈公直，㐫殺守命，禀性悪虐狂妄。\",\"logicSentenceId\":\"7580380898681356351\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"45\",\"lineNum\":0,\"lineType\":1,\"content\":\"又看金木水火土生尅制化推詳。\",\"logicSentenceId\":\"7580380898681372735\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178992400318518","endPageId":"7330178992400318518","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681339967\",\"content\":\"如果命星运行缓和，禀性就不恒定，喜怒无常，善恶观念容易受到外界影响而摇摆不定，随波逐流；如果有善星守护命宫，则能补益先天禀赋。\"},{\"logicSentenceId\":\"7580380898681356351\",\"content\":\"性情仁慈公正耿直，若凶煞之星守命，则禀性凶恶暴虐狂妄。\"},{\"logicSentenceId\":\"7580380898681372735\",\"content\":\"又要看金木水火土的生克制化之理来详细推断。\"},{\"logicSentenceId\":\"7580380898681323583\",\"content\":\"就像身命星一颗紧挨着一颗。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1338,"chapterOrder":28,"inChapterOrder":8,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129637413","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"46\",\"lineNum\":0,\"lineType\":10,\"content\":\"論男女命同異\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178992400318518","endPageId":"7330178992400318518","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":120,"chapterOrder":28,"inChapterOrder":9,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129653797","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"47\",\"lineNum\":0,\"lineType\":1,\"content\":\"男女命不同，星辰各别。\",\"logicSentenceId\":\"7580380898681389119\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"48\",\"lineNum\":0,\"lineType\":1,\"content\":\"男命先看身命，次看財帛、官禄、遷移，\",\"logicSentenceId\":\"7580380898681405503\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"49\",\"lineNum\":0,\"lineType\":2,\"content\":\"俱要庙旺為吉，敗陷聚。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"50\",\"lineNum\":0,\"lineType\":1,\"content\":\"㐫為㐫，三看福徳、權禄、刼空庙陷、\",\"logicSentenceId\":\"7580380898681405503\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"51\",\"lineNum\":0,\"lineType\":2,\"content\":\"言忌外看田宅妻。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"52\",\"lineNum\":0,\"lineType\":1,\"content\":\"妾疾厄宫，吉㐫已録。\",\"logicSentenceId\":\"7580380898681405503\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"53\",\"lineNum\":0,\"lineType\":1,\"content\":\"干後，又看父母妻\",\"logicSentenceId\":\"7580380898681421887\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"54\",\"lineNum\":0,\"lineType\":2,\"content\":\"子三宫。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"55\",\"lineNum\":0,\"lineType\":1,\"content\":\"俱有刼空殺忌，則僧道之命，否則貧窮孤獨。\",\"logicSentenceId\":\"7580380898681421887\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"56\",\"lineNum\":0,\"lineType\":1,\"content\":\"湏要仔細𠫵詳，方可断人禍福荣枯。\",\"logicSentenceId\":\"7580380898681438271\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"57\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330178972552265762\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"58\",\"lineNum\":0,\"lineType\":2,\"content\":\"女命先爲身命吉㐫。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"59\",\"lineNum\":0,\"lineType\":1,\"content\":\"如貪狼七殺擎羊則不羙。\",\"logicSentenceId\":\"7580380898681454655\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"60\",\"lineNum\":0,\"lineType\":1,\"content\":\"次看福徳，\",\"logicSentenceId\":\"7580380898681471039\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"61\",\"lineNum\":0,\"lineType\":2,\"content\":\"宫吉㐫若七殺单。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"62\",\"lineNum\":0,\"lineType\":1,\"content\":\"居福徳，必為娼婢，三㸔夫君，四看子媳。\",\"logicSentenceId\":\"7580380898681471039\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"63\",\"lineNum\":0,\"lineType\":2,\"content\":\"財帛、田宅。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"64\",\"lineNum\":0,\"lineType\":1,\"content\":\"若桃花刑殺，要敗絕空亡為吉，若諸吉廟旺，不\",\"logicSentenceId\":\"7580380898681487423\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"65\",\"lineNum\":0,\"lineType\":2,\"content\":\"佳雖。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"66\",\"lineNum\":0,\"lineType\":1,\"content\":\"是艱辛貧困，亦不為下賤夭拆。\",\"logicSentenceId\":\"7580380898681487423\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"67\",\"lineNum\":0,\"lineType\":1,\"content\":\"論女因夫貴女命貴格，\",\"logicSentenceId\":\"7580380898681503807\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"68\",\"lineNum\":0,\"lineType\":2,\"content\":\"反無。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"69\",\"lineNum\":0,\"lineType\":1,\"content\":\"用以子媳夫君福徳為正強，田宅財帛為次強，以官禄遷移七宫為𨺻。\",\"logicSentenceId\":\"7580380898681503807\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178992400318518","endPageId":"7330178972552265762","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681421887\",\"content\":\"看完天干之后，再看命盘中父母宫、夫妻宫都有劫煞、空亡、七杀、忌星的情况，如果都有的话就是适合出家做僧道的命，否则就是贫穷孤独的命。\"},{\"logicSentenceId\":\"7580380898681438271\",\"content\":\"必须要仔细详加分析，才可以判断人的祸福兴衰。\"},{\"logicSentenceId\":\"7580380898681454655\",\"content\":\"比如贪狼、七杀、擎羊这些星曜出现就不吉利。\"},{\"logicSentenceId\":\"7580380898681471039\",\"content\":\"其次看福德宫，若星辰居于福德宫，命主必为娼婢，第三要看丈夫，第四要看子女媳妇。\"},{\"logicSentenceId\":\"7580380898681487423\",\"content\":\"如果命中有桃花、刑星、杀星，那么命中有破败、死绝、空亡这些才算吉利；如果各种吉星处于庙旺之地，即使不会经历艰辛贫困，也不会沦落下贱或夭折。\"},{\"logicSentenceId\":\"7580380898681503807\",\"content\":\"论女命因夫贵的贵格，以子媳宫、夫君宫、福德宫为正强，田宅宫、财帛宫为次强，以官禄宫、迁移宫等七宫为陷。\"},{\"logicSentenceId\":\"7580380898681389119\",\"content\":\"男女命理不同，星辰各有差别。\"},{\"logicSentenceId\":\"7580380898681405503\",\"content\":\"看男命时，首先要看身宫和命宫，其次要看财帛宫、官禄宫、迁移宫，其中有凶星就是有凶兆，第三要看福德宫、权禄宫、劫空宫、庙陷情况、妻妾宫、疾厄宫，这样男命的吉凶就能推算出来了。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":4686,"chapterOrder":28,"inChapterOrder":10,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129670181","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"70\",\"lineNum\":0,\"lineType\":10,\"content\":\"論小児命\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178972552265762","endPageId":"7330178972552265762","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":114,"chapterOrder":28,"inChapterOrder":11,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129686565","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"71\",\"lineNum\":0,\"lineType\":2,\"content\":\"小児愽士、力士上\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"72\",\"lineNum\":0,\"lineType\":1,\"content\":\"短下長，靑龍將軍，腮小頭圓，大耗鼻仰唇縮，死符病符，声髙性雄；官府奏書逢𢙣曜，落地無聲；白虎大嵗遇七殺，防弱遭傷。\",\"logicSentenceId\":\"7580380898681520191\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"73\",\"lineNum\":0,\"lineType\":1,\"content\":\"湏分生尅制化之垣，更㸔帝禄盛\",\"logicSentenceId\":\"7580380898681536575\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"74\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330178992400760886\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"75\",\"lineNum\":0,\"lineType\":1,\"content\":\"衰之地，復觀関殺，方知壽天窮通。\",\"logicSentenceId\":\"7580380898681536575\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178972552265762","endPageId":"7330178992400760886","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681520191\",\"content\":\"下身短上身长，有青龙将军之相，脸颊小脑袋圆；大耗星照命则鼻子上仰嘴唇收缩，死符、病符星临身，声音高亢性格雄健；官府、奏书星遇上恶曜，行事悄无声息；白虎、太岁星碰到七杀星，要防备弱者遭受伤害。\"},{\"logicSentenceId\":\"7580380898681536575\",\"content\":\"需要分辨星曜生克制化的宫垣，还要查看帝禄盛衰的宫位，再观察关煞，才能知晓寿命长短、穷困通达。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1396,"chapterOrder":28,"inChapterOrder":12,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129702949","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"76\",\"lineNum\":0,\"lineType\":1,\"content\":\"凢小児初生，命中星辰庙旺，大小二限未行，断其灾少，易養，父母無尅。\",\"logicSentenceId\":\"7580380898681552959\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"77\",\"lineNum\":0,\"lineType\":1,\"content\":\"若命坐𢙣殺，又緾陥地，大小二限未行，断其灾多，難養，刑尅父母。\",\"logicSentenceId\":\"7580380898681569343\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178992400760886","endPageId":"7330178992400760886","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681552959\",\"content\":\"凡是刚出生的小儿，命中的星辰处于庙旺的状态，大运和小运还未开始运行，就可以判断这个孩子遭遇的灾祸少，容易养活，而且对父母也没有刑克。\"},{\"logicSentenceId\":\"7580380898681569343\",\"content\":\"如果命宫中有恶杀星，又被凶星缠绕于陷地，大小二限还未起运，可判断此命灾难多、难养活，会刑克父母。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":930,"chapterOrder":28,"inChapterOrder":13,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129719333","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"78\",\"lineNum\":0,\"lineType\":1,\"content\":\"定小児生時訣：\",\"logicSentenceId\":\"7580380898681585727\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178992400760886","endPageId":"7330178992400760886","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681585727\",\"content\":\"确定小儿出生时辰的口诀：。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":273,"chapterOrder":28,"inChapterOrder":14,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129735717","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"79\",\"lineNum\":0,\"lineType\":1,\"content\":\"子午卯酉单頂門，或偏左邉二三分。\",\"logicSentenceId\":\"7580380898681602111\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"80\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅申巳亥亦单頂，偏居右去始為真。\",\"logicSentenceId\":\"7580380898681618495\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"81\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戍丑未是雙頂，胞胎受定正時辰。\",\"logicSentenceId\":\"7580380898681634879\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178992400760886","endPageId":"7330178992400760886","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681618495\",\"content\":\"出生在寅时、申时、巳时、亥时的孩子也是单顶旋，顶旋偏右才是准确的。\"},{\"logicSentenceId\":\"7580380898681634879\",\"content\":\"出生在辰、戌、丑、未时的婴儿头顶是双旋，这是在胞胎中就确定了的正确出生时辰。\"},{\"logicSentenceId\":\"7580380898681602111\",\"content\":\"出生在子午卯酉时的小儿头顶只有一个囟门，或者囟门偏左两三分。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1024,"chapterOrder":28,"inChapterOrder":15,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129752101","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"82\",\"lineNum\":0,\"lineType\":1,\"content\":\"又子午卯酉面向天，寅申己亥側身眠，辰戌丑未臉伏地，臨盆當試用心堅。\",\"logicSentenceId\":\"7580380898681651263\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178992400760886","endPageId":"7330178992400760886","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681651263\",\"content\":\"又子午卯酉时出生的婴儿面向天，出生在寅申巳亥时的婴儿侧身睡，辰戌丑未时出生的婴儿脸伏地，接生时应当用心仔细判断。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":480,"chapterOrder":28,"inChapterOrder":16,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129768485","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"83\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179103183667235\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"84\",\"lineNum\":0,\"lineType\":10,\"content\":\"論人生時安命吉㐫\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179103183667235","endPageId":"7330179103183667235","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":242,"chapterOrder":28,"inChapterOrder":17,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129784869","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"85\",\"lineNum\":0,\"lineType\":1,\"content\":\"凢男女生在寅午戍、申子辰六陽時，安命在此六宫者吉；生在已酉丑、亥卯未六隂時，安命在此六隂宫者吉。\",\"logicSentenceId\":\"7580380898681667647\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"86\",\"lineNum\":0,\"lineType\":1,\"content\":\"反此則少逐。\",\"logicSentenceId\":\"7580380898681684031\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179103183667235","endPageId":"7330179103183667235","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681684031\",\"content\":\"与此相反就少有顺遂。\"},{\"logicSentenceId\":\"7580380898681667647\",\"content\":\"凡是男女出生在寅午戌、申子辰这六个阳时，命宫定在这六个阳宫的人吉利；出生在巳酉丑、亥卯未这六个阴时，命宫定在这六个阴宫的人吉利。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":779,"chapterOrder":28,"inChapterOrder":18,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158890129801253","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"87\",\"lineNum\":0,\"lineType\":10,\"content\":\"論人生時要審的確\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179103183667235","endPageId":"7330179103183667235","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":126,"chapterOrder":28,"inChapterOrder":19,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274534938","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"88\",\"lineNum\":0,\"lineType\":1,\"content\":\"如人生子亥二時，最難定凖，要仔細推詳。\",\"logicSentenceId\":\"7580380898681700415\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"89\",\"lineNum\":0,\"lineType\":1,\"content\":\"如子時有十刻，上五刻属昨夜亥時，下五刻属今日子時。\",\"logicSentenceId\":\"7580380898681716799\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"90\",\"lineNum\":0,\"lineType\":1,\"content\":\"如天氣隂雨之際，必湏羅經以定真確時候，若差訛，則命不凖矣。\",\"logicSentenceId\":\"7580380898681733183\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179103183667235","endPageId":"7330179103183667235","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681716799\",\"content\":\"例如子时总共有十刻，前五刻属于昨夜的亥时，后五刻属于今天的子时。\"},{\"logicSentenceId\":\"7580380898681733183\",\"content\":\"如果遇到阴雨天气，必须用罗盘来确定准确的时辰，如果时辰有差错，那么命理推算就不准确了。\"},{\"logicSentenceId\":\"7580380898681700415\",\"content\":\"比如人生于子时和亥时，最难准确判定时辰，要仔细推究。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1099,"chapterOrder":28,"inChapterOrder":20,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274551322","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"91\",\"lineNum\":0,\"lineType\":10,\"content\":\"論小児尅親\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179103183667235","endPageId":"7330179103183667235","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":117,"chapterOrder":28,"inChapterOrder":21,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274567706","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"92\",\"lineNum\":0,\"lineType\":1,\"content\":\"如辰戌丑未生人，見辰戌丑未時最毒。\",\"logicSentenceId\":\"7580380898681749567\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"93\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330178992400842806\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"94\",\"lineNum\":0,\"lineType\":1,\"content\":\"如\",\"logicSentenceId\":\"7580380898681765951\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"95\",\"lineNum\":0,\"lineType\":2,\"content\":\"子寅卯巳生人，見午、申。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"96\",\"lineNum\":0,\"lineType\":1,\"content\":\"酉亥時，主先尅父，出十六歲不論。\",\"logicSentenceId\":\"7580380898681765951\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"97\",\"lineNum\":0,\"lineType\":1,\"content\":\"如辰、已丑末生人，見子午卯、巳亥申酉生時者，主先尅母。\",\"logicSentenceId\":\"7580380898681782335\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179103183667235","endPageId":"7330178992400842806","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681749567\",\"content\":\"如果是辰戌丑未时出生的人，遇到辰戌丑未时最为不利。\"},{\"logicSentenceId\":\"7580380898681765951\",\"content\":\"如果出生在酉时或亥时，预示着先克害父亲，过了十六岁就不再受此影响。\"},{\"logicSentenceId\":\"7580380898681782335\",\"content\":\"如果是辰、巳、丑、未年出生的人，遇到子、午、卯、巳、亥、申、酉这些生时，预示着先克母亲。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1394,"chapterOrder":28,"inChapterOrder":22,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274584090","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"98\",\"lineNum\":0,\"lineType\":10,\"content\":\"論命先貧後富\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178992400842806","endPageId":"7330178992400842806","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":120,"chapterOrder":28,"inChapterOrder":23,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274600474","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"99\",\"lineNum\":0,\"lineType\":1,\"content\":\"如人生於冨貴之家，一生快樂享福，財官題逹，妻荣子貴，奴僕成行，聲名昭著。\",\"logicSentenceId\":\"7580380898681798719\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"100\",\"lineNum\":0,\"lineType\":1,\"content\":\"其間有半途遭傷，人離財散，官非火盗。\",\"logicSentenceId\":\"7580380898681815103\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"101\",\"lineNum\":0,\"lineType\":1,\"content\":\"身喪家亡，此等之命，非命也，却是限歩逢㐫，大小二限及太嵗相冲照，又加㐫殺守臨，故此破敗不貧，即損壽也，所謂先成後敗，先大後小也。\",\"logicSentenceId\":\"7580380898681831487\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178992400842806","endPageId":"7330178992400842806","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681831487\",\"content\":\"身死家破，这样的命，并非命中注定，而是因为大运和小运走到了不好的阶段，大运、小运与太岁相互冲撞照临，再加上凶煞坐守降临，所以才会导致家业破败，不是变得贫穷困苦，就是寿命受损，这就是所谓的先成功后失败，先兴盛后衰败。\"},{\"logicSentenceId\":\"7580380898681798719\",\"content\":\"如果一个人生于富贵之家，一生快乐享福，钱财富足官位显达，妻子荣耀子女显贵，奴仆成群，名声显赫。\"},{\"logicSentenceId\":\"7580380898681815103\",\"content\":\"其中有的人会在半途遭遇灾祸，导致亲人离散、钱财散尽，还会遭遇官司、火灾和盗窃。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1512,"chapterOrder":28,"inChapterOrder":24,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274616858","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"102\",\"lineNum\":0,\"lineType\":1,\"content\":\"又有人命出身微賤，营活生理，百工巧藝，九流醫術，又為\",\"logicSentenceId\":\"7580380898681847871\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"103\",\"lineNum\":0,\"lineType\":2,\"content\":\"農圃等軰\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"104\",\"lineNum\":0,\"lineType\":1,\"content\":\"初歷艱辛度日，却乃中末平地，升騰發財，驚駭\",\"logicSentenceId\":\"7580380898681847871\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"105\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179103183798307\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"106\",\"lineNum\":0,\"lineType\":1,\"content\":\"郷邦，因生在中庸之局，後因限歩相扶，星辰逢吉曜庙旺，以此突然發達進禄，所謂先貧後冨，先小後大是也。\",\"logicSentenceId\":\"7580380898681847871\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330178992400842806","endPageId":"7330179103183798307","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681847871\",\"content\":\"又有人命出身低微卑贱，以各种营生维持生计，从事百工技艺和九流医术，起初艰难度日，但到中年和晚年时却能平步青云，发家致富，震惊乡里。这是因为出生时处于中庸的命局，后因运势相助，星辰遇到吉利的星曜且处于旺相之地，因此突然发达获得俸禄，这就是所谓的先贫后富，先小后大。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1310,"chapterOrder":28,"inChapterOrder":25,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274633242","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"107\",\"lineNum\":0,\"lineType\":10,\"content\":\"論大限十年祸福何如？\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179103183798307","endPageId":"7330179103183798307","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":133,"chapterOrder":28,"inChapterOrder":26,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274649626","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"108\",\"lineNum\":0,\"lineType\":1,\"content\":\"宫分星緾全吉，庙旺得地，無擎羊陀羅、火鈴空刼者，主十年安静，人財全羙。\",\"logicSentenceId\":\"7580380898681864255\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"109\",\"lineNum\":0,\"lineType\":1,\"content\":\"若限内有擎羊、陀羅、火鈴、空刼忌星為伴，成敗不一。\",\"logicSentenceId\":\"7580380898681880639\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"110\",\"lineNum\":0,\"lineType\":1,\"content\":\"如宫分星緾䧟，地值擎陀、火鈴、空刼忌，又加流年𢙣殺凑合，及小限巡逢㐫殺，則官災，死亡立見。\",\"logicSentenceId\":\"7580380898681897023\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"111\",\"lineNum\":0,\"lineType\":1,\"content\":\"大限将出，有吉星，衆者無災悔，少者災多，損人，破財不利。\",\"logicSentenceId\":\"7580380898681913407\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"112\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡行至寅申巳亥子午宫，遇紫微、天府、天同、太陽、大隂、昌曲、禄存、禄主吉星，主吉星，主人財興旺，添丁進口之慶。\",\"logicSentenceId\":\"7580380898681929791\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"113\",\"lineNum\":0,\"lineType\":1,\"content\":\"行至辰戍\",\"logicSentenceId\":\"7580380898681946175\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"114\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179141985140775\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"115\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑未卯酉，遇𢙣殺、𤎉貞、天使、羊陀、火鈴、空刼忌星，主人酒色荒迷，貧乏死生。\",\"logicSentenceId\":\"7580380898681946175\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"116\",\"lineNum\":0,\"lineType\":1,\"content\":\"遇左右昌曲，仕宦遷官加職，士民生子發財，婦人喜事，僧道亦利，商賈得益。\",\"logicSentenceId\":\"7580380898681962559\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"117\",\"lineNum\":0,\"lineType\":1,\"content\":\"凡大小二限及大嵗怕行天傷、天使夾地，怕行天空、地刼之地，怕行擎羊、陀羅之地，及羊陀冲照，怕脫㐫限，怕逢㐫限，又怕傷使、刼空、羊陀，併夾歲限。\",\"logicSentenceId\":\"7580380898681978943\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"118\",\"lineNum\":0,\"lineType\":1,\"content\":\"如天傷在子，天使在寅，嵗限在丑宫，乃併夾也。\",\"logicSentenceId\":\"7580380898681995327\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"119\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀命尚且無用，况夾限乎？\",\"logicSentenceId\":\"7580381736106721334\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"120\",\"lineNum\":0,\"lineType\":1,\"content\":\"若逃得過，湏看夀星、紫微、天同、天梁、貪狼坐命可觧。\",\"logicSentenceId\":\"7580381736106737718\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"121\",\"lineNum\":0,\"lineType\":1,\"content\":\"更湏看月值𢙣殺，日值惡殺，加凑大小嵗月日時五者叅詳吉㐫推断，\",\"logicSentenceId\":\"7580381736106754102\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179103183798307","endPageId":"7330179141985140775","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580380898681880639\",\"content\":\"如果限内有擎羊、陀罗、火铃、空劫等忌星相伴，结果就会成败不定。\"},{\"logicSentenceId\":\"7580380898681946175\",\"content\":\"行运到辰、戌、丑、未、卯、酉宫位，遇到恶杀、廉贞、天使、擎羊陀罗、火星铃星、空劫忌星，主此人会沉迷酒色，陷入贫困，甚至有生死之祸。\"},{\"logicSentenceId\":\"7580380898681864255\",\"content\":\"宫位和星宿都是吉利的，星曜处于庙旺之地，并且没有擎羊星、陀罗星、火星星、铃星、天空星、地劫星的话，代表命主会有十年安稳顺遂的时光，人和钱财都美满如意。\"},{\"logicSentenceId\":\"7580380898681962559\",\"content\":\"遇到左辅右弼、文昌文曲，当官的会升官晋级，读书人和百姓会生子发财，妇女会有喜事，僧人和道士也有好处，商人会获得利益。\"},{\"logicSentenceId\":\"7580381736106737718\",\"content\":\"若能逃过这些不利情况，需看寿星、紫微、天同、天梁、贪狼处于命宫才能化解。\"},{\"logicSentenceId\":\"7580380898681913407\",\"content\":\"大限即将结束时，若有吉星，吉星多则无灾祸悔恨，吉星少则灾祸多，会损人丁，破财不利。\"},{\"logicSentenceId\":\"7580380898681897023\",\"content\":\"如果宫位星缠陷落，又遇到擎羊、陀罗、火星、铃星、天空、地劫等忌星，再加上流年遇到恶煞相凑，以及小限巡行遇到凶杀，那么官灾、死亡马上就会出现。\"},{\"logicSentenceId\":\"7580381736106754102\",\"content\":\"还要看当月值凶煞、当日值凶煞，结合大小限、流年、月、日、时这五个时间因素综合参详推断吉凶。\"},{\"logicSentenceId\":\"7580380898681929791\",\"content\":\"凡是行运到寅、申、巳、亥、子、午宫，遇到紫微、天府、天同、太阳、大阴、文昌文曲、禄存、禄主等吉星，主吉星，主人财兴旺，有添丁进口的喜事。\"},{\"logicSentenceId\":\"7580380898681978943\",\"content\":\"凡大小二限及太岁怕行天伤、天使夹着的地方，怕行天空、地劫所在的地方，怕行擎羊、陀罗所在的地方，及被擎羊、陀罗冲照，怕脱离凶限，怕遇到凶限，又怕伤使、劫空、羊陀一起夹着岁限。\"},{\"logicSentenceId\":\"7580380898681995327\",\"content\":\"比如天伤星在子宫，天使星在寅宫，岁限落在丑宫，这就是天伤星和天使星夹着岁限的情况。\"},{\"logicSentenceId\":\"7580381736106721334\",\"content\":\"命盘中有擎羊星、陀罗星尚且没有用处，何况是被它们夹着岁限呢？\"}]}","chapterId":"1jvzop58rvpyq","dataSize":5672,"chapterOrder":28,"inChapterOrder":27,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274666010","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"122\",\"lineNum\":0,\"lineType\":1,\"content\":\"太嵗行至奏書将。\",\"logicSentenceId\":\"7580381736106770486\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"123\",\"lineNum\":0,\"lineType\":1,\"content\":\"軍直符、天使、天傷、羊陀、火鈴、空刼忌星逢一二位，主人離\",\"logicSentenceId\":\"7580381736106786870\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"124\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179200889946127\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"125\",\"lineNum\":0,\"lineType\":1,\"content\":\"財散，疾病、哭泣之兆。\",\"logicSentenceId\":\"7580381736106786870\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"126\",\"lineNum\":0,\"lineType\":1,\"content\":\"若嵗限犯重月日一二位，又逢忌星合者，官吏遭謫，常人招橫事，婦人損胎，病者死亡。\",\"logicSentenceId\":\"7580381736106803254\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"127\",\"lineNum\":0,\"lineType\":1,\"content\":\"若𢙣殺在不得地，如風雨暴過。\",\"logicSentenceId\":\"7580381736106819638\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"128\",\"lineNum\":0,\"lineType\":1,\"content\":\"若歲限臨無吉星，命中無故，其年難過，必死。\",\"logicSentenceId\":\"7580381736106836022\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985140775","endPageId":"7330179200889946127","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736106803254\",\"content\":\"如果岁限重复犯了月、日中的一两位，又遇到忌星会合，官吏会遭贬谪，普通人会招来意外灾祸，妇女会流产，病人会死亡。\"},{\"logicSentenceId\":\"7580381736106819638\",\"content\":\"如果凶煞星处于不利的宫位，就像暴风雨突然过去一样。\"},{\"logicSentenceId\":\"7580381736106836022\",\"content\":\"如果岁限降临却没有吉星，命盘中又无化解之象，这年便难以度过，必定死亡。\"},{\"logicSentenceId\":\"7580381736106770486\",\"content\":\"太岁运行到奏书将的位置。\"},{\"logicSentenceId\":\"7580381736106786870\",\"content\":\"军直符、天使、天伤、羊陀、火铃、空劫这些忌星遇到其中一两个，是主人离散、钱财散尽、疾病、哭泣的征兆。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":2066,"chapterOrder":28,"inChapterOrder":28,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274682394","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"129\",\"lineNum\":0,\"lineType\":10,\"content\":\"論二限太嵗吉㐫\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179200889946127","endPageId":"7330179200889946127","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":124,"chapterOrder":28,"inChapterOrder":29,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274698778","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"130\",\"lineNum\":0,\"lineType\":1,\"content\":\"湏詳大限獨守，吉㐫何如，小限獨守，吉㐫何如？\",\"logicSentenceId\":\"7580381736106852406\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"131\",\"lineNum\":0,\"lineType\":1,\"content\":\"太嵗獨守，吉㐫何如？\",\"logicSentenceId\":\"7580381736106868790\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"132\",\"lineNum\":0,\"lineType\":1,\"content\":\"歲限俱㐫則㐫。\",\"logicSentenceId\":\"7580381736106885174\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"133\",\"lineNum\":0,\"lineType\":1,\"content\":\"又看大限與小限相逢，吉㐫何如。\",\"logicSentenceId\":\"7580381736106901558\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"134\",\"lineNum\":0,\"lineType\":1,\"content\":\"太限逢太嵗，吉㐫何如？\",\"logicSentenceId\":\"7580381736106917942\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"135\",\"lineNum\":0,\"lineType\":1,\"content\":\"小限逢太嵗，吉㐫何如，禍福尢𦂳。\",\"logicSentenceId\":\"7580381736106934326\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"136\",\"lineNum\":0,\"lineType\":1,\"content\":\"又看太歲冲大限、小限，太嵗冲羊陀七殺，然後可断夀夭荣枯。\",\"logicSentenceId\":\"7580381736106950710\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179200889946127","endPageId":"7330179200889946127","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736106885174\",\"content\":\"大限、小限、太岁都有凶星守命，那就一定是凶兆。\"},{\"logicSentenceId\":\"7580381736106901558\",\"content\":\"又要看大限与小限相逢，吉凶如何。\"},{\"logicSentenceId\":\"7580381736106917942\",\"content\":\"大限遇到太岁，吉凶如何？\"},{\"logicSentenceId\":\"7580381736106934326\",\"content\":\"小限遇到太岁时，吉凶如何，祸福尤其紧要。\"},{\"logicSentenceId\":\"7580381736106950710\",\"content\":\"还要看太岁冲犯大限、小限，太岁冲犯羊陀七杀，然后才可以推断寿命长短、荣盛衰落。\"},{\"logicSentenceId\":\"7580381736106852406\",\"content\":\"必须详细考察大限独自坐守时，吉凶情况如何，小限独自坐守时，吉凶情况如何？\"},{\"logicSentenceId\":\"7580381736106868790\",\"content\":\"太岁单独坐守，吉凶如何？\"}]}","chapterId":"1jvzop58rvpyq","dataSize":2114,"chapterOrder":28,"inChapterOrder":30,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274715162","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"137\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179141985239079\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"138\",\"lineNum\":0,\"lineType\":10,\"content\":\"論行限分南北斗\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985239079","endPageId":"7330179141985239079","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":241,"chapterOrder":28,"inChapterOrder":31,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274731546","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"139\",\"lineNum\":0,\"lineType\":1,\"content\":\"陽男隂女，南斗為福；隂男陽女，北斗為福。\",\"logicSentenceId\":\"7580381736106967094\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"140\",\"lineNum\":0,\"lineType\":1,\"content\":\"北斗諸星吉㐫，大限断上五年應，小限断上半年應。\",\"logicSentenceId\":\"7580381736106983478\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"141\",\"lineNum\":0,\"lineType\":1,\"content\":\"南斗諸星吉㐫，大限断下五年應，小限斷下半年應。\",\"logicSentenceId\":\"7580381736106999862\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985239079","endPageId":"7330179141985239079","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736106999862\",\"content\":\"南斗诸星的吉凶，大限对应的吉凶在接下来五年应验，小限对应的吉凶在下半年应验。\"},{\"logicSentenceId\":\"7580381736106967094\",\"content\":\"阳年出生的男性和阴年出生的女性，以南斗星为福运；阴年出生的男性和阳年出生的女性，以北斗星为福运。\"},{\"logicSentenceId\":\"7580381736106983478\",\"content\":\"北斗各星的吉凶情况，大限推断上五年应验，小限推断上半年应验。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1126,"chapterOrder":28,"inChapterOrder":32,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274747930","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"142\",\"lineNum\":0,\"lineType\":10,\"content\":\"論流年太嵗逢吉㐫星殺\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985239079","endPageId":"7330179141985239079","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":133,"chapterOrder":28,"inChapterOrder":33,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274764314","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"143\",\"lineNum\":0,\"lineType\":1,\"content\":\"几太嵗看三方對照星辰，吉㐫何如，以定禍福。\",\"logicSentenceId\":\"7580381736107016246\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985239079","endPageId":"7330179141985239079","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107016246\",\"content\":\"考察太岁的三方对照星辰，吉凶如何，以此来确定祸福。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":352,"chapterOrder":28,"inChapterOrder":34,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274780698","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"144\",\"lineNum\":0,\"lineType\":1,\"content\":\"太嵗在命宫行，看禍福尤𦂳。\",\"logicSentenceId\":\"7580381736107032630\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"145\",\"lineNum\":0,\"lineType\":1,\"content\":\"如命在子宫，太嵗到子，又癸生人，逢吉則吉，遇㐫則㐫。\",\"logicSentenceId\":\"7580381736107049014\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985239079","endPageId":"7330179141985239079","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107032630\",\"content\":\"太岁运行到命宫时，查看祸福尤为要紧。\"},{\"logicSentenceId\":\"7580381736107049014\",\"content\":\"如果命宫在子宫位，太岁运行到子位，又是癸年出生的人，遇到吉星就吉利，碰到凶星就凶险。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":695,"chapterOrder":28,"inChapterOrder":35,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274797082","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"146\",\"lineNum\":0,\"lineType\":10,\"content\":\"論隂隲延夀\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985239079","endPageId":"7330179141985239079","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":118,"chapterOrder":28,"inChapterOrder":36,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274813466","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"147\",\"lineNum\":0,\"lineType\":1,\"content\":\"隂隲延夀生百福，雖然倒限不遭傷。\",\"logicSentenceId\":\"7580381736107065398\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"148\",\"lineNum\":0,\"lineType\":1,\"content\":\"假如有人大小二限及\",\"logicSentenceId\":\"7580381736107081782\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"149\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179200890109967\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"150\",\"lineNum\":0,\"lineType\":1,\"content\":\"太嵗到㐫陥地，有延過壽去不死者，還是其人曾行隂隲。\",\"logicSentenceId\":\"7580381736107081782\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"151\",\"lineNum\":0,\"lineType\":1,\"content\":\"平曰利物濟人，反身修徳，以作善降祥，雖㐫不害。\",\"logicSentenceId\":\"7580381736107098166\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"152\",\"lineNum\":0,\"lineType\":1,\"content\":\"如宋郊編荻橋渡蟻是也。\",\"logicSentenceId\":\"7580381736107114550\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"153\",\"lineNum\":0,\"lineType\":1,\"content\":\"又如諸葛亮火燒藤甲軍，傷人太毒，减夀一紀，當以此𠫵詳。\",\"logicSentenceId\":\"7580381736107130934\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985239079","endPageId":"7330179200890109967","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107114550\",\"content\":\"就像宋郊编织荻草为桥让蚂蚁渡河的例子一样。\"},{\"logicSentenceId\":\"7580381736107130934\",\"content\":\"又比如诸葛亮火烧藤甲军，伤人过于狠毒，减少了十二年的寿命，应当用这个例子来参考。\"},{\"logicSentenceId\":\"7580381736107065398\",\"content\":\"积阴德能延长寿命、带来诸多福分，即使限运不顺也不会遭受伤害。\"},{\"logicSentenceId\":\"7580381736107081782\",\"content\":\"假如有人的大运、小运以及太岁都走到了凶陷的宫位，却能够平安度过这个期限没有死去，那是因为这个人曾经做过积德行善的事情。\"},{\"logicSentenceId\":\"7580381736107098166\",\"content\":\"平日做利益他人、救济众人之事，反省自身修养品德，因为行善而天降吉祥，即使遭遇凶险也不会受到伤害。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":2099,"chapterOrder":28,"inChapterOrder":37,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274829850","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"154\",\"lineNum\":0,\"lineType\":10,\"content\":\"論羊陀迭併\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179200890109967","endPageId":"7330179200890109967","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":118,"chapterOrder":28,"inChapterOrder":38,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891274846234","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"155\",\"lineNum\":0,\"lineType\":1,\"content\":\"如庚生人，命在卯宫，遷移在酉宫，如遇羊陀流年，亦庚禄居申，流羊在酉，流陀在未，是命在卯宮，原有酉宫擎羊冲合流年，又遇流羊流陀，謂之羊陀迭併\",\"logicSentenceId\":\"7580381736107147318\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179200890109967","endPageId":"7330179200890109967","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107147318\",\"content\":\"比如庚年出生的人，命宫在卯宫，迁移宫在酉宫，若遇到羊陀星所在的流年，而且庚的禄位在申宫，流羊星在酉宫，流年陀罗在未宫，这样命宫在卯宫，原本就有酉宫的擎羊星与流年冲合，又遇上流羊星和流陀星，这就叫做羊陀迭并。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":730,"chapterOrder":28,"inChapterOrder":39,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891626856486","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"156\",\"lineNum\":0,\"lineType\":10,\"content\":\"論七殺重逢\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179200890109967","endPageId":"7330179200890109967","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":118,"chapterOrder":28,"inChapterOrder":40,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891626872870","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"157\",\"lineNum\":0,\"lineType\":1,\"content\":\"如命中三合原有七殺守照，而流年又遇流羊、流陀冲照，謂\",\"logicSentenceId\":\"7580381736107163702\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"158\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179141985320999\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"159\",\"lineNum\":0,\"lineType\":1,\"content\":\"之七殺重逢，二者為禍最毒，入庙災晦减輕。\",\"logicSentenceId\":\"7580381736107163702\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"160\",\"lineNum\":0,\"lineType\":1,\"content\":\"如𨺻地逢忌，及卯酉遇擎羊，為閑宫，午生人不利也。\",\"logicSentenceId\":\"7580381736107180086\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"161\",\"lineNum\":0,\"lineType\":1,\"content\":\"然七殺逢吉曜，衆亦轉㐫化吉，不可一槩論㐫。\",\"logicSentenceId\":\"7580381736107196470\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"162\",\"lineNum\":0,\"lineType\":1,\"content\":\"擎羊、陀羅、七殺，逢紫微天相、禄存三合拱照，可觧\",\"logicSentenceId\":\"7580381736107212854\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179200890109967","endPageId":"7330179141985320999","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107163702\",\"content\":\"如果命盘中三合宫原本就有七杀星坐守照命，而在当年又遇到流羊星、流陀星冲照，这就叫做七杀重逢，这两种情况带来的灾祸最为严重，若星曜入庙则灾祸和晦气会减轻。\"},{\"logicSentenceId\":\"7580381736107180086\",\"content\":\"如果在陷地遇到忌星，以及在卯宫、酉宫遇到擎羊星，这两个宫位属于闲宫，对午生人不利。\"},{\"logicSentenceId\":\"7580381736107196470\",\"content\":\"然而七杀星遇上吉祥的星曜，大多也能转凶为吉，不能一概而论说都是凶兆。\"},{\"logicSentenceId\":\"7580381736107212854\",\"content\":\"擎羊、陀罗、七杀，遇到紫微、天相、禄存以三合的方式拱照，就可以化解。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1889,"chapterOrder":28,"inChapterOrder":41,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891626889254","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"163\",\"lineNum\":0,\"lineType\":1,\"content\":\"詩：羊陀迭併命難逃，七殺重逢禍必遭。\",\"logicSentenceId\":\"7580381736107229238\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"164\",\"lineNum\":0,\"lineType\":1,\"content\":\"曰：太嵗二限臨此地，十生九死不堅牢。\",\"logicSentenceId\":\"7580381736107245622\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985320999","endPageId":"7330179141985320999","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107245622\",\"content\":\"诗云：太岁和大小二限来到此地，十有九死难以安稳。\"},{\"logicSentenceId\":\"7580381736107229238\",\"content\":\"诗说：擎羊星和陀罗星叠加并列，命运往往难以逃脱厄运，七杀星再次相逢灾祸必定降临。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":697,"chapterOrder":28,"inChapterOrder":42,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891626905638","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"165\",\"lineNum\":0,\"lineType\":10,\"content\":\"論大小二限星辰過十二宫遇十二夫人所忌訣\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985320999","endPageId":"7330179141985320999","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":160,"chapterOrder":28,"inChapterOrder":43,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891626922022","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"166\",\"lineNum\":0,\"lineType\":2,\"content\":\"遇此主災悔，官非孝服，火盗破財，刑傷，死亡立見。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985320999","endPageId":"7330179141985320999","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":174,"chapterOrder":28,"inChapterOrder":44,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891626938406","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"167\",\"lineNum\":0,\"lineType\":1,\"content\":\"人生子命忌寅申，假如子年生人，切忌寅申嵗限，災悔至重。\",\"logicSentenceId\":\"7580381736107262006\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"168\",\"lineNum\":0,\"lineType\":1,\"content\":\"及忌子午嵗限\",\"logicSentenceId\":\"7580381736107278390\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"169\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179292686499855\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"170\",\"lineNum\":0,\"lineType\":1,\"content\":\"相冲。\",\"logicSentenceId\":\"7580381736107278390\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985320999","endPageId":"7330179292686499855","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107262006\",\"content\":\"出生年份为子年的人要忌讳寅年和申年，如果是子年出生的人，一定要注意在寅年和申年的运势，这两个年份的灾祸和晦气会非常严重。\"},{\"logicSentenceId\":\"7580381736107278390\",\"content\":\"以及忌讳子年与午年的岁限相冲。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":955,"chapterOrder":28,"inChapterOrder":45,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891626954790","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"171\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑午生人丑午嗔。\",\"logicSentenceId\":\"7580381736107294774\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"172\",\"lineNum\":0,\"lineType\":1,\"content\":\"假如丑生人忌午丑嵗限，午生人亦忌丑午歲限，及忌七殺星，災悔極重。\",\"logicSentenceId\":\"7580381736107311158\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179292686499855","endPageId":"7330179292686499855","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107294774\",\"content\":\"丑年、午年出生的人，忌遇丑、午岁限。\"},{\"logicSentenceId\":\"7580381736107311158\",\"content\":\"假如是丑年出生的人忌讳经历午、丑的岁限，午年出生的人也忌讳经历丑、午的岁限，并且忌讳遇到七杀星，这样带来的灾祸和晦气极其严重。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":760,"chapterOrder":28,"inChapterOrder":46,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891626971174","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"173\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅卯之人防已亥，假如寅卯人忌己亥嵗限，及忌卯酉寅申相冲。\",\"logicSentenceId\":\"7580381736107327542\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179292686499855","endPageId":"7330179292686499855","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107327542\",\"content\":\"寅年或卯年出生的人要防备己亥年，假如寅年或卯年出生的人忌讳己亥年，并且要忌讳卯酉、寅申相冲的情况。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":445,"chapterOrder":28,"inChapterOrder":47,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891626987558","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"174\",\"lineNum\":0,\"lineType\":1,\"content\":\"蛇龍切忌本身臨。\",\"logicSentenceId\":\"7580381736107343926\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"175\",\"lineNum\":0,\"lineType\":1,\"content\":\"假如巳生人忌逢已年，及忌行到巳限；辰生人忌行辰年，及忌行到辰限為天羅文忌到戍爲地綱限，遇此主灾殃水厄之險，官非破財，憂制連連。\",\"logicSentenceId\":\"7580381736107360310\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179292686499855","endPageId":"7330179292686499855","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107343926\",\"content\":\"属蛇和属龙的人切忌遇到与自身属相相同的岁限。\"},{\"logicSentenceId\":\"7580381736107360310\",\"content\":\"如果是巳年出生的人，忌讳遇到巳年，也忌讳走到巳这一运势期限；辰年出生的人，忌讳遇到辰年，也忌讳走到辰这一运势期限，这是天罗；忌讳走到戌这一运势期限，这是地纲。遇到这些情况，会有灾殃、水厄的危险，会遭遇官司、破财，忧愁不断。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1009,"chapterOrder":28,"inChapterOrder":48,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891627003942","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"176\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179141985402919\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"177\",\"lineNum\":0,\"lineType\":1,\"content\":\"申人鈴火災殃重。\",\"logicSentenceId\":\"7580381736107376694\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"178\",\"lineNum\":0,\"lineType\":1,\"content\":\"假如申生人，忌逢火鈴二星，必主災悔至重。\",\"logicSentenceId\":\"7580381736107393078\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"179\",\"lineNum\":0,\"lineType\":1,\"content\":\"及忌寅年冲。\",\"logicSentenceId\":\"7580381736107409462\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985402919","endPageId":"7330179141985402919","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107376694\",\"content\":\"申年出生的人遇到铃星和火星，灾殃会很严重。\"},{\"logicSentenceId\":\"7580381736107393078\",\"content\":\"假如申年出生的人，忌讳遇到火星、铃星这两颗星，必定会有非常严重的灾祸和不幸。\"},{\"logicSentenceId\":\"7580381736107409462\",\"content\":\"以及忌讳寅年相冲。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1003,"chapterOrder":28,"inChapterOrder":49,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891736072201","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"180\",\"lineNum\":0,\"lineType\":1,\"content\":\"未遇猪鷄墓患殷。\",\"logicSentenceId\":\"7580381736107425846\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"181\",\"lineNum\":0,\"lineType\":1,\"content\":\"假如未生忌逢酉亥歲限，又忌見擎羊在四墓宫。\",\"logicSentenceId\":\"7580381736107442230\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985402919","endPageId":"7330179141985402919","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107425846\",\"content\":\"未年出生的人忌讳遇到亥年、酉年，会有严重的灾祸忧患。\"},{\"logicSentenceId\":\"7580381736107442230\",\"content\":\"假如未年出生的人忌讳遇到酉年、亥年的岁限，又忌讳见到擎羊星在四墓宫。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":664,"chapterOrder":28,"inChapterOrder":50,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891736088585","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"182\",\"lineNum\":0,\"lineType\":1,\"content\":\"戍亥羊陀湏避忌。\",\"logicSentenceId\":\"7580381736107458614\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"183\",\"lineNum\":0,\"lineType\":1,\"content\":\"假如戍亥生人，忌遇羊陀，災重。\",\"logicSentenceId\":\"7580381736107474998\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"184\",\"lineNum\":0,\"lineType\":1,\"content\":\"戍生人又忌行到戌宫嵗限為地網，又忌行到辰宫嵗限為天羅，為之辰戌相冲，\",\"logicSentenceId\":\"7580381736107491382\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"185\",\"lineNum\":0,\"lineType\":2,\"content\":\"不羙。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985402919","endPageId":"7330179141985402919","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107458614\",\"content\":\"戌年、亥年出生的人必须避开擎羊星和陀罗星。\"},{\"logicSentenceId\":\"7580381736107474998\",\"content\":\"假如是戌年或亥年出生的人，忌讳遇到擎羊星和陀罗星，灾祸严重。\"},{\"logicSentenceId\":\"7580381736107491382\",\"content\":\"戌年出生的人又忌讳行至戌宫岁限，这是地网，又忌讳行至辰宫岁限，这是天罗，因为辰戌相冲。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1112,"chapterOrder":28,"inChapterOrder":51,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891736104969","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"186\",\"lineNum\":0,\"lineType\":1,\"content\":\"酉人陀刃亦非親。\",\"logicSentenceId\":\"7580381736107507766\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"187\",\"lineNum\":0,\"lineType\":1,\"content\":\"假如酉生人亦忌羊陀星歲限，及忌行卯宫限，及卯年歲君相冲\",\"logicSentenceId\":\"7580381736107524150\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179141985402919","endPageId":"7330179141985402919","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107524150\",\"content\":\"假如出生在酉年的人，也忌讳遇到羊陀星所在的岁限，还忌讳走到卯宫的岁限，以及与卯年的岁君相冲。\"},{\"logicSentenceId\":\"7580381736107507766\",\"content\":\"酉年出生的人也要避免陀罗、擎羊二星。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":694,"chapterOrder":28,"inChapterOrder":52,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891736121353","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"188\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179292686614543\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"189\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌：猪犬生人莫遇陀，辰戍切忌到綱羅。\",\"logicSentenceId\":\"7580381736107540534\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179292686614543","endPageId":"7330179292686614543","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107540534\",\"content\":\"口诀说：属猪属狗的人不要遇到陀罗星，遇到辰戌岁限千万要避开天罗地网。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":487,"chapterOrder":28,"inChapterOrder":53,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891736137737","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"190\",\"lineNum\":0,\"lineType\":1,\"content\":\"曰：預先整頓衣冠木，未免生人唱挽歌。\",\"logicSentenceId\":\"7580381736107556918\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179292686614543","endPageId":"7330179292686614543","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107556918\",\"content\":\"预先准备好棺材的木料，免不了活着的人唱起挽歌。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":337,"chapterOrder":28,"inChapterOrder":54,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891736154121","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"191\",\"lineNum\":0,\"lineType\":10,\"content\":\"論立命行限宫歌\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179292686614543","endPageId":"7330179292686614543","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":124,"chapterOrder":28,"inChapterOrder":55,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891736170505","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"192\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌：\",\"logicSentenceId\":\"7580381736107573302\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"193\",\"lineNum\":0,\"lineType\":2,\"content\":\"金人遇坎命湏傷，木命逢離有禍殃。水遇良宫應蹇滯，火來兑上禍難藏。土到東南逢震巽，曰湏防膿血及驚慌。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179292686614543","endPageId":"7330179292686614543","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107573302\",\"content\":\"歌：。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":446,"chapterOrder":28,"inChapterOrder":56,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891736186889","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"194\",\"lineNum\":0,\"lineType\":1,\"content\":\"縱然吉曜相逢照，未免官災閙一塲。\",\"logicSentenceId\":\"7580381736107589686\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179292686614543","endPageId":"7330179292686614543","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107589686\",\"content\":\"即使吉星相遇照耀，也难免会有一场官场灾祸。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":325,"chapterOrder":28,"inChapterOrder":57,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891736203273","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"195\",\"lineNum\":0,\"lineType\":10,\"content\":\"論太嵗小限\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179292686614543","endPageId":"7330179292686614543","contentEncryptType":0,"translateContent":"","chapterId":"1jvzop58rvpyq","dataSize":118,"chapterOrder":28,"inChapterOrder":58,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891736219657","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"196\",\"lineNum\":0,\"lineType\":1,\"content\":\"星辰庙陷，遇十二宫中吉㐫，依此判断。\",\"logicSentenceId\":\"7580381736107606070\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"197\",\"lineNum\":0,\"lineType\":1,\"content\":\"人行年災患，响應如神。\",\"logicSentenceId\":\"7580381736107622454\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179292686614543","endPageId":"7330179292686614543","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107606070\",\"content\":\"星辰在庙旺、落陷的状态下，遇到十二宫中的吉凶，就依照上面所说的内容来进行判断。\"},{\"logicSentenceId\":\"7580381736107622454\",\"content\":\"人一年中的灾祸忧患，灵验如神。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":646,"chapterOrder":28,"inChapterOrder":59,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891920457779","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"198\",\"lineNum\":0,\"lineType\":1,\"content\":\"子年太嵗併小限到子宫，入庙化吉，\",\"logicSentenceId\":\"7580381736107638838\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"199\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179267113844772\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"200\",\"lineNum\":0,\"lineType\":1,\"content\":\"七殺破軍，在子宫守歲限。\",\"logicSentenceId\":\"7580381736107638838\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"201\",\"lineNum\":0,\"lineType\":1,\"content\":\"癸庚已人發福，巨門、天機，乙癸生人發福，天府、天相、天梁。\",\"logicSentenceId\":\"7580381736107655222\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"202\",\"lineNum\":0,\"lineType\":1,\"content\":\"丁已、庚生人財旺遂心，天同丙丁生人，財官雙羙。\",\"logicSentenceId\":\"7580381736107671606\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179292686614543","endPageId":"7330179267113844772","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107671606\",\"content\":\"丁巳、庚年出生的人财运兴旺称心如意；天同星，丙、丁年出生的人，财富和官职两全其美。\"},{\"logicSentenceId\":\"7580381736107638838\",\"content\":\"子年时太岁和小限一同到子宫，进入庙旺状态化为吉祥，七杀、破军二星在子宫守护这一年的岁限。\"},{\"logicSentenceId\":\"7580381736107655222\",\"content\":\"癸年、庚年、己年出生的人会发福，有巨门星、天机星，乙年、癸年出生的人会发福，有天府星、天相星、天梁星。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1453,"chapterOrder":28,"inChapterOrder":60,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891920474163","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"203\",\"lineNum\":0,\"lineType\":1,\"content\":\"子年太嵗併小限到子宫，不入廟，化㐫。\",\"logicSentenceId\":\"7580381736107687990\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"204\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微在子宫守命，及嵗限。\",\"logicSentenceId\":\"7580381736107704374\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"205\",\"lineNum\":0,\"lineType\":1,\"content\":\"丙戊、壬生人悔吝，破財災殃。\",\"logicSentenceId\":\"7580381736107720758\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179267113844772","endPageId":"7330179267113844772","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107704374\",\"content\":\"紫微星在子宫坐守命宫和岁限宫位。\"},{\"logicSentenceId\":\"7580381736107720758\",\"content\":\"丙年、戊年、壬年出生的人会有悔恨遗憾之事，遭遇破财和灾祸。\"},{\"logicSentenceId\":\"7580381736107687990\",\"content\":\"子年太岁和小限到子宫，不入庙，化为凶象。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":907,"chapterOrder":28,"inChapterOrder":61,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891920490547","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"206\",\"lineNum\":0,\"lineType\":1,\"content\":\"子年太嵗所值吉㐫星：禄存、天機、天同、太隂、昌曲、輔弼、破軍、天相、㢘貞、武曲、天府、巨門、七殺，可断。\",\"logicSentenceId\":\"7580381736107737142\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"207\",\"lineNum\":0,\"lineType\":1,\"content\":\"其年人財两羙，事事遂心。\",\"logicSentenceId\":\"7580381736107753526\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"208\",\"lineNum\":0,\"lineType\":1,\"content\":\"若遇貪狼、紫微、天梁、忌星、太陽擎羊，便断人財耗散，官災，孝服，口舌，本身\",\"logicSentenceId\":\"7580381736107769910\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"209\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179292686761999\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"210\",\"lineNum\":0,\"lineType\":1,\"content\":\"災悔，不寕，减半論之。\",\"logicSentenceId\":\"7580381736107769910\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179267113844772","endPageId":"7330179292686761999","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107769910\",\"content\":\"若遇到贪狼、紫微、天梁、忌星、太阳、擎羊，就推断会出现人财耗散、官灾、孝服、口舌是非、自身有灾祸悔恨、不得安宁的情况，减半来论断。\"},{\"logicSentenceId\":\"7580381736107737142\",\"content\":\"子年太岁所对应的吉凶星有：禄存、天机、天同、太阴、文昌文曲、左辅右弼、破军、天相、廉贞、武曲、天府、巨门、七杀，可据此判断吉凶。\"},{\"logicSentenceId\":\"7580381736107753526\",\"content\":\"这一年，人事和财运都很好，事事都能顺遂心意。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1594,"chapterOrder":28,"inChapterOrder":62,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891920506931","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"211\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑年太嵗併小限到丑宫，入庙化吉，天機在丑守命，丙辛生人發旺，天相、戊生人發旺，太隂、武曲，丙戊生人發旺，天府、𤎉貞、戊生人發旺，天梁，丙戊辛生人發旺。\",\"logicSentenceId\":\"7580381736107786294\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179292686761999","endPageId":"7330179292686761999","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736107786294\",\"content\":\"丑年太岁和小限到丑宫，入庙可化解为吉利之象，天机星在丑宫坐守命宫，丙年和辛年出生的人会兴旺发达，天相星，戊年出生的人会兴旺发达，太阴星、武曲星，丙年和戊年出生的人会兴旺发达，天府星、廉贞星，戊年出生的人会兴旺发达，天梁星，丙年、戊年和辛年出生的人会兴旺发达。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":827,"chapterOrder":28,"inChapterOrder":63,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891920523315","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"212\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑年太嵗併小限到丑宫，不入庙化㐫。\",\"logicSentenceId\":\"7580381736107802678\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"213\",\"lineNum\":0,\"lineType\":1, ":\"7580381736108212278\",\"content\":\"出生年份天干为癸和甲的人，财运、官运和禄运都很旺盛。\"},{\"logicSentenceId\":\"7580381736108228662\",\"content\":\"天机、太阳星，丁、庚、癸年出生的人财禄发旺；天同星，戊、庚、癸年出生的人顺遂。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1681,"chapterOrder":28,"inChapterOrder":72,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891920670771","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"250\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰年太嵗併小限到辰宮，不入庙，化㐫。\",\"logicSentenceId\":\"7580381736108261430\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"251\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼、武曲在辰，壬癸生人災悔，天同、巨門、丁庚生人悔吝。\",\"logicSentenceId\":\"7580381736108277814\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"252\",\"lineNum\":0,\"lineType\":1,\"content\":\"亷貞壬癸生人，主災悔至重。\",\"logicSentenceId\":\"7580381736108294198\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"253\",\"lineNum\":0,\"lineType\":1,\"content\":\"太隂太陽、天機、甲乙、戊巳生人災悔。\",\"logicSentenceId\":\"7580381736108310582\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179267114008612","endPageId":"7330179267114008612","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736108294198\",\"content\":\"廉贞星对壬年或癸年出生的人来说，预示着灾祸和悔恨极其严重。\"},{\"logicSentenceId\":\"7580381736108310582\",\"content\":\"太阴、太阳、天机，甲乙、戊巳年出生的人会有灾祸和悔恨。\"},{\"logicSentenceId\":\"7580381736108261430\",\"content\":\"辰年太岁和小限运行到辰宫，若不在庙旺之地，就会化为凶象。\"},{\"logicSentenceId\":\"7580381736108277814\",\"content\":\"贪狼、武曲星在辰宫时，壬年、癸年出生的人会有灾祸和悔恨之事，天同、巨门星在辰宫时，丁年、庚年出生的人会有懊恼和遗憾之事。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1426,"chapterOrder":28,"inChapterOrder":73,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891920687155","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"254\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰年太嵗所值吉㐫星：\",\"logicSentenceId\":\"7580381736108326966\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"255\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330179366821068835\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"256\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽、天機、天梁、七殺、貪狼、文昌、左輔、右弼便断。\",\"logicSentenceId\":\"7580381736108326966\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"257\",\"lineNum\":0,\"lineType\":1,\"content\":\"其年財禄大進益，家道興隆，添丁進口，婚姻喜慶重重。\",\"logicSentenceId\":\"7580381736108343350\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"258\",\"lineNum\":0,\"lineType\":1,\"content\":\"若遇紫微、天同、㢘貞、天府、太隂、巨門、天相、破軍忌宿，便断。\",\"logicSentenceId\":\"7580381858358100009\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"259\",\"lineNum\":0,\"lineType\":1,\"content\":\"其年破敗孝服，官災、口舌。\",\"logicSentenceId\":\"7580381858358116393\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330179267114008612","endPageId":"7330179366821068835","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7580381736108326966\",\"content\":\"辰年太岁所对应的吉凶星：太阳、天机、天梁、七杀、贪狼、文昌、左辅、右弼即可论断。\"},{\"logicSentenceId\":\"7580381736108343350\",\"content\":\"这一年财禄大幅增加，家庭兴旺发达，家中添丁，婚姻喜事不断。\"},{\"logicSentenceId\":\"7580381858358100009\",\"content\":\"如果遇到紫微、天同、廉贞、天府、太阴、巨门、天相、破军这些忌星，就进行推断。\"},{\"logicSentenceId\":\"7580381858358116393\",\"content\":\"这一年会家道破败、遭遇丧事，还会有官司灾祸、口舌是非。\"}]}","chapterId":"1jvzop58rvpyq","dataSize":1705,"chapterOrder":28,"inChapterOrder":74,"volumeId":"7330179081331277875","volumeVersion":44},{"paragraphId":"7356158891920703539","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"260\",\"lineNum\":0,\"lineType\":1,\"content\":\"巳年太嵗併小限到巳宫，入庙化吉。\",\"logicSentenceId\":\"7580381858358132777\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"261\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微天府、天同、巨門、天相、天梁、破軍。\",\"logicSentenceId\":\"7580381858358149161\",\"marginNoteIdList\":nu
