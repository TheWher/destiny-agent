\":\"化䕃名延夀，父母宫主星。\",\"logicSentenceId\":\"7587041035319279670\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"655\",\"lineNum\":0,\"lineType\":1,\"content\":\"田宅，兄弟内得之福自生。\",\"logicSentenceId\":\"7587041035319296054\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"656\",\"lineNum\":0,\"lineType\":1,\"content\":\"形神自持重，心性更和平。\",\"logicSentenceId\":\"7587041035319312438\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"657\",\"lineNum\":0,\"lineType\":1,\"content\":\"生來無災患，文\",\"logicSentenceId\":\"7587041035319328822\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"658\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174813065035795\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"659\",\"lineNum\":0,\"lineType\":2,\"content\":\"章\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"660\",\"lineNum\":0,\"lineType\":1,\"content\":\"有聲名。\",\"logicSentenceId\":\"7587041035319328822\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"661\",\"lineNum\":0,\"lineType\":1,\"content\":\"六親更和睦，仕䆠居王庭。\",\"logicSentenceId\":\"7587041035319345206\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"662\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門若相㑹，劳磅歴艱辛。\",\"logicSentenceId\":\"7587041035319361590\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"663\",\"lineNum\":0,\"lineType\":1,\"content\":\"若\",\"logicSentenceId\":\"7587041035319377974\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"664\",\"lineNum\":0,\"lineType\":2,\"content\":\"逢天\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"665\",\"lineNum\":0,\"lineType\":1,\"content\":\"機照，僧道享山林。\",\"logicSentenceId\":\"7587041035319377974\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174764830638092","endPageId":"7330174813065035795","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035319099446\",\"content\":\"戊年或巳年出生的人符合此格局，如果被四煞星冲破命局，就如同禾苗长成却不开花结实。\"},{\"logicSentenceId\":\"7587041035319132214\",\"content\":\"廉贞星与刑星、忌星同见天梁星，必定没有克敌制胜的忧虑；火星、铃星、刑星、暗星遇上天梁星，也没有征战的困扰。\"},{\"logicSentenceId\":\"7587041035319230518\",\"content\":\"女人有吉星入庙，能旺丈夫、利于子女，有文昌、文曲、左辅、右弼扶持，可获封赠；若被擎羊、陀罗、火星、忌星冲破刑克，会招来不少是非。\"},{\"logicSentenceId\":\"7587041035319361590\",\"content\":\"巨门星如果相会，会经历劳累和艰辛。\"},{\"logicSentenceId\":\"7587041035319083062\",\"content\":\"天梁星在父母宫时，代表其人稳重且有威严；若天梁星与太阳星在福德宫相会，命主会拥有极高的地位和尊贵的身份。\"},{\"logicSentenceId\":\"7587041035319164982\",\"content\":\"白虎与奏书、食禄会合，会有意外的荣耀；青龙发动，则有文书方面的喜事。\"},{\"logicSentenceId\":\"7587041035319328822\",\"content\":\"生来没有灾祸忧患，在文学方面有声望名誉。\"},{\"logicSentenceId\":\"7587041035319181366\",\"content\":\"小耗、大耗二星相遇，所做之事都不能成功。\"},{\"logicSentenceId\":\"7587041035319296054\",\"content\":\"在田宅宫、兄弟宫，自然会获得其中的福运。\"},{\"logicSentenceId\":\"7587041035319148598\",\"content\":\"当天梁星与太岁相冲时，反而会带来福气。\"},{\"logicSentenceId\":\"7587041035319246902\",\"content\":\"对僧人道士来说是适宜的。\"},{\"logicSentenceId\":\"7587041035319377974\",\"content\":\"如果天机星照耀，僧人道士能在山林中安享生活。\"},{\"logicSentenceId\":\"7587041035319312438\",\"content\":\"形态和精神稳重，心性更加平和。\"},{\"logicSentenceId\":\"7587041035319115830\",\"content\":\"天梁星与天机星、耗曜星同宫，命主会像僧道一样清闲；如果与贪狼星、巨门星同度，就会败坏伦理、扰乱习俗；命主的奴仆宫、疾厄宫出现这种情况，也不是丰足的论断。\"},{\"logicSentenceId\":\"7587041035319279670\",\"content\":\"天梁星化荫名为延寿，是父母宫的主星。\"},{\"logicSentenceId\":\"7587041035319197750\",\"content\":\"病符星、官符星相侵扰，不会造成灾祸。\"},{\"logicSentenceId\":\"7587041035319263286\",\"content\":\"歌诀说：天梁星原本属土，是南斗星中最吉祥的星。\"},{\"logicSentenceId\":\"7587041035319050294\",\"content\":\"希夷先生又说：天梁属南斗，是掌管寿命的星，化气为荫庇、为寿命，辅佐上帝的威权，是父母宫的主星，主人容貌清秀、性格温和，形体与精神稳重，性情光明磊落，通晓兵法。\"},{\"logicSentenceId\":\"7587041035319066678\",\"content\":\"若能与文昌、文曲、左辅、右弼星加会，可官至台省。\"},{\"logicSentenceId\":\"7587041035319214134\",\"content\":\"总结论述。\"},{\"logicSentenceId\":\"7587041035319345206\",\"content\":\"六亲更加和睦，当官的能在朝廷任职。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":7833,"chapterOrder":2,"inChapterOrder":40,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694662194","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"666\",\"lineNum\":0,\"lineType\":1,\"content\":\"二星在辰戍，福夀不湏論。\",\"logicSentenceId\":\"7587041035319394358\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"667\",\"lineNum\":0,\"lineType\":2,\"content\":\"問七殺星。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"668\",\"lineNum\":0,\"lineType\":1,\"content\":\"所主若何？\",\"logicSentenceId\":\"7587041035319410742\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"669\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：七殺，南斗第六星也，属火金，乃斗中之上将，實成敗之孤辰。\",\"logicSentenceId\":\"7587041035319427126\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"670\",\"lineNum\":0,\"lineType\":1,\"content\":\"在斗司斗柄，主於風憲，其威作金之靈，其性若淸凉之状。\",\"logicSentenceId\":\"7587041035319443510\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"671\",\"lineNum\":0,\"lineType\":1,\"content\":\"主於数，則冝僧道；主於身，定歷艱辛。\",\"logicSentenceId\":\"7587041035319459894\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"672\",\"lineNum\":0,\"lineType\":1,\"content\":\"在命官若限，不扶夭折；在官祿得地，化以為祥。\",\"logicSentenceId\":\"7587041035319476278\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"673\",\"lineNum\":0,\"lineType\":1,\"content\":\"在子息而\",\"logicSentenceId\":\"7587041035319492662\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"674\",\"lineNum\":0,\"lineType\":2,\"content\":\"子息。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"675\",\"lineNum\":0,\"lineType\":1,\"content\":\"孤卑，居夫婦而鴛衾半冷。\",\"logicSentenceId\":\"7587041035319492662\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"676\",\"lineNum\":0,\"lineType\":1,\"content\":\"㑹刑囚於田宅，父母刑傷父\",\"logicSentenceId\":\"7587041035319509046\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"677\",\"lineNum\":0,\"lineType\":2,\"content\":\"母産業\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"678\",\"lineNum\":0,\"lineType\":1,\"content\":\"難晋。\",\"logicSentenceId\":\"7587041035319509046\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"679\",\"lineNum\":0,\"lineType\":1,\"content\":\"逢刑忌殺于遷移，疾厄終身残疾。\",\"logicSentenceId\":\"7587041035319525430\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"680\",\"lineNum\":0,\"lineType\":1,\"content\":\"縱使一身孤獨，也應夀年不長。\",\"logicSentenceId\":\"7587041035319541814\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"681\",\"lineNum\":0,\"lineType\":1,\"content\":\"與囚於身命，折肢傷服，文主痨傷，會囚耗於遷移，死于道路。\",\"logicSentenceId\":\"7587041035319558198\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"682\",\"lineNum\":0,\"lineType\":1,\"content\":\"若臨陷弱之宮，爲殘較减；若值正隂之宫，\",\"logicSentenceId\":\"7587041035319574582\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"683\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174813065183251\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"684\",\"lineNum\":0,\"lineType\":1,\"content\":\"作禍𢙴深。\",\"logicSentenceId\":\"7587041035319574582\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"685\",\"lineNum\":0,\"lineType\":1,\"content\":\"流年殺曜莫教逢，身殺星辰休迭併。\",\"logicSentenceId\":\"7587041035319590966\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"686\",\"lineNum\":0,\"lineType\":1,\"content\":\"身殺逢惡曜於要地，命逢殺曜于三方。\",\"logicSentenceId\":\"7587041035319607350\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"687\",\"lineNum\":0,\"lineType\":1,\"content\":\"流殺又迭併，二限之中又逢，主陣亡掠死。\",\"logicSentenceId\":\"7587041035319623734\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"688\",\"lineNum\":0,\"lineType\":1,\"content\":\"合太陽、巨門㑹帝旺之郷，則吉；處空亡，犯刑殺，遭禍不輕。\",\"logicSentenceId\":\"7587041035319640118\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"689\",\"lineNum\":0,\"lineType\":1,\"content\":\"大小二限合身命，殺雖帝制也無功；三合對冲，雖禄亦無力。\",\"logicSentenceId\":\"7587041035319656502\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"690\",\"lineNum\":0,\"lineType\":1,\"content\":\"盖世英雄為殺制，此時一夣南柯。\",\"logicSentenceId\":\"7587041035319672886\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"691\",\"lineNum\":0,\"lineType\":1,\"content\":\"此乃倒限之地，所主，務要仔細推詳，乃数中之𢙣曜，實非善星也。\",\"logicSentenceId\":\"7587041035319689270\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174813065035795","endPageId":"7330174813065183251","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035319640118\",\"content\":\"太阳星与巨门星会合于帝旺的宫位，就吉利；处于空亡的宫位，触犯刑杀，遭遇的灾祸就不轻。\"},{\"logicSentenceId\":\"7587041035319574582\",\"content\":\"如果落入衰弱的宫位，带来的伤残会有所减轻；如果处于正阴的宫位，造成的灾祸更深重。\"},{\"logicSentenceId\":\"7587041035319656502\",\"content\":\"大限和小限会合身宫和命宫，杀星即使处于尊贵地位也没有功效；如果遇到三合对冲的情况，即便遇到禄星也没有力量。\"},{\"logicSentenceId\":\"7587041035319443510\",\"content\":\"在北斗中掌管斗柄，主管风纪法度，其威严展现金属的灵性，它的性情如同清凉的状态。\"},{\"logicSentenceId\":\"7587041035319525430\",\"content\":\"在迁移宫遇到刑星、忌星、煞星，疾厄宫会终身残疾。\"},{\"logicSentenceId\":\"7587041035319410742\",\"content\":\"所主之事如何？\"},{\"logicSentenceId\":\"7587041035319672886\",\"content\":\"即便盖世英雄也会被煞星所克制，此时就如同做了一场南柯梦。\"},{\"logicSentenceId\":\"7587041035319590966\",\"content\":\"不要遇到流年中的凶煞星曜，自身的杀星也不要重叠在一起。\"},{\"logicSentenceId\":\"7587041035319558198\",\"content\":\"如果与囚星同在身命宫，会折肢受伤，文人则主痨病损伤；与囚星、耗星相会于迁移宫，会死于道路之上。\"},{\"logicSentenceId\":\"7587041035319541814\",\"content\":\"即使一生孤独，寿命也不会长。\"},{\"logicSentenceId\":\"7587041035319427126\",\"content\":\"回答说：七杀星，是南斗第六星，属火和金，是斗中的上将，实际上是决定成败的孤独之星。\"},{\"logicSentenceId\":\"7587041035319492662\",\"content\":\"在子女方面孤独卑贱，在夫妻方面夫妻感情淡薄。\"},{\"logicSentenceId\":\"7587041035319689270\",\"content\":\"这即是倒限之地，所主之事，一定要仔细推究详察，它是命数中的恶曜，实在不是善星啊。\"},{\"logicSentenceId\":\"7587041035319509046\",\"content\":\"在田宅宫与刑星、囚星相会，父母会有刑伤之事，父亲难以晋升。\"},{\"logicSentenceId\":\"7587041035319476278\",\"content\":\"在命宫或限宫时，若不得扶助则夭折；在官禄宫处于有利位置，会转化为吉祥。\"},{\"logicSentenceId\":\"7587041035319623734\",\"content\":\"流年的杀曜又重叠并临，在大小二限中又遇到，预示会阵亡或被劫掠而死。\"},{\"logicSentenceId\":\"7587041035319607350\",\"content\":\"身杀在关键宫位遇到凶星，命宫在三方遭遇煞星。\"},{\"logicSentenceId\":\"7587041035319459894\",\"content\":\"若从命数来看，适合做僧道之人；自身际遇方面，注定经历艰难辛苦。\"},{\"logicSentenceId\":\"7587041035319394358\",\"content\":\"这两颗星处于辰位和戌位时，福分寿数不必再论。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":7116,"chapterOrder":2,"inChapterOrder":41,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694678578","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"692\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生曰：七殺斗中上将，遇紫㣲則化權降福；遇火鈴則爲殺長其威。\",\"logicSentenceId\":\"7587041035319705654\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"693\",\"lineNum\":0,\"lineType\":1,\"content\":\"遇㐫曜於生鄉，定為屠宰；㑹昌曲於要地，情性頑嚚。\",\"logicSentenceId\":\"7587041035319722038\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"694\",\"lineNum\":0,\"lineType\":1,\"content\":\"秘經云：七殺居䧟地，沉吟福不生。\",\"logicSentenceId\":\"7587041035319738422\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"695\",\"lineNum\":0,\"lineType\":1,\"content\":\"是也。\",\"logicSentenceId\":\"7587041035319754806\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"696\",\"lineNum\":0,\"lineType\":1,\"content\":\"二宮逢之，定歷艱辛；二限逢之，遭殃破敗。\",\"logicSentenceId\":\"7587041035319771190\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"697\",\"lineNum\":0,\"lineType\":1,\"content\":\"遇帝禄而可觧，遭流殺而逢㐫。\",\"logicSentenceId\":\"7587041035319787574\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"698\",\"lineNum\":0,\"lineType\":1,\"content\":\"守\",\"logicSentenceId\":\"7587041035319803958\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"699\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174867410583564\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"700\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命，作事進退，喜怒不常。\",\"logicSentenceId\":\"7587041035319803958\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"701\",\"lineNum\":0,\"lineType\":1,\"content\":\"左右、昌曲入庙拱照，掌生殺之權，冨貴出衆。\",\"logicSentenceId\":\"7587041035319820342\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"702\",\"lineNum\":0,\"lineType\":1,\"content\":\"若四殺忌星冲破，巧藝平常之人，䧟地殘疾。\",\"logicSentenceId\":\"7587041035319836726\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"703\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命旺地，財權服衆，志過丈夫。\",\"logicSentenceId\":\"7587041035319853110\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"704\",\"lineNum\":0,\"lineType\":1,\"content\":\"四殺冲破，刑尅不潔，僧道冝之。\",\"logicSentenceId\":\"7587041035319869494\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"705\",\"lineNum\":0,\"lineType\":1,\"content\":\"若殺凑飄蕩，流移還俗。\",\"logicSentenceId\":\"7587041035319885878\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174813065183251","endPageId":"7330174867410583564","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035319738422\",\"content\":\"秘经说：七杀星处于陷地，忧愁沉吟福运不生。\"},{\"logicSentenceId\":\"7587041035319787574\",\"content\":\"遇到帝禄就可以化解灾祸，遭遇流杀就会遇到凶险。\"},{\"logicSentenceId\":\"7587041035319885878\",\"content\":\"若煞曜聚集导致漂泊不定，流离辗转还俗。\"},{\"logicSentenceId\":\"7587041035319820342\",\"content\":\"左辅、右弼、文昌、文曲入庙拱照，命主可掌握生杀大权，富贵超过众人。\"},{\"logicSentenceId\":\"7587041035319869494\",\"content\":\"如果被四煞冲破，就会刑克六亲，行为不检点，适合出家为僧道。\"},{\"logicSentenceId\":\"7587041035319705654\",\"content\":\"希夷先生说：七杀星是北斗星中的上将，遇到紫微星就会化为权星降下福气；遇到火星、铃星就会助长它作为凶星的威力。\"},{\"logicSentenceId\":\"7587041035319754806\",\"content\":\"说的就是这个意思。\"},{\"logicSentenceId\":\"7587041035319722038\",\"content\":\"七杀星在生旺之地遇到凶星，命主定会从事屠宰行业；七杀星在关键宫位与文昌星、文曲星相会，命主性情顽固愚笨。\"},{\"logicSentenceId\":\"7587041035319836726\",\"content\":\"如果遇到四煞忌星冲破，就是技艺平常的人，落在陷地就会有残疾。\"},{\"logicSentenceId\":\"7587041035319771190\",\"content\":\"命宫和身宫遇到七杀星，必定历经艰辛；大小二限遇到七杀星，就会遭遇灾祸、家道破败。\"},{\"logicSentenceId\":\"7587041035319853110\",\"content\":\"女性命盘处于旺地，掌握财权使众人信服，志向超过男子。\"},{\"logicSentenceId\":\"7587041035319803958\",\"content\":\"七杀星守在命宫或身宫时，做事犹豫不决，情绪喜怒无常。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":4153,"chapterOrder":2,"inChapterOrder":42,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694694962","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"706\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：七殺寅、申、子、午宫，四夷拱手服英雄。\",\"logicSentenceId\":\"7587041035319902262\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"707\",\"lineNum\":0,\"lineType\":1,\"content\":\"魁鉞左右文昌㑹，權禄名高食萬鍾。\",\"logicSentenceId\":\"7587041035319918646\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"708\",\"lineNum\":0,\"lineType\":1,\"content\":\"殺居䧟地不堪言，㐫禍猶如抱虎眠。\",\"logicSentenceId\":\"7587041035319935030\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"709\",\"lineNum\":0,\"lineType\":1,\"content\":\"若是殺強無制伏，少年惡死到黄泉。\",\"logicSentenceId\":\"7587041035319951414\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"710\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：破軍所主若何？\",\"logicSentenceId\":\"7587041035319967798\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"711\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：破軍属水，北斗弟七星也，司夫妻\",\"logicSentenceId\":\"7587041035319984182\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"712\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174867410714636\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"713\",\"lineNum\":0,\"lineType\":1,\"content\":\"子媳、奴僕之神。\",\"logicSentenceId\":\"7587041035319984182\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"714\",\"lineNum\":0,\"lineType\":1,\"content\":\"居子午入庙，在天為殺氣，在数為耗星，故化氣曰耗。\",\"logicSentenceId\":\"7587041035320000566\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"715\",\"lineNum\":0,\"lineType\":1,\"content\":\"主人暴凶狡詐，其性奸猾，與人寡合，動輟損人，不成人之惡善，助人之悪虐，視六親如冦仇，處骨肉無仁義。\",\"logicSentenceId\":\"7587041035320016950\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"716\",\"lineNum\":0,\"lineType\":1,\"content\":\"惟六癸、六甲生人合格，主富貴。\",\"logicSentenceId\":\"7587041035320033334\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"717\",\"lineNum\":0,\"lineType\":1,\"content\":\"陷地，加殺冲破，巧藝殘疾，不守祖業，僧道冝之。\",\"logicSentenceId\":\"7587041035320049718\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"718\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人冲破，滛蕩無耻。\",\"logicSentenceId\":\"7587041035320066102\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"719\",\"lineNum\":0,\"lineType\":1,\"content\":\"此星居紫微則失威權，逢天府則作奸偽，㑹天機則𣆨𥨸狗偷。\",\"logicSentenceId\":\"7587041035320082486\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"720\",\"lineNum\":0,\"lineType\":1,\"content\":\"與𤎉貞、火鈴同度，則决起官方；與巨門同度，則口舌争聞；與刑忌同度，則終身殘疾；與武曲入財，則東傾西敗；與文星守命，一生貧士；遇諸㐫結党破敗，遇陥地，其禍不輕。\",\"logicSentenceId\":\"7587041035320098870\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"721\",\"lineNum\":0,\"lineType\":1,\"content\":\"惟天梁可制其𢙣，天禄可觧其狂。\",\"logicSentenceId\":\"7587041035320115254\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"722\",\"lineNum\":0,\"lineType\":1,\"content\":\"若逢流殺交併，家業蕩空，與文曲入於水域，殘疾離郷；遇文\",\"logicSentenceId\":\"7587041035320131638\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"723\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174914583887913\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"724\",\"lineNum\":0,\"lineType\":2,\"content\":\"昌入。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"725\",\"lineNum\":0,\"lineType\":1,\"content\":\"於震宫，遇吉可貴。\",\"logicSentenceId\":\"7587041035320131638\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"726\",\"lineNum\":0,\"lineType\":1,\"content\":\"若女命逢之，無媒自嫁，喪莭飄流，瓦坐人身命居子午、貪狼七殺相拱，則威震華夷。\",\"logicSentenceId\":\"7587041035320148022\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"727\",\"lineNum\":0,\"lineType\":1,\"content\":\"或與武曲同居巳宫，貪狼拱亦。\",\"logicSentenceId\":\"7587041035320164406\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"728\",\"lineNum\":0,\"lineType\":1,\"content\":\"居台閣，但㸔𢙣星何如。\",\"logicSentenceId\":\"7587041035320180790\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"729\",\"lineNum\":0,\"lineType\":1,\"content\":\"庚癸生人入格，到老亦不全美也。\",\"logicSentenceId\":\"7587041035320197174\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"730\",\"lineNum\":0,\"lineType\":1,\"content\":\"在身命䧟地，棄祖離宗，在兄弟骨肉参啇，在夫妻不正，主婚姻進退，在子息先損後成，在財帛如湯澆雪，在疾厄致。\",\"logicSentenceId\":\"7587041035320213558\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"731\",\"lineNum\":0,\"lineType\":1,\"content\":\"尫羸之疾，在遷移奔走無力，在奴僕謗怨迯走，在官禄主淸貧在田。\",\"logicSentenceId\":\"7587041035320229942\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"732\",\"lineNum\":0,\"lineType\":1,\"content\":\"地䧟度，祖基破蕩，在福徳多災，在父母破相刑尅。\",\"logicSentenceId\":\"7587041035320246326\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174867410583564","endPageId":"7330174914583887913","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035320148022\",\"content\":\"如果是女性的命盘逢到此星，会没有媒人自己嫁人，丧失名节、漂泊流离；若命主身份卑微，命宫坐守子牛位，贪狼与七杀星相拱照，则能威震中外。\"},{\"logicSentenceId\":\"7587041035319902262\",\"content\":\"歌中说：七杀星位于寅、申、子、午宫位时，四方外族都会拱手敬服英雄。\"},{\"logicSentenceId\":\"7587041035319967798\",\"content\":\"问：破军星所主的情况如何？\"},{\"logicSentenceId\":\"7587041035320033334\",\"content\":\"只有六癸、六甲年出生的人符合格局，主富贵。\"},{\"logicSentenceId\":\"7587041035320229942\",\"content\":\"身体衰弱的疾病，在迁移宫主奔走无力，在奴仆宫主奴仆诽谤埋怨后逃走，在官禄宫主清贫，在田宫。\"},{\"logicSentenceId\":\"7587041035319984182\",\"content\":\"回答说：破军星属水，是北斗七星中的第七星，掌管夫妻、子媳、奴仆的神。\"},{\"logicSentenceId\":\"7587041035320115254\",\"content\":\"只有天梁星可以遏制它的恶，天禄星可以化解它的狂。\"},{\"logicSentenceId\":\"7587041035320246326\",\"content\":\"地陷的度数，祖先的基业会破败毁坏，在福德宫多灾多难，父母宫会有破相、遭遇刑克的情况。\"},{\"logicSentenceId\":\"7587041035319918646\",\"content\":\"天魁天钺左辅右弼与文昌相会，权势俸禄名望崇高享受万钟俸禄。\"},{\"logicSentenceId\":\"7587041035320098870\",\"content\":\"与廉贞、火铃同度，必定引发官司；与巨门同度，口舌是非频传；与刑星、忌星同度，就会终身残疾；与武曲入财帛宫，产业破败倾颓；与文星同守命宫，一生都是贫穷之人；遇到众多凶星结党就会破败，遇到陷地，灾祸不轻。\"},{\"logicSentenceId\":\"7587041035320016950\",\"content\":\"主人残暴凶狠、狡诈奸滑，其本性奸险狡猾，与人难以融洽相处，动辄损害他人，不成就他人的善举，却助长他人的恶行，把六亲当作仇敌，对待骨肉至亲也毫无仁义之心。\"},{\"logicSentenceId\":\"7587041035320049718\",\"content\":\"处于陷地，再加上煞星冲破，擅长某种技艺但身有残疾，不能守住祖业，适合出家当僧人或者道士。\"},{\"logicSentenceId\":\"7587041035320213558\",\"content\":\"身宫和命宫在陷地，会抛弃祖宗、离开宗族；落在兄弟宫，会与兄弟骨肉相互指责；落在夫妻宫，夫妻关系不端正，婚姻会有波折；落在子女宫，子女先有损伤后能有成；落在财帛宫，钱财如沸水浇雪般消融；落在疾厄宫会导致……。\"},{\"logicSentenceId\":\"7587041035320082486\",\"content\":\"破军星位于紫微宫时会失去威权，遇到天府星时就会变得奸诈虚伪，与天机会合就会有鼠窃狗偷的行径。\"},{\"logicSentenceId\":\"7587041035319951414\",\"content\":\"如果七杀星强大而没有制伏，少年时就会遭遇横祸死亡。\"},{\"logicSentenceId\":\"7587041035320180790\",\"content\":\"能位居台阁高官，但看恶星的情况如何。\"},{\"logicSentenceId\":\"7587041035320131638\",\"content\":\"如果遇到流年煞星交并，家业就会荡然无存；与文曲星处于水的方位，会残疾并背井离乡；在震宫遇到文星，又遇到吉星就会显贵。\"},{\"logicSentenceId\":\"7587041035319935030\",\"content\":\"七杀星处于陷地的情况难以言说，遭遇的凶祸就像抱着老虎睡觉一样危险。\"},{\"logicSentenceId\":\"7587041035320164406\",\"content\":\"或者与武曲星同处巳宫，贪狼星也来拱照。\"},{\"logicSentenceId\":\"7587041035320197174\",\"content\":\"庚年和癸年出生的人即使符合格局，到老也不会十分美满。\"},{\"logicSentenceId\":\"7587041035320066102\",\"content\":\"女性遇到冲破的情况，会变得淫荡无耻。\"},{\"logicSentenceId\":\"7587041035320000566\",\"content\":\"破军星落在子午宫位时处于入庙的状态，在天上代表着肃杀之气，在命理中代表着耗损之星，所以它的化气称为耗。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":9061,"chapterOrder":2,"inChapterOrder":43,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694711346","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"733\",\"lineNum\":0,\"lineType\":1,\"content\":\"問文昌星所主若何？\",\"logicSentenceId\":\"7587041035320262710\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"734\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：文昌主科甲，守身命，主人𱐍閑儒雅，清秀魁梧，愽文廣記，機変異常，一舉成名，披緋衣紫，福\",\"logicSentenceId\":\"7587041035320279094\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"735\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174914584002601\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"736\",\"lineNum\":0,\"lineType\":1,\"content\":\"夀雙全。\",\"logicSentenceId\":\"7587041035320279094\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"737\",\"lineNum\":0,\"lineType\":1,\"content\":\"縱四殺冲破，不為下賤。\",\"logicSentenceId\":\"7587041035320295478\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"738\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人加吉得地，衣禄充足；四殺冲破，偏房下僧道宜之，加權禄重厚，有師號。\",\"logicSentenceId\":\"7587041035320311862\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174914583887913","endPageId":"7330174914584002601","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035320279094\",\"content\":\"回答说：文昌星主管科举功名，坐守身宫和命宫，主人闲适儒雅，容貌清秀、身材魁梧，学识渊博、记忆力强，机智善变不同寻常，能一举成名，身披红袍腰系紫绶，福寿双全。\"},{\"logicSentenceId\":\"7587041035320295478\",\"content\":\"即使被四煞冲破，也不会沦为下贱之人。\"},{\"logicSentenceId\":\"7587041035320311862\",\"content\":\"女人如果遇到吉星且星曜得地，衣食俸禄就会充足；如果被四煞冲破，适合做偏房或出家为僧道，如果再加上权禄重厚，就会有师号。\"},{\"logicSentenceId\":\"7587041035320262710\",\"content\":\"所预示的情况是怎样的？\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1802,"chapterOrder":2,"inChapterOrder":44,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694727730","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"739\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：文昌主科甲，辰巳是旺地利午𭒡卯酉火，生人不利，眉目定。\",\"logicSentenceId\":\"7587041035320328246\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"740\",\"lineNum\":0,\"lineType\":1,\"content\":\"分明相貌極，俊麗喜於金。\",\"logicSentenceId\":\"7587041035320344630\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"741\",\"lineNum\":0,\"lineType\":1,\"content\":\"生人冨貴雙全美，先難而後易，中𣇋有聲名。\",\"logicSentenceId\":\"7587041035320361014\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"742\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽䕃福集傳臚弟一名\",\"logicSentenceId\":\"7587041035320377398\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174914584002601","endPageId":"7330174914584002601","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035320377398\",\"content\":\"太阳带来荫庇福泽，聚集成为传胪第一名。\"},{\"logicSentenceId\":\"7587041035320328246\",\"content\":\"歌中说：文昌星主管科举功名，在辰、巳两个时辰处于旺地，利于午时出生的人，若出生于卯、酉两个时辰，且属火命，则对人不利，容貌是确定的。\"},{\"logicSentenceId\":\"7587041035320344630\",\"content\":\"长相五官分明，极其俊美秀丽，命盘中喜见金星。\"},{\"logicSentenceId\":\"7587041035320361014\",\"content\":\"出生之人富贵双全、美满无缺，先历经艰难而后顺遂，中年和晚年享有声名。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1404,"chapterOrder":2,"inChapterOrder":45,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694744114","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"743\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：文曲星所主若何？\",\"logicSentenceId\":\"7587041035320393782\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"744\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：文曲属水，北斗弟四星也，主科甲文章之宿。\",\"logicSentenceId\":\"7587041035320410166\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"745\",\"lineNum\":0,\"lineType\":1,\"content\":\"其像属水，與文昌同協，吉数最為祥，臨身命中，作科弟之客。\",\"logicSentenceId\":\"7587041035320426550\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"746\",\"lineNum\":0,\"lineType\":1,\"content\":\"桃花浪煖，入仕無疑。\",\"logicSentenceId\":\"7587041035320442934\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"747\",\"lineNum\":0,\"lineType\":1,\"content\":\"於官禄，靣君顔而執政，卑居身命，更逢㐫曜，亦作無名舌辨之徒。\",\"logicSentenceId\":\"7587041035320459318\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"748\",\"lineNum\":0,\"lineType\":1,\"content\":\"與𤎉貞共處，必作公\",\"logicSentenceId\":\"7587041035320492086\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"749\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174914584117289\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"750\",\"lineNum\":0,\"lineType\":1,\"content\":\"吏官身；與太隂同行，定係九流術士。\",\"logicSentenceId\":\"7587041035320492086\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"751\",\"lineNum\":0,\"lineType\":1,\"content\":\"怕逢破軍，怨諨水以生災；𭒡遇貪狼，莊政事而𩔊倒。\",\"logicSentenceId\":\"7587041035320508470\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"752\",\"lineNum\":0,\"lineType\":1,\"content\":\"逢七殺刑忌囚，及諸𢙣曜，詐偽莫逃；逢巨門共其度邪而䘮志。\",\"logicSentenceId\":\"7587041035320524854\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"753\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命不宜於逢水性楊花，忌入土宫，限臨蹭蹬。\",\"logicSentenceId\":\"7587041035320541238\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"754\",\"lineNum\":0,\"lineType\":1,\"content\":\"若禄存化禄來緾，不可以為㐫論。\",\"logicSentenceId\":\"7587041035320557622\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174914584002601","endPageId":"7330174914584117289","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035320426550\",\"content\":\"它的星象属水，与文昌星相互配合，吉利的气数最为祥瑞，降临到人的命盘中，能使人成为科举及第之人。\"},{\"logicSentenceId\":\"7587041035320508470\",\"content\":\"害怕遇到破军星，会因灾祸之水而生灾；倘若遇到贪狼星，会使庄重的政务颠倒倾覆。\"},{\"logicSentenceId\":\"7587041035320524854\",\"content\":\"遇到七杀、刑、忌、囚，以及各种凶星，欺诈虚伪难以逃脱；与巨门星同度，会因邪恶而丧失志向。\"},{\"logicSentenceId\":\"7587041035320442934\",\"content\":\"在桃花盛开、春水温暖之时，进入仕途毫无疑问。\"},{\"logicSentenceId\":\"7587041035320459318\",\"content\":\"在官禄方面，能面见君主且处于执政的低位。身命宫如果再遇到凶星，也会成为没有名气、只会耍嘴皮的人。\"},{\"logicSentenceId\":\"7587041035320410166\",\"content\":\"回答说：文曲星属水，是北斗星的第四颗星，主管科举考试和文章的星宿。\"},{\"logicSentenceId\":\"7587041035320541238\",\"content\":\"女性命格不适合遇到文曲星，不然会水性杨花，忌讳落入土宫，行至此运限时会遭遇挫折。\"},{\"logicSentenceId\":\"7587041035320557622\",\"content\":\"如果禄存化禄前来缠绕，就不能将其视为凶兆。\"},{\"logicSentenceId\":\"7587041035320492086\",\"content\":\"与廉贞星同处，必定会成为公吏之类的官员；与太阴星同行，一定会是九流术士。\"},{\"logicSentenceId\":\"7587041035320393782\",\"content\":\"问：文曲星掌管的是什么呢？\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":3761,"chapterOrder":2,"inChapterOrder":46,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694760498","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"755\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生曰：文曲守身，命居巳酉丑宫，居侯伯，武貪三合同垣，将相之格，文昌遇合亦然。\",\"logicSentenceId\":\"7587041035320574006\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"756\",\"lineNum\":0,\"lineType\":1,\"content\":\"若陷宫午戍之地，巨門、羊陀冲破，喪命殀析，水大驚險。\",\"logicSentenceId\":\"7587041035320590390\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"757\",\"lineNum\":0,\"lineType\":1,\"content\":\"居亥卯未旺地，與天梁、天相會，主聦明愽學，殺冲破，只冝僧道。\",\"logicSentenceId\":\"7587041035320606774\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"758\",\"lineNum\":0,\"lineType\":1,\"content\":\"若女命值之，清秀聦明，主貴。\",\"logicSentenceId\":\"7587041035331567658\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"759\",\"lineNum\":0,\"lineType\":1,\"content\":\"若陥地冲破，滛而且賤。\",\"logicSentenceId\":\"7587041035331584042\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174914584117289","endPageId":"7330174914584117289","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035320574006\",\"content\":\"希夷先生说：文曲星守命，命宫位于巳、酉、丑宫，可位居侯伯；武曲星与贪狼星三合且同处一个星垣，是将相的命格，文昌星遇合也是如此。\"},{\"logicSentenceId\":\"7587041035320590390\",\"content\":\"若星宿落入午宫戌宫这类陷落之地，巨门、擎羊、陀罗等星曜冲破，便会丧命夭折，遭遇重大水患惊险。\"},{\"logicSentenceId\":\"7587041035320606774\",\"content\":\"命主处于亥、卯、未这三个旺盛之地，与天梁星、天相星相会合，主其人聪明且学识渊博；若被煞星冲破，则只适合出家为僧或做道士。\"},{\"logicSentenceId\":\"7587041035331567658\",\"content\":\"如果女性命盘遇到这种情况，会容貌清秀、聪明伶俐，命中显贵。\"},{\"logicSentenceId\":\"7587041035331584042\",\"content\":\"如果处于陷地且被冲破，就会淫荡而且低贱。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1966,"chapterOrder":2,"inChapterOrder":47,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694776882","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"760\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：流年昌曲若何？\",\"logicSentenceId\":\"7587041035331600426\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"761\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：命逢流年昌曲，為科名科甲大小\",\"logicSentenceId\":\"7587041035331616810\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"762\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174961904074793\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"763\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限逢之，三合拱照太陽，又照流年禄小限太嵗逢魁鉞，左右台座，日月科權、禄馬三方拱照，决然高中無疑。\",\"logicSentenceId\":\"7587041035331616810\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"764\",\"lineNum\":0,\"lineType\":1,\"content\":\"然非此数星俱全，方為大吉，但以流年科甲為主。\",\"logicSentenceId\":\"7587041035331633194\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"765\",\"lineNum\":0,\"lineType\":1,\"content\":\"如命限值之，其餘吉曜，若得二三拱照，亦必高中。\",\"logicSentenceId\":\"7587041035331649578\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"766\",\"lineNum\":0,\"lineType\":1,\"content\":\"但二星在巳酉得地，不冨即貴，只是不能耐乆。\",\"logicSentenceId\":\"7587041035331665962\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174914584117289","endPageId":"7330174961904074793","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035331649578\",\"content\":\"如果命限遇到文昌星、文曲星，其他吉祥之星若能有两三个拱照，也必定能高中。\"},{\"logicSentenceId\":\"7587041035331665962\",\"content\":\"但是文昌星、文曲星在巳位、酉位得地，不富即贵，只是这种富贵不能长久维持。\"},{\"logicSentenceId\":\"7587041035331600426\",\"content\":\"问：流年遇到文昌、文曲星会怎样？\"},{\"logicSentenceId\":\"7587041035331616810\",\"content\":\"回答说：命遇上流年文昌星和文曲星，会有科名科甲，大小二限遇上它们，三合拱照太阳星，又照流年禄星，小限太岁遇到魁星和钺星，有左辅右弼、三台八座，太阳星、太阴星、科星、权星、禄星、天马星三方拱照，必定高中无疑。\"},{\"logicSentenceId\":\"7587041035331633194\",\"content\":\"然而并非这几颗星都齐全才算是大吉，只要以流年科甲为主就可以了。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2260,"chapterOrder":2,"inChapterOrder":48,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694793266","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"767\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：南北昌曲星，数中推第一。\",\"logicSentenceId\":\"7587041035331682346\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"768\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命最爲佳，諸吉恐非吉。\",\"logicSentenceId\":\"7587041035331698730\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"769\",\"lineNum\":0,\"lineType\":1,\"content\":\"得居人命上，桃花浪三汲；入仕更無虚，從容要輔弼；只恐𢙣殺冲，火鈴、羊陀激。\",\"logicSentenceId\":\"7587041035331715114\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"770\",\"lineNum\":0,\"lineType\":1,\"content\":\"若還逢陷地，苗而秀不實，不是公吏軰。\",\"logicSentenceId\":\"7587041035331731498\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"771\",\"lineNum\":0,\"lineType\":1,\"content\":\"九流併數術。\",\"logicSentenceId\":\"7587041035331747882\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"772\",\"lineNum\":0,\"lineType\":1,\"content\":\"無破，宰職權；女人，多滛佚。\",\"logicSentenceId\":\"7587041035331764266\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"773\",\"lineNum\":0,\"lineType\":1,\"content\":\"樂居亥子丑，空亡宫無益。\",\"logicSentenceId\":\"7587041035331780650\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"774\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174961904189481\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"775\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：左輔所主若何？\",\"logicSentenceId\":\"7587041035331797034\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"776\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生答曰：左輔，帝極主宰之身命，諸宫降福，主人形貌敦厚，慷慨風流，紫府禄權。\",\"logicSentenceId\":\"7587041035331813418\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"777\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪武合冲照，主文武大貴。\",\"logicSentenceId\":\"7587041035331829802\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"778\",\"lineNum\":0,\"lineType\":1,\"content\":\"火忌冲破，雖冨貴不乆，僧道清閑。\",\"logicSentenceId\":\"7587041035331846186\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"779\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人温重賢曉，旺地封贈，火忌冲破，以中局断之。\",\"logicSentenceId\":\"7587041035331862570\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"780\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：右弼所主若何？\",\"logicSentenceId\":\"7587041035331878954\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"781\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生答曰：右弼，帝極主宰之星，守身命，文墨精通，紫府吉星同垣，財官雙羙，文武雙全。\",\"logicSentenceId\":\"7587041035331895338\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"782\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀火忌冲破，下局断之，女人賢良有志，縱四殺冲破，不為下賤，僧道清閑。\",\"logicSentenceId\":\"7587041035331911722\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174961904074793","endPageId":"7330174961904189481","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035331911722\",\"content\":\"如果受到羊陀、火星、忌星的冲克破坏，就按照下等格局来论断；女人贤良且有志向，即使受到四煞星的冲克破坏，也不会沦为下贱之人；命主若是僧道之人，则会生活清闲。\"},{\"logicSentenceId\":\"7587041035331747882\",\"content\":\"九流以及各种数术。\"},{\"logicSentenceId\":\"7587041035331731498\",\"content\":\"如果还遇到陷地，就会像禾苗抽穗却不结果实一样，不是公吏之辈。\"},{\"logicSentenceId\":\"7587041035331780650\",\"content\":\"南北昌曲星喜欢落在亥、子、丑这三个宫位，落在空亡的宫位则没有益处。\"},{\"logicSentenceId\":\"7587041035331813418\",\"content\":\"希夷先生回答说：左辅星，掌管着人的身宫和命宫，会给各个星宫降下福气，代表着这个人外貌敦厚稳重，为人慷慨且风流潇洒，兼具紫微、天府、禄存、化权等吉星特质。\"},{\"logicSentenceId\":\"7587041035331698730\",\"content\":\"文昌星和文曲星在身宫、命宫最为吉利，其他吉星汇聚时却不一定是好事。\"},{\"logicSentenceId\":\"7587041035331829802\",\"content\":\"贪狼星和武曲星会合、对冲、照临，主其人在文和武方面都极为显贵。\"},{\"logicSentenceId\":\"7587041035331895338\",\"content\":\"希夷先生回答说：右弼，是帝极主宰之星，守护身命宫，主人精通文墨，与紫府吉星同宫，既有钱财又有官位，使人文武双全。\"},{\"logicSentenceId\":\"7587041035331797034\",\"content\":\"问：左辅星主管的是什么呢？\"},{\"logicSentenceId\":\"7587041035331862570\",\"content\":\"女人温柔持重、贤明聪慧，处于旺地可获封赠；若被火星、忌星冲破，则按中局来论断。\"},{\"logicSentenceId\":\"7587041035331764266\",\"content\":\"不受冲克，有宰相之权；女人，大多淫逸。\"},{\"logicSentenceId\":\"7587041035331846186\",\"content\":\"若被火星、忌星冲破，即使富贵也不会长久，若为僧道则能安闲自在。\"},{\"logicSentenceId\":\"7587041035331682346\",\"content\":\"歌中说：南北昌曲星，在数中被推为第一。\"},{\"logicSentenceId\":\"7587041035331878954\",\"content\":\"问：右弼所主的情况是怎样的呢？\"},{\"logicSentenceId\":\"7587041035331715114\",\"content\":\"昌曲二星位于人命宫，科举考试中能三次高中；进入仕途更不会落空，从容不迫需要辅弼二星相助；只怕被凶煞星冲克，火星、铃星、擎羊、陀罗四煞相逼。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":5447,"chapterOrder":2,"inChapterOrder":49,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694809650","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"783\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：左輔原属𡈽，右弼水為根。\",\"logicSentenceId\":\"7587041035331928106\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"784\",\"lineNum\":0,\"lineType\":1,\"content\":\"失君為無用，三合冝見君。\",\"logicSentenceId\":\"7587041035331944490\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"785\",\"lineNum\":0,\"lineType\":1,\"content\":\"若在紫\",\"logicSentenceId\":\"7587041035331960874\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"786\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174961904304169\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"787\",\"lineNum\":0,\"lineType\":1,\"content\":\"㣲位，爵禄不湏論。\",\"logicSentenceId\":\"7587041035331960874\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"788\",\"lineNum\":0,\"lineType\":1,\"content\":\"若在夫妻位，主人定二婚。\",\"logicSentenceId\":\"7587041035331977258\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"789\",\"lineNum\":0,\"lineType\":1,\"content\":\"若與𤎉貞併，惡賊遭鉗髠。\",\"logicSentenceId\":\"7587041035331993642\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174961904189481","endPageId":"7330174961904304169","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035331928106\",\"content\":\"有歌诀说：左辅原本五行属土，右弼以水为五行根基。\"},{\"logicSentenceId\":\"7587041035331944490\",\"content\":\"失去主星就没有作用，三方会合时适宜见到主星。\"},{\"logicSentenceId\":\"7587041035331960874\",\"content\":\"如果在紫微位，官职和俸禄就不用多提了。\"},{\"logicSentenceId\":\"7587041035331977258\",\"content\":\"如果在夫妻宫，命主一定会有二婚。\"},{\"logicSentenceId\":\"7587041035331993642\",\"content\":\"如果右弼星与廉贞星同宫，作恶的盗贼会遭受钳刑和髡刑。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1683,"chapterOrder":2,"inChapterOrder":50,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694826034","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"790\",\"lineNum\":0,\"lineType\":1,\"content\":\"輔弼為上相，輔佐紫微星。\",\"logicSentenceId\":\"7587041035332010026\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"791\",\"lineNum\":0,\"lineType\":1,\"content\":\"喜居日月側，文人遇禹門。\",\"logicSentenceId\":\"7587041035332026410\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"792\",\"lineNum\":0,\"lineType\":1,\"content\":\"倘居閑位上，無爵更無名。\",\"logicSentenceId\":\"7587041035332042794\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"793\",\"lineNum\":0,\"lineType\":1,\"content\":\"妻宫遇此宿，决定两妻成。\",\"logicSentenceId\":\"7587041035332059178\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"794\",\"lineNum\":0,\"lineType\":1,\"content\":\"若與刑囚處，遭傷作盗論。\",\"logicSentenceId\":\"7587041035332075562\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"795\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：天魁、天鉞星所主若何？\",\"logicSentenceId\":\"7587041035332091946\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"796\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：魁、鉞斗中司科之星，人命坐貴向貴，或得左右吉聚，無不富貴。\",\"logicSentenceId\":\"7587041035332108330\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"797\",\"lineNum\":0,\"lineType\":1,\"content\":\"况二星又為上界和合之神。\",\"logicSentenceId\":\"7587041035332124714\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"798\",\"lineNum\":0,\"lineType\":1,\"content\":\"若魁臨命，鉞守身，更迭相守，更遇紫府日月，昌曲，左右權禄相凑，少年必聚羙妻。\",\"logicSentenceId\":\"7587041035332141098\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"799\",\"lineNum\":0,\"lineType\":1,\"content\":\"若遇大難，必得貴人成就扶助。\",\"logicSentenceId\":\"7587041035332157482\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"800\",\"lineNum\":0,\"lineType\":1,\"content\":\"小人不一，亦不為㐫。\",\"logicSentenceId\":\"7587041035332173866\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"801\",\"lineNum\":0,\"lineType\":1,\"content\":\"限步廵逢，必主女子添喜。\",\"logicSentenceId\":\"7587041035332190250\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"802\",\"lineNum\":0,\"lineType\":1,\"content\":\"生男\",\"logicSentenceId\":\"7587041035332206634\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"803\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175012839751691\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"804\",\"lineNum\":0,\"lineType\":1,\"content\":\"則俊雅入學，功名有成；生女則容貌端莊，出衆超群。\",\"logicSentenceId\":\"7587041035332206634\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"805\",\"lineNum\":0,\"lineType\":1,\"content\":\"若四十以後，逢墓庫，不依此断，有㐫不以為灾。\",\"logicSentenceId\":\"7587041035332223018\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"806\",\"lineNum\":0,\"lineType\":1,\"content\":\"居官者賢能威武，声名逺播，僧道享福，與人和睦，不為下賤。\",\"logicSentenceId\":\"7587041035332239402\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"807\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人吉，多宰輔之妻。\",\"logicSentenceId\":\"7587041035332255786\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"808\",\"lineNum\":0,\"lineType\":1,\"content\":\"命婦之論，若加悪殺，亦為富貴，但不免私情滛泆。\",\"logicSentenceId\":\"7587041035332272170\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174961904304169","endPageId":"7330175012839751691","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035332239402\",\"content\":\"做官的人贤能威武，声名远播；僧人和道士享福，与人和睦相处，不会地位卑下。\"},{\"logicSentenceId\":\"7587041035332059178\",\"content\":\"如果右弼星落在夫妻宫，命主一定会有两段婚姻。\"},{\"logicSentenceId\":\"7587041035332141098\",\"content\":\"如果天魁星临命宫，天钺星守身宫，二者交替守护，再遇到紫微星、天府星、太阳星、太阴星，文昌星、文曲星，左辅星、右弼星、化权星、化禄星汇聚，少年时必定能娶到美妻。\"},{\"logicSentenceId\":\"7587041035332091946\",\"content\":\"问：天魁、天钺星所主宰的是什么呢？\"},{\"logicSentenceId\":\"7587041035332255786\",\"content\":\"女人吉利，大多会成为宰相之类高官的妻子。\"},{\"logicSentenceId\":\"7587041035332206634\",\"content\":\"如果生男孩，则英俊文雅，入学读书，在功名上有所成就；如果生女孩，则容貌端庄，出类拔萃。\"},{\"logicSentenceId\":\"7587041035332075562\",\"content\":\"若与刑囚同宫，会遭受伤害，被当作盗贼论处。\"},{\"logicSentenceId\":\"7587041035332173866\",\"content\":\"普通人情况不同，但也不会有凶险。\"},{\"logicSentenceId\":\"7587041035332026410\",\"content\":\"右弼星喜欢处在日、月的旁边，文人遇到它就如同鲤鱼跃龙门（有好的机遇）。\"},{\"logicSentenceId\":\"7587041035332272170\",\"content\":\"对于命妇的论断，如果命盘中有凶煞星，也会富贵，但难免会有私情、生活放荡不检点。\"},{\"logicSentenceId\":\"7587041035332190250\",\"content\":\"行运遇到这两颗星，必定预示着女子有喜事降临。\"},{\"logicSentenceId\":\"7587041035332042794\",\"content\":\"倘若处在闲散的位置上，既无爵位又无名声。\"},{\"logicSentenceId\":\"7587041035332223018\",\"content\":\"如果四十岁以后，遇到墓库的情况，就不按照上述论断来判断，即便有凶险也不会造成灾祸。\"},{\"logicSentenceId\":\"7587041035332124714\",\"content\":\"况且这两颗星又是上界的和合之神。\"},{\"logicSentenceId\":\"7587041035332157482\",\"content\":\"如果遭遇大难，必定能得到贵人的成就和扶助。\"},{\"logicSentenceId\":\"7587041035332108330\",\"content\":\"希夷先生回答说：天魁、天钺是斗宿中掌管科举的星曜，人的命盘若坐于贵位或朝向贵位，或者得到左辅、右弼等吉星汇聚，没有不富贵的。\"},{\"logicSentenceId\":\"7587041035332010026\",\"content\":\"左辅星和右弼星是上相，辅佐紫微星。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":5860,"chapterOrder":2,"inChapterOrder":51,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694842418","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"809\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：天乙貴人衆所欽，命逢金帶福弥深。\",\"logicSentenceId\":\"7587041035332288554\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"810\",\"lineNum\":0,\"lineType\":1,\"content\":\"飛騰名譽人争慕，慱雅皆通古與今。\",\"logicSentenceId\":\"7587041035332304938\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"811\",\"lineNum\":0,\"lineType\":1,\"content\":\"魁鉞二星限中強，人人遇此廣錢粮。\",\"logicSentenceId\":\"7587041035332321322\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"812\",\"lineNum\":0,\"lineType\":1,\"content\":\"官吏逢之發財福，當年必定靣君王。\",\"logicSentenceId\":\"7587041035332337706\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175012839751691","endPageId":"7330175012839751691","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035332321322\",\"content\":\"魁钺二星在命限中强盛，人人遇到它都会广有钱财。\"},{\"logicSentenceId\":\"7587041035332337706\",\"content\":\"当官的人遇到魁钺二星会获得财富福气，当年一定能面见君王。\"},{\"logicSentenceId\":\"7587041035332288554\",\"content\":\"歌诀说：天乙贵人受到众人钦佩，命里遇到金带福气更加深厚。\"},{\"logicSentenceId\":\"7587041035332304938\",\"content\":\"声名远扬人人争相仰慕，博学高雅古今皆通。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1261,"chapterOrder":2,"inChapterOrder":52,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694858802","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"813\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：禄存星所主若何？\",\"logicSentenceId\":\"7587041035332354090\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"814\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：禄存北斗弟三星，真\",\"logicSentenceId\":\"7587041035332370474\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"815\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175012839849995\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"816\",\"lineNum\":0,\"lineType\":1,\"content\":\"人之宿，主人貴爵，掌人夀基。\",\"logicSentenceId\":\"7587041035332370474\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"817\",\"lineNum\":0,\"lineType\":1,\"content\":\"帝相扶之施權，日月得之増輝。\",\"logicSentenceId\":\"7587041035332386858\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"818\",\"lineNum\":0,\"lineType\":1,\"content\":\"天府武曲為厥職，天梁、天同共其詳。\",\"logicSentenceId\":\"7587041035332403242\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"819\",\"lineNum\":0,\"lineType\":1,\"content\":\"十二宫惟身命田宅、財帛為𦂳，主冨居遷移則佳。\",\"logicSentenceId\":\"7587041035332419626\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"820\",\"lineNum\":0,\"lineType\":1,\"content\":\"與帝星守官禄，冝子孫爵秩。\",\"logicSentenceId\":\"7587041035332436010\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"821\",\"lineNum\":0,\"lineType\":1,\"content\":\"若獨守命而無吉化，乃㸔財奴耳。\",\"logicSentenceId\":\"7587041035332452394\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"822\",\"lineNum\":0,\"lineType\":1,\"content\":\"逢吉逞其權，遇𢙣敗其迹。\",\"logicSentenceId\":\"7587041035332468778\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"823\",\"lineNum\":0,\"lineType\":1,\"content\":\"最嫌落於陥空，不能為福。\",\"logicSentenceId\":\"7587041035332485162\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"824\",\"lineNum\":0,\"lineType\":1,\"content\":\"更凑火鈴空刼，巧藝安身。\",\"logicSentenceId\":\"7587041035332501546\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"825\",\"lineNum\":0,\"lineType\":1,\"content\":\"盖禄爵當得勢而享之。\",\"logicSentenceId\":\"7587041035332517930\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"826\",\"lineNum\":0,\"lineType\":1,\"content\":\"守身命，主人慈厚信直，通文濟楚，女人清淑机巧，能幹能爲，有君子之志。\",\"logicSentenceId\":\"7587041035332534314\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"827\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫府𤎉同會合，作祿存上局。\",\"logicSentenceId\":\"7587041035332550698\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"828\",\"lineNum\":0,\"lineType\":1,\"content\":\"大抵此星諸宮降福消灾。\",\"logicSentenceId\":\"7587041035332567082\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"829\",\"lineNum\":0,\"lineType\":1,\"content\":\"然禄存陥居四墓之地者，盖以辰戊為魁罡，丑未為貴人之門，故祿辰遇之，良有以也。\",\"logicSentenceId\":\"7587041035332583466\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175012839751691","endPageId":"7330175012839849995","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035332517930\",\"content\":\"大概禄位和爵位应当在得势的时候去享受它。\"},{\"logicSentenceId\":\"7587041035332534314\",\"content\":\"禄存星守身宫、命宫，主其人慈善宽厚、诚信正直，通晓文墨、举止得体，女性则清秀贤淑、心灵手巧，有能力有作为，有君子的志向。\"},{\"logicSentenceId\":\"7587041035332452394\",\"content\":\"如果禄存星单独坐守命宫且没有吉利的化象，那命主就是守财奴罢了。\"},{\"logicSentenceId\":\"7587041035332386858\",\"content\":\"有帝星和相星扶持它，它就能施展权力；太阳和月亮遇到它，也会增添光辉。\"},{\"logicSentenceId\":\"7587041035332403242\",\"content\":\"天府星和武曲星履行它的职责，天梁星和天同星共同说明它的详情。\"},{\"logicSentenceId\":\"7587041035332419626\",\"content\":\"十二宫中只有身宫、命宫、田宅宫、财帛宫最为要紧，主富足，居于迁移宫则更好。\"},{\"logicSentenceId\":\"7587041035332501546\",\"content\":\"如果再遇到火星、铃星、天空、地劫等星曜，就只能凭借一门精巧的技艺来安身立命了。\"},{\"logicSentenceId\":\"7587041035332436010\",\"content\":\"禄存星与帝星一同守着官禄宫，对子孙的爵位和俸禄有益。\"},{\"logicSentenceId\":\"7587041035332567082\",\"content\":\"大致上，这颗星在各个宫位都能带来福气、消除灾祸。\"},{\"logicSentenceId\":\"7587041035332370474\",\"content\":\"希夷先生回答说：禄存星是北斗的第三颗星，是真人的星宿，主尊贵的爵位，掌管人的寿命根基。\"},{\"logicSentenceId\":\"7587041035332583466\",\"content\":\"然而禄存星陷入辰、戌、丑、未四墓之地，是因为辰、戌为魁罡，丑、未为贵人之门，所以禄存星遇到它们，确实是有原因的。\"},{\"logicSentenceId\":\"7587041035332468778\",\"content\":\"遇到吉星就能施展它的权力，遇到凶星就会败坏它的轨迹。\"},{\"logicSentenceId\":\"7587041035332485162\",\"content\":\"最忌讳落入陷空之地，不能带来福气。\"},{\"logicSentenceId\":\"7587041035332550698\",\"content\":\"紫微星、天府星、廉贞星、天同星四星会合，构成禄存星的上佳格局。\"},{\"logicSentenceId\":\"7587041035332354090\",\"content\":\"问：禄存星所主管的是什么呢？\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":5257,"chapterOrder":2,"inChapterOrder":53,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863847981093","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"830\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：\",\"logicSentenceId\":\"7587041035332599850\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"831\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175060478541878\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"832\",\"lineNum\":0,\"lineType\":1,\"content\":\"北斗禄存星，数中為上局。\",\"logicSentenceId\":\"7587041035332599850\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"833\",\"lineNum\":0,\"lineType\":1,\"content\":\"守值身命内，不貴多金玉。\",\"logicSentenceId\":\"7587041035332616234\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"834\",\"lineNum\":0,\"lineType\":1,\"content\":\"此爲迪吉星，亦可登仕路。\",\"logicSentenceId\":\"7587041035332632618\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"835\",\"lineNum\":0,\"lineType\":1,\"content\":\"文人有聲名，武人有厚禄，常庶發橫財，僧道主獲福，官吏若逢之，断然食天禄。\",\"logicSentenceId\":\"7587041035332649002\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175012839849995","endPageId":"7330175060478541878","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035332649002\",\"content\":\"文人会有声誉名望，武人有丰厚的俸禄，普通人会发横财，僧人道士会获得福报，官吏如果遇到它，必然会享受朝廷的俸禄。\"},{\"logicSentenceId\":\"7587041035332599850\",\"content\":\"歌诀说：北斗禄存星，在命理数中属于上佳格局。\"},{\"logicSentenceId\":\"7587041035332616234\",\"content\":\"坐守身宫和命宫之内，不以多金多玉为贵。\"},{\"logicSentenceId\":\"7587041035332632618\",\"content\":\"这是一颗启迪吉祥的星，也可以踏上仕途。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1558,"chapterOrder":2,"inChapterOrder":54,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863847997477","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"836\",\"lineNum\":0,\"lineType\":1,\"content\":\"又曰：夾禄拱貴，并化禄，命裡重逢金滿屋。\",\"logicSentenceId\":\"7587041035332665386\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"837\",\"lineNum\":0,\"lineType\":1,\"content\":\"不惟方丈比諸侯，一食萬鍾猶未足。\",\"logicSentenceId\":\"7587041035332681770\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175060478541878","endPageId":"7330175060478541878","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035332665386\",\"content\":\"又说：受到禄星夹护、贵人拱卫，并且化出禄星，命中若再遇到这种情况就会家财万贯。\"},{\"logicSentenceId\":\"7587041035332681770\",\"content\":\"不仅方丈能与诸侯相比，一顿饭吃万锺粮食还嫌不足。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":694,"chapterOrder":2,"inChapterOrder":55,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848013861","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"838\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄存對靣守遷移，三合逢之利禄冝。\",\"logicSentenceId\":\"7587041035332698154\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"839\",\"lineNum\":0,\"lineType\":1,\"content\":\"得逢遐迩人欽敬，的然白手起家基。\",\"logicSentenceId\":\"7587041035332714538\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175060478541878","endPageId":"7330175060478541878","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035332698154\",\"content\":\"禄存星落在迁移宫的对面宫位，迁移宫三合位遇到它，有利于获得功名利禄。\"},{\"logicSentenceId\":\"7587041035332714538\",\"content\":\"能够得到远近之人的钦佩敬重，的确可以白手创立家业根基。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":676,"chapterOrder":2,"inChapterOrder":56,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848030245","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"840\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：天馬星所主若何？\",\"logicSentenceId\":\"7587041035332730922\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"841\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：諸宮各有制化，如身命臨之，謂之驛馬，喜禄存、紫府、昌曲守照為吉。\",\"logicSentenceId\":\"7587041035332747306\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"842\",\"lineNum\":0,\"lineType\":1,\"content\":\"如大小二限\",\"logicSentenceId\":\"7587041035332763690\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"843\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175060478640182\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"844\",\"lineNum\":0,\"lineType\":1,\"content\":\"臨之，更遇禄存、紫府、流昌必利。\",\"logicSentenceId\":\"7587041035332763690\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"845\",\"lineNum\":0,\"lineType\":1,\"content\":\"如與禄存同宫，謂之禄馬交。\",\"logicSentenceId\":\"7587041035332780074\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"846\",\"lineNum\":0,\"lineType\":1,\"content\":\"馳又曰：折鞭馬，紫府同宫，謂之扶舉馬；刑殺同宫，謂之負尸馬；火星同宫，謂之戰馬；日月同宫，謂之雌雄。\",\"logicSentenceId\":\"7587041035332796458\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"847\",\"lineNum\":0,\"lineType\":1,\"content\":\"馬，逢空亡，謂之死亡；馬，居絶死，謂之死馬，遇陀羅，謂之折足馬。\",\"logicSentenceId\":\"7587041035332812842\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"848\",\"lineNum\":0,\"lineType\":1,\"content\":\"以上犯此数者，俱主災病。\",\"logicSentenceId\":\"7587041035332829226\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"849\",\"lineNum\":0,\"lineType\":1,\"content\":\"流年值之，依此断。\",\"logicSentenceId\":\"7587041035332845610\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175060478541878","endPageId":"7330175060478640182","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035332829226\",\"content\":\"以上触犯这些情况的，都预示着会有灾病。\"},{\"logicSentenceId\":\"7587041035332845610\",\"content\":\"流年遇到这些情况，就依据上述的内容来判断。\"},{\"logicSentenceId\":\"7587041035332730922\",\"content\":\"问：天马星所主的情况是怎样的？\"},{\"logicSentenceId\":\"7587041035332747306\",\"content\":\"希夷先生回答说：各个星宫都有各自的制化规则，如果身命宫遇到天马星，就称为驿马，喜欢有禄存星、紫府星、文昌星和文曲星守护照临，则为吉利。\"},{\"logicSentenceId\":\"7587041035332763690\",\"content\":\"如果大小二限遇到天马星，再遇到禄存、紫府、流昌必定有利。\"},{\"logicSentenceId\":\"7587041035332780074\",\"content\":\"如果与禄存星同宫，就叫做禄马交。\"},{\"logicSentenceId\":\"7587041035332796458\",\"content\":\"驰又说：折鞭马，与紫府同宫，称为扶举马；与刑杀同宫，称为负尸马；与火星同宫，称为战马；与日月同宫，称为雌雄。\"},{\"logicSentenceId\":\"7587041035332812842\",\"content\":\"天马星遇到空亡，称作死亡马；天马星处在绝死之位，称作死马；天马星遇到陀罗星，称作折足马。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":3070,"chapterOrder":2,"inChapterOrder":57,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848046629","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"850\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：化禄星所主若何？\",\"logicSentenceId\":\"7587041035332861994\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"851\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：禄為福徳之神，守身命官禄之位，科權相逢，必作大臣之職。\",\"logicSentenceId\":\"7587041035332878378\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"852\",\"lineNum\":0,\"lineType\":1,\"content\":\"小限逢之，主進財入仕之喜，大限十年，吉慶無疑。\",\"logicSentenceId\":\"7587041035332894762\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"853\",\"lineNum\":0,\"lineType\":1,\"content\":\"𢙣曜來臨，并羊陀火忌冲照，亦不為害。\",\"logicSentenceId\":\"7587041035332911146\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"854\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人吉凑作命婦。\",\"logicSentenceId\":\"7587041035332927530\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"855\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限逢之，内外威嚴，殺凑平常。\",\"logicSentenceId\":\"7587041035332943914\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175060478640182","endPageId":"7330175060478640182","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035332927530\",\"content\":\"女人若吉星汇聚则可成为受封诰的妇女。\"},{\"logicSentenceId\":\"7587041035332943914\",\"content\":\"小限、大限遇到化禄星，会有内外都很有威严的运势，如果同时遇到煞星汇聚，就只是运势平常而已。\"},{\"logicSentenceId\":\"7587041035332861994\",\"content\":\"问：化禄星代表的情况是怎样的？\"},{\"logicSentenceId\":\"7587041035332878378\",\"content\":\"希夷先生回答说：禄星是福德之神，守护在身宫、命宫和官禄宫的位置，与科星、权星相遇，必定能担任大臣之职。\"},{\"logicSentenceId\":\"7587041035332894762\",\"content\":\"小限遇到化禄星，主要预示获得财富和官职的喜事，大限十年期间，吉祥喜庆无疑。\"},{\"logicSentenceId\":\"7587041035332911146\",\"content\":\"即使凶星降临，以及与擎羊、陀罗、火星、化忌相冲照，也不会造成危害。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2051,"chapterOrder":2,"inChapterOrder":58,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848063013","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"856\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：化權星所主若何？\",\"logicSentenceId\":\"7587041035332960298\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"857\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：權星掌判生殺之神，\",\"logicSentenceId\":\"7587041035332976682\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"858\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175060478738486\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"859\",\"lineNum\":0,\"lineType\":1,\"content\":\"守身命科禄相，出将入相，科權相逢，必定文章冠世，人皆欽仰。\",\"logicSentenceId\":\"7587041035332976682\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"860\",\"lineNum\":0,\"lineType\":1,\"content\":\"小限相逢，無有不吉，大限十年，必然遂志。\",\"logicSentenceId\":\"7587041035332993066\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"861\",\"lineNum\":0,\"lineType\":1,\"content\":\"如逢羊陀、耗使刼空，听說貽累，官災貶謫。\",\"logicSentenceId\":\"7587041035333009450\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"862\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人得之，内外稱意，可作命婦僧道，掌山林，有師號。\",\"logicSentenceId\":\"7587041035333025834\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175060478640182","endPageId":"7330175060478738486","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035333009450\",\"content\":\"如果遇到羊陀、耗使、劫空等煞星，据说会受到牵累，遭遇官场灾祸而被贬官。\"},{\"logicSentenceId\":\"7587041035333025834\",\"content\":\"女人得到化权星，家庭内外都称心如意，可以成为命妇、出家为僧尼或道士，能够掌管寺庙道观，拥有师号。\"},{\"logicSentenceId\":\"7587041035332960298\",\"content\":\"问：化权星所主管的事情是怎样的？\"},{\"logicSentenceId\":\"7587041035332976682\",\"content\":\"希夷先生回答说：权星是掌管和决断生杀大权的神，守护身命宫并与科星、禄星相配时，能出将入相；科星和权星相遇，必定文章冠绝当世，人人都钦佩敬仰。\"},{\"logicSentenceId\":\"7587041035332993066\",\"content\":\"小限相遇，没有不吉利的事，大限十年，必定实现志向。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2113,"chapterOrder":2,"inChapterOrder":59,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848079397","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"863\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：化科星所主若何？\",\"logicSentenceId\":\"7587041035333042218\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"864\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：科星上界應試，主掌文墨之星，守身命權禄相逢，宰臣之貴。\",\"logicSentenceId\":\"7587041035333058602\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"865\",\"lineNum\":0,\"lineType\":1,\"content\":\"如逢𢙣曜，亦為文章秀士，可作群英師範。\",\"logicSentenceId\":\"7587041035333074986\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"866\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命吉供，主貴封贈，雖四殺冲破，亦爲冨貴。\",\"logicSentenceId\":\"7587041035333091370\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"867\",\"lineNum\":0,\"lineType\":1,\"content\":\"與科星拱冲同論。\",\"logicSentenceId\":\"7587041035333107754\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175060478738486","endPageId":"7330175060478738486","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035333091370\",\"content\":\"女性命格若逢吉曜，主能获得显贵的封赠，即使四煞星冲破命局，也能享有富贵。\"},{\"logicSentenceId\":\"7587041035333107754\",\"content\":\"与科星相互拱冲的情况同样看待。\"},{\"logicSentenceId\":\"7587041035333042218\",\"content\":\"问：化科星主掌的是什么呢？\"},{\"logicSentenceId\":\"7587041035333058602\",\"content\":\"希夷先生回答说：科星在天界掌管科举考试，是掌管文墨的星，若守身命宫且与权星、禄星相逢，预示能获得宰相般的尊贵地位。\"},{\"logicSentenceId\":\"7587041035333074986\",\"content\":\"如果遇上凶星，也是才华出众的文人，能够成为众人的榜样和老师。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1676,"chapterOrder":2,"inChapterOrder":60,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848095781","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"868\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：化忌星所主若何？\",\"logicSentenceId\":\"7587041035333124138\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"869\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：忌為多管之神，守身命，一生不順，小限逢之，二年不足，大限十年悔吝。\",\"logicSentenceId\":\"7587041035333140522\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"870\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限太歳\",\"logicSentenceId\":\"7587041035333156906\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"871\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175109665128502\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"872\",\"lineNum\":0,\"lineType\":1,\"content\":\"交臨，斷然蹭蹬。\",\"logicSentenceId\":\"7587041035333156906\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"873\",\"lineNum\":0,\"lineType\":1,\"content\":\"文人不耐乆，武人縱有官災，口舌不妨，雖啇賈枝藝人皆不冝利。\",\"logicSentenceId\":\"7587041035333173290\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"874\",\"lineNum\":0,\"lineType\":1,\"content\":\"如㑹紫府、昌曲，左右科權，禄與忌同宫，又兼四殺共處，即發，亦不住財，功名亦不成就。\",\"logicSentenceId\":\"7587041035333189674\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"875\",\"lineNum\":0,\"lineType\":1,\"content\":\"如卑逢四殺，耗使刼空，主奔波𢃄疾，僧道流移還信，女人一生貧妖。\",\"logicSentenceId\":\"7587041035713249299\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175060478738486","endPageId":"7330175109665128502","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035713249299\",\"content\":\"如果命格低微又逢四煞星，以及耗星、使星、劫星、空星，主一生奔波劳碌且疾病缠身，僧人道士会四处漂泊还俗，女人会一生贫穷且命运坎坷。\"},{\"logicSentenceId\":\"7587041035333124138\",\"content\":\"问：化忌星所主的情况是怎样的？\"},{\"logicSentenceId\":\"7587041035333140522\",\"content\":\"希夷先生回答说：化忌星是多管闲事之神，守护身命宫，一生都不顺利，小限遇到它，两年内会诸事不顺，大限遇到它，十年内都会有遗憾和悔恨的事情发生。\"},{\"logicSentenceId\":\"7587041035333156906\",\"content\":\"大小二限与太岁相遇，必定困顿不顺。\"},{\"logicSentenceId\":\"7587041035333173290\",\"content\":\"文人难以长久顺遂，武人即便遭遇官灾，口舌是非也无大碍，即便从事商业、技艺的人也都难以获利。\"},{\"logicSentenceId\":\"7587041035333189674\",\"content\":\"如果遇到紫微、天府、文昌、文曲，以及左辅、右弼、科星、权星，禄星与忌星在同一宫位，又兼与四煞星同处，即使发达，也守不住钱财，功名也无法成就。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2687,"chapterOrder":2,"inChapterOrder":61,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848112165","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"876\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：擎羊星所主若何？\",\"logicSentenceId\":\"7587041035713265683\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"877\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：擎羊比斗之助星，守身命，性麄行暴，孤单則視親為踈，翻恩為怨，入庙性剛果决，机謀好勇，主權貴。\",\"logicSentenceId\":\"7587041035713282067\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"878\",\"lineNum\":0,\"lineType\":1,\"content\":\"北方生人為福，四墓生人不忌，居卯酉作禍興殃，刑尅極甚。\",\"logicSentenceId\":\"7587041035713298451\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"879\",\"lineNum\":0,\"lineType\":1,\"content\":\"六甲六戊生人，必有卤禍，縱冨貴不乆，亦不善終。\",\"logicSentenceId\":\"7587041035713314835\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"880\",\"lineNum\":0,\"lineType\":1,\"content\":\"若九流工藝人，辛勤，加火忌刼空冲破，殘疾離祖，刑尅六親。\",\"logicSentenceId\":\"7587041035713331219\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"881\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人入庙加吉，上局殺耗冲破，多主刑尅。\",\"logicSentenceId\":\"7587041035713347603\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"882\",\"lineNum\":0,\"lineType\":1,\"content\":\"下局。\",\"logicSentenceId\":\"7587041035713363987\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175109665128502","endPageId":"7330175109665128502","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035713314835\",\"content\":\"六甲年和六戊年出生的人，必定会有鲁莽带来的灾祸，即使富贵也不会长久，也不能善终。\"},{\"logicSentenceId\":\"7587041035713331219\",\"content\":\"如果是从事九流工艺的人，辛勤劳作，再加上火星、忌星、劫星、空星冲破，会导致残疾、离开祖籍，刑克六亲。\"},{\"logicSentenceId\":\"7587041035713347603\",\"content\":\"女人入庙且有吉星相助，但上等格局被煞星、耗星冲破，大多会有刑克之事。\"},{\"logicSentenceId\":\"7587041035713363987\",\"content\":\"下等格局。\"},{\"logicSentenceId\":\"7587041035713265683\",\"content\":\"问：擎羊星所主宰的是怎样的呢？\"},{\"logicSentenceId\":\"7587041035713282067\",\"content\":\"希夷先生回答说：擎羊星是北斗的辅助星，守护身宫、命宫，性格粗鲁、行为暴躁，孤独时会把亲人看得疏远，将恩情转变为怨恨，入庙时，性格刚强果决，善于谋划、喜好勇武，主有权贵之象。\"},{\"logicSentenceId\":\"7587041035713298451\",\"content\":\"北方出生的人有福气，四墓出生的人不忌，居住在卯酉方位会招致祸患和灾难，刑克非常严重。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2617,"chapterOrder":2,"inChapterOrder":62,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848128549","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"883\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175109665275958\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"884\",\"lineNum\":0,\"lineType\":1,\"content\":\"問陀羅星所主若何？\",\"logicSentenceId\":\"7587041035713380371\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"885\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：陀羅北斗之助星，守身命，心行不正，暗𰜜長流，性剛威猛，作事進退，横成橫破，飄蕩不定。\",\"logicSentenceId\":\"7587041035713396755\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"886\",\"lineNum\":0,\"lineType\":1,\"content\":\"與貪狼同度，因酒色以成痨；與火鈴同處，定疥疫之不死。\",\"logicSentenceId\":\"7587041035713413139\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"887\",\"lineNum\":0,\"lineType\":1,\"content\":\"居疾厄，暗疾緾綿。\",\"logicSentenceId\":\"7587041035713429523\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"888\",\"lineNum\":0,\"lineType\":1,\"content\":\"辰戍丑未生人爲福，在庙財官論文人不耐\",\"logicSentenceId\":\"7587041035713445907\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"889\",\"lineNum\":0,\"lineType\":2,\"content\":\"乆武。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"890\",\"lineNum\":0,\"lineType\":1,\"content\":\"人，横發高遷。\",\"logicSentenceId\":\"7587041035713445907\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"891\",\"lineNum\":0,\"lineType\":1,\"content\":\"若陥地加殺，刑尅招㐫，二姓延生，女人刑尅下賤。\",\"logicSentenceId\":\"7587041035713462291\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175109665275958","endPageId":"7330175109665275958","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035713413139\",\"content\":\"与贪狼星同处一宫，会因沉迷酒色而患上痨病；与火星、铃星同处一宫，必定会患疥疮、瘟疫但不会死。\"},{\"logicSentenceId\":\"7587041035713429523\",\"content\":\"陀罗星位于疾厄宫，人会有缠绵难愈的暗疾。\"},{\"logicSentenceId\":\"7587041035713445907\",\"content\":\"辰戌丑未出生的人有福，陀罗星处于庙旺之地时，主财运和官运，文人士子耐不住性子，会突然发达高升。\"},{\"logicSentenceId\":\"7587041035713462291\",\"content\":\"如果陀罗星处于陷地并且遇到了煞星，就会刑克六亲而招来凶祸，需要过继给其他姓氏的人家才能生存，女性则刑克亲人且命格低微。\"},{\"logicSentenceId\":\"7587041035713380371\",\"content\":\"问陀罗星主掌的情况如何？\"},{\"logicSentenceId\":\"7587041035713396755\",\"content\":\"希夷先生回答说：陀罗是北斗的辅助星，守在身宫、命宫，心思行为不端正，暗中的祸害不断，性格刚强威猛，做事犹豫不决，意外成功也意外破败，漂泊不定。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2622,"chapterOrder":2,"inChapterOrder":63,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848144933","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"892\",\"lineNum\":0,\"lineType\":10,\"content\":\"羊陀二星緫論\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175109665275958","endPageId":"7330175109665275958","contentEncryptType":0,"translateContent":"","chapterId":"1jvzoopnqo0t6","dataSize":121,"chapterOrder":2,"inChapterOrder":64,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848161317","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"893\",\"lineNum\":0,\"lineType\":1,\"content\":\"玉蟾先生曰：擎羊、陀羅二星，属火金，乃北斗浮星，在斗司奏，在數主㐫厄，羊化氣。\",\"logicSentenceId\":\"7587041035713478675\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"894\",\"lineNum\":0,\"lineType\":1,\"content\":\"曰刑。\",\"logicSentenceId\":\"7587041035713495059\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"895\",\"lineNum\":0,\"lineType\":1,\"content\":\"陀化氣曰忌。\",\"logicSentenceId\":\"7587041035713511443\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"896\",\"lineNum\":0,\"lineType\":1,\"content\":\"怕臨兄弟田宅，父母\",\"logicSentenceId\":\"7587041035713527827\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"897\",\"lineNum\":0,\"lineType\":2,\"content\":\"三宫忌三\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"898\",\"lineNum\":0,\"lineType\":1,\"content\":\"合臨，身命，合昌曲左右有暗痣，眼痣見日月，女尅\",\"logicSentenceId\":\"7587041035713527827\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"899\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175109665423414\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"900\",\"lineNum\":0,\"lineType\":1,\"content\":\"夫而夫尅婦，為諸官之㐫神。\",\"logicSentenceId\":\"7587041035713527827\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"901\",\"lineNum\":0,\"lineType\":1,\"content\":\"忌同日月，則傷親損目；刑併桃花，則風流惹禍。\",\"logicSentenceId\":\"7587041035713544211\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"902\",\"lineNum\":0,\"lineType\":1,\"content\":\"忌與貪狼合，因花酒以忘身。\",\"logicSentenceId\":\"7587041035713560595\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"903\",\"lineNum\":0,\"lineType\":1,\"content\":\"刑與暗同行，招暗疾而壊目。\",\"logicSentenceId\":\"7587041035713576979\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"904\",\"lineNum\":0,\"lineType\":1,\"content\":\"忌與殺暗同度，招凌辱而生暗疾。\",\"logicSentenceId\":\"7587041035713593363\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"905\",\"lineNum\":0,\"lineType\":1,\"content\":\"與火鈴為㐫伴，只冝僧道權。\",\"logicSentenceId\":\"7587041035713609747\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"906\",\"lineNum\":0,\"lineType\":1,\"content\":\"刑合殺，疾病官厄，不免貪耗流年，面上刺痕。\",\"logicSentenceId\":\"7587041035713626131\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"907\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限更遇此，灾害不時而生也。\",\"logicSentenceId\":\"7587041035713642515\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175109665275958","endPageId":"7330175109665423414","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035713527827\",\"content\":\"怕临兄弟宫、田宅宫，与父母宫合临，与身宫命宫同临；若与文昌、文曲、左辅、右弼同宫则身上有暗痣，与太阳、太阴同宫则眼睛周围有痣，女命克夫，男命克妻，为诸宫之凶神。\"},{\"logicSentenceId\":\"7587041035713495059\",\"content\":\"叫做刑。\"},{\"logicSentenceId\":\"7587041035713576979\",\"content\":\"擎羊星与暗曜一同出现，会招来暗疾并且损害眼睛。\"},{\"logicSentenceId\":\"7587041035713560595\",\"content\":\"忌讳与贪狼星会合，因为沉迷花酒而迷失自我。\"},{\"logicSentenceId\":\"7587041035713593363\",\"content\":\"忌与杀星、暗星同宫，会遭遇凌辱而产生暗疾。\"},{\"logicSentenceId\":\"7587041035713626131\",\"content\":\"擎羊与七杀相会，会有疾病、官运困厄，流年还难免有贪念损耗，脸上会有刺痕。\"},{\"logicSentenceId\":\"7587041035713511443\",\"content\":\"陀罗星化气为忌。\"},{\"logicSentenceId\":\"7587041035713609747\",\"content\":\"与火星、铃星成为凶伴，只适合在僧道方面掌权。\"},{\"logicSentenceId\":\"7587041035713544211\",\"content\":\"陀罗星与太阳、太阴同宫，会伤害亲人、损伤眼睛；擎羊星与桃花星同宫，会因为风流韵事招来灾祸。\"},{\"logicSentenceId\":\"7587041035713478675\",\"content\":\"玉蟾先生说：擎羊、陀罗二星，属火金，是北斗的浮星，在北斗中负责奏事，在气数上主凶厄，擎羊化气。\"},{\"logicSentenceId\":\"7587041035713642515\",\"content\":\"大运和小运中如果再次遇到这两颗星，灾害就会不时发生。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":4070,"chapterOrder":2,"inChapterOrder":65,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848177701","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"908\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：刑與暗同行，暗疾刑六親。\",\"logicSentenceId\":\"7587041035713658899\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"909\",\"lineNum\":0,\"lineType\":1,\"content\":\"火鈴遇凶俾，只冝道與僧權。\",\"logicSentenceId\":\"7587041035713675283\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"910\",\"lineNum\":0,\"lineType\":1,\"content\":\"刑囚合殺，疾病炎厄侵貪耗流年聚，面上刺痕新。\",\"logicSentenceId\":\"7587041035713691667\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"911\",\"lineNum\":0,\"lineType\":1,\"content\":\"限運若逢此，横禍血刄生。\",\"logicSentenceId\":\"7587041035713708051\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"912\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀夭夀殺人遇爲掃星。\",\"logicSentenceId\":\"7587041035713724435\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"913\",\"lineNum\":0,\"lineType\":1,\"content\":\"君子防恐惧，小人遭凌刑，遇耗决。\",\"logicSentenceId\":\"7587041035713740819\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"914\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175173032787987\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"915\",\"lineNum\":0,\"lineType\":1,\"content\":\"乞求只冝林下人。\",\"logicSentenceId\":\"7587041035713757203\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"916\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限倘來犯，不時災禍侵。\",\"logicSentenceId\":\"7587041035713773587\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175109665423414","endPageId":"7330175173032787987","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035713740819\",\"content\":\"君子防备恐惧之事，小人遭受欺凌刑罚，遇到耗星定有灾祸。\"},{\"logicSentenceId\":\"7587041035713757203\",\"content\":\"乞求只适合隐居山林之人。\"},{\"logicSentenceId\":\"7587041035713773587\",\"content\":\"如果大运和小限遇到这种情况，灾祸会不时降临。\"},{\"logicSentenceId\":\"7587041035713658899\",\"content\":\"歌诀说：刑星与暗星一同出现，会带来暗疾且伤害六亲。\"},{\"logicSentenceId\":\"7587041035713675283\",\"content\":\"火星、铃星与凶神相遇，只适合在僧道中掌权。\"},{\"logicSentenceId\":\"7587041035713691667\",\"content\":\"刑星、囚星与杀星会合，疾病、火灾等灾祸侵袭，贪耗之事在流年聚集，脸上会有新的刺痕。\"},{\"logicSentenceId\":\"7587041035713708051\",\"content\":\"如果在限运中遇到这种情况，就会遭遇横祸、血光之灾。\"},{\"logicSentenceId\":\"7587041035713724435\",\"content\":\"羊陀星主夭折减寿、有杀身之祸，遇到它们会被称为扫星。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2536,"chapterOrder":2,"inChapterOrder":66,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848194085","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"917\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：火星所主若何？\",\"logicSentenceId\":\"7587041035713789971\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"918\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：火星乃南斗浮星也。\",\"logicSentenceId\":\"7587041035713806355\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"919\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生歌曰：火星大殺将，南斗號殺神。\",\"logicSentenceId\":\"7587041035713822739\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"920\",\"lineNum\":0,\"lineType\":1,\"content\":\"若坐身命位，諸宫不可臨。\",\"logicSentenceId\":\"7587041035713839123\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"921\",\"lineNum\":0,\"lineType\":1,\"content\":\"性氣亦沉𣫭，剛強出衆人。\",\"logicSentenceId\":\"7587041035713855507\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"922\",\"lineNum\":0,\"lineType\":1,\"content\":\"毛髪多異類，唇齒有傷痕。\",\"logicSentenceId\":\"7587041035713871891\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"923\",\"lineNum\":0,\"lineType\":1,\"content\":\"更與羊陀㑹，襁褓必災迍。\",\"logicSentenceId\":\"7587041035713888275\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"924\",\"lineNum\":0,\"lineType\":1,\"content\":\"過房出外飬，二姓可延生。\",\"logicSentenceId\":\"7587041035713904659\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"925\",\"lineNum\":0,\"lineType\":1,\"content\":\"此星東南利，不利西北生。\",\"logicSentenceId\":\"7587041035713921043\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"926\",\"lineNum\":0,\"lineType\":1,\"content\":\"若得貪狼㑹，旺地貴無倫。\",\"logicSentenceId\":\"7587041035713937427\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"927\",\"lineNum\":0,\"lineType\":1,\"content\":\"封侯居上将，勲業著邉庭。\",\"logicSentenceId\":\"7587041035713953811\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"928\",\"lineNum\":0,\"lineType\":1,\"content\":\"三方無殺破，中年後始興。\",\"logicSentenceId\":\"7587041035713970195\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"929\",\"lineNum\":0,\"lineType\":1,\"content\":\"僧首多飄蕩，不守規戒心。\",\"logicSentenceId\":\"7587041035713986579\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"930\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人旺地絜，陥地主邪滛。\",\"logicSentenceId\":\"7587041035714002963\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"931\",\"lineNum\":0,\"lineType\":1,\"content\":\"刑夫又尅子，下賤劳碌人。\",\"logicSentenceId\":\"7587041035714019347\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"932\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：鈴星所主若何？\",\"logicSentenceId\":\"7587041035714035731\",\"marginNoteIdList\":nul
