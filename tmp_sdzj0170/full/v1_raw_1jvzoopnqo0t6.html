nt\":\"此星处于命宫，为人敦厚稳重，面色发紫，一概作吉利论断。\"},{\"logicSentenceId\":\"7587041034758111251\",\"content\":\"能够洞察细微之处，做事情很有方法。\"},{\"logicSentenceId\":\"7587041034758127635\",\"content\":\"女性命盘中有此星是福气，遇到吉星就吉利，遇到凶星就凶险。\"},{\"logicSentenceId\":\"7587041034757996563\",\"content\":\"如果遇到四煞、劫煞、天空，天机、天梁星冲破，必定是出家之人。\"},{\"logicSentenceId\":\"7587041034758062099\",\"content\":\"后来化气说：善与地合而行事，能解析诸星的顺逆定数。\"},{\"logicSentenceId\":\"7587041034758078483\",\"content\":\"对于人的命数而言，若遇到各种吉星都聚集在一起，那么所有事情都会顺遂。\"},{\"logicSentenceId\":\"7587041034758160403\",\"content\":\"学习命理的人应该仔细琢磨这些内容。\"},{\"logicSentenceId\":\"7587041034758029331\",\"content\":\"问：天机星所掌管的是什么呢？\"},{\"logicSentenceId\":\"7587041034758045715\",\"content\":\"回答说：天机星属木，是南斗第三颗增寿的吉星。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":5426,"chapterOrder":2,"inChapterOrder":22,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008568371","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"366\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生曰：天機益夀之星，若守身命，主人異常。\",\"logicSentenceId\":\"7587041034758176787\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"367\",\"lineNum\":0,\"lineType\":1,\"content\":\"與天梁左右，昌曲交㑹，文為清題，武為忠良。\",\"logicSentenceId\":\"7587041034758193171\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"368\",\"lineNum\":0,\"lineType\":1,\"content\":\"若居陷地，四殺冲破，是為下局。\",\"logicSentenceId\":\"7587041034758209555\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"369\",\"lineNum\":0,\"lineType\":1,\"content\":\"若見七殺天梁，當爲僧道之淸閑。\",\"logicSentenceId\":\"7587041034758225939\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"370\",\"lineNum\":0,\"lineType\":1,\"content\":\"凢人二限逢之，興家創業更攺。\",\"logicSentenceId\":\"7587041034758242323\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"371\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人吉星拱照，主旺夫益子，有權禄則為貴婦，落局羊陀火忌冲破，主下賤殘疾刑尅。\",\"logicSentenceId\":\"7587041034758258707\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174419656065060","endPageId":"7330174419656065060","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034758258707\",\"content\":\"女人若有吉星拱照，主能旺夫益子，若有权力和俸禄则会成为贵妇，若落入不好的格局且被羊陀火忌冲破，主下贱、残疾，遭遇刑克之事。\"},{\"logicSentenceId\":\"7587041034758176787\",\"content\":\"希夷先生说：天机星是增寿之星，如果守护人的身宫和命宫，预示此人非同寻常。\"},{\"logicSentenceId\":\"7587041034758193171\",\"content\":\"天机星与天梁星、左辅星、右弼星、文昌星、文曲星交会，命主若是从文则成为清高高雅的文人，若是从武则成为忠诚贤良的将领。\"},{\"logicSentenceId\":\"7587041034758209555\",\"content\":\"如果天机星处于陷地，被四煞星冲破，这就是下等格局。\"},{\"logicSentenceId\":\"7587041034758225939\",\"content\":\"若遇到七杀星和天梁星，此人会有僧道般的清闲生活。\"},{\"logicSentenceId\":\"7587041034758242323\",\"content\":\"凡是人在大运和流年遇到天机星时，会振兴家业、开创事业并做出改变。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2215,"chapterOrder":2,"inChapterOrder":23,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008584755","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"372\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：天機兄弟，主南斗正曜星，作事有操畧，禀性最高明，所為最好尚，亦可作群英，㑹吉主享福，入格居翰林。\",\"logicSentenceId\":\"7587041034758275091\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"373\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門同一位，武職壓邉庭，亦要權逢殺，方可立功名。\",\"logicSentenceId\":\"7587041034758291475\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"374\",\"lineNum\":0,\"lineType\":1,\"content\":\"天梁星同位，定作道與\",\"logicSentenceId\":\"7587041034758307859\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"375\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174419656196132\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"376\",\"lineNum\":0,\"lineType\":1,\"content\":\"僧，女人若逢此，性巧必滛奔。\",\"logicSentenceId\":\"7587041034758307859\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"377\",\"lineNum\":0,\"lineType\":1,\"content\":\"天同與昌曲，聚拱主華荣，辰戍子午地，入廟有功名。\",\"logicSentenceId\":\"7587041034758324243\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"378\",\"lineNum\":0,\"lineType\":1,\"content\":\"若在寅卯辰，七殺并破軍，血光災不測，羊陀及火鈴。\",\"logicSentenceId\":\"7587041034758340627\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"379\",\"lineNum\":0,\"lineType\":1,\"content\":\"若與諸殺㑹，災患有虛驚。\",\"logicSentenceId\":\"7587041034758357011\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"380\",\"lineNum\":0,\"lineType\":1,\"content\":\"武暗𤎉破㑹，両目少光明。\",\"logicSentenceId\":\"7587041034758373395\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"381\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限臨此宿，事必有變更。\",\"logicSentenceId\":\"7587041034758389779\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174419656065060","endPageId":"7330174419656196132","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034758357011\",\"content\":\"如果与众多煞星交会，灾祸和虚惊就会出现。\"},{\"logicSentenceId\":\"7587041034758373395\",\"content\":\"武曲、暗曜、廉贞、破军四星相会，两眼少光明。\"},{\"logicSentenceId\":\"7587041034758389779\",\"content\":\"行运到这一星宿时，事情必定会有变化。\"},{\"logicSentenceId\":\"7587041034758275091\",\"content\":\"歌中说：天机星作为兄弟宫的主星，是南斗的正曜星，命主做事有谋略，禀性极为聪明，所作所为最为高尚，也能成为杰出人物，若与吉星会合则主享福，符合格局可位居翰林。\"},{\"logicSentenceId\":\"7587041034758291475\",\"content\":\"天机星与巨门星同宫，命主适合担任武职镇守边疆，也必须权星七杀同度，才能建立功名。\"},{\"logicSentenceId\":\"7587041034758307859\",\"content\":\"天梁星同宫，必定成为道士或僧人，女人如果遇到这种情况，生性乖巧但必定淫乱私奔。\"},{\"logicSentenceId\":\"7587041034758324243\",\"content\":\"天同星与文昌星、文曲星相聚拱照，主荣华富贵；在辰、戌、子、午的宫位，星曜入庙则会有功名。\"},{\"logicSentenceId\":\"7587041034758340627\",\"content\":\"如果位于寅、卯、辰的位置，七杀与破军同宫，则会有难以预料的血光之灾，还会遇到擎羊星、陀罗星以及火星、铃星。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":3212,"chapterOrder":2,"inChapterOrder":24,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008601139","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"382\",\"lineNum\":0,\"lineType\":1,\"content\":\"玉蟾先生曰：天機，南斗善星，故化氣曰善，佐帝令以行事，解諸㐫之逆節定教。\",\"logicSentenceId\":\"7587041034758406163\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"383\",\"lineNum\":0,\"lineType\":1,\"content\":\"於人命之中，若逢吉聚，則為富貴。\",\"logicSentenceId\":\"7587041034758422547\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"384\",\"lineNum\":0,\"lineType\":1,\"content\":\"若逢殺冲亦必好善，孝義六親，勤於禮佛，無不仁不義之為，有靈通變逹之志。\",\"logicSentenceId\":\"7587041034758438931\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"385\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命逢之，多主福壽。\",\"logicSentenceId\":\"7587041034758455315\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"386\",\"lineNum\":0,\"lineType\":1,\"content\":\"其在廟旺有力，䧟地無力。\",\"logicSentenceId\":\"7587041034758471699\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"387\",\"lineNum\":0,\"lineType\":1,\"content\":\"問太陽所主若何？\",\"logicSentenceId\":\"7587041034758488083\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"388\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：太陽星属火，日之精也，乃造化之表儀。\",\"logicSentenceId\":\"7587041034758504467\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"389\",\"lineNum\":0,\"lineType\":1,\"content\":\"在数，主人有貴氣，能為文為武。\",\"logicSentenceId\":\"7587041034758520851\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"390\",\"lineNum\":0,\"lineType\":1,\"content\":\"諸吉集則降禎祥，處黒\",\"logicSentenceId\":\"7587041034758537235\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"391\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174464988053515\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"392\",\"lineNum\":0,\"lineType\":1,\"content\":\"星則劳心費力。\",\"logicSentenceId\":\"7587041034758537235\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"393\",\"lineNum\":0,\"lineType\":1,\"content\":\"若隨身命之中，居於庙樂之地，爲数中之至曜，乃官禄之樞機，後化貴化禄，最冝在官禄宮，男作父星，女為夫主。\",\"logicSentenceId\":\"7587041034758553619\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"394\",\"lineNum\":0,\"lineType\":1,\"content\":\"命逢諸吉守照，更得太隂同照，富貴全羙。\",\"logicSentenceId\":\"7587041034758570003\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"395\",\"lineNum\":0,\"lineType\":1,\"content\":\"若身居之。\",\"logicSentenceId\":\"7587041034882777129\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"396\",\"lineNum\":0,\"lineType\":1,\"content\":\"逢吉聚，則可在貴人門下客，否則公卿走卒，夫妻亦為弱宫。\",\"logicSentenceId\":\"7587041034882793513\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"397\",\"lineNum\":0,\"lineType\":1,\"content\":\"男爲諸吉聚，可因妻得貴，䧟地加殺，傷妻不吉。\",\"logicSentenceId\":\"7587041034882809897\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"398\",\"lineNum\":0,\"lineType\":1,\"content\":\"男女宫得八座加吉星，在庙旺地，主生貴子，權柄不小。\",\"logicSentenceId\":\"7587041034882826281\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"399\",\"lineNum\":0,\"lineType\":1,\"content\":\"若財帛宫於旺地㑹吉相助，不怕巨門緾，其富貴綿逺矣。\",\"logicSentenceId\":\"7587041034882842665\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"400\",\"lineNum\":0,\"lineType\":1,\"content\":\"若旺相無空刼，一生主冨。\",\"logicSentenceId\":\"7587041034882859049\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"401\",\"lineNum\":0,\"lineType\":1,\"content\":\"居田宅，得祖父䕃澤；若左右諸吉星皆至，大小二限俱到，必有驟興之喜。\",\"logicSentenceId\":\"7587041034882875433\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"402\",\"lineNum\":0,\"lineType\":1,\"content\":\"若限不扶，不可以三合論議，恐應小差。\",\"logicSentenceId\":\"7587041034882891817\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"403\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命逢之，限旺亦可共享。\",\"logicSentenceId\":\"7587041034882908201\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"404\",\"lineNum\":0,\"lineType\":1,\"content\":\"與鈴刑忌集限，目下有憂，或主尅父。\",\"logicSentenceId\":\"7587041034882924585\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"405\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174464988151819\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"406\",\"lineNum\":0,\"lineType\":1,\"content\":\"與刑殺聚限，有傷官之憂，常人有官非之撓。\",\"logicSentenceId\":\"7587041034882940969\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"407\",\"lineNum\":0,\"lineType\":1,\"content\":\"與羊陀聚，則有疾病；與火鈴合，其苦楚不少。\",\"logicSentenceId\":\"7587041034882957353\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"408\",\"lineNum\":0,\"lineType\":1,\"content\":\"推而至此，禍福瞭然。\",\"logicSentenceId\":\"7587041034882973737\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"409\",\"lineNum\":0,\"lineType\":1,\"content\":\"遷移宫，其福與身命不同，難招祖業，移根換棄，出租爲家，限歩逢之，决要動移，女命逢之不及。\",\"logicSentenceId\":\"7587041034882990121\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"410\",\"lineNum\":0,\"lineType\":1,\"content\":\"若福徳宮有相佐夫，招賢明之夫。\",\"logicSentenceId\":\"7587041034883006505\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"411\",\"lineNum\":0,\"lineType\":1,\"content\":\"父毋宫男子单作父星，有輝則吉，無輝尅父。\",\"logicSentenceId\":\"7587041034883022889\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"412\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生曰：太陽星周天曆度，輪轉無竆，喜輔弼而佐君，象以禄存而助福。\",\"logicSentenceId\":\"7587041034883039273\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"413\",\"lineNum\":0,\"lineType\":1,\"content\":\"所忌者巨暗遭逢，所樂者太隂相旺，諸宫㑹吉則吉，黒道遇之則劳。\",\"logicSentenceId\":\"7587041034883055657\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"414\",\"lineNum\":0,\"lineType\":1,\"content\":\"守人身命，主人忠鯁，不較是非。\",\"logicSentenceId\":\"7587041034883072041\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"415\",\"lineNum\":0,\"lineType\":1,\"content\":\"若居廟旺，化禄化權，允為貴論。\",\"logicSentenceId\":\"7587041034883088425\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"416\",\"lineNum\":0,\"lineType\":1,\"content\":\"若得左右昌曲、魁鉞三合拱照財官二宫，富貴極品。\",\"logicSentenceId\":\"7587041034883104809\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"417\",\"lineNum\":0,\"lineType\":1,\"content\":\"加四殺，亦主飽煖，僧道有師號。\",\"logicSentenceId\":\"7587041034883121193\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"418\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人庙旺，\",\"logicSentenceId\":\"7587041034883137577\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"419\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174464988282891\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"420\",\"lineNum\":0,\"lineType\":1,\"content\":\"主旺夫益子，加權禄封贈，加殺主平常。\",\"logicSentenceId\":\"7587041034883137577\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174419656196132","endPageId":"7330174464988282891","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034883055657\",\"content\":\"所忌讳的是遇到巨暗星，所欢喜的是太阴星处于旺盛状态，各宫位与吉星会合就会有吉祥之事，遇到凶星就会辛劳。\"},{\"logicSentenceId\":\"7587041034882957353\",\"content\":\"与擎羊星、陀罗星相会，就会有疾病；与火星、铃星相合，所遭受的痛苦就不会少。\"},{\"logicSentenceId\":\"7587041034758537235\",\"content\":\"诸多吉星汇聚就会降下吉祥，与凶星同处就会劳心费力。\"},{\"logicSentenceId\":\"7587041034883022889\",\"content\":\"男子的父母宫单独作为父星，如果有光辉则为吉，没有光辉则克父。\"},{\"logicSentenceId\":\"7587041034758553619\",\"content\":\"如果在身命宫之中，处于庙旺喜乐之地，是星数中最尊贵的星曜，是官禄的关键，之后会化为贵人星、禄星，最适合落在官禄宫，对男性而言代表父亲，对女性而言代表丈夫。\"},{\"logicSentenceId\":\"7587041034758471699\",\"content\":\"它在处于庙旺的宫位时力量强大，处于陷地的宫位时力量弱小。\"},{\"logicSentenceId\":\"7587041034882891817\",\"content\":\"如果大运没有帮扶，就不能用三合宫来论断，恐怕会有小的偏差。\"},{\"logicSentenceId\":\"7587041034882875433\",\"content\":\"曜星落在田宅宫，能够得到祖父的庇佑和恩泽；如果左辅、右弼等吉星都汇聚，大小二限一起到来，必定会有突然兴盛的喜事。\"},{\"logicSentenceId\":\"7587041034882924585\",\"content\":\"与铃星、刑星、忌星在限运中会合，眼下会有忧愁，或者预示着克父。\"},{\"logicSentenceId\":\"7587041034758488083\",\"content\":\"问太阳星所掌管的是什么呢？\"},{\"logicSentenceId\":\"7587041034883088425\",\"content\":\"如果太阳星位于庙旺的宫位，出现化禄、化权的情况，确实可以称得上是富贵之相。\"},{\"logicSentenceId\":\"7587041034883006505\",\"content\":\"如果福德宫有相星来辅佐丈夫，能招来贤明的丈夫。\"},{\"logicSentenceId\":\"7587041034758504467\",\"content\":\"回答说：太阳星属火，是太阳的精华，是自然造化的外在表现。\"},{\"logicSentenceId\":\"7587041034883072041\",\"content\":\"太阳星在身宫、命宫，主人忠诚正直，不计较是非。\"},{\"logicSentenceId\":\"7587041034758520851\",\"content\":\"在命数上，主命之人有贵气，能文能武。\"},{\"logicSentenceId\":\"7587041034882777129\",\"content\":\"如果太阳星位于身宫。\"},{\"logicSentenceId\":\"7587041034758438931\",\"content\":\"若遇到煞星相冲也必定会心地善良，对六亲孝顺有道义，勤于礼佛，没有不仁不义的行为，有灵活变通、通达事理的志向。\"},{\"logicSentenceId\":\"7587041034882908201\",\"content\":\"女性命盘遇到这种情况，行运旺盛时也可共享富贵。\"},{\"logicSentenceId\":\"7587041034882793513\",\"content\":\"如果遇到吉星聚集，那么可以在贵人门下做门客；否则会成为公卿的走卒，夫妻宫也会成为弱势宫位。\"},{\"logicSentenceId\":\"7587041034882842665\",\"content\":\"如果财帛宫在旺地得吉星相助，就不怕巨门星缠绕，这样富贵就能绵延久远。\"},{\"logicSentenceId\":\"7587041034883121193\",\"content\":\"就算加上四煞星，也能让人衣食温饱，僧人、道士有师号。\"},{\"logicSentenceId\":\"7587041034882990121\",\"content\":\"迁移宫的福分与身宫、命宫不同，难以继承祖业，需离开故土，以租赁房屋为家，行运到此宫位，必定要迁移，女性命盘逢此情况更不利。\"},{\"logicSentenceId\":\"7587041034758422547\",\"content\":\"在人命之中，如果遇到吉星汇聚，就会富贵。\"},{\"logicSentenceId\":\"7587041034883137577\",\"content\":\"太阳星落在女命的庙旺之地，预示着这个女子能旺夫益子，如果再遇上化权、化禄，还能获得封赠，如果遇上了四煞星，就预示着这个女子一生比较平常。\"},{\"logicSentenceId\":\"7587041034882826281\",\"content\":\"男女宫有八座星和吉星，且处于庙旺之地，预示会生育贵子，子女权力不小。\"},{\"logicSentenceId\":\"7587041034882809897\",\"content\":\"男子命局中诸多吉星汇聚，就能够凭借妻子的助力获得显贵的地位，若太阳星处于陷地且有煞星相犯，对妻子不利，不吉利。\"},{\"logicSentenceId\":\"7587041034758455315\",\"content\":\"女性命格遇到此星，大多预示福寿双全。\"},{\"logicSentenceId\":\"7587041034758570003\",\"content\":\"命盘遇到诸多吉星守护照耀，再得到太阴星一同照耀，富贵双全完美无缺。\"},{\"logicSentenceId\":\"7587041034882859049\",\"content\":\"如果处于旺相状态且没有空劫星，一生会富足。\"},{\"logicSentenceId\":\"7587041034883039273\",\"content\":\"希夷先生说：太阳星在周天运行的度数，循环转动没有穷尽，喜欢辅弼星来辅佐自己，象征着用禄存星来增添福气。\"},{\"logicSentenceId\":\"7587041034882940969\",\"content\":\"与刑杀汇聚于限运时，会有损伤官运的担忧，普通人会有官司是非的困扰。\"},{\"logicSentenceId\":\"7587041034758406163\",\"content\":\"玉蟾先生说：天机星，是南斗中的善星，所以化气为善，辅佐天帝的命令行事，化解各种凶星的逆乱，安定教化。\"},{\"logicSentenceId\":\"7587041034882973737\",\"content\":\"推算到这里，祸福就很清楚了。\"},{\"logicSentenceId\":\"7587041034883104809\",\"content\":\"如果能得到左辅、右弼、文昌、文曲、天魁、天钺六颗星以三合的方式拱照财帛宫和官禄宫，那么命主会极为富贵。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":12604,"chapterOrder":2,"inChapterOrder":25,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008617523","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"421\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：太陽原属火，正主官禄星。\",\"logicSentenceId\":\"7587041034883153961\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"422\",\"lineNum\":0,\"lineType\":1,\"content\":\"若居身命位，禀性最聦明。\",\"logicSentenceId\":\"7587041034883170345\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"423\",\"lineNum\":0,\"lineType\":1,\"content\":\"慈愛量寛大，福夀享遐齡。\",\"logicSentenceId\":\"7587041034883186729\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"424\",\"lineNum\":0,\"lineType\":1,\"content\":\"若與太隂㑹，驟發貴無倫。\",\"logicSentenceId\":\"7587041034883203113\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"425\",\"lineNum\":0,\"lineType\":1,\"content\":\"有輝照身命，平步入金門。\",\"logicSentenceId\":\"7587041034883219497\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"426\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門不相犯，升殿承君恩。\",\"logicSentenceId\":\"7587041034883235881\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"427\",\"lineNum\":0,\"lineType\":1,\"content\":\"偏垣逢暗度，貧賤不可言。\",\"logicSentenceId\":\"7587041034883252265\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"428\",\"lineNum\":0,\"lineType\":1,\"content\":\"男人必尅父，女命夫不全。\",\"logicSentenceId\":\"7587041034883268649\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"429\",\"lineNum\":0,\"lineType\":1,\"content\":\"火䍅逢苦定，羊陀眼目昏，二限若值此，必定賣田園。\",\"logicSentenceId\":\"7587041034883285033\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"430\",\"lineNum\":0,\"lineType\":1,\"content\":\"玉蟾先生曰：太陽司權貴為文，遇天刑為武。\",\"logicSentenceId\":\"7587041034883301417\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"431\",\"lineNum\":0,\"lineType\":1,\"content\":\"在寅卯爲初昇，在辰巳為昇殿，在午爲曰麗中天，主大冨貴，在未申爲偏垣，作事先勤後惰，在酉為西没，貴而不顕，秀而不實；在戍亥子\",\"logicSentenceId\":\"7587041034883317801\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"432\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174512002056203\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"433\",\"lineNum\":0,\"lineType\":1,\"content\":\"為失輝，更逢臣暗破軍，一生劳碌貧忙，更主眼目有傷，與人寡合招非。\",\"logicSentenceId\":\"7587041034883317801\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"434\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命逢之，夫星不美，遇耗則非禮成婚。\",\"logicSentenceId\":\"7587041034883334185\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"435\",\"lineNum\":0,\"lineType\":1,\"content\":\"若與禄存同宫。\",\"logicSentenceId\":\"7587041034883350569\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"436\",\"lineNum\":0,\"lineType\":1,\"content\":\"雖主財帛亦辛苦不閑，若與帝星左右同宫，則爲貴論。\",\"logicSentenceId\":\"7587041034883366953\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"437\",\"lineNum\":0,\"lineType\":1,\"content\":\"又嫌火鈴刑忌，未免先尅其父。\",\"logicSentenceId\":\"7587041034883383337\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"438\",\"lineNum\":0,\"lineType\":1,\"content\":\"此星男得之為父星，女得之為夫星。\",\"logicSentenceId\":\"7587041034883399721\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174464988282891","endPageId":"7330174512002056203","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034883383337\",\"content\":\"又忌讳火星、铃星、天刑、忌星，难免先克伤父亲。\"},{\"logicSentenceId\":\"7587041034883399721\",\"content\":\"这颗星男人得到它作为父星，女人得到它作为夫星。\"},{\"logicSentenceId\":\"7587041034883203113\",\"content\":\"如果与太阴相会，会突然发达显贵无比。\"},{\"logicSentenceId\":\"7587041034883334185\",\"content\":\"女子命格遇到这种情况，夫星征兆不佳，遇到耗星就会不合礼俗地成婚。\"},{\"logicSentenceId\":\"7587041034883252265\",\"content\":\"太阳星落入偏宫又逢暗度，贫穷低贱的境况难以用言语形容。\"},{\"logicSentenceId\":\"7587041034883268649\",\"content\":\"男人必定克害父亲，女子命中丈夫难以圆满。\"},{\"logicSentenceId\":\"7587041034883170345\",\"content\":\"如果太阳星位于身宫或命宫，其人天性最为聪明。\"},{\"logicSentenceId\":\"7587041034883350569\",\"content\":\"如果与禄存星处在同一宫位。\"},{\"logicSentenceId\":\"7587041034883219497\",\"content\":\"有光辉照耀身宫命宫，就能平步青云直入金殿。\"},{\"logicSentenceId\":\"7587041034883285033\",\"content\":\"火星与铃星相遇定有苦难，擎羊星和陀罗星出现会导致眼目昏花，大运和小限若遇到这种情况，必定会卖掉田园。\"},{\"logicSentenceId\":\"7587041034883366953\",\"content\":\"即便能拥有钱财，也会过得辛苦忙碌不得清闲；如果与帝星左右同宫，就可论为显贵。\"},{\"logicSentenceId\":\"7587041034883235881\",\"content\":\"若不与巨门星相犯，便能升殿承受君王恩宠。\"},{\"logicSentenceId\":\"7587041034883317801\",\"content\":\"太阳在寅宫、卯宫时为初升，在辰宫、巳宫时为升殿，在午宫时如太阳正挂在天空中央，预示着大富大贵；在未宫、申宫时为偏垣，做事会先勤奋后懈怠，在酉宫时如太阳西落，虽贵但不显赫，有才华却难以实现抱负；在戌宫、亥宫、子宫时光芒消失，再遇到臣星、暗星、破军星，一生会劳碌贫困，还会有眼睛方面的疾病，与人难以融洽相处且会招来是非。\"},{\"logicSentenceId\":\"7587041034883186729\",\"content\":\"为人慈爱、度量宽大，能够享受福寿、长寿高龄。\"},{\"logicSentenceId\":\"7587041034883153961\",\"content\":\"歌诀说：太阳星原本属火，正主管官禄星。\"},{\"logicSentenceId\":\"7587041034883301417\",\"content\":\"玉蟾先生说：太阳星掌管权贵主文职，遇到天刑星则主武职。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":5728,"chapterOrder":2,"inChapterOrder":26,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008633907","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"439\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：武曲星所主若何？\",\"logicSentenceId\":\"7587041034883416105\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"440\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：武曲北斗第六星，属金，乃財帛宫，主財，與天府同宫有夀，其施權於十二宫，分其臨地有庙旺陥宫，主於人性切果决，有喜有怒，可福可災。\",\"logicSentenceId\":\"7587041034883432489\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"441\",\"lineNum\":0,\"lineType\":1,\"content\":\"若耗囚㑹於震宫，必為破祖，淹晋之軰與。\",\"logicSentenceId\":\"7587041034883448873\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"442\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄馬交馳，發財於逺郡；若貪狼同度，慳吝之人；破軍同財，郷財到手而成空。\",\"logicSentenceId\":\"7587041034883465257\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"443\",\"lineNum\":0,\"lineType\":1,\"content\":\"諸㐫聚而作禍，\",\"logicSentenceId\":\"7587041034883481641\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"444\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174512002154507\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"445\",\"lineNum\":0,\"lineType\":1,\"content\":\"吉集以成祥。\",\"logicSentenceId\":\"7587041034883481641\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174512002056203","endPageId":"7330174512002154507","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034883448873\",\"content\":\"如果耗星、囚星在震宫相会，必定破败祖业，是困顿、滞留不得志之辈。\"},{\"logicSentenceId\":\"7587041034883465257\",\"content\":\"禄存星与天马星交会，会在远方的郡县发财；若与贪狼星同宫，会是吝啬之人；如果与破军星同宫，得到家乡的钱财最后也会化为泡影。\"},{\"logicSentenceId\":\"7587041034883481641\",\"content\":\"各种凶星聚集在一起就会带来灾祸，吉星汇聚就会带来吉祥。\"},{\"logicSentenceId\":\"7587041034883416105\",\"content\":\"问：武曲星代表的命理情况是怎样的呢？\"},{\"logicSentenceId\":\"7587041034883432489\",\"content\":\"回答说：武曲星是北斗第六星，属金，是财帛宫的主星，掌管财运，与天府星同宫则主长寿，其权力遍及十二宫，根据所处宫位有庙旺陷落之分，主于人性情急切果决，有喜有怒，可能带来福运也可能引发灾祸。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2290,"chapterOrder":2,"inChapterOrder":27,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008650291","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"446\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生曰：武曲属金，在天司寿，在数司財，怕受制入陥，喜禄存而同政，與太隂以互權。\",\"logicSentenceId\":\"7587041034883498025\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"447\",\"lineNum\":0,\"lineType\":1,\"content\":\"天府、天梁為佐貳之星，財帛田宅為專司之所。\",\"logicSentenceId\":\"7587041034883514409\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"448\",\"lineNum\":0,\"lineType\":1,\"content\":\"悪殺耗囚㑹於震宫，必見木壓雷驚，破軍；貪狼㑹於坎宫，必主投河溺水。\",\"logicSentenceId\":\"7587041034883530793\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"449\",\"lineNum\":0,\"lineType\":1,\"content\":\"㑹禄馬則發財遠郡；貪狼㑹則少年不利。\",\"logicSentenceId\":\"7587041034883547177\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"450\",\"lineNum\":0,\"lineType\":1,\"content\":\"所謂武曲守命福非輕，貪狼不發少年人是也。\",\"logicSentenceId\":\"7587041034883563561\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"451\",\"lineNum\":0,\"lineType\":1,\"content\":\"庙樂桃花同度，利已損人。\",\"logicSentenceId\":\"7587041034883579945\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"452\",\"lineNum\":0,\"lineType\":1,\"content\":\"七殺火星同宫，因財被刼，遇羊陀則孤尅，遇破軍難顯貴，单居二限可也。\",\"logicSentenceId\":\"7587041034883596329\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"453\",\"lineNum\":0,\"lineType\":1,\"content\":\"若與破軍同位，更臨二限之中，定主是非之撓。\",\"logicSentenceId\":\"7587041034883612713\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"454\",\"lineNum\":0,\"lineType\":1,\"content\":\"盖武曲守命，主人剛強果断。\",\"logicSentenceId\":\"7587041034883629097\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"455\",\"lineNum\":0,\"lineType\":1,\"content\":\"甲巳生人福厚，出将入相，更得貪火冲破，定為貴格。\",\"logicSentenceId\":\"7587041034883645481\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"456\",\"lineNum\":0,\"lineType\":1,\"content\":\"喜西北生人東\",\"logicSentenceId\":\"7587041034883661865\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"457\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174565189943350\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"458\",\"lineNum\":0,\"lineType\":2,\"content\":\"南生人，平常不守。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"459\",\"lineNum\":0,\"lineType\":1,\"content\":\"祖業，四殺冲破，孤貧不一，破相延年，女人吉多，爲貴婦。\",\"logicSentenceId\":\"7587041034883661865\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"460\",\"lineNum\":0,\"lineType\":1,\"content\":\"加殺冲破，孤尅。\",\"logicSentenceId\":\"7587041034883678249\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"461\",\"lineNum\":0,\"lineType\":1,\"content\":\"問天同星所主若何？\",\"logicSentenceId\":\"7587041034883694633\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"462\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：天同星属水、金，南斗第四星也，為福徳宫之主宰。\",\"logicSentenceId\":\"7587041034883711017\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174512002154507","endPageId":"7330174565189943350","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034883629097\",\"content\":\"大概武曲星坐守命宫，主其人性格刚强、做事果断。\"},{\"logicSentenceId\":\"7587041034883579945\",\"content\":\"武曲星处于庙旺状态且与桃花星同度时，会利己损人。\"},{\"logicSentenceId\":\"7587041034883514409\",\"content\":\"天府、天梁是辅佐之星，财帛、田宅是武曲星专门掌管的宫位。\"},{\"logicSentenceId\":\"7587041034883678249\",\"content\":\"如果再加上煞星冲破命盘，就会孤独克害亲人。\"},{\"logicSentenceId\":\"7587041034883711017\",\"content\":\"回答说：天同星五行属水、金，是南斗第四星，是福德宫的主宰。\"},{\"logicSentenceId\":\"7587041034883612713\",\"content\":\"如果与破军星处于同一宫位，又处于两个运势周期之中，必定会招致是非纷扰。\"},{\"logicSentenceId\":\"7587041034883645481\",\"content\":\"甲年、巳年出生的人福分深厚，能成为将军或宰相，若再遇到贪狼星和火星冲克，必定是显贵的命格。\"},{\"logicSentenceId\":\"7587041034883661865\",\"content\":\"喜西北方出生的人在东方有祖业，若被四杀冲破，孤苦贫寒各不相同，可能破相但能延年益寿，女子多吉利，可成为贵妇。\"},{\"logicSentenceId\":\"7587041034883498025\",\"content\":\"希夷先生说：武曲星属金，在天上掌管寿命，在命理中掌管财帛，怕受到克制落入陷地，喜欢与禄存星共同发挥作用，能与太阴星相互借取权势。\"},{\"logicSentenceId\":\"7587041034883596329\",\"content\":\"七杀星和火星同处一宫，会因钱财而遭遇抢劫；遇到擎羊、陀罗会孤独克害；遇到破军星难以获得显贵；单独处于少年、青年两个阶段还可以。\"},{\"logicSentenceId\":\"7587041034883547177\",\"content\":\"与禄马星相会，就会在远方郡县发财；与贪狼星相会，少年时期就会遭遇不利。\"},{\"logicSentenceId\":\"7587041034883530793\",\"content\":\"恶星、杀星、耗星、囚星与破军星在震宫会合，必定会出现被树木压到、被雷电惊吓的情况；贪狼星在坎宫会合，必定会导致投河溺水的灾祸。\"},{\"logicSentenceId\":\"7587041034883694633\",\"content\":\"问天同星主掌的情况是怎样的？\"},{\"logicSentenceId\":\"7587041034883563561\",\"content\":\"所谓武曲星坐守命宫，福气不轻，贪狼星不会让少年人发达就是这个道理。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":5444,"chapterOrder":2,"inChapterOrder":28,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008666675","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"463\",\"lineNum\":0,\"lineType\":1,\"content\":\"後云：化福，最喜遇吉矅，𦔳福添祥。\",\"logicSentenceId\":\"7587041034883727401\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"464\",\"lineNum\":0,\"lineType\":1,\"content\":\"爲人𤎉潔，貌禀淸竒。\",\"logicSentenceId\":\"7587041034883743785\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"465\",\"lineNum\":0,\"lineType\":1,\"content\":\"有機謀，無亢激，不怕七殺相侵，不怕諸殺同纒。\",\"logicSentenceId\":\"7587041034883760169\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"466\",\"lineNum\":0,\"lineType\":1,\"content\":\"限若逢之，一生得地，十二宫中皆曰福，無破定為祥。\",\"logicSentenceId\":\"7587041034883776553\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"467\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生曰：天同、南斗益筭保生之星。\",\"logicSentenceId\":\"7587041034883792937\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"468\",\"lineNum\":0,\"lineType\":1,\"content\":\"化禄爲善，逢吉為祥。\",\"logicSentenceId\":\"7587041034883809321\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"469\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命值之，主為人謙遜，禀性温和，心慈鯁直，文墨精通，有竒志，無㐫激。\",\"logicSentenceId\":\"7587041034883825705\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"470\",\"lineNum\":0,\"lineType\":1,\"content\":\"不忌七殺相侵，不畏諸㐫同度，十二宮中皆爲福論。\",\"logicSentenceId\":\"7587041034883842089\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"471\",\"lineNum\":0,\"lineType\":1,\"content\":\"遇左右、昌、梁貴顯。\",\"logicSentenceId\":\"7587041034883858473\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"472\",\"lineNum\":0,\"lineType\":1,\"content\":\"喜壬、乙生人，巳、亥得地，不冝六庚生人，\",\"logicSentenceId\":\"7587041034883874857\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"473\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174565190058038\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"474\",\"lineNum\":0,\"lineType\":1,\"content\":\"居酉地終身不守，㑹四殺，居巳亥為陷，殘疾孤尅。\",\"logicSentenceId\":\"7587041034883874857\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"475\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人逢殺冲破，刑夫尅子；梁月冲破，合作偏房，僧道冝之，主享福。\",\"logicSentenceId\":\"7587041034883907625\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174565189943350","endPageId":"7330174565190058038","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034883907625\",\"content\":\"女人遇到煞星冲破，就会刑克丈夫和子女；遇到天梁星、太阴星冲破，适宜做偏房。适合出家为僧道，能享受福运。\"},{\"logicSentenceId\":\"7587041034883825705\",\"content\":\"如果身宫或命宫遇到天同星，主为人谦逊，天性温和，心地仁慈耿直，精通文墨，有非凡的志向，没有凶暴激烈的性情。\"},{\"logicSentenceId\":\"7587041034883809321\",\"content\":\"化禄则为良善，逢吉星则为祥瑞。\"},{\"logicSentenceId\":\"7587041034883727401\",\"content\":\"后来又说：天同星化福，最喜欢遇到吉星，能够增添福运和吉祥。\"},{\"logicSentenceId\":\"7587041034883842089\",\"content\":\"不忌讳七杀星侵犯，不畏惧众凶星同宫，在十二宫中都作福气论断。\"},{\"logicSentenceId\":\"7587041034883743785\",\"content\":\"为人清正廉洁，容貌天生清秀不凡。\"},{\"logicSentenceId\":\"7587041034883776553\",\"content\":\"天同星处于有利的宫位时，在十二宫位中都能带来福气，没有冲破必定吉祥。\"},{\"logicSentenceId\":\"7587041034883792937\",\"content\":\"希夷先生说：天同星是南斗星中增加寿命、保佑生命的星。\"},{\"logicSentenceId\":\"7587041034883874857\",\"content\":\"喜壬年、乙年出生的人，在巳、亥宫位为得地；不宜六庚年出生的人，若处于酉宫位则终身不得安稳。会合四煞星，在巳亥宫位落入陷地，身体残疾，孤独刑克。\"},{\"logicSentenceId\":\"7587041034883760169\",\"content\":\"有智谋策略，不急躁偏激，不怕七杀星侵犯，不怕各种煞星一同缠绕。\"},{\"logicSentenceId\":\"7587041034883858473\",\"content\":\"遇到左辅、右弼、文昌、天梁会尊贵显达。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":4122,"chapterOrder":2,"inChapterOrder":29,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008683059","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"476\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：亷貞所主若何？\",\"logicSentenceId\":\"7587041034883940393\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"477\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：𤎉貞属木，北斗第五星也。\",\"logicSentenceId\":\"7587041034883956777\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"478\",\"lineNum\":0,\"lineType\":1,\"content\":\"在斗司品秩，在数司權令，不臨庙旺，更犯官符，故曰化囚為殺，觸之不可觧其禍，逢之不可測其祥。\",\"logicSentenceId\":\"7587041034883973161\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"479\",\"lineNum\":0,\"lineType\":1,\"content\":\"主人心狼性狂，不習禮義。\",\"logicSentenceId\":\"7587041034883989545\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"480\",\"lineNum\":0,\"lineType\":1,\"content\":\"逢帝座執威權，遇禄存主冨貴，遇文昌好禮樂，遇殺曜顕武職。\",\"logicSentenceId\":\"7587041034884005929\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"481\",\"lineNum\":0,\"lineType\":1,\"content\":\"在官禄有威權，在身命為次桃花。\",\"logicSentenceId\":\"7587041034884022313\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"482\",\"lineNum\":0,\"lineType\":1,\"content\":\"若居旺宮，則賭賻迷花而致訟；與巨門交會於䧟地，則是非起於官司。\",\"logicSentenceId\":\"7587041034884038697\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"483\",\"lineNum\":0,\"lineType\":1,\"content\":\"逢財星耗合，祖業必破；遇刑忌則膿血不免；遇白虎則刑杖難逃；遇武曲於受制之郷，恐木壓蛇傷；同火曜於陷空之地，主投河自縊。\",\"logicSentenceId\":\"7587041034884055081\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"484\",\"lineNum\":0,\"lineType\":1,\"content\":\"破\",\"logicSentenceId\":\"7587041034884071465\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"485\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174565190221878\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"486\",\"lineNum\":0,\"lineType\":1,\"content\":\"軍與日月以濟行，目疾而不免。\",\"logicSentenceId\":\"7587041034884071465\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"487\",\"lineNum\":0,\"lineType\":1,\"content\":\"限逢至此，災不可攘。\",\"logicSentenceId\":\"7587041034884087849\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"488\",\"lineNum\":0,\"lineType\":1,\"content\":\"只冝官禄身命之位，遇吉福應，逢㐫則不慈。\",\"logicSentenceId\":\"7587041034884104233\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"489\",\"lineNum\":0,\"lineType\":1,\"content\":\"若在他宫，禍福冝詳。\",\"logicSentenceId\":\"7587041034884120617\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174565190058038","endPageId":"7330174565190221878","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034884071465\",\"content\":\"破军星与太阳星、太阴星同行，必然会患上眼疾。\"},{\"logicSentenceId\":\"7587041034884104233\",\"content\":\"只适合在官禄、身命的宫位，遇到吉星有福气相应，遇到凶星就不吉利。\"},{\"logicSentenceId\":\"7587041034883956777\",\"content\":\"回答说：廉贞星属木，是北斗的第五颗星。\"},{\"logicSentenceId\":\"7587041034883989545\",\"content\":\"主人心性狠毒、性情狂躁，不学习礼仪道义。\"},{\"logicSentenceId\":\"7587041034884005929\",\"content\":\"遇到帝座星会执掌权威，遇到禄存星主富贵，遇到文昌星喜好礼乐，遇到杀曜星则会显达于武职。\"},{\"logicSentenceId\":\"7587041034884087849\",\"content\":\"运势到此，灾祸无法消除。\"},{\"logicSentenceId\":\"7587041034883973161\",\"content\":\"在北斗中掌管品级，在数术中掌管权令，若不处于庙旺之地，又触犯官符，所以说化为囚星成为杀星，遇到它无法解除灾祸，碰到它难以预测吉凶。\"},{\"logicSentenceId\":\"7587041034884038697\",\"content\":\"若处于旺宫，就会因赌博、沉迷女色而导致诉讼；与巨门星在陷地交会，就会因官司引发是非。\"},{\"logicSentenceId\":\"7587041034884120617\",\"content\":\"若在其他宫位，祸福应当详细考量。\"},{\"logicSentenceId\":\"7587041034884022313\",\"content\":\"廉贞星落在官禄宫有威严权势，落在身命宫则为次等的桃花星。\"},{\"logicSentenceId\":\"7587041034884055081\",\"content\":\"遇到财星和耗星，祖业一定会破败；遇到刑星和忌星，一定会有脓血之灾；遇到白虎星，难逃刑杖之苦；遇到武曲星在其受制的宫位，恐怕会有被树木压伤、被蛇咬伤的危险；与火星在陷空之地会合，会有投河、上吊的危险。\"},{\"logicSentenceId\":\"7587041034883940393\",\"content\":\"问：廉贞星所主的情况是怎样的？\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":4499,"chapterOrder":2,"inChapterOrder":30,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008699443","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"490\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：㢘貪已亥宫，遇吉福盈豐。\",\"logicSentenceId\":\"7587041034884137001\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"491\",\"lineNum\":0,\"lineType\":1,\"content\":\"應過三旬後，湏防不善終。\",\"logicSentenceId\":\"7587041034884153385\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"492\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：天府所主若何？\",\"logicSentenceId\":\"7587041034884169769\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"493\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：天府属土，南斗主令第一星也。\",\"logicSentenceId\":\"7587041034884186153\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"494\",\"lineNum\":0,\"lineType\":1,\"content\":\"為財帛之主宰，在斗司福權之宿，會吉皆為冨貴之基，定作荣昌之論。\",\"logicSentenceId\":\"7587041034884202537\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174565190221878","endPageId":"7330174565190221878","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034884186153\",\"content\":\"回答说：天府星属土，是南斗星中掌管时令的第一颗星。\"},{\"logicSentenceId\":\"7587041034884202537\",\"content\":\"天府星是财帛的主宰之星，在南斗中掌管福气和权力，与吉星相会都是富贵的根基，必定会有繁荣昌盛的论断。\"},{\"logicSentenceId\":\"7587041034884137001\",\"content\":\"歌诀说：廉贞星和贪狼星在己亥宫位，遇到吉星则福气充盈丰厚。\"},{\"logicSentenceId\":\"7587041034884153385\",\"content\":\"应该过了三十岁以后，必须防备不得善终。\"},{\"logicSentenceId\":\"7587041034884169769\",\"content\":\"问：天府星所主的情况如何？\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1603,"chapterOrder":2,"inChapterOrder":31,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008715827","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"495\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生曰：天府乃南斗延夀觧厄之星，又曰：司命上相鎮國之星，在斗司權，在数則職掌財帛田宅衣禄之神，為帝之佐貳，能制羊陀爲從，能化火鈴爲福。\",\"logicSentenceId\":\"7587041034884218921\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"496\",\"lineNum\":0,\"lineType\":1,\"content\":\"主人相貌清竒，禀性温\",\"logicSentenceId\":\"7587041034884235305\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"497\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174610547195945\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"498\",\"lineNum\":0,\"lineType\":1,\"content\":\"良端雅，與太陽昌曲㑹，必登首選；逢禄存武曲，必有巨萬之冨。\",\"logicSentenceId\":\"7587041034884235305\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"499\",\"lineNum\":0,\"lineType\":1,\"content\":\"秘云：天府為禄庫，命逢終是冨是也。\",\"logicSentenceId\":\"7587041034884251689\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"500\",\"lineNum\":0,\"lineType\":1,\"content\":\"不喜四殺冲破，雖無宫貴，亦主財田冨足。\",\"logicSentenceId\":\"7587041034884268073\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"501\",\"lineNum\":0,\"lineType\":1,\"content\":\"以田宅財為廟樂，以奴僕相貌為䧟弱，以兄弟為平。\",\"logicSentenceId\":\"7587041034884284457\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"502\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命逢之，得相佐，主夫妻子女不缺。\",\"logicSentenceId\":\"7587041034884300841\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"503\",\"lineNum\":0,\"lineType\":1,\"content\":\"若值空亡，是為孤立，不可一例而摧断。\",\"logicSentenceId\":\"7587041034884317225\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"504\",\"lineNum\":0,\"lineType\":1,\"content\":\"大柢此星多主吉。\",\"logicSentenceId\":\"7587041034884333609\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"505\",\"lineNum\":0,\"lineType\":1,\"content\":\"又曰：此星不論諸宫皆吉。\",\"logicSentenceId\":\"7587041034884349993\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"506\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命得之，清正機巧，旺夫益子，雖見冲破，亦以善論，僧道宜之。\",\"logicSentenceId\":\"7587041034884366377\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"507\",\"lineNum\":0,\"lineType\":1,\"content\":\"有師號\",\"logicSentenceId\":\"7587041034884382761\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174565190221878","endPageId":"7330174610547195945","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034884366377\",\"content\":\"女性命格中有天府星，为人清正、机灵巧妙，能旺丈夫、利于子女，即使遇到冲煞克制，也应从好的方面论断，适合出家为僧为道。\"},{\"logicSentenceId\":\"7587041034884333609\",\"content\":\"大抵这颗星多主吉祥。\"},{\"logicSentenceId\":\"7587041034884268073\",\"content\":\"天府星不喜欢被四煞冲破，即使没有宫廷显贵之位，也主财富和田产富足。\"},{\"logicSentenceId\":\"7587041034884235305\",\"content\":\"主人相貌清秀不凡，性格温和善良、端庄文雅，与太阳、文昌、文曲星相会，必定能在科举等选拔中名列前茅；遇到禄存星、武曲星，必定会拥有巨额财富。\"},{\"logicSentenceId\":\"7587041034884317225\",\"content\":\"如果遇到空亡，就会孤独无依，不能一概而论地推断。\"},{\"logicSentenceId\":\"7587041034884349993\",\"content\":\"又说：这颗星不论在各个宫位都是吉利的。\"},{\"logicSentenceId\":\"7587041034884251689\",\"content\":\"秘传之说称：天府星是禄库，命宫逢之终究会富贵。\"},{\"logicSentenceId\":\"7587041034884300841\",\"content\":\"身命宫遇到天府星，又有吉星辅佐，预示着夫妻、子女都不缺。\"},{\"logicSentenceId\":\"7587041034884382761\",\"content\":\"有师的名号。\"},{\"logicSentenceId\":\"7587041034884284457\",\"content\":\"田宅宫、财帛宫处于旺势，奴仆宫、相貌宫处于弱势，兄弟宫处于平稳状态。\"},{\"logicSentenceId\":\"7587041034884218921\",\"content\":\"希夷先生说：天府是南斗中掌管延长寿命、解除厄运的星宿，又说是掌管命运、位居上相、镇守国家的星宿，在斗宿掌管权力，在术数里是掌管财帛、田宅、衣禄的神，是天帝的辅佐大臣，能够制伏擎羊、陀罗，使其为自己所用，能够化解火星、铃星的凶性，使之变为福泽。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":4309,"chapterOrder":2,"inChapterOrder":32,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008732211","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"508\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：天府為禄庫，入命終是冨。\",\"logicSentenceId\":\"7587041034884399145\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"509\",\"lineNum\":0,\"lineType\":1,\"content\":\"萬頃置田庄，家資無論数。\",\"logicSentenceId\":\"7587041034895360041\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"510\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命坐香閨，男人食天禄。\",\"logicSentenceId\":\"7587041034895376425\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"511\",\"lineNum\":0,\"lineType\":1,\"content\":\"此是福吉星，四外無不足。\",\"logicSentenceId\":\"7587041034895392809\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"512\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174610547310633\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"513\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：太隂星所主若何？\",\"logicSentenceId\":\"7587041034895409193\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"514\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：太隂乃水之精，為田宅主，化冨與日為配天儀表，有上弦、下弦之用。\",\"logicSentenceId\":\"7587041034895425577\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"515\",\"lineNum\":0,\"lineType\":1,\"content\":\"黄到黒到，分勢，尚好𧇊，数定庙樂。\",\"logicSentenceId\":\"7587041034895441961\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"516\",\"lineNum\":0,\"lineType\":1,\"content\":\"其為人也聦明俊秀，其禀性也端雅純祥。\",\"logicSentenceId\":\"7587041034895458345\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"517\",\"lineNum\":0,\"lineType\":1,\"content\":\"上弦為要之機，下弦减威之論。\",\"logicSentenceId\":\"7587041034895474729\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"518\",\"lineNum\":0,\"lineType\":1,\"content\":\"所值不以，所見無妨。\",\"logicSentenceId\":\"7587041034895491113\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"519\",\"lineNum\":0,\"lineType\":1,\"content\":\"若相生坐於太陽，日在卯，月在酉，俱為旺地，為冨貴之基。\",\"logicSentenceId\":\"7587041034895507497\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"520\",\"lineNum\":0,\"lineType\":1,\"content\":\"命坐銀輝之宫，諸吉咸集，爲享福之論。\",\"logicSentenceId\":\"7587041034895523881\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"521\",\"lineNum\":0,\"lineType\":1,\"content\":\"若居䧟地，則落弱之名。\",\"logicSentenceId\":\"7587041034895540265\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"522\",\"lineNum\":0,\"lineType\":1,\"content\":\"若上弦、下弦，仍可不逢巨門為佳。\",\"logicSentenceId\":\"7587041034895556649\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"523\",\"lineNum\":0,\"lineType\":1,\"content\":\"身若居之，則有隨娘継拜，或離祖過房。\",\"logicSentenceId\":\"7587041034895573033\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"524\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命若見悪殺交冲，必作傷残之論，除非僧道，反獲禎祥，决禍福，最為要𦂳，不可参差。\",\"logicSentenceId\":\"7587041034895589417\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"525\",\"lineNum\":0,\"lineType\":1,\"content\":\"又或與文曲同居身命，定是九流術士。\",\"logicSentenceId\":\"7587041034895605801\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"526\",\"lineNum\":0,\"lineType\":1,\"content\":\"男為妻宿，又作母星。\",\"logicSentenceId\":\"7587041034895622185\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"527\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174662875283497\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"528\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生曰：太隂化禄，與日為配，以卯辰、巳午未為䧟地，以酉戍亥子丑為得垣，酉為西出之門，為東潜之所，嫌巨曜以來緾，怕羊陀以同度。\",\"logicSentenceId\":\"7587041034895638569\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"529\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉囚相犯，七殺相冲，恐非得意之垣，定作傷殘之論。\",\"logicSentenceId\":\"7587041034895654953\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"530\",\"lineNum\":0,\"lineType\":1,\"content\":\"此星属水，為田宅宫，主有輝為福，失䧟必㐫。\",\"logicSentenceId\":\"7587041034895671337\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"531\",\"lineNum\":0,\"lineType\":1,\"content\":\"男女得之，皆為母星，又作妻宿。\",\"logicSentenceId\":\"7587041034895687721\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"532\",\"lineNum\":0,\"lineType\":1,\"content\":\"若在身命庙樂吉集，主冨貴。\",\"logicSentenceId\":\"7587041034895704105\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"533\",\"lineNum\":0,\"lineType\":1,\"content\":\"在疾厄，遇陀暗，為目疾；遇火鈴為災，值貪殺損目，在父母，如䧟地失輝，遇流年白虎、太嵗，主毋有災。\",\"logicSentenceId\":\"7587041034895720489\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"534\",\"lineNum\":0,\"lineType\":1,\"content\":\"此雖純和之星，但失輝受制則不吉。\",\"logicSentenceId\":\"7587041034895736873\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"535\",\"lineNum\":0,\"lineType\":1,\"content\":\"若逢白虎，䘮門吊客，凄亦慎之。\",\"logicSentenceId\":\"7587041034895753257\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174610547195945","endPageId":"7330174662875283497","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034895458345\",\"content\":\"这样的人聪明俊秀，他的禀性端庄文雅、纯良祥和。\"},{\"logicSentenceId\":\"7587041034895671337\",\"content\":\"这颗星属水，对应田宅宫，当它明亮时带来福泽，如果落入陷地就一定会有凶险。\"},{\"logicSentenceId\":\"7587041034895409193\",\"content\":\"问：太阴星代表的命理情况是怎样的呢？\"},{\"logicSentenceId\":\"7587041034895474729\",\"content\":\"上弦月是重要的时机，下弦月是减少威势的说法。\"},{\"logicSentenceId\":\"7587041034895638569\",\"content\":\"希夷先生说：太阴化禄，与太阳相配，以卯辰、巳午未为陷地，以酉戌亥子丑为得垣之地，酉是西出之门，是从东方潜入的地方，嫌恶巨门星缠扰，害怕羊陀同度。\"},{\"logicSentenceId\":\"7587041034895589417\",\"content\":\"如果命盘和身盘中出现凶恶煞星相互冲克的情况，必然会有伤残的论断，除非是僧人或道士，反而能获得吉祥，判断祸福，这一点是最为关键的，不能有差错。\"},{\"logicSentenceId\":\"7587041034895605801\",\"content\":\"又或者与文曲星同处身宫和命宫，此人必定是九流术士。\"},{\"logicSentenceId\":\"7587041034895720489\",\"content\":\"太阴星在疾厄宫，遇到陀罗星、暗曜，会导致眼疾；遇到火星、铃星会有灾祸；遇到贪狼星、七杀星会损伤眼睛。太阴星在父母宫，如果处于陷地且失去光辉，又遇到流年白虎、太岁，预示母亲会有灾祸。\"},{\"logicSentenceId\":\"7587041034895704105\",\"content\":\"如果太阴星落在身宫或命宫，处于庙旺之地且有吉利的星曜汇聚，预示命主富贵。\"},{\"logicSentenceId\":\"7587041034895441961\",\"content\":\"月亮从明亮到昏暗，有不同的态势，盈亏变化是正常的，状态由星曜落入的宫位决定其庙旺与喜乐。\"},{\"logicSentenceId\":\"7587041034895654953\",\"content\":\"廉贞与囚星相冲犯，七杀星来相冲，恐怕不是如意的星垣之地，必定会得出有伤残的论断。\"},{\"logicSentenceId\":\"7587041034884399145\",\"content\":\"有口诀说：天府星是财禄的库藏，落入命宫的人终究会富裕。\"},{\"logicSentenceId\":\"7587041034895622185\",\"content\":\"对男子而言，它既是妻星，又是母星。\"},{\"logicSentenceId\":\"7587041034895753257\",\"content\":\"如果遇到白虎、丧门、吊客，即使凄凉也要谨慎对待。\"},{\"logicSentenceId\":\"7587041034895392809\",\"content\":\"这是一颗福运吉利之星，各方面都富足有余。\"},{\"logicSentenceId\":\"7587041034895491113\",\"content\":\"所遇情况无论如何，所见到的也没什么妨碍。\"},{\"logicSentenceId\":\"7587041034895736873\",\"content\":\"这虽是纯粹温和的星曜，但失去光辉、受到克制就不吉利。\"},{\"logicSentenceId\":\"7587041034895523881\",\"content\":\"命坐于银辉之宫，各种吉星聚集，这是能享福的说法。\"},{\"logicSentenceId\":\"7587041034895360041\",\"content\":\"置办万顷田庄，家中财产不计其数。\"},{\"logicSentenceId\":\"7587041034895376425\",\"content\":\"女子安居闺阁，男子享受朝廷俸禄。\"},{\"logicSentenceId\":\"7587041034895540265\",\"content\":\"如果处于不利的位置，就会有衰弱的名声。\"},{\"logicSentenceId\":\"7587041034895556649\",\"content\":\"如果是上弦月、下弦月，仍然以不遇到巨门星为好。\"},{\"logicSentenceId\":\"7587041034895507497\",\"content\":\"如果太阴星与太阳星相生且坐守太阳星位，太阳在卯位，太阴在酉位，二者所处皆为旺地，这便是富贵的基础。\"},{\"logicSentenceId\":\"7587041034895425577\",\"content\":\"回答说：太阴星是水的精华，主管田产住宅，能化育财富，与太阳相配为天的表征，有上弦月、下弦月的作用。\"},{\"logicSentenceId\":\"7587041034895687721\",\"content\":\"男女的命盘中出现太阴星，太阴星都代表母亲，也代表妻子。\"},{\"logicSentenceId\":\"7587041034895573033\",\"content\":\"如果身宫处于这种情况，就会有跟随母亲改嫁、认他人为父母，或者离开祖籍过继给他人的情况。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":9235,"chapterOrder":2,"inChapterOrder":33,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694547506","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"536\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：貪狼所主若何？\",\"logicSentenceId\":\"7587041034895769641\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"537\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：貪狼，北斗觧厄之神，第一星也。\",\"logicSentenceId\":\"7587041034895786025\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"538\",\"lineNum\":0,\"lineType\":1,\"content\":\"属水，化氣，為桃花，為標凖，乃主禍福之神。\",\"logicSentenceId\":\"7587041034895802409\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"539\",\"lineNum\":0,\"lineType\":1,\"content\":\"受善惡，定奸詐瞞人，\",\"logicSentenceId\":\"7587041034895818793\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"540\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174662875398185\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"541\",\"lineNum\":0,\"lineType\":1,\"content\":\"授學神仙之術，又好高吟浮蕩，作巧成拙。\",\"logicSentenceId\":\"7587041034895818793\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"542\",\"lineNum\":0,\"lineType\":1,\"content\":\"入庙樂之宫，可為祥可為禍。\",\"logicSentenceId\":\"7587041034895835177\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"543\",\"lineNum\":0,\"lineType\":1,\"content\":\"㑹破軍，迷花恋酒而䘮命同禄存可吉。\",\"logicSentenceId\":\"7587041034895851561\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"544\",\"lineNum\":0,\"lineType\":1,\"content\":\"遇耗囚以虚花，遇𤎉貞也不㓗。\",\"logicSentenceId\":\"7587041034895867945\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"545\",\"lineNum\":0,\"lineType\":1,\"content\":\"見七殺，或配以遭刑，遇羊陀，主痔疾，逢刑忌，有班痕，怕二限，為禍非輕。\",\"logicSentenceId\":\"7587041034895884329\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"546\",\"lineNum\":0,\"lineType\":1,\"content\":\"與七殺同守身命，男有穿窬之躰，女有偷香之態，諸吉壓，不能為福，衆㐫聚，愈長其奸。\",\"logicSentenceId\":\"7587041034895900713\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"547\",\"lineNum\":0,\"lineType\":1,\"content\":\"以\",\"logicSentenceId\":\"7587041034895917097\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"548\",\"lineNum\":0,\"lineType\":2,\"content\":\"事藏\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"549\",\"lineNum\":0,\"lineType\":1,\"content\":\"機虚花無實，與人交厚者簿，而簿者又厚，故云：七殺守身終是夭，貪狼入庙必為娼。\",\"logicSentenceId\":\"7587041034895917097\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"550\",\"lineNum\":0,\"lineType\":1,\"content\":\"若身命與破軍同居，更居三合之郷、生旺之地，男好飲而好賭賻、逰蕩，女無媒而自嫁、滛奔、私竊。\",\"logicSentenceId\":\"7587041034895933481\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"551\",\"lineNum\":0,\"lineType\":1,\"content\":\"輕則隨客奔馳，重則遊於歌妓。\",\"logicSentenceId\":\"7587041034895949865\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"552\",\"lineNum\":0,\"lineType\":1,\"content\":\"喜見空亡，返主端正。\",\"logicSentenceId\":\"7587041034895966249\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"553\",\"lineNum\":0,\"lineType\":1,\"content\":\"若\",\"logicSentenceId\":\"7587041034895982633\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"554\",\"lineNum\":0,\"lineType\":2,\"content\":\"與武曲同。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"555\",\"lineNum\":0,\"lineType\":1,\"content\":\"度為人謟侫奸貪，每存肥已之心，並無濟人之意。\",\"logicSentenceId\":\"7587041034895982633\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"556\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174662875529257\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"557\",\"lineNum\":0,\"lineType\":1,\"content\":\"與貞同，公庭必定遭刑；七殺同，定為屠宰。\",\"logicSentenceId\":\"7587041034895999017\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"558\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀交併，必作風流之鬼。\",\"logicSentenceId\":\"7587041034896015401\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"559\",\"lineNum\":0,\"lineType\":1,\"content\":\"昌曲同度，必多虚而少實。\",\"logicSentenceId\":\"7587041034896031785\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"560\",\"lineNum\":0,\"lineType\":1,\"content\":\"與七殺日月同纒，男女滛邪，虚花。\",\"logicSentenceId\":\"7587041034896048169\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"561\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門交戰，口舌是非常有。\",\"logicSentenceId\":\"7587041034896064553\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"562\",\"lineNum\":0,\"lineType\":1,\"content\":\"若犯帝座無制，便為無益之人。\",\"logicSentenceId\":\"7587041034896080937\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"563\",\"lineNum\":0,\"lineType\":1,\"content\":\"得輔弼、昌曲夾制，則無此論。\",\"logicSentenceId\":\"7619241901221773358\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"564\",\"lineNum\":0,\"lineType\":1,\"content\":\"䧟地逢生，又生祥瑞，雖家顛也發一時之財。\",\"logicSentenceId\":\"7587041034896113705\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"565\",\"lineNum\":0,\"lineType\":1,\"content\":\"惟㑹火鈴，冨貴全羙。\",\"logicSentenceId\":\"7587041034896130089\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"566\",\"lineNum\":0,\"lineType\":1,\"content\":\"在財帛與武曲、太隂同，終非所自發，則為滛供。\",\"logicSentenceId\":\"7587041034896146473\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"567\",\"lineNum\":0,\"lineType\":1,\"content\":\"在兄弟子息俱為陷地，在田宅則破蕩祖業，先冨後貧。\",\"logicSentenceId\":\"7587041034896162857\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"568\",\"lineNum\":0,\"lineType\":1,\"content\":\"奴僕居於庙旺，必因奴僕所破。\",\"logicSentenceId\":\"7587041034896179241\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"569\",\"lineNum\":0,\"lineType\":1,\"content\":\"夫妻宫男女俱不得羙。\",\"logicSentenceId\":\"7587041034896195625\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"570\",\"lineNum\":0,\"lineType\":1,\"content\":\"疾厄與羊陀暗殺交併，酒色之病迁移。\",\"logicSentenceId\":\"7587041034896212009\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"571\",\"lineNum\":0,\"lineType\":1,\"content\":\"若坐土郷破軍暗殺，併流年嵗殺叠併，則主遭兵火賊盗相侵。\",\"logicSentenceId\":\"7587041034896228393\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"572\",\"lineNum\":0,\"lineType\":1,\"content\":\"緫而言之，男女非得地之星不見尢妙。\",\"logicSentenceId\":\"7587041034896244777\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174662875283497","endPageId":"7330174662875529257","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034895933481\",\"content\":\"如果命宫和身宫与破军同宫，又位于三合的宫位、生旺的宫位，男子喜好饮酒、赌博、游荡，女子不经过媒人说媒就私自出嫁、与人私奔、偷窃。\"},{\"logicSentenceId\":\"7587041034896195625\",\"content\":\"夫妻宫的话，无论男女，婚姻都不会美满。\"},{\"logicSentenceId\":\"7587041034895982633\",\"content\":\"如果命度如此之人，为人谄媚奸邪贪婪，常常只想着自己获利，毫无帮助他人的想法。\"},{\"logicSentenceId\":\"7587041034895867945\",\"content\":\"贪狼星如果遇到耗星、囚星，就会有虚幻不实之事；遇到廉贞星，也会有不洁净之事。\"},{\"logicSentenceId\":\"7587041034895917097\",\"content\":\"因为天机星虚花无实，与人交往时，原本关系深厚的会变得淡薄，而原本淡薄的又会变得深厚，所以说：七杀星守身最终会夭折，贪狼星入庙必定会沦为娼妓。\"},{\"logicSentenceId\":\"7587041034896015401\",\"content\":\"羊陀二星交会，命主必定会成为风流鬼。\"},{\"logicSentenceId\":\"7587041034895769641\",\"content\":\"问：贪狼星所主管的事情是怎样的？\"},{\"logicSentenceId\":\"7587041034895851561\",\"content\":\"与破军星相会，沉溺酒色而丧命；与禄存星相会则可获吉祥。\"},{\"logicSentenceId\":\"7587041034896048169\",\"content\":\"与七杀、太阳、太阴同宫缠绕，男女淫邪，华而不实。\"},{\"logicSentenceId\":\"7587041034896064553\",\"content\":\"巨门星与其他星曜相互冲击，口舌是非非常多。\"},{\"logicSentenceId\":\"7587041034896130089\",\"content\":\"只有与火星、铃星交会，才能富贵双全、完美无缺。\"},{\"logicSentenceId\":\"7587041034895802409\",\"content\":\"属水，化气，是桃花星，作为标准，是主宰祸福的神。\"},{\"logicSentenceId\":\"7587041034896179241\",\"content\":\"奴仆宫处于庙旺状态，必定会因奴仆而破败。\"},{\"logicSentenceId\":\"7587041034895818793\",\"content\":\"受到善恶影响，注定会奸诈欺瞒他人，喜好神仙之术，又喜欢高谈阔论、轻浮放荡，结果弄巧成拙。\"},{\"logicSentenceId\":\"7587041034895949865\",\"content\":\"轻的情况是跟着客人四处奔走，严重的情况是出入歌妓场所。\"},{\"logicSentenceId\":\"7587041034896228393\",\"content\":\"如果位于土乡且遇破军星、暗杀星，再加上流年岁杀星重叠出现，那么命主会遭遇战火、盗贼侵犯。\"},{\"logicSentenceId\":\"7587041034896162857\",\"content\":\"在兄弟宫和子女宫都处于不利的位置，在田宅宫则会破败祖业，先富裕后贫穷。\"},{\"logicSentenceId\":\"7587041034896031785\",\"content\":\"文昌文曲同宫，必定多虚浮而少实在。\"},{\"logicSentenceId\":\"7587041034895835177\",\"content\":\"进入庙乐之宫，可能带来吉祥或灾祸。\"},{\"logicSentenceId\":\"7587041034896244777\",\"content\":\"总而言之，无论男女，若不是得地的星曜，不显现更好。\"},{\"logicSentenceId\":\"7587041034895884329\",\"content\":\"遇到七杀星，可能会因搭配而遭受刑罚；遇到擎羊陀罗星，预示会患痔疾；碰上刑忌星，身上会有斑痕；害怕行至二限运，带来的灾祸不轻。\"},{\"logicSentenceId\":\"7587041034896212009\",\"content\":\"在疾厄宫与擎羊、陀罗、暗煞星交会，会因酒色引发的病症而奔波迁移。\"},{\"logicSentenceId\":\"7587041034895966249\",\"content\":\"贪狼星喜见空亡，反而使其为人品行端正。\"},{\"logicSentenceId\":\"7587041034896080937\",\"content\":\"如果犯帝座星且没有克制化解，就没有益处。这样的人遇到左辅右弼、文昌文曲星从两侧制约，前面这些论断就不适用了。\"},{\"logicSentenceId\":\"7587041034895999017\",\"content\":\"与廉贞星同宫，必定会在公堂受刑；与七杀星同宫，会成为屠夫。\"},{\"logicSentenceId\":\"7587041034895900713\",\"content\":\"贪狼星和七杀星一同坐守命宫、身宫时，男性会有小偷的习性，女性会有偷情的模样，如果有诸多吉星压制，也无法带来福气，如果有众多凶星聚集，就会更加助长他们的奸邪心性。\"},{\"logicSentenceId\":\"7587041034896146473\",\"content\":\"在财帛宫与武曲、太阴同宫，最终，财富并非自己所挣得，若发了财则会用于荒淫的供费。\"},{\"logicSentenceId\":\"7587041034896113705\",\"content\":\"处于不利境地却遇到生机，又会产生吉祥的征兆，即使家庭破败也能在一时之间发财。\"},{\"logicSentenceId\":\"7587041034895786025\",\"content\":\"回答说：贪狼，是北斗星中解除灾厄的神灵，是第一颗星。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":10903,"chapterOrder":2,"inChapterOrder":34,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694563890","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"573\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174709775990847\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"574\",\"lineNum\":0,\"lineType\":2,\"content\":\"希夷先生曰：\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"575\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼爲北斗觧厄之神，陽明之星，其氣属木躰，\",\"logicSentenceId\":\"7587041034896261161\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"576\",\"lineNum\":0,\"lineType\":2,\"content\":\"属水。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"577\",\"lineNum\":0,\"lineType\":1,\"content\":\"故化氣為桃花，乃主禍福之神。\",\"logicSentenceId\":\"7587041034896261161\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"578\",\"lineNum\":0,\"lineType\":1,\"content\":\"在数則樂為放蕩之事，遇吉則主冨貴，遇㐫則主虚浮。\",\"logicSentenceId\":\"7587041034896277545\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"579\",\"lineNum\":0,\"lineType\":1,\"content\":\"主人矮小，性剛猛威，机深謀逺，隨波逐浪，愛憎難定。\",\"logicSentenceId\":\"7587041034896293929\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"580\",\"lineNum\":0,\"lineType\":1,\"content\":\"居庙旺，遇火星，武職權貴。\",\"logicSentenceId\":\"7587041034896310313\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"581\",\"lineNum\":0,\"lineType\":1,\"content\":\"戊已生人合局，遇軍相延夀，會𤎉武巧藝，得禄存僧道冝之。\",\"logicSentenceId\":\"7587041034896326697\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"582\",\"lineNum\":0,\"lineType\":1,\"content\":\"殺破相冲，飄蓬度日，女人主刑尅不㓗，遇太隂則主滛佚。\",\"logicSentenceId\":\"7587041034896343081\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174709775990847","endPageId":"7330174709775990847","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034896326697\",\"content\":\"戊年或己年出生的人若命盘符合格局，遇到天府星、天相星可延长寿命，与廉贞星、武曲星会合会有精巧技艺，得到禄存星，适合出家为僧道。\"},{\"logicSentenceId\":\"7587041034896343081\",\"content\":\"七杀、破军相互冲克，会像蓬草一样漂泊度日。女性主刑克、行为不检点，若遇太阴星，则主淫荡放佚。\"},{\"logicSentenceId\":\"7587041034896261161\",\"content\":\"贪狼星是北斗七星中解除厄运的神，是明亮的星，它的气属于木的属性，所以化气为桃花，是主宰祸福的神。\"},{\"logicSentenceId\":\"7587041034896277545\",\"content\":\"在命数上若喜欢做放荡之事，就主富贵；遇到凶煞则主虚浮。\"},{\"logicSentenceId\":\"7587041034896293929\",\"content\":\"命主身材矮小，性格刚猛威严，心机深沉、谋略长远，随波逐流，爱憎难以确定。\"},{\"logicSentenceId\":\"7587041034896310313\",\"content\":\"处于庙旺状态，遇到火星，会拥有武职权力和显贵地位。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2707,"chapterOrder":2,"inChapterOrder":35,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694580274","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"583\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：巨門所主若何？\",\"logicSentenceId\":\"7587041034896375849\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"584\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：巨門属水金，北斗第二星也，爲隂精之星，化氣為暗，在身命一生招口舌之非；在兄弟則骨肉参商，任夫妻主於隔角，生離死别，縱夫妻有對，不免汚名失節；在子息損後方招，雖有而無。\",\"logicSentenceId\":\"7587041034896392233\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"585\",\"lineNum\":0,\"lineType\":1,\"content\":\"在財帛有争競之撓；在疾厄\",\"logicSentenceId\":\"7587041034896408617\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"586\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174709776171071\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"587\",\"lineNum\":0,\"lineType\":1,\"content\":\"遇刑忌眼目之災。\",\"logicSentenceId\":\"7587041034896408617\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"588\",\"lineNum\":0,\"lineType\":1,\"content\":\"殺臨主殘疾。\",\"logicSentenceId\":\"7587041034896425001\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"589\",\"lineNum\":0,\"lineType\":1,\"content\":\"在遷移則招是非，在奴僕則多怨逆；在官祿主招刑杖，在田宅則破蕩祖業，在福徳其禍稍輕，在父母則𮞸棄擲。\",\"logicSentenceId\":\"7587041034896441385\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174709775990847","endPageId":"7330174709776171071","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034896375849\",\"content\":\"问：巨门星所主的情况如何？\"},{\"logicSentenceId\":\"7587041034896392233\",\"content\":\"回答说：巨门星属水金，是北斗第二星，是阴精之星，化气为暗，在身命宫则一生招来口舌是非；在兄弟宫则兄弟间关系不和睦，在夫妻宫则夫妻会有隔阂，生离死别，即使夫妻成双，也不免污名失节；在子女宫则子女有损后才会有，虽有却如同没有。\"},{\"logicSentenceId\":\"7587041034896408617\",\"content\":\"在财帛宫会有竞争的困扰；在疾厄宫遇到刑星、忌星会有眼目方面的灾祸。\"},{\"logicSentenceId\":\"7587041034896425001\",\"content\":\"煞星来临主有残疾之患。\"},{\"logicSentenceId\":\"7587041034896441385\",\"content\":\"在迁移宫则招惹是非，在奴仆宫则多生怨恨违逆；在官禄宫会招来刑罚杖责，在田宅宫则破败荡尽祖业，在福德宫灾祸稍轻，在父母宫会被疏远抛弃。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2384,"chapterOrder":2,"inChapterOrder":36,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694596658","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"590\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生曰：巨門在天司品萬物，在数則掌執是非，主於暗昧，疑是多非，欺瞞天地，進退両難。\",\"logicSentenceId\":\"7587041034896457769\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"591\",\"lineNum\":0,\"lineType\":1,\"content\":\"其性則靣是背非，六親寡合，交人初善終𢙣。\",\"logicSentenceId\":\"7587041034896474153\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"592\",\"lineNum\":0,\"lineType\":1,\"content\":\"十二宫中，若無庙樂照臨，到處為灾奔波。\",\"logicSentenceId\":\"7587041034896490537\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"593\",\"lineNum\":0,\"lineType\":1,\"content\":\"劳碌至亥子丑、寅巳申維，冨貴亦不耐乆。\",\"logicSentenceId\":\"7587041034896506921\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"594\",\"lineNum\":0,\"lineType\":1,\"content\":\"會太陽則吉㐫相半，逢七殺則主殺傷，貪耗同行，因好徒配，遇帝座則制其强，逢禄存則觧其厄，值羊陀男盗女娼。\",\"logicSentenceId\":\"7587041034896523305\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"595\",\"lineNum\":0,\"lineType\":1,\"content\":\"對宫遇火鈴、白虎、無帝座禄存，决配千里；三合殺凑，必遭火厄。\",\"logicSentenceId\":\"7619241901221789742\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"596\",\"lineNum\":0,\"lineType\":1,\"content\":\"此乃孤獨之宿，刻剥\",\"logicSentenceId\":\"7587041034896539689\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"597\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174709776302143\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"598\",\"lineNum\":0,\"lineType\":1,\"content\":\"之神，除為僧道九流，方免劳神偃蹇。\",\"logicSentenceId\":\"7587041034896539689\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"599\",\"lineNum\":0,\"lineType\":1,\"content\":\"限逢㐫曜，災難不輕。\",\"logicSentenceId\":\"7587041034896556073\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174709776171071","endPageId":"7330174709776302143","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034896490537\",\"content\":\"在十二宫中，如果没有庙乐照临，所到之处都会带来灾祸、令人奔波。\"},{\"logicSentenceId\":\"7587041034896506921\",\"content\":\"劳碌到亥、子、丑、寅、巳、申这些方位，即便获得富贵也难以长久保持。\"},{\"logicSentenceId\":\"7587041034896523305\",\"content\":\"与太阳相会则吉凶参半，遇到七杀则主有杀伤之事，贪狼、耗星同宫，因喜好而遭流放，遇到帝座星则能抑制其强势，遇到禄存星则能解除其厄运，遇到羊陀星则男盗女娼在对宫，遇到火星铃星白虎星，若没有帝座禄存，必定流放千里；三方四正杀星聚集，必遭火灾之厄。\"},{\"logicSentenceId\":\"7587041034896539689\",\"content\":\"这是颗孤独的星宿，刻薄的神煞，除非去做僧道或从事九流职业，才能免去劳神困顿。\"},{\"logicSentenceId\":\"7587041034896556073\",\"content\":\"行运遇到凶星，灾难不会轻。\"},{\"logicSentenceId\":\"7587041034896457769\",\"content\":\"希夷先生说：巨门星在天上掌管品评万物，在数术里则掌管是非，主导于暗昧不明之事，疑惑重重，是非颇多，欺瞒天地，进退两难。\"},{\"logicSentenceId\":\"7587041034896474153\",\"content\":\"它的特性是表面一套背后一套，与六亲难以融洽相处，与人交往起初友好最终交恶。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":3293,"chapterOrder":2,"inChapterOrder":37,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694613042","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"600\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：天相星所主若何？\",\"logicSentenceId\":\"7587041034896572457\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"601\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：天相属水，南斗第五星也。\",\"logicSentenceId\":\"7587041034896588841\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"602\",\"lineNum\":0,\"lineType\":1,\"content\":\"為司爵之宿，爲福善，化氣曰印，是為官禄文星，佐帝之位。\",\"logicSentenceId\":\"7587041034896605225\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"603\",\"lineNum\":0,\"lineType\":1,\"content\":\"若人命逢之，言語誠實，事不虚爲，見人難有惻憶之心，見人𢙣抱不平之氣。\",\"logicSentenceId\":\"7587041034896621609\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"604\",\"lineNum\":0,\"lineType\":1,\"content\":\"官禄得之則顕荣，帝座合之則五權，雖佐日月之光，兼化𤎉貞之悪。\",\"logicSentenceId\":\"7587041034896637993\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"605\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命得之而荣耀，子息得之而嗣續昌。\",\"logicSentenceId\":\"7587041034896654377\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"606\",\"lineNum\":0,\"lineType\":1,\"content\":\"十二宮中，皆爲祥福，不隨悪而變志，不因殺而攺移，限步逢之，冨不可量。\",\"logicSentenceId\":\"7619242148411473929\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"607\",\"lineNum\":0,\"lineType\":1,\"content\":\"此星若臨生狂之郷，雖不逢帝座，若得左右，則職其威權，或居閑弱之地也。\",\"logicSentenceId\":\"7587041034896670761\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"608\",\"lineNum\":0,\"lineType\":1,\"content\":\"作吉利二限逢之，主富贵。\",\"logicSentenceId\":\"7587041034896687145\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174709776302143","endPageId":"7330174709776302143","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034896654377\",\"content\":\"身命宫有天相星就会荣耀，子女宫有天相星则子嗣昌盛，十二宫有天相星都是吉祥福泽，不随恶星而改变意志，不因为煞星的影响而改变，行运遇到天相星，财富不可限量。\"},{\"logicSentenceId\":\"7587041034896670761\",\"content\":\"此星如果临生旺的地方，虽未与帝座相遇，如果得到左右辅佐，就能执掌威权，或者处于闲散、弱势之地。\"},{\"logicSentenceId\":\"7587041034896687145\",\"content\":\"在吉利的两个运势阶段遇到它，预示富贵。\"},{\"logicSentenceId\":\"7587041034896572457\",\"content\":\"问：天相星所主之事如何？\"},{\"logicSentenceId\":\"7587041034896588841\",\"content\":\"回答说：天相星属水，是南斗的第五颗星。\"},{\"logicSentenceId\":\"7587041034896605225\",\"content\":\"它是掌管爵位的星宿，主福泽善行，化气称作印，是象征官禄的文星，处于辅佐帝王的位置。\"},{\"logicSentenceId\":\"7587041034896621609\",\"content\":\"若人命中遇到此星，说话诚实可信，做事不虚假，看到别人有难会有同情怜悯之心，看到别人作恶就会有打抱不平的勇气。\"},{\"logicSentenceId\":\"7587041034896637993\",\"content\":\"官禄得到它就会显赫荣耀，与帝座星会合就会有五种权柄，虽然辅助日月的光辉，还能化解廉贞星的凶煞。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":3189,"chapterOrder":2,"inChapterOrder":38,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694629426","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"609\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生曰：天相，南斗司爵之星，化氣爲印，主人衣食豐足，\",\"logicSentenceId\":\"7587041034896703529\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"610\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174764830523404\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"611\",\"lineNum\":0,\"lineType\":1,\"content\":\"昌曲左右加㑹，位至公卿。\",\"logicSentenceId\":\"7587041034896703529\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"612\",\"lineNum\":0,\"lineType\":1,\"content\":\"䧟地貪𤎉、武破，羊陀殺凑，巧藝安身，火鈴冲破殘疾。\",\"logicSentenceId\":\"7587041034896719913\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"613\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人主聰明端莊，志過丈天。\",\"logicSentenceId\":\"7587041034896736297\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"614\",\"lineNum\":0,\"lineType\":1,\"content\":\"三方吉拱封贈論。\",\"logicSentenceId\":\"7587041034896752681\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"615\",\"lineNum\":0,\"lineType\":1,\"content\":\"若昌曲冲破，侍妾，在僧道主清高。\",\"logicSentenceId\":\"7587041034896769065\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"616\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：天相原属水，化印主官禄。\",\"logicSentenceId\":\"7587041034896785449\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"617\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命両官蓬，定主多財福。\",\"logicSentenceId\":\"7587041034896801833\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"618\",\"lineNum\":0,\"lineType\":1,\"content\":\"形躰又肥滿，語言不輕凟。\",\"logicSentenceId\":\"7587041034896818217\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"619\",\"lineNum\":0,\"lineType\":1,\"content\":\"出仕主飛騰，居家主財谷。\",\"logicSentenceId\":\"7587041034896834601\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"620\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限若逢之，有事皆充足。\",\"logicSentenceId\":\"7587041034896850985\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"621\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：天梁星所主若何？\",\"logicSentenceId\":\"7587041034896867369\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"622\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：天梁属土，南斗第二星也。\",\"logicSentenceId\":\"7587041034896883753\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"623\",\"lineNum\":0,\"lineType\":1,\"content\":\"司夀化氣，為䕃爲福。\",\"logicSentenceId\":\"7587041034896900137\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"624\",\"lineNum\":0,\"lineType\":1,\"content\":\"夀乃父毋之主，宰殺帝之權。\",\"logicSentenceId\":\"7587041034896916521\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"625\",\"lineNum\":0,\"lineType\":1,\"content\":\"於人命則性情磊落，於相貌則厚重温謙循直無私，臨事果决，䕃於身命，福\",\"logicSentenceId\":\"7587041034896932905\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"626\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174764830638092\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"627\",\"lineNum\":0,\"lineType\":1,\"content\":\"及子孫遇昌曲於財官，逢太陽於福徳\",\"logicSentenceId\":\"7587041034896932905\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"628\",\"lineNum\":0,\"lineType\":1,\"content\":\" \",\"charPic\":{\"unicode\":\"&#22270;\",\"url\":\"https:\u002F\u002Fp9-ancientlib-sign.byteimg.com\u002Ftos-cn-i-ceu0di7tn2\u002Fread\u002FSDZJ0170\u002F1\u002Fref\u002F1jw0gc0ofbuw6\u002F1-1711800585157.webp~tplv-ceu0di7tn2-presize-v1:300:q70.png?lk3s=e5c95217&x-expires=1788480000&x-signature=4GZSsIo8n3wISm4PAkQlDq27yqI%3D\",\"uri\":\"read\u002FSDZJ0170\u002F1\u002Fref\u002F1jw0gc0ofbuw6\u002F1-1711800585157.webp\",\"fontType\":0,\"components\":\"\",\"variants\":\"\",\"charPicId\":\"\"},\"logicSentenceId\":\"7587041034896932905\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"629\",\"lineNum\":0,\"lineType\":1,\"content\":\"合，乃為萬今，聲名題於王室，職位臨於風憲。\",\"logicSentenceId\":\"7587041034896932905\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"630\",\"lineNum\":0,\"lineType\":1,\"content\":\"若逢耗矔，更逢天機及殺，冝僧道，亦受王冡制誥。\",\"logicSentenceId\":\"7587041034896965673\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"631\",\"lineNum\":0,\"lineType\":1,\"content\":\"逢貪狼同度，而亂礼亂家，居奴僕疾厄，相貌作豐除之論。\",\"logicSentenceId\":\"7587041034896982057\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"632\",\"lineNum\":0,\"lineType\":1,\"content\":\"見童貞刑忌，必無灾厄克激之虞；遇火鈴刑暗，亦無征戦之橈。\",\"logicSentenceId\":\"7587041035318984758\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"633\",\"lineNum\":0,\"lineType\":1,\"content\":\"太歳冲而爲福，白虎臨而無殃。\",\"logicSentenceId\":\"7587041035319001142\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"634\",\"lineNum\":0,\"lineType\":1,\"content\":\"論而至此，数决竆通之論也。\",\"logicSentenceId\":\"7587041035319017526\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"635\",\"lineNum\":0,\"lineType\":1,\"content\":\"命或對宫，有天梁，主有夀，乃極吉之星也。\",\"logicSentenceId\":\"7587041035319033910\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174709776302143","endPageId":"7330174764830638092","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034896834601\",\"content\":\"出去做官能飞黄腾达，居家生活能有财富和粮食。\"},{\"logicSentenceId\":\"7587041034896801833\",\"content\":\"当天相星落在命宫和身宫这两个宫位时，一定会带来很多的财富和福气。\"},{\"logicSentenceId\":\"7587041034896769065\",\"content\":\"如果文昌、文曲星冲破，为侍妾，在僧道则主清高。\"},{\"logicSentenceId\":\"7587041034896703529\",\"content\":\"希夷先生说：天相，是南斗掌管爵位的星，化气为印，主人衣食丰足，文昌、文曲、左辅、右弼与之会合，位至公卿。\"},{\"logicSentenceId\":\"7587041035318984758\",\"content\":\"遇到童贞、刑忌等星曜，必定没有灾厄、克激的忧患；碰到火、铃、刑、暗等星曜，也没有征战的纷扰。\"},{\"logicSentenceId\":\"7587041034896982057\",\"content\":\"与贪狼星同度，就会违背礼仪、扰乱家庭；若处于奴仆、疾厄宫位，相貌方面就按丰盈去除之说来论断。\"},{\"logicSentenceId\":\"7587041034896818217\",\"content\":\"身形又肥胖丰满，说话不随便轻慢。\"},{\"logicSentenceId\":\"7587041034896867369\",\"content\":\"问：天梁星主管什么？\"},{\"logicSentenceId\":\"7587041034896785449\",\"content\":\"歌诀说：天相星原本属水，化气为印，主掌官运和俸禄。\"},{\"logicSentenceId\":\"7587041035319001142\",\"content\":\"遇到太岁相冲反而带来福气，遇到白虎星降临也没有灾祸。\"},{\"logicSentenceId\":\"7587041034896752681\",\"content\":\"三方吉星拱照，主封赠。\"},{\"logicSentenceId\":\"7587041034896965673\",\"content\":\"如果遇到耗矔，又碰上天机星以及煞星，适合出家为僧道，也能受到朝廷的封诰。\"},{\"logicSentenceId\":\"7587041034896736297\",\"content\":\"女性命主聪明端庄，志向超越丈夫。\"},{\"logicSentenceId\":\"7587041034896883753\",\"content\":\"回答说：天梁星属土，是南斗的第二颗星。\"},{\"logicSentenceId\":\"7587041034896916521\",\"content\":\"寿命是父母的主宰，拥有如同帝王般掌管生杀的权力。\"},{\"logicSentenceId\":\"7587041034896719913\",\"content\":\"当处于陷落之地时，与贪狼、廉贞、武曲、破军相会，又有擎羊、陀罗等煞星汇聚，凭借精巧技艺安身；若被火星、铃星冲破，则会导致残疾。\"},{\"logicSentenceId\":\"7587041034896932905\",\"content\":\"落在人命盘中，代表这个人的性情光明磊落；落在相貌宫中，代表这个人容貌端庄、温和谦逊、公正无私，面对事情能够果断决策，落在身宫或者命宫时会带来荫庇和福气。子孙在财帛宫、官禄宫遇到文昌星、文曲星，在福德宫与太阳星会合，就会名传千古，声名传遍朝廷，担任的职位能监察百官。\"},{\"logicSentenceId\":\"7587041035319017526\",\"content\":\"论述到这里，就是推断命运好坏的定论了。\"},{\"logicSentenceId\":\"7587041034896850985\",\"content\":\"人生两个重要阶段如果遇到它，所有事情都会充裕富足。\"},{\"logicSentenceId\":\"7587041035319033910\",\"content\":\"命宫或对宫有天梁星，主长寿，是极为吉利的星。\"},{\"logicSentenceId\":\"7587041034896900137\",\"content\":\"它掌管寿命，化生出的气能带来庇荫和福气。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":7961,"chapterOrder":2,"inChapterOrder":39,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158862694645810","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"636\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生又曰：天梁南斗，司夀之星，化氣為䕃為夀，佐上帝威權，為父母宫主，主人淸秀温和，形神𥡷重，性情磊落，善識兵法。\",\"logicSentenceId\":\"7587041035319050294\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"637\",\"lineNum\":0,\"lineType\":1,\"content\":\"得昌曲左右加㑹，位至台省。\",\"logicSentenceId\":\"7587041035319066678\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"638\",\"lineNum\":0,\"lineType\":1,\"content\":\"在父母宮，則厚重威嚴，㑹太陽於福徳，極品之貴。\",\"logicSentenceId\":\"7587041035319083062\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"639\",\"lineNum\":0,\"lineType\":1,\"content\":\"戊巳生人合局，若四殺冲破，則苖而\",\"logicSentenceId\":\"7587041035319099446\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"640\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174813064953875\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"641\",\"lineNum\":0,\"lineType\":1,\"content\":\"不秀。\",\"logicSentenceId\":\"7587041035319099446\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"642\",\"lineNum\":0,\"lineType\":1,\"content\":\"逢天機耗曜，僧道清閑；如貪巨同度，則敗倫亂俗，在奴僕疾厄，亦非豐除之論。\",\"logicSentenceId\":\"7587041035319115830\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"643\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉貞刑忌見之，必無克敵之虞；火鈴刑暗，遇之，亦無征戰之撓。\",\"logicSentenceId\":\"7587041035319132214\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"644\",\"lineNum\":0,\"lineType\":1,\"content\":\"太歲冲而為福。\",\"logicSentenceId\":\"7587041035319148598\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"645\",\"lineNum\":0,\"lineType\":1,\"content\":\"白虎㑹\",\"logicSentenceId\":\"7587041035319164982\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"646\",\"lineNum\":0,\"lineType\":2,\"content\":\"而無災。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"647\",\"lineNum\":0,\"lineType\":1,\"content\":\"奏書食，則有意外之荣；靑龍動則有文書之喜。\",\"logicSentenceId\":\"7587041035319164982\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"648\",\"lineNum\":0,\"lineType\":1,\"content\":\"小耗大耗交遇，所幹無成。\",\"logicSentenceId\":\"7587041035319181366\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"649\",\"lineNum\":0,\"lineType\":1,\"content\":\"病符、官符相侵，不爲災。\",\"logicSentenceId\":\"7587041035319197750\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"650\",\"lineNum\":0,\"lineType\":1,\"content\":\"論。\",\"logicSentenceId\":\"7587041035319214134\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"651\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人吉星入庙，旺夫益子，昌曲左右、扶持封贈，羊陀火忌冲破刑尅，招非不少。\",\"logicSentenceId\":\"7587041035319230518\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"652\",\"lineNum\":0,\"lineType\":1,\"content\":\"僧道冝之。\",\"logicSentenceId\":\"7587041035319246902\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"653\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：天梁原属土，南斗最吉星。\",\"logicSentenceId\":\"7587041035319263286\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"654\",\"lineNum\":0,\"lineType\":1,\"content
