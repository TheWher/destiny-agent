l,\"pinYin\":null},{\"lineId\":\"933\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：鈴星乃南斗助星也。\",\"logicSentenceId\":\"7587041035714052115\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175173032787987","endPageId":"7330175173032787987","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035713953811\",\"content\":\"封侯担任上将，在边疆建立卓著的功勋。\"},{\"logicSentenceId\":\"7587041035713986579\",\"content\":\"僧人大多漂泊不定，心中不守清规戒律。\"},{\"logicSentenceId\":\"7587041035713822739\",\"content\":\"希夷先生的歌中说：火星是大杀将，在南斗被称作杀神。\"},{\"logicSentenceId\":\"7587041035713921043\",\"content\":\"这颗星对东南方有利，对西北方出生的人不利。\"},{\"logicSentenceId\":\"7587041035713855507\",\"content\":\"性情沉郁，刚强超出众人。\"},{\"logicSentenceId\":\"7587041035713839123\",\"content\":\"如果落在身宫和命宫的位置，其他各宫都不宜临照。\"},{\"logicSentenceId\":\"7587041035713888275\",\"content\":\"如果再与羊陀相会，婴儿时期必定会遭遇灾祸。\"},{\"logicSentenceId\":\"7587041035713789971\",\"content\":\"问：火星所代表的命理情况是怎样的呢？\"},{\"logicSentenceId\":\"7587041035713904659\",\"content\":\"过继给他人或外出寄养，随两个姓氏方可延续生命。\"},{\"logicSentenceId\":\"7587041035713871891\",\"content\":\"毛发大多异于常人，唇齿有伤痕。\"},{\"logicSentenceId\":\"7587041035714019347\",\"content\":\"刑克丈夫又克子女，是下贱劳碌的人。\"},{\"logicSentenceId\":\"7587041035713970195\",\"content\":\"三方宫位没有煞星冲破，中年之后才开始兴盛。\"},{\"logicSentenceId\":\"7587041035714052115\",\"content\":\"回答说：铃星是南斗的辅助星。\"},{\"logicSentenceId\":\"7587041035713806355\",\"content\":\"回答说：火星是南斗的浮星。\"},{\"logicSentenceId\":\"7587041035714002963\",\"content\":\"女人处于旺地时品行高洁，处于陷地时则主邪淫之事。\"},{\"logicSentenceId\":\"7587041035714035731\",\"content\":\"问：铃星代表的命理情况是怎样的呢？\"},{\"logicSentenceId\":\"7587041035713937427\",\"content\":\"如果火星能与贪狼星相会，处于旺地时尊贵无比。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":4724,"chapterOrder":2,"inChapterOrder":67,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848210469","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"934\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生歌曰：大殺鈴星将，南斗為從神。\",\"logicSentenceId\":\"7587041035714068499\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"935\",\"lineNum\":0,\"lineType\":1,\"content\":\"值人身命者，性格\",\"logicSentenceId\":\"7587041035714084883\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"936\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175173032919059\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"937\",\"lineNum\":0,\"lineType\":1,\"content\":\"亦沉吟。\",\"logicSentenceId\":\"7587041035714084883\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"938\",\"lineNum\":0,\"lineType\":1,\"content\":\"形貌多異類，威勢有聲名。\",\"logicSentenceId\":\"7587041035714101267\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"939\",\"lineNum\":0,\"lineType\":1,\"content\":\"若與貪狼㑹，指日立邉庭。\",\"logicSentenceId\":\"7587041035714117651\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"940\",\"lineNum\":0,\"lineType\":1,\"content\":\"庙地財官貴，陥地主孤貧。\",\"logicSentenceId\":\"7587041035714134035\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175173032787987","endPageId":"7330175173032919059","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035714068499\",\"content\":\"希夷先生的歌中说：大杀星就是铃星将，它是南斗的从属神。\"},{\"logicSentenceId\":\"7587041035714084883\",\"content\":\"当铃星位于人的命宫或身宫时，此人性格也会深沉内敛。\"},{\"logicSentenceId\":\"7587041035714101267\",\"content\":\"外貌大多与众不同，有威严气势且名声在外。\"},{\"logicSentenceId\":\"7587041035714117651\",\"content\":\"如果铃星与贪狼星相会，很快就能在边疆建立功业。\"},{\"logicSentenceId\":\"7587041035714134035\",\"content\":\"处于庙旺之地则主财禄、官职显贵，处于陷弱之地则主孤独贫困。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1744,"chapterOrder":2,"inChapterOrder":68,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848226853","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"941\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀若凑合，其形大不清。\",\"logicSentenceId\":\"7587041035714150419\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"942\",\"lineNum\":0,\"lineType\":1,\"content\":\"孤单并棄祖，殘傷帯疾人。\",\"logicSentenceId\":\"7587041035714166803\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"943\",\"lineNum\":0,\"lineType\":1,\"content\":\"僧道多飄蕩，還俗定無倫。\",\"logicSentenceId\":\"7587041035714183187\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"944\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人無吉曜，刑尅少六親。\",\"logicSentenceId\":\"7587041035714199571\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"945\",\"lineNum\":0,\"lineType\":1,\"content\":\"終身不貞絜，夀夭仍困貧。\",\"logicSentenceId\":\"7587041035714215955\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175173032919059","endPageId":"7330175173032919059","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035714215955\",\"content\":\"一生不贞洁，寿命短且依旧贫困。\"},{\"logicSentenceId\":\"7587041035714150419\",\"content\":\"羊陀二星若交会，其形相大为不佳。\"},{\"logicSentenceId\":\"7587041035714166803\",\"content\":\"孤独无依且背弃祖先，伤残又带着疾病的人。\"},{\"logicSentenceId\":\"7587041035714183187\",\"content\":\"僧道多漂泊不定，还俗必定违背伦常。\"},{\"logicSentenceId\":\"7587041035714199571\",\"content\":\"女人命中没有吉星照耀，会刑克亲人且缺少六亲相助。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1402,"chapterOrder":2,"inChapterOrder":69,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848243237","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"946\",\"lineNum\":0,\"lineType\":1,\"content\":\"此星大殺將，其𢙣不可禁。\",\"logicSentenceId\":\"7587041035714232339\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"947\",\"lineNum\":0,\"lineType\":1,\"content\":\"一生有㐫福，聚實爲虚情。\",\"logicSentenceId\":\"7587041035714248723\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"948\",\"lineNum\":0,\"lineType\":1,\"content\":\"七殺主陣亡，破軍財屋傾。\",\"logicSentenceId\":\"7587041035714265107\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"949\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉宿羊刑㑹，刼冝主刀兵。\",\"logicSentenceId\":\"7587041035714281491\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"950\",\"lineNum\":0,\"lineType\":1,\"content\":\"或遇貪狼宿，官禄亦不寕。\",\"logicSentenceId\":\"7587041035714297875\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"951\",\"lineNum\":0,\"lineType\":1,\"content\":\"若逢居旺地，冨貴不可倫。\",\"logicSentenceId\":\"7587041035714314259\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175173032919059","endPageId":"7330175173032919059","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035714281491\",\"content\":\"廉贞星与擎羊星、刑星相会，遇到劫星就宜有刀兵之灾。\"},{\"logicSentenceId\":\"7587041035714297875\",\"content\":\"如果遇到贪狼星宿，官职俸禄也不安宁。\"},{\"logicSentenceId\":\"7587041035714314259\",\"content\":\"如果这些星宿处于旺地，富贵无法比拟。\"},{\"logicSentenceId\":\"7587041035714232339\",\"content\":\"这颗星是大杀将星，它的凶恶难以遏制。\"},{\"logicSentenceId\":\"7587041035714248723\",\"content\":\"一生之中有凶有福，但所聚之实皆是虚情。\"},{\"logicSentenceId\":\"7587041035714265107\",\"content\":\"七杀主阵亡，破军主财散屋塌。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1683,"chapterOrder":2,"inChapterOrder":70,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848259621","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"952\",\"lineNum\":0,\"lineType\":10,\"content\":\"羊陀、火鈴四星緫論\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175173032919059","endPageId":"7330175173032919059","contentEncryptType":0,"translateContent":"","chapterId":"1jvzoopnqo0t6","dataSize":130,"chapterOrder":2,"inChapterOrder":71,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848276005","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"953\",\"lineNum\":0,\"lineType\":1,\"content\":\"玉蟾先生曰：鈴火陀羅，金擎羊刑忌訣，一名馬掃星，又名短壽殺。\",\"logicSentenceId\":\"7587041035714330643\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"954\",\"lineNum\":0,\"lineType\":1,\"content\":\"君子失其權，小人犯刑法。\",\"logicSentenceId\":\"7587041035714347027\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"955\",\"lineNum\":0,\"lineType\":1,\"content\":\"狐獨尅六親，災禍常不歇。\",\"logicSentenceId\":\"7587041035714363411\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"956\",\"lineNum\":0,\"lineType\":1,\"content\":\"腰\",\"logicSentenceId\":\"7587041035714379795\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"957\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175218624790567\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"958\",\"lineNum\":0,\"lineType\":1,\"content\":\"足唇齒傷，劳碌多蹇剥。\",\"logicSentenceId\":\"7587041035714379795\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"959\",\"lineNum\":0,\"lineType\":1,\"content\":\"破相又劳心，乞丐填溝壑。\",\"logicSentenceId\":\"7587041035714396179\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"960\",\"lineNum\":0,\"lineType\":1,\"content\":\"武曲併貪狼，一世招㐫𢙣。\",\"logicSentenceId\":\"7587041035714412563\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"961\",\"lineNum\":0,\"lineType\":1,\"content\":\"疾厄若逢之，四時不離着。\",\"logicSentenceId\":\"7587041035714428947\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"962\",\"lineNum\":0,\"lineType\":1,\"content\":\"只冝山寺僧，金糓常安樂。\",\"logicSentenceId\":\"7587041035714445331\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175173032919059","endPageId":"7330175218624790567","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035714445331\",\"content\":\"只适合做山寺中的僧人，才能长久过上富足安乐的生活。\"},{\"logicSentenceId\":\"7587041035714330643\",\"content\":\"玉蟾先生说：铃星、火星、陀罗星，金星、擎羊星、刑星、忌星的秘诀，一名叫马扫星，又名短寿杀。\"},{\"logicSentenceId\":\"7587041035714347027\",\"content\":\"对君子而言，会失去权势；对小人而言，会触犯刑法。\"},{\"logicSentenceId\":\"7587041035714363411\",\"content\":\"会孤独，刑克六亲，灾祸常常不断。\"},{\"logicSentenceId\":\"7587041035714379795\",\"content\":\"腰、足、唇、齿会受伤，一生劳碌而且命运坎坷不顺。\"},{\"logicSentenceId\":\"7587041035714396179\",\"content\":\"面容受损又操心劳累，最终像乞丐一样死在沟壑之中。\"},{\"logicSentenceId\":\"7587041035714412563\",\"content\":\"武曲星与贪狼星同宫，一生都会招来凶险灾祸。\"},{\"logicSentenceId\":\"7587041035714428947\",\"content\":\"疾厄宫若遇到这些凶星，一年四季灾病缠身。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2660,"chapterOrder":2,"inChapterOrder":72,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158863848292389","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"963\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：天空地刼所主若何？\",\"logicSentenceId\":\"7587041035714461715\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"964\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：二星守身命，遇吉則吉，遇吉則㐫。\",\"logicSentenceId\":\"7587041035714478099\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"965\",\"lineNum\":0,\"lineType\":1,\"content\":\"如四殺冲照，輕者下賤，重者六畜之命，僧道不正，女子婢妾，刑尅孤獨。\",\"logicSentenceId\":\"7587041035714494483\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"966\",\"lineNum\":0,\"lineType\":1,\"content\":\"大抵二星俱不冝見，定主破財。\",\"logicSentenceId\":\"7587041035714510867\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"967\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限逢之必㐫。\",\"logicSentenceId\":\"7587041035714527251\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"968\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：刼空為害最愁人，才智英雄誤一身。\",\"logicSentenceId\":\"7587041035714543635\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"969\",\"lineNum\":0,\"lineType\":1,\"content\":\"只好為僧併學術，堆金積玉也湏貧。\",\"logicSentenceId\":\"7587041035714560019\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"970\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175218624888871\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"971\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：天傷、天使星所主若何？\",\"logicSentenceId\":\"7587041035714576403\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175218624790567","endPageId":"7330175218624888871","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035714527251\",\"content\":\"大运和小运遇到这两颗星一定会有凶灾。\"},{\"logicSentenceId\":\"7587041035714543635\",\"content\":\"歌诀说：天空、地劫二星带来的危害最让人发愁，会耽误有才智的英雄一生。\"},{\"logicSentenceId\":\"7587041035714560019\",\"content\":\"只适合当和尚、做学问，就算金银财宝堆成山，到头来也必定受穷。\"},{\"logicSentenceId\":\"7587041035714576403\",\"content\":\"问：天伤星、天使星主掌的情况是怎样的？\"},{\"logicSentenceId\":\"7587041035714461715\",\"content\":\"问：天空星和地劫星所主的情况如何？\"},{\"logicSentenceId\":\"7587041035714478099\",\"content\":\"希夷先生回答说：天空、地劫二星守着身宫和命宫，遇到吉星就吉利，遇到凶星就凶险。\"},{\"logicSentenceId\":\"7587041035714494483\",\"content\":\"如果与四煞星冲照，命轻一些的人会身份低贱，严重一些的会过着如同牲畜一般的生活，从事僧道职业的人会行为不端，女子会成为婢女或妾室，并且会刑克亲人、一生孤独。\"},{\"logicSentenceId\":\"7587041035714510867\",\"content\":\"大体上这两颗星都不宜出现，必定会导致破财。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2785,"chapterOrder":2,"inChapterOrder":73,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158864376463410","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"972\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：天傷乃上天虚耗之神，天使乃上天傳使之神。\",\"logicSentenceId\":\"7587041035714592787\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"973\",\"lineNum\":0,\"lineType\":1,\"content\":\"太嵗二限逢之，不問得地否，只要吉多為福，其禍稍輕。\",\"logicSentenceId\":\"7587041035714609171\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"974\",\"lineNum\":0,\"lineType\":1,\"content\":\"如無吉值巨門、羊陀火忌夭机，其年必主官災、䘮亡破敗。\",\"logicSentenceId\":\"7587041035714625555\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"975\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：限至天耗號天傷，夫子在陳也絶粮。\",\"logicSentenceId\":\"7587041035714641939\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"976\",\"lineNum\":0,\"lineType\":1,\"content\":\"天使限臨人共忌，石崇冨貴破家亡。\",\"logicSentenceId\":\"7587041035714658323\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175218624888871","endPageId":"7330175218624888871","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035714609171\",\"content\":\"太岁和二限遇到它们，不论是否处于有利位置，只要吉星众多就能带来福气，灾祸就会稍微减轻。\"},{\"logicSentenceId\":\"7587041035714625555\",\"content\":\"如果没有吉星临值，遇到巨门、羊陀、火星、忌星、天机，那一年必定会有官司灾祸、亲人丧亡、家道破败。\"},{\"logicSentenceId\":\"7587041035714641939\",\"content\":\"歌诀说：限运到天耗星称作天伤星时，就像孔子在陈国断绝粮食一样。\"},{\"logicSentenceId\":\"7587041035714658323\",\"content\":\"天使星临照的限运，人人都忌讳，即便像石崇一样富贵，也会落得家破人亡的下场。\"},{\"logicSentenceId\":\"7587041035714592787\",\"content\":\"希夷先生回答说：天伤是上天虚耗之神，天使是上天传使之神。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1846,"chapterOrder":2,"inChapterOrder":74,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158864376479794","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"977\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：天刑星所主若何？\",\"logicSentenceId\":\"7587041035714674707\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"978\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：天刑守命，身不為僧道，定主孤刑，不貧則夭，父毋\",\"logicSentenceId\":\"7587041035714691091\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"979\",\"lineNum\":0,\"lineType\":1,\"content\":\" \",\"charPic\":{\"unicode\":\"&#22270;\",\"url\":\"https:\u002F\u002Fp6-ancientlib-sign.byteimg.com\u002Ftos-cn-i-ceu0di7tn2\u002Fread\u002FSDZJ0170\u002F1\u002Fref\u002F1jw0gc0ofcwti\u002F1-1711802821794.webp~tplv-ceu0di7tn2-presize-v1:300:q70.png?lk3s=e5c95217&x-expires=1788480000&x-signature=AJgdHCJKWAIObNGMRcxz%2Bmnnh34%3D\",\"uri\":\"read\u002FSDZJ0170\u002F1\u002Fref\u002F1jw0gc0ofcwti\u002F1-1711802821794.webp\",\"fontType\":0,\"components\":\ neId\":\"984\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175218625019943\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"985\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：\",\"logicSentenceId\":\"7587041035714740243\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"986\",\"lineNum\":0,\"lineType\":2,\"content\":\"天刑。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"987\",\"lineNum\":0,\"lineType\":1,\"content\":\"未必是㐫星入庙，名為天喜神。\",\"logicSentenceId\":\"7587041035714740243\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"988\",\"lineNum\":0,\"lineType\":1,\"content\":\"昌曲吉星來凑合，定然献策到王庭。\",\"logicSentenceId\":\"7587041035714756627\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"989\",\"lineNum\":0,\"lineType\":1,\"content\":\"刑居\",\"logicSentenceId\":\"7587041035714773011\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"990\",\"lineNum\":0,\"lineType\":2,\"content\":\"寅上并酉。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"991\",\"lineNum\":0,\"lineType\":1,\"content\":\"戍，更臨卯位自光明，必遇文星成大業，掌握邉彊百萬兵。\",\"logicSentenceId\":\"7587041035714773011\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175218625019943","endPageId":"7330175218625019943","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035714773011\",\"content\":\"天刑星在戍宫，又临卯位，自然光明，必定会遇到文星成就大业，掌握边疆百万雄兵。\"},{\"logicSentenceId\":\"7587041035714740243\",\"content\":\"未必是凶星，入庙后名为天喜神。\"},{\"logicSentenceId\":\"7587041035714756627\",\"content\":\"文昌、文曲两颗吉星汇聚交会，必定能向朝廷进献策略。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1494,"chapterOrder":2,"inChapterOrder":76,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158864376512562","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"992\",\"lineNum\":0,\"lineType\":1,\"content\":\"三不了兮號天刑，為僧為道是孤身。\",\"logicSentenceId\":\"7587041035714789395\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"993\",\"lineNum\":0,\"lineType\":1,\"content\":\"天哭二星皆同到，終是難逃有疾人。\",\"logicSentenceId\":\"7587041035714805779\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175218625019943","endPageId":"7330175218625019943","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035714789395\",\"content\":\"种种事难了断就叫做天刑，即便出家为僧为道也会孤单一人。\"},{\"logicSentenceId\":\"7587041035714805779\",\"content\":\"天哭二星都同时到来，最终难逃疾病缠身。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":631,"chapterOrder":2,"inChapterOrder":77,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158864376528946","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"994\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：天姚星所主若何？\",\"logicSentenceId\":\"7587041035714822163\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"995\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：天姚守身命，心性隂毒，多疑惑，善顔色風流，多婢主滛，入庙旺，主冨貴，多奴。\",\"logicSentenceId\":\"7587041035714838547\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"996\",\"lineNum\":0,\"lineType\":1,\"content\":\"居亥，有學識，㑹惡星，破家敗産，因色犯刑。\",\"logicSentenceId\":\"7587041035714854931\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"997\",\"lineNum\":0,\"lineType\":1,\"content\":\"六合重逢，少年夭折。\",\"logicSentenceId\":\"7587041035714871315\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"998\",\"lineNum\":0,\"lineType\":1,\"content\":\"若\",\"logicSentenceId\":\"7587041035725832235\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"999\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175270499942441\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1000\",\"lineNum\":0,\"lineType\":1,\"content\":\"臨限不用媒妁，招手成婚，或紫微吉星加剛柔相濟，主風騷，加紅鵉愈淫，加刑刄主夭。\",\"logicSentenceId\":\"7587041035725832235\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175218625019943","endPageId":"7330175270499942441","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035725832235\",\"content\":\"若在运限中不用媒人，招手就能成婚；若有紫微等吉星且刚柔相济，主为人风骚；若加上红鸾星则越发淫荡；若加上刑刃星则主夭折。\"},{\"logicSentenceId\":\"7587041035714822163\",\"content\":\"问：天姚星主掌的事情是怎样的？\"},{\"logicSentenceId\":\"7587041035714838547\",\"content\":\"希夷先生回答说：天姚星坐守命宫和身宫时，命主心性阴险狠毒，容易产生疑虑和猜忌，容貌姣好且风流多情，身边有很多婢女且容易沉迷于淫乱之事；当天姚星处于庙旺的状态时，命主会拥有富贵，身边会有很多奴仆。\"},{\"logicSentenceId\":\"7587041035714854931\",\"content\":\"天姚星位于亥位时，命主有学识，但如果与恶星相会，会导致破家败产，还会因女色而触犯刑罚。\"},{\"logicSentenceId\":\"7587041035714871315\",\"content\":\"如果天姚星与六合星再次相遇，命主会在少年时夭折。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2261,"chapterOrder":2,"inChapterOrder":78,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158864376545330","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1001\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：天姚居戌卯酉逰，更入雙魚一併求。\",\"logicSentenceId\":\"7587041035725848619\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1002\",\"lineNum\":0,\"lineType\":1,\"content\":\"福厚生成躭酒色，無災無禍度春秋。\",\"logicSentenceId\":\"7587041035725865003\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175270499942441","endPageId":"7330175270499942441","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035725848619\",\"content\":\"歌诀说：天姚星在戌、卯、酉位游动，再进入双鱼宫位一并推求。\"},{\"logicSentenceId\":\"7587041035725865003\",\"content\":\"生来福分深厚，沉迷酒色，一生无灾无祸度过岁月。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":660,"chapterOrder":2,"inChapterOrder":79,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158864376561714","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1003\",\"lineNum\":0,\"lineType\":1,\"content\":\"天姚星與敗星同，號曰人間掃氣囂。\",\"logicSentenceId\":\"7587041035725881387\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1004\",\"lineNum\":0,\"lineType\":1,\"content\":\"辛若平生過一世，不曽安亦在家中。\",\"logicSentenceId\":\"7587041035725897771\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175270499942441","endPageId":"7330175270499942441","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035725881387\",\"content\":\"天姚星和败星性质相似，被称作人间的扫把星、晦气星。\"},{\"logicSentenceId\":\"7587041035725897771\",\"content\":\"辛苦劳碌过一生，连在家中也得不到安宁。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":627,"chapterOrder":2,"inChapterOrder":80,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158864376578098","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1005\",\"lineNum\":0,\"lineType\":1,\"content\":\"人身偶尔值天姚，恋色貪花性箒㐫。\",\"logicSentenceId\":\"7587041035725914155\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1006\",\"lineNum\":0,\"lineType\":1,\"content\":\"此曜若居生旺地，位登極品亦風騷。\",\"logicSentenceId\":\"7587041035725930539\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175270499942441","endPageId":"7330175270499942441","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035725930539\",\"content\":\"此星曜若处于生旺之地，即便官位达到极品也会风流多情。\"},{\"logicSentenceId\":\"7587041035725914155\",\"content\":\"人的命盘中如果偶尔遇到天姚星，就会贪恋美色，性情凶狠。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":654,"chapterOrder":2,"inChapterOrder":81,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158864376594482","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1007\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：天哭、天虚二星，所主若何？\",\"logicSentenceId\":\"7587041035725946923\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175270499942441","endPageId":"7330175270499942441","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035725946923\",\"content\":\"问：天哭、天虚两颗星，主掌的是什么呢？\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":317,"chapterOrder":2,"inChapterOrder":82,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158864376610866","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"1008\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生荅曰：哭虚為悪曜，\",\"logicSentenceId\":\"7587041035725963307\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1009\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330175270500040745\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1010\",\"lineNum\":0,\"lineType\":1,\"content\":\"臨命最非常。\",\"logicSentenceId\":\"7587041035725963307\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1011\",\"lineNum\":0,\"lineType\":1,\"content\":\"加臨父母内，破蕩賣田庄。\",\"logicSentenceId\":\"7587041035725979691\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1012\",\"lineNum\":0,\"lineType\":1,\"content\":\"若教身命陷，竆獨帶刑傷。\",\"logicSentenceId\":\"7587041035725996075\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"1013\",\"lineNum\":0,\"lineType\":1,\"content\":\"六親多不足，煩惱過時光。\",\"logicSentenceId\":\"7587041035726012459\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330175270499942441","endPageId":"7330175270500040745","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041035725979691\",\"content\":\"若这两颗星加临到代表父母的宫位内，就会家道破落衰败，甚至要变卖田庄。\"},{\"logicSentenceId\":\"7587041035725996075\",\"content\":\"如果命宫和身宫被陷，会陷入穷困孤独且遭受刑罚伤害。\"},{\"logicSentenceId\":\"7587041035726012459\",\"content\":\"六亲大多不圆满，在烦恼中度过时光。\"},{\"logicSentenceId\":\"7587041035725963307\",\"content\":\"希夷先生回答说：天哭星和天虚星是凶星，照临命宫最为不妙。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":1471,"chapterOrder":2,"inChapterOrder":83,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"73561588
