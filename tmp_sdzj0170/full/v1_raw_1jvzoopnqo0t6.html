ll,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330173949894213651","endPageId":"7330173949894213651","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587040568061607955\",\"content\":\"函装完整。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":235,"chapterOrder":2,"inChapterOrder":4,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158860421382182","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"75\",\"lineNum\":0,\"lineType\":1,\"content\":\"斗数至玄至微，理𣥜易明，雖設問於百篇之中，猶有言而未盡。\",\"logicSentenceId\":\"7587040568061624339\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"76\",\"lineNum\":0,\"lineType\":1,\"content\":\"至如星之分野，各有所属，夀夭賢愚，富貴貧賤，不可一槩論議。\",\"logicSentenceId\":\"7587040568061640723\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"77\",\"lineNum\":0,\"lineType\":1,\"content\":\"其星分布于十二垣，数定乎三十六位，入庙為竒，失度為虚。\",\"logicSentenceId\":\"7587040568061657107\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"78\",\"lineNum\":0,\"lineType\":1,\"content\":\"大抵以身命為福徳之本，加以根源為窮通之資。\",\"logicSentenceId\":\"7587040568061673491\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"79\",\"lineNum\":0,\"lineType\":1,\"content\":\"星有同纒，数有分定，湏明其生尅之要，必詳乎得垣失度之分。\",\"logicSentenceId\":\"7587040568061689875\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"80\",\"lineNum\":0,\"lineType\":1,\"content\":\"觀\",\"logicSentenceId\":\"7587040568061706259\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"81\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174007737712681\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"82\",\"lineNum\":0,\"lineType\":1,\"content\":\"乎紫微舎纒，司一天儀之象，卒列宿而成垣。\",\"logicSentenceId\":\"7587040568061706259\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"83\",\"lineNum\":0,\"lineType\":1,\"content\":\"𡈽星苟居其垣，若可動移；金星專司財庫，最怕空亡。\",\"logicSentenceId\":\"7587040568061722643\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"84\",\"lineNum\":0,\"lineType\":1,\"content\":\"帝居動則列宿奔馳；貪守空而財源不聚。\",\"logicSentenceId\":\"7587040568061739027\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"85\",\"lineNum\":0,\"lineType\":1,\"content\":\"各司其職，不可参差。\",\"logicSentenceId\":\"7587040568061755411\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"86\",\"lineNum\":0,\"lineType\":1,\"content\":\"苟或不察其機，更忘其變，則数之造化逺矣。\",\"logicSentenceId\":\"7587040568061771795\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"87\",\"lineNum\":0,\"lineType\":1,\"content\":\"例曰：禄逢冲破，吉處藏㐫；馬遇空亡，終身奔走。\",\"logicSentenceId\":\"7587040568061788179\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"88\",\"lineNum\":0,\"lineType\":1,\"content\":\"生逢敗地，發也虚花。\",\"logicSentenceId\":\"7587040568061804563\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"89\",\"lineNum\":0,\"lineType\":1,\"content\":\"絶處逢生，花而不敗。\",\"logicSentenceId\":\"7587040568061820947\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"90\",\"lineNum\":0,\"lineType\":1,\"content\":\"星臨庙旺，再觀生尅之機；命坐強宫，細察制化之理。\",\"logicSentenceId\":\"7587040568061837331\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"91\",\"lineNum\":0,\"lineType\":1,\"content\":\"日月最嫌反背，禄馬最喜交馳，倘居空亡，得失最為要緊，若逢敗地，扶持大有竒功。\",\"logicSentenceId\":\"7587040568061853715\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"92\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微天府，全依輔弼之功；七殺破軍，專依羊鈴之虐。\",\"logicSentenceId\":\"7587040568061870099\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"93\",\"lineNum\":0,\"lineType\":1,\"content\":\"諸星吉，逢㐫也吉，諸星㐫，逢吉也㐫。\",\"logicSentenceId\":\"7587040568061886483\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"94\",\"lineNum\":0,\"lineType\":1,\"content\":\"輔弼夾帝為上品，桃花犯主為至滛。\",\"logicSentenceId\":\"7587040568061902867\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"95\",\"lineNum\":0,\"lineType\":1,\"content\":\"君臣慶會，材擅經邦；魁鉞同行，位居台輔。\",\"logicSentenceId\":\"7587040568061919251\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"96\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄\",\"logicSentenceId\":\"7587040568061935635\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"97\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174007737876521\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"98\",\"lineNum\":0,\"lineType\":1,\"content\":\"文拱命，貴而且賢；日月夾財，不權則冨；馬頭𢃄箭，鎮衞邉疆；刑囚夾印，刑杖惟司；善䕃朝綱，仁慈之長。\",\"logicSentenceId\":\"7587040568061935635\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"99\",\"lineNum\":0,\"lineType\":1,\"content\":\"貴入貴郷，逢者富貴；財居財位，遇者冨奢。\",\"logicSentenceId\":\"7587040568061952019\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"100\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽居午，謂之日麗中天，有專榷之貴，敵國之冨。\",\"logicSentenceId\":\"7587040568061968403\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"101\",\"lineNum\":0,\"lineType\":1,\"content\":\"太隂居子，號曰水澄桂蕚，得淸要之職，忠諫之材。\",\"logicSentenceId\":\"7587040568061984787\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"102\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微輔弼同宫，一呼百諾，居上品。\",\"logicSentenceId\":\"7587040568062001171\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"103\",\"lineNum\":0,\"lineType\":1,\"content\":\"文耗居寅卯，謂之衆水朝東。\",\"logicSentenceId\":\"7587040568062017555\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"104\",\"lineNum\":0,\"lineType\":1,\"content\":\"日月守不如照合，䕃福聚，不怕㐫危。\",\"logicSentenceId\":\"7587040568062033939\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"105\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪居亥子，名為泛水桃花；刑遇貪狼，號曰風流彩杖。\",\"logicSentenceId\":\"7587040568062050323\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"106\",\"lineNum\":0,\"lineType\":1,\"content\":\"七殺𤎉貞同位，路上埋屍；破軍暗矅同鄉，水中作塚。\",\"logicSentenceId\":\"7587040568062066707\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"107\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄居奴僕，縱有官也奔馳；帝遇㐫徒，雖獲吉而無道。\",\"logicSentenceId\":\"7587040568062083091\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"108\",\"lineNum\":0,\"lineType\":1,\"content\":\"帝坐金車，則曰金轝捧節；福安文曜，謂之玉袖天香。\",\"logicSentenceId\":\"7587040568062099475\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"109\",\"lineNum\":0,\"lineType\":1,\"content\":\"太陽會文昌於官禄，皇殿朝班，冨貴全羙。\",\"logicSentenceId\":\"7587040568062115859\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"110\",\"lineNum\":0,\"lineType\":1,\"content\":\"太隂㑹\",\"logicSentenceId\":\"7587040568062132243\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"111\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174059281416233\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"112\",\"lineNum\":0,\"lineType\":1,\"content\":\"文曲於妻宫，蟾宫折桂，文章令盛；禄存守於田財，堆金積玉，財䕃坐於遷移，巨啇高賈。\",\"logicSentenceId\":\"7587040568062132243\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"113\",\"lineNum\":0,\"lineType\":1,\"content\":\"耗居禄位，沿途乞食；貪會旺宫，終身鼠𥨸；殺居絶地，天年夭似顔回；貪坐生郷，夀考永如彭祖。\",\"logicSentenceId\":\"7587040568062148627\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"114\",\"lineNum\":0,\"lineType\":1,\"content\":\"忌暗同居身命，疾厄沉困、弱羸。\",\"logicSentenceId\":\"7587040568062165011\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"115\",\"lineNum\":0,\"lineType\":1,\"content\":\"㐫星㑹於父母、遷移，刑傷産室；刑殺同𤎉貞於官禄，枷杻難逃；官府加刑殺於遷移，離郷遭配。\",\"logicSentenceId\":\"7587040568062181395\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"116\",\"lineNum\":0,\"lineType\":1,\"content\":\"善福守於空位，天竺生涯；輔弼单守命宫，離宗庶出。\",\"logicSentenceId\":\"7587040568062197779\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"117\",\"lineNum\":0,\"lineType\":1,\"content\":\"七殺臨於身命，加𢙣殺，必定死亡。\",\"logicSentenceId\":\"7587040568062214163\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"118\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊鈴合於命宫，遇白虎湏當刑戮；官府發於吉曜，流殺怕逢破軍；羊鈴慿太嵗以引行。\",\"logicSentenceId\":\"7587040568062230547\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"119\",\"lineNum\":0,\"lineType\":1,\"content\":\"病符官符皆作禍，奏書愽士與流禄盡作吉祥；力士将軍同青龍顕其權勢。\",\"logicSentenceId\":\"7587040568062246931\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"120\",\"lineNum\":0,\"lineType\":1,\"content\":\"童子限如水上泡漚，老人限似風中燃燭。\",\"logicSentenceId\":\"7587040568062263315\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"121\",\"lineNum\":0,\"lineType\":1,\"content\":\"遇殺\",\"logicSentenceId\":\"7587040568062279699\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"122\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174059281514537\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"123\",\"lineNum\":0,\"lineType\":1,\"content\":\"與擎羊，流年最忌。\",\"logicSentenceId\":\"7587040568062279699\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"124\",\"lineNum\":0,\"lineType\":1,\"content\":\"人生荣辱，限元必有休咎；處世孤貧，数位定逢駁雜；學者至此，誠玄㣲矣。\",\"logicSentenceId\":\"7587040568062296083\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330173949894213651","endPageId":"7330174059281514537","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587040568062033939\",\"content\":\"太阳星、太阴星坐守不如相互照合，这样能聚集福泽和庇佑，不用担心遇到凶险危难。\"},{\"logicSentenceId\":\"7587040568062263315\",\"content\":\"童子的命限就像水上的泡沫一样脆弱，老人的命限就像风中的蜡烛一样飘摇。\"},{\"logicSentenceId\":\"7587040568061755411\",\"content\":\"每个星宿都掌管着各自的职责，不可以混淆错乱。\"},{\"logicSentenceId\":\"7587040568061640723\",\"content\":\"至于星辰的分野，各有其所属，人的寿命长短、贤能愚笨、富贵贫贱，不能一概而论。\"},{\"logicSentenceId\":\"7587040568062230547\",\"content\":\"擎羊星和铃星会合在命宫，遇到白虎星，一定会遭受刑罚杀戮；官符星出现在吉利的星曜位置，流年的凶煞最怕遇到破军星；擎羊星和铃星依靠太岁的力量而行动。\"},{\"logicSentenceId\":\"7587040568062165011\",\"content\":\"忌星和暗曜同时落在命宫、身宫，就会容易生病且病情严重，身体虚弱瘦弱。\"},{\"logicSentenceId\":\"7587040568061837331\",\"content\":\"星曜处于庙旺状态时，还要观察生克的机变；命主位于强宫，仔细考察制约与转化的道理。\"},{\"logicSentenceId\":\"7587040568061657107\",\"content\":\"这些星宿分布在十二宫垣，定数在于三十六位，入庙就是吉兆，失度就是凶兆。\"},{\"logicSentenceId\":\"7587040568062050323\",\"content\":\"贪狼星位于亥位或子位，叫做泛水桃花；刑星与贪狼星相遇，叫做风流彩杖。\"},{\"logicSentenceId\":\"7587040568061722643\",\"content\":\"土星如果处在自己的宫垣，就好像可以移动一样；金星专门掌管财库，最害怕空亡。\"},{\"logicSentenceId\":\"7587040568061886483\",\"content\":\"各星宿处于吉利状态，即便遇到凶险情况也会吉利；各星宿处于凶险状态，即便遇到吉利情况也会凶险。\"},{\"logicSentenceId\":\"7587040568061935635\",\"content\":\"禄存星和文昌星拱卫命宫，其人既显贵又贤能；太阳星和太阴星夹着财帛宫，不是有权势就是富有；杀破狼居午宫交汇擎羊，能镇守边疆；刑星和囚星夹着印星，专管刑杖之事；善星和荫星朝向命主的命宫和官禄宫，会是仁慈的首领。\"},{\"logicSentenceId\":\"7587040568061984787\",\"content\":\"太阴星落在子宫，称为水澄桂萼，能获得清贵重要的职位，有忠诚进谏的才能。\"},{\"logicSentenceId\":\"7587040568062001171\",\"content\":\"紫微星和辅弼星同处一宫，一呼百诺，位居上品。\"},{\"logicSentenceId\":\"7587040568062197779\",\"content\":\"善福星守于空亡之位，会有去天竺的生活经历；左辅星和右弼星仅有一颗守在命宫，会是离开宗族的庶出之人。\"},{\"logicSentenceId\":\"7587040568062246931\",\"content\":\"病符星和官符星都会带来灾祸，奏书星、博士星和流禄星都会带来吉祥；力士星、将军星和青龙星会彰显人的权势。\"},{\"logicSentenceId\":\"7587040568061870099\",\"content\":\"紫微星和天府星，完全依靠左辅星、右弼星的辅助之功；七杀星和破军星，专门依靠擎羊星、铃星的凶恶之力。\"},{\"logicSentenceId\":\"7587040568061820947\",\"content\":\"在绝境中遇到生机，就像花朵一样不会凋谢。\"},{\"logicSentenceId\":\"7587040568062214163\",\"content\":\"七杀星临于身宫命宫，再加上恶煞星，命主必定死亡。\"},{\"logicSentenceId\":\"7587040568061673491\",\"content\":\"大体上以身命为福德的根本，再加上根源作为穷困与显达的凭借。\"},{\"logicSentenceId\":\"7587040568062279699\",\"content\":\"遇到七杀星和擎羊星，流年运势最为忌讳。\"},{\"logicSentenceId\":\"7587040568062148627\",\"content\":\"耗星处于禄位，会沿途乞讨为生；贪狼会聚旺宫，终生靠偷窃度日；七杀星处于绝地，寿命会像颜回一样夭折；贪狼星位于生乡，寿命会像彭祖一样长久。\"},{\"logicSentenceId\":\"7587040568061771795\",\"content\":\"如果不洞察其中的玄机，又忽略了其中的变化，那么对命理的造化就相差甚远了。\"},{\"logicSentenceId\":\"7587040568062066707\",\"content\":\"七杀和廉贞同宫，会有横尸路上的灾祸；破军星和暗𬺟星同宫，会有葬身水中的厄运。\"},{\"logicSentenceId\":\"7587040568062017555\",\"content\":\"文星和耗星处于寅卯方位，称作众水朝东。\"},{\"logicSentenceId\":\"7587040568062181395\",\"content\":\"凶星在父母宫、迁移宫相会，会使产妇遭受刑伤；刑杀星与廉贞星同在官禄宫，难逃枷锁之灾；官府星加刑杀星在迁移宫，背井离乡遭发配。\"},{\"logicSentenceId\":\"7587040568061739027\",\"content\":\"如果帝星在变动，那么众星就会随之运转；贪狼星落在空亡之位，那么财源就无法聚集。\"},{\"logicSentenceId\":\"7587040568061706259\",\"content\":\"观察紫微星盘里星宿的分布和交会，它就像是掌管着整个天体运行的样子，众多星宿最终组合形成了星垣。\"},{\"logicSentenceId\":\"7587040568061804563\",\"content\":\"命盘中的星宿落在了衰败之地，就算是有发达的时候，也只是表面繁华。\"},{\"logicSentenceId\":\"7587040568061902867\",\"content\":\"左辅星和右弼星夹着帝星是上品格局，桃花星侵犯主星是极其淫乱的。\"},{\"logicSentenceId\":\"7587040568061919251\",\"content\":\"君臣吉星相会，才能擅长治理国家；魁星和钺星一同出现，位居三公宰辅。\"},{\"logicSentenceId\":\"7587040568061624339\",\"content\":\"斗数极其玄妙精微，道理很好明白，虽然在百篇之中进行了设问解答，仍然有没说完的地方。\"},{\"logicSentenceId\":\"7587040568062132243\",\"content\":\"太阴星与文曲星会于夫妻宫，可在科举中及第，文章声名远扬；禄存星守于田宅和财帛宫，能积累大量财富；财帛和荫星位于迁移宫，可成为大商巨贾。\"},{\"logicSentenceId\":\"7587040568062296083\",\"content\":\"人生的荣华与屈辱，在命运周期中必有吉凶显现；处世孤独贫困，命数定是杂乱不顺；研习命理者到此境界，则知其中玄妙精微了。\"},{\"logicSentenceId\":\"7587040568061968403\",\"content\":\"太阳位于午位，称之为日丽中天，拥有专卖垄断的尊贵地位，富可敌国的财富。\"},{\"logicSentenceId\":\"7587040568061952019\",\"content\":\"尊贵的星曜落入尊贵的宫位，命主就会富贵双全；财星落入财帛的宫位，命主就会富足奢侈。\"},{\"logicSentenceId\":\"7587040568062115859\",\"content\":\"太阳星与文昌星在官禄宫相会，可在皇宫大殿中位列朝班，富贵圆满。\"},{\"logicSentenceId\":\"7587040568061788179\",\"content\":\"举例来说：禄星遭遇冲破，吉祥中暗藏凶险；天马星遇到空亡，一生劳碌奔波。\"},{\"logicSentenceId\":\"7587040568061689875\",\"content\":\"星辰有相互缠绕的情况，宫数也有各自的定数，必须明白它们生克的关键，一定要详细了解星辰得垣和失度的区别。\"},{\"logicSentenceId\":\"7587040568061853715\",\"content\":\"太阳和月亮最忌讳背离，禄星和天马最宜交错奔驰，倘若处于空亡之位，得失就最为关键，若遭遇衰败之地，得到扶持会有极大功效。\"},{\"logicSentenceId\":\"7587040568062083091\",\"content\":\"禄星处在奴仆宫位，即便有官职也会奔波劳碌；帝星遇到凶星，虽然获得吉利但行事不合正道。\"},{\"logicSentenceId\":\"7587040568062099475\",\"content\":\"帝星坐于金车之位，就称作金𬛼捧节；福星安于文曜之宿，就叫做玉袖天香。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":16803,"chapterOrder":2,"inChapterOrder":5,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158860421398566","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"125\",\"lineNum\":0,\"lineType\":10,\"content\":\"形性賦\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174059281514537","endPageId":"7330174059281514537","contentEncryptType":0,"translateContent":"","chapterId":"1jvzoopnqo0t6","dataSize":112,"chapterOrder":2,"inChapterOrder":6,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158860421414950","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"126\",\"lineNum\":0,\"lineType\":1,\"content\":\"原夫紫㣲帝座，生爲厚重之容；天府尊星，當主純和之體。\",\"logicSentenceId\":\"7587040568062312467\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"127\",\"lineNum\":0,\"lineType\":1,\"content\":\"金烏圓滿，玉兔清竒，天機為不長不短之姿，情懷好善。\",\"logicSentenceId\":\"7587040568062328851\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"128\",\"lineNum\":0,\"lineType\":1,\"content\":\"武曲乃至剛至毅之操，心性果决，天同肥滿，目秀清竒，𤎉貞眉寛口濶靣横，為人性暴，好忿，好争。\",\"logicSentenceId\":\"7587040568062345235\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"129\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼為善𢙣之星，入庙必應長聳，出垣必定頑嚚。\",\"logicSentenceId\":\"7587040568062361619\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"130\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門乃是非之曜，在廟敦厚温良，天相精神相貌持重，天梁𥡷重，心事玉潔氷淸。\",\"logicSentenceId\":\"7587040568062378003\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"131\",\"lineNum\":0,\"lineType\":1,\"content\":\"七殺如子路，暴虎馮河。\",\"logicSentenceId\":\"7587040568062394387\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"132\",\"lineNum\":0,\"lineType\":1,\"content\":\"火鈴似豫讓，吞炭装啞，暴虎馮河兮目大㐫狼，吞炭装啞\",\"logicSentenceId\":\"7587040568062410771\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"133\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174059281612841\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"134\",\"lineNum\":0,\"lineType\":1,\"content\":\"兮暗狼聲沉俊雅。\",\"logicSentenceId\":\"7587040568062410771\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"135\",\"lineNum\":0,\"lineType\":1,\"content\":\"文昌，眉淸目秀、磊落；文曲，口舌便侫，在廟定生異痣，失陷必有班痕。\",\"logicSentenceId\":\"7587040568062427155\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"136\",\"lineNum\":0,\"lineType\":1,\"content\":\"左輔右弼，温良規模，端莊高士。\",\"logicSentenceId\":\"7587040568062443539\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"137\",\"lineNum\":0,\"lineType\":1,\"content\":\"天魁天鉞，具足威儀；重合三台，則十全模範。\",\"logicSentenceId\":\"7587040568062459923\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"138\",\"lineNum\":0,\"lineType\":1,\"content\":\"擎羊陀羅，形醜貌麄，有矯詐躰態。\",\"logicSentenceId\":\"7587040568062476307\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"139\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍不仁，背厚眉寛，行坐腰斜、奸詐、好行驚險。\",\"logicSentenceId\":\"7587040568062492691\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"140\",\"lineNum\":0,\"lineType\":1,\"content\":\"性貌如春和藹，乃是禄存之情徳；情懷似火烽衝，此誠破耗之威權。\",\"logicSentenceId\":\"7587040568062509075\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"141\",\"lineNum\":0,\"lineType\":1,\"content\":\"星論廟旺，最怕空亡；殺落空亡，竟無威力。\",\"logicSentenceId\":\"7587040568062525459\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"142\",\"lineNum\":0,\"lineType\":1,\"content\":\"權禄克九竅之竒，耗刼散平生之福。\",\"logicSentenceId\":\"7587040568062541843\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"143\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄逢梁隂抱私財，益與他人；耗遇貪狼，凄滛情於井底，貪星入於馬垣，易善易悪，惡曜扶同善曜禀性不常。\",\"logicSentenceId\":\"7587040568062558227\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"144\",\"lineNum\":0,\"lineType\":1,\"content\":\"財居空亡，巴三覽四，文曲旺宫，聞一知十。\",\"logicSentenceId\":\"7587040768070516777\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"145\",\"lineNum\":0,\"lineType\":1,\"content\":\"暗合𤎉貞，為貪濫之曹吏；身命司数，寔奸盗之技児，猪屠之流；\",\"logicSentenceId\":\"7587040768070533161\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"146\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174059281678377\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"147\",\"lineNum\":0,\"lineType\":1,\"content\":\"善祿定是竒高之藝，細巧伶俐之人。\",\"logicSentenceId\":\"7587040768070533161\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"148\",\"lineNum\":0,\"lineType\":1,\"content\":\"男居生旺，最要得纁，女居死絶，專㸔福徳。\",\"logicSentenceId\":\"7587040768070549545\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"149\",\"lineNum\":0,\"lineType\":1,\"content\":\"命最嫌立於敗位，財源却怕逢空亡，機刑殺䕃狐星論，嗣續之宫，加惡星忌耗，不為竒特；陀忌耗囚之星，守父母之纒，决然破祖，刑傷兼之；童格冝相，根基要察。\",\"logicSentenceId\":\"7587040768070565929\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"150\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微肥滿，天府精神。\",\"logicSentenceId\":\"7587040768070582313\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"151\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄存禄主，也應厚重；日月曲相同梁機昌，皆為羙俊之姿，乃是清竒之格，上長下短，自秀眉清。\",\"logicSentenceId\":\"7587040768070598697\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"152\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼同武曲，形小聲高而量大；天同加陀忌，肥滿而目渺，擎羊身察遭傷，若遇火鈴巨暗，必生異病。\",\"logicSentenceId\":\"7587040768070615081\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"153\",\"lineNum\":0,\"lineType\":1,\"content\":\"又值耗殺，定主形醜貌麄。\",\"logicSentenceId\":\"7587040768070631465\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"154\",\"lineNum\":0,\"lineType\":1,\"content\":\"若居死絶之限，童子乳哺，徒劳其力，老者亦然夀終。\",\"logicSentenceId\":\"7587040768070647849\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"155\",\"lineNum\":0,\"lineType\":1,\"content\":\"此数中之綱領，乃為星緯之機關。\",\"logicSentenceId\":\"7587040768070664233\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"156\",\"lineNum\":0,\"lineType\":1,\"content\":\"玩味專精，以恭玄妙。\",\"logicSentenceId\":\"7587040768070680617\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"157\",\"lineNum\":0,\"lineType\":1,\"content\":\"限有高低，星尋\",\"logicSentenceId\":\"7587040768070697001\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"158\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174113597718539\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"159\",\"lineNum\":0,\"lineType\":1,\"content\":\"喜怒。\",\"logicSentenceId\":\"7587040768070697001\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"160\",\"lineNum\":0,\"lineType\":1,\"content\":\"假如運限駁雜，終有浮沉。\",\"logicSentenceId\":\"7587040768070713385\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"161\",\"lineNum\":0,\"lineType\":1,\"content\":\"如逢殺地，更要推詳；倘遇空亡，必湏細察。\",\"logicSentenceId\":\"7587040768070729769\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"162\",\"lineNum\":0,\"lineType\":1,\"content\":\"精研於此，不患不神。\",\"logicSentenceId\":\"7587040768070746153\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174059281514537","endPageId":"7330174113597718539","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587040568062525459\",\"content\":\"论星曜处于庙旺的状态，最怕落入空亡之位；杀星落入空亡之位，竟然就没有威力了。\"},{\"logicSentenceId\":\"7587040768070631465\",\"content\":\"又遇到耗星和杀星，必定会使相貌丑陋、外形粗笨。\"},{\"logicSentenceId\":\"7587040768070533161\",\"content\":\"与廉贞星暗合的，是贪婪无度的小吏；掌管身命之数的，实际上是有奸盗技艺的人，如屠夫之流；有善禄星的一定是技艺高超、心思细腻伶俐之人。\"},{\"logicSentenceId\":\"7587040568062328851\",\"content\":\"太阳星圆满，太阴星清奇不凡，天机星呈现不高不矮的姿态，性情善良。\"},{\"logicSentenceId\":\"7587040768070713385\",\"content\":\"假如运势驳杂，最终会有起伏。\"},{\"logicSentenceId\":\"7587040768070729769\",\"content\":\"若遇到有凶煞的境地，更要详细推断；倘若遇到空亡的情况，必须仔细考察。\"},{\"logicSentenceId\":\"7587040568062541843\",\"content\":\"权禄二星克伤九窍的奇异之处，耗星和劫星消散一生的福气。\"},{\"logicSentenceId\":\"7587040568062410771\",\"content\":\"火星、铃星像豫让一样吞炭装哑，徒手搏虎徒步过河时眼睛大而凶恶如狼，吞炭装哑时声音低沉而优雅如暗狼。\"},{\"logicSentenceId\":\"7587040768070615081\",\"content\":\"贪狼和武曲同宫，体型矮小，声音高亢，度量很大；天同加陀罗、忌星，体型肥胖，眼睛细小，擎羊守命，身体会遭受伤害，如果遇到火星、铃星、巨门、暗曜，一定会生怪病。\"},{\"logicSentenceId\":\"7587040568062394387\",\"content\":\"七杀星如同子路，空手打虎，徒步渡河。\"},{\"logicSentenceId\":\"7587040768070582313\",\"content\":\"紫微星饱满，天府星精神饱满。\"},{\"logicSentenceId\":\"7587040568062378003\",\"content\":\"巨门是是非的星曜，在庙旺之地则为人敦厚温良，天相星精神相貌持重，天梁星稳重，内心纯净高洁。\"},{\"logicSentenceId\":\"7587040568062345235\",\"content\":\"武曲星具有极为刚硬坚毅的操守，心性果断决绝；天同星对应的人身材丰满，眼睛清秀不凡；廉贞星对应的人眉毛宽阔、嘴巴宽大、脸庞横阔，为人性情暴躁，容易愤怒、喜好争斗。\"},{\"logicSentenceId\":\"7587040568062459923\",\"content\":\"天魁和天钺，具备威严仪表；若与三台星重合，便是十全十美的典范。\"},{\"logicSentenceId\":\"7587040768070565929\",\"content\":\"命最忌讳处于衰败之位，财源则怕遭遇空亡，以机、刑、杀、荫、狐星来论断，子嗣宫，若加上恶星、忌星、耗星，就不算奇特；陀罗、忌星、耗星、囚星守于父母宫位，必定会破败祖业，还会有刑伤之事；孩童的命格适宜仔细相看，根基需要认真考察。\"},{\"logicSentenceId\":\"7587040568062427155\",\"content\":\"文昌星对应的人，眉清目秀、光明磊落；文曲星对应的人，能言善辩、花言巧语，处于旺庙状态时脸上定会生出奇异的痣，处于失陷状态时脸上必定会有斑痕。\"},{\"logicSentenceId\":\"7587040768070549545\",\"content\":\"男命处于生旺的宫位，最需要得到吉运助力；女命处于死绝的宫位，专看福德宫。\"},{\"logicSentenceId\":\"7587040568062443539\",\"content\":\"左辅和右弼二星，展现出温和善良、有风度气质，是相貌端庄的高尚之士。\"},{\"logicSentenceId\":\"7587040768070647849\",\"content\":\"如果处于死绝的界限，对于幼儿来说，即便悉心哺育也是白费力气，老者同样寿终正寝。\"},{\"logicSentenceId\":\"7587040768070664233\",\"content\":\"这些是命理中的纲领，也是星象推算的关键要点。\"},{\"logicSentenceId\":\"7587040568062476307\",\"content\":\"擎羊陀罗，容貌丑陋、长相粗犷，有狡黠欺诈的神态举止。\"},{\"logicSentenceId\":\"7587040768070746153\",\"content\":\"如果能在这方面精心钻研，不必担心不能精通神妙之理。\"},{\"logicSentenceId\":\"7587040568062509075\",\"content\":\"性情相貌如同春天一般和蔼，这是禄存星的性情品德；情怀气度如同火焰烽烟般冲腾，这确实是破耗星的威严权势。\"},{\"logicSentenceId\":\"7587040768070680617\",\"content\":\"专心细致地琢磨玩味，以恭敬之心领悟其中的玄妙之处。\"},{\"logicSentenceId\":\"7587040568062558227\",\"content\":\"禄存遇天梁、太阴藏有私财，用来帮助他人；破耗遇贪狼，沉溺情欲如坠深井，贪狼星进入天马宫，善恶不定，凶星与吉星会合，本性多变。\"},{\"logicSentenceId\":\"7587040768070697001\",\"content\":\"大运有高有低，星曜有喜有怒。\"},{\"logicSentenceId\":\"7587040768070598697\",\"content\":\"禄存和禄主星，也应稳重厚实；日、月、曲星、相星、同星、梁星、机星、昌星等，都有着俊美之貌，这是清奇的命格，身形上半身长下半身短，自然会眉清目秀。\"},{\"logicSentenceId\":\"7587040568062361619\",\"content\":\"贪狼星是象征善恶的星曜，当它处于庙旺状态时，命主必定身形高大挺拔；若落入落陷的宫位，则命主必然愚顽奸诈。\"},{\"logicSentenceId\":\"7587040768070516777\",\"content\":\"财星落在空亡的宫位，做事不专注，挑三拣四；文曲星处于旺宫，人能闻一知十。\"},{\"logicSentenceId\":\"7587040568062492691\",\"content\":\"破军星代表的人缺乏仁爱之心，背部宽厚、眉毛宽阔，行走和坐立时腰是歪斜的，为人奸诈，喜欢做惊险刺激的事情。\"},{\"logicSentenceId\":\"7587040568062312467\",\"content\":\"原来，紫微帝星照命的人，生来就有沉稳厚重的容貌；天府尊星临身的人，应当具有温和纯善的气质。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":12710,"chapterOrder":2,"inChapterOrder":7,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158860421431334","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"163\",\"lineNum\":0,\"lineType\":10,\"content\":\"星垣論\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174113597718539","endPageId":"7330174113597718539","contentEncryptType":0,"translateContent":"","chapterId":"1jvzoopnqo0t6","dataSize":112,"chapterOrder":2,"inChapterOrder":8,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158860421447718","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"164\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫㣲帝座，以輔弼為佐貳，作数中之主星，乃有用之源流。\",\"logicSentenceId\":\"7587040768070762537\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"165\",\"lineNum\":0,\"lineType\":1,\"content\":\"是以南北二斗，集而成数，為萬物之靈。\",\"logicSentenceId\":\"7587040768070778921\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"166\",\"lineNum\":0,\"lineType\":1,\"content\":\"盖以水淘溶，則隂陽既濟，水盛陽傷，火盛隂滅，二者不可偏廢，故得其中者，斯為羙矣。\",\"logicSentenceId\":\"7587040768070795305\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"167\",\"lineNum\":0,\"lineType\":1,\"content\":\"寅乃木之垣，乃三陽交泰之時，草木萌芽之所，至於卯位，其木愈旺矣。\",\"logicSentenceId\":\"7587040768070811689\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"168\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼天機是庙樂，故得天相水到寅爲之旺相；巨門水得卯為之䟽通。\",\"logicSentenceId\":\"7587040768070828073\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"169\",\"lineNum\":0,\"lineType\":1,\"content\":\"木乃土栽培，加以水之澆灌三方，更得文曲水、破軍水相會尤妙，又加禄存土，極羙矣。\",\"logicSentenceId\":\"7587040768070844457\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"170\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨門水到\",\"logicSentenceId\":\"7587040768070860841\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"171\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174113597833227\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"172\",\"lineNum\":0,\"lineType\":1,\"content\":\"丑，天梁土到未，陀羅金到於四墓之所，苟或得擎羊金相㑹，以土為金墓，則金通不凝。\",\"logicSentenceId\":\"7587040768070860841\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"173\",\"lineNum\":0,\"lineType\":1,\"content\":\"加以天府土天同金以生之，是為金趂𡈽肥順其徳以生成，未巳午乃火位，巳為水土所絶之地更午垣之火餘，氣流於巳，水則倒流，火氣逆熖，必歸于巳。\",\"logicSentenceId\":\"7587040768070877225\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"174\",\"lineNum\":0,\"lineType\":1,\"content\":\"午属火德，能生於巳絶之土，所以𤎉貞木居焉。\",\"logicSentenceId\":\"7587040768070893609\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"175\",\"lineNum\":0,\"lineType\":1,\"content\":\"至於午火旺照離。\",\"logicSentenceId\":\"7587040768070909993\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"176\",\"lineNum\":0,\"lineType\":1,\"content\":\"明，洞徹表裏，而文曲水入庙，若㑹紫府，則魁星拱斗，加以天機木，貪狼火，謂之變景，愈加竒特。\",\"logicSentenceId\":\"7587040768070926377\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"177\",\"lineNum\":0,\"lineType\":1,\"content\":\"申酉金乃西方太白之氣，武居申而好生，擎羊在酉而用殺，加以巨門禄存陀羅而𦔳之愈急，湏得逆行，逢善化悪，是為妙用。\",\"logicSentenceId\":\"7587040768070942761\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"178\",\"lineNum\":0,\"lineType\":1,\"content\":\"亥水属文曲破軍之庙地，乃文明清高之士，萬里𣲖源之絜，如大川之澤，不\",\"logicSentenceId\":\"7587040768070959145\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"179\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174113597931531\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"180\",\"lineNum\":0,\"lineType\":1,\"content\":\"爲焦枯；居於亥位，將入天河，是故為妙。\",\"logicSentenceId\":\"7587040768070959145\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"181\",\"lineNum\":0,\"lineType\":1,\"content\":\"破軍水於子旺之鄉，如巨海之浪淜洶湧，可遠覌而不可近𠋣，破軍是以居焉。\",\"logicSentenceId\":\"7587040768070975529\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"182\",\"lineNum\":0,\"lineType\":1,\"content\":\"若四墓之尅，充其㳽漫，必得武曲之金，使其源流不絶，方為妙矣。\",\"logicSentenceId\":\"7587040768070991913\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"183\",\"lineNum\":0,\"lineType\":1,\"content\":\"其餘諸星，以身命推之，無施不可，至玄至妙者矣。\",\"logicSentenceId\":\"7587040768071008297\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174113597718539","endPageId":"7330174113597931531","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587040768070828073\",\"content\":\"贪狼星和天机星处于庙旺喜乐的位置，所以天相星所代表的水到寅位就呈现旺相的状态；巨门星所代表的水到卯位就能得到疏通。\"},{\"logicSentenceId\":\"7587040768070942761\",\"content\":\"申酉金是西方太白金星的气息，武曲星位于申位喜好生发，擎羊星在酉位会施展杀伐，再加上巨门、禄存、陀罗助长作用更加急迫，必须逆行，遇到善就能化解恶，这就是神奇的作用。\"},{\"logicSentenceId\":\"7587040768070778921\",\"content\":\"因此南北二斗，聚集而成命数，成为万物之灵。\"},{\"logicSentenceId\":\"7587040768070877225\",\"content\":\"再加上天府土和天同金来相生，这就是金趁土肥，顺应其德来生成，未、巳、午是火的方位，巳是水和土断绝的地方，再加上午宫的余火，气流到巳，水就会倒流，火气逆向燃烧，必定汇聚到巳。\"},{\"logicSentenceId\":\"7587040768070844457\",\"content\":\"木需要土来栽培，再加上水从三方进行浇灌，若能让文曲水、破军水汇合就更加美妙了，若再有禄存土，那就极其美好了。\"},{\"logicSentenceId\":\"7587040768070991913\",\"content\":\"如果四墓之克，充塞泛滥，必须要有武曲之金，使其持续流动而不枯竭，才是妙处。\"},{\"logicSentenceId\":\"7587040768070860841\",\"content\":\"巨门水到丑位，天梁土到未位，陀罗金到四个墓库的位置，如果能与擎羊金相会，以土作为金的墓库，那么金气通畅而不会凝聚。\"},{\"logicSentenceId\":\"7587040768070926377\",\"content\":\"明亮，透彻内外，而文曲水星入庙，如果与紫府星相会，那么魁星拱卫北斗，再加上天机木星、贪狼火星，就叫做变景，更加奇特。\"},{\"logicSentenceId\":\"7587040768070762537\",\"content\":\"紫微帝座，以左辅星和右弼星作为辅佐，作为数术中的主星，乃是发挥作用的根源。\"},{\"logicSentenceId\":\"7587040768070811689\",\"content\":\"寅位是木的宫垣所在，代表着三阳交泰的时候，是草木开始萌芽的地方，等到了卯位，木就更加旺盛了。\"},{\"logicSentenceId\":\"7587040768070893609\",\"content\":\"午位属火德，能生养在巳位绝地的土，所以廉贞木居于此。\"},{\"logicSentenceId\":\"7587040768070959145\",\"content\":\"亥水属于文曲星、破军星的庙地，象征着文明清高的士人，源头来自万里之外的纯净之水，如同大川湖泽，不会干涸枯竭；居于亥位，即将流入天河，所以是妙处。\"},{\"logicSentenceId\":\"7587040768071008297\",\"content\":\"其余的星曜，根据身宫和命宫来推断，没有不能应用的，真是极其玄妙啊。\"},{\"logicSentenceId\":\"7587040768070795305\",\"content\":\"因为水经过淘洗溶解，就能使阴阳协调平衡；水势过盛会损伤阳气，火势过旺会耗灭阴气，两者不能偏废任何一方，所以能够达到中和适度的状态，才是美好的。\"},{\"logicSentenceId\":\"7587040768070909993\",\"content\":\"至于午火旺盛，照耀着离位。\"},{\"logicSentenceId\":\"7587040768070975529\",\"content\":\"破军水在子位旺盛之地，就像大海的波浪汹涌澎湃，可以远远观看但不能靠近依靠，所以破军星居于此处。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":7491,"chapterOrder":2,"inChapterOrder":9,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158860421464102","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"184\",\"lineNum\":0,\"lineType\":10,\"content\":\"斗数凖繩\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174113597931531","endPageId":"7330174113597931531","contentEncryptType":0,"translateContent":"","chapterId":"1jvzoopnqo0t6","dataSize":115,"chapterOrder":2,"inChapterOrder":10,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158860421480486","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"185\",\"lineNum\":0,\"lineType\":1,\"content\":\"命居生旺，定冨貴各有其冝；身坐空亡，論荣枯專求其要。\",\"logicSentenceId\":\"7587040768071024681\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"186\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微帝座在南極，不能施功；天府令星在南地，専能為福。\",\"logicSentenceId\":\"7587040768071041065\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"187\",\"lineNum\":0,\"lineType\":1,\"content\":\"天機七殺同宫，也善三分；太隂火鈴同位，反成十𢙣。\",\"logicSentenceId\":\"7587040768071057449\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"188\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼為善宿，入廟不㐫；巨門為𢙣曜，得垣尢羙。\",\"logicSentenceId\":\"7587040768071073833\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"189\",\"lineNum\":0,\"lineType\":1,\"content\":\"諸㐫在𦂳要之鄉，最冝制，擎羊在身命之位，却受孤单。\",\"logicSentenceId\":\"7587040768071090217\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"190\",\"lineNum\":0,\"lineType\":1,\"content\":\"若見殺星倒限最㐫，福䕃臨之，\",\"logicSentenceId\":\"7587040768071106601\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"191\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174195852247051\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"192\",\"lineNum\":0,\"lineType\":1,\"content\":\"庶幾可解。\",\"logicSentenceId\":\"7587040768071106601\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"193\",\"lineNum\":0,\"lineType\":1,\"content\":\"大抵在人之機變，更加作意之推詳。\",\"logicSentenceId\":\"7587040768071122985\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"194\",\"lineNum\":0,\"lineType\":1,\"content\":\"辨生尅制化以定窮通；看好𢙣正偏以言禍福。\",\"logicSentenceId\":\"7587040768071139369\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"195\",\"lineNum\":0,\"lineType\":1,\"content\":\"官星居於福地，近貴营財；福星居於官宫，却成無成。\",\"logicSentenceId\":\"7587040768071155753\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"196\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命得星為要，限度遇吉為荣。\",\"logicSentenceId\":\"7587040768071172137\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"197\",\"lineNum\":0,\"lineType\":1,\"content\":\"若言子媳有無，專在擎羊。\",\"logicSentenceId\":\"7587040768071188521\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"198\",\"lineNum\":0,\"lineType\":1,\"content\":\"耗殺逢之則害，妻妾亦然。\",\"logicSentenceId\":\"7587040768071204905\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"199\",\"lineNum\":0,\"lineType\":1,\"content\":\"相貌逢㐫，必𢃄破相；疾厄逢忌，定有尫羸。\",\"logicSentenceId\":\"7587040768071221289\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"200\",\"lineNum\":0,\"lineType\":1,\"content\":\"湏言定数以求玄，更在同年之相合。\",\"logicSentenceId\":\"7587040768071237673\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"201\",\"lineNum\":0,\"lineType\":1,\"content\":\"緫為綱頌，用作凖繩。\",\"logicSentenceId\":\"7587040768071254057\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174113597931531","endPageId":"7330174195852247051","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587040768071188521\",\"content\":\"如果要谈论子媳的有无，主要看擎羊星。\"},{\"logicSentenceId\":\"7587040768071221289\",\"content\":\"相貌宫遇到凶星，必定会有破相；疾厄宫遇到忌星，身体一定会瘦弱多病。\"},{\"logicSentenceId\":\"7587040768071139369\",\"content\":\"分辨星宿之间的生克制化关系来判断一个人的穷困与亨通；观察星曜的好坏正偏来谈论祸福。\"},{\"logicSentenceId\":\"7587040768071024681\",\"content\":\"命宫落在生旺之地，能确定富贵各有适宜的情况；身宫落在空亡之位，论兴衰要专门探求其中关键。\"},{\"logicSentenceId\":\"7587040768071204905\",\"content\":\"遇到耗星和杀星就会有祸害，妻妾方面也是如此。\"},{\"logicSentenceId\":\"7587040768071155753\",\"content\":\"官星处在福泽之地，能亲近权贵经营财富；福星处在官禄之宫，却会一事无成。\"},{\"logicSentenceId\":\"7587040768071057449\",\"content\":\"天机星和七杀星处在同一宫位，也有三分好处；太阴星与火星、铃星处在同一位置，反而会形成极大的恶象。\"},{\"logicSentenceId\":\"7587040768071172137\",\"content\":\"命宫和身宫有吉星落入是非常关键的，大运和流年遇到吉利的星曜则会有荣耀顺遂的运势。\"},{\"logicSentenceId\":\"7587040768071122985\",\"content\":\"大体上在于人的随机应变，还要更加用心地去推断详察。\"},{\"logicSentenceId\":\"7587040768071237673\",\"content\":\"需要谈论定数来探究其中的玄妙，又要结合同年命盘来综合判断。\"},{\"logicSentenceId\":\"7587040768071254057\",\"content\":\"将这些内容总结为纲领性的颂词，作为判断的准则。\"},{\"logicSentenceId\":\"7587040768071106601\",\"content\":\"如果遇到杀星运转到不利的界限最为凶险，有福气荫庇降临，或许可以化解。\"},{\"logicSentenceId\":\"7587040768071041065\",\"content\":\"紫微帝座处在南极的位置，无法施展功效；天府令星处在南方地域，专门能够带来福泽。\"},{\"logicSentenceId\":\"7587040768071073833\",\"content\":\"贪狼是善星，入庙就不会有凶险；巨门是恶星，得垣则尤为美好。\"},{\"logicSentenceId\":\"7587040768071090217\",\"content\":\"各种凶星在重要的宫位，最适宜被克制；擎羊星位于身宫或命宫的位置，命主就会遭受孤单之苦。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":5373,"chapterOrder":2,"inChapterOrder":11,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158860421496870","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"202\",\"lineNum\":0,\"lineType\":10,\"content\":\"斗数發㣲論\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174195852247051","endPageId":"7330174195852247051","contentEncryptType":0,"translateContent":"","chapterId":"1jvzoopnqo0t6","dataSize":118,"chapterOrder":2,"inChapterOrder":12,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158860421513254","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"203\",\"lineNum\":0,\"lineType\":2,\"content\":\"白玉\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"204\",\"lineNum\":0,\"lineType\":1,\"content\":\"蟾先生曰：覌天斗数，與五星不同。\",\"logicSentenceId\":\"7587040768071270441\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"205\",\"lineNum\":0,\"lineType\":1,\"content\":\"按此星辰與諸術大異。\",\"logicSentenceId\":\"7587040768071286825\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"206\",\"lineNum\":0,\"lineType\":1,\"content\":\"四正吉星定為貴，三方殺拱少為竒。\",\"logicSentenceId\":\"7587040768071303209\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"207\",\"lineNum\":0,\"lineType\":1,\"content\":\"對照兮詳㐫詳吉，合照兮覌賤視荣。\",\"logicSentenceId\":\"7587040768071319593\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"208\",\"lineNum\":0,\"lineType\":1,\"content\":\"吉星入垣則為吉，㐫星失地則為㐫。\",\"logicSentenceId\":\"7587040768071335977\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"209\",\"lineNum\":0,\"lineType\":1,\"content\":\"命逢紫\",\"logicSentenceId\":\"7587040768071352361\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"210\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174195852361739\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"211\",\"lineNum\":0,\"lineType\":1,\"content\":\"府，非特壽而且荣；身遇殺星，不但貧而且賤。\",\"logicSentenceId\":\"7587040768071352361\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"212\",\"lineNum\":0,\"lineType\":1,\"content\":\"左右會於紫府，極品之尊；科權陷於㐫郷，功名𬧙蹬；行限逢乎弱地，未必為災；立命會在強宫，必能降福。\",\"logicSentenceId\":\"7587040768071368745\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"213\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀七殺，限運莫逢，逢之定有刑傷；\",\"logicSentenceId\":\"7587040768071385129\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"214\",\"lineNum\":0,\"lineType\":2,\"content\":\"刼空傷使，在内，合断。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"215\",\"lineNum\":0,\"lineType\":1,\"content\":\"天哭䘮門，流年莫遇，遇之寔防破害。\",\"logicSentenceId\":\"7587040768071385129\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"216\",\"lineNum\":0,\"lineType\":1,\"content\":\"南斗主限必生男，北斗加臨，先得女。\",\"logicSentenceId\":\"7587040768071401513\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"217\",\"lineNum\":0,\"lineType\":1,\"content\":\"科星居於陷地，燈火辛勤；昌曲在㐫郷，林泉冷淡，奸謀頻設。\",\"logicSentenceId\":\"7587040768071417897\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"218\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫㣲愧遇破軍；滛奔大行，紅鵉羞逢貪宿。\",\"logicSentenceId\":\"7587040768071434281\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"219\",\"lineNum\":0,\"lineType\":1,\"content\":\"命身相尅，則心亂而不閑；玄媪\",\"logicSentenceId\":\"7587040768071450665\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"220\",\"lineNum\":0,\"lineType\":2,\"content\":\"即天姚星。\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"221\",\"lineNum\":0,\"lineType\":1,\"content\":\"三宫，則邪滛而躭酒。\",\"logicSentenceId\":\"7587040768071450665\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"222\",\"lineNum\":0,\"lineType\":1,\"content\":\"殺臨三位，定然妻子不和；巨到二宫，必是兄弟無義；刑殺守子宮，子難奉老；諸㐫照財帛，聚散無常。\",\"logicSentenceId\":\"7587040768071467049\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"223\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊陀疾厄，眼目昏肓；火鈴到遷移，長途寂寞。\",\"logicSentenceId\":\"7587040768071483433\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"224\",\"lineNum\":0,\"lineType\":1,\"content\":\"尊星列賤位，主人多劳；悪星\",\"logicSentenceId\":\"7587040768071499817\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"225\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174249518252051\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"226\",\"lineNum\":0,\"lineType\":1,\"content\":\"應八宫，奴僕有𦔳。\",\"logicSentenceId\":\"7587040768071499817\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"227\",\"lineNum\":0,\"lineType\":1,\"content\":\"官禄遇紫府，富而且貴；田宅遇破軍，先破後成；福徳遇空刼，奔走無力；相貌加刑殺，刑尅難免。\",\"logicSentenceId\":\"7587040768071516201\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"228\",\"lineNum\":0,\"lineType\":1,\"content\":\"後學者執此推詳，萬無一失。\",\"logicSentenceId\":\"7587040768071532585\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174195852247051","endPageId":"7330174249518252051","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587040768071368745\",\"content\":\"左辅星和右弼星会集于紫微星和天府星所在宫位，会有极尊贵的地位；科星和权星陷入凶煞之地，功名之路会坎坷不顺；行运走到衰弱之地，不一定会有灾祸；命宫会合于强宫，必定能降下福运。\"},{\"logicSentenceId\":\"7587040768071450665\",\"content\":\"命宫与身宫相克，就会心绪烦乱不得安宁；玄媪星处于三宫，就会行为邪淫且沉迷于酒。\"},{\"logicSentenceId\":\"7587040768071434281\",\"content\":\"紫微星忌惮遇到破军星；淫乱私奔之事大肆盛行，红鸾星羞于遇到贪狼星。\"},{\"logicSentenceId\":\"7587040768071499817\",\"content\":\"尊贵的星曜落在了卑贱的宫位，代表命主会十分劳碌；凶恶的星曜应于第八宫，代表能得到奴仆的帮助。\"},{\"logicSentenceId\":\"7587040768071352361\",\"content\":\"命宫中有紫微星、天府星，不但长寿而且荣耀；身宫中有杀星，不但贫穷而且低贱。\"},{\"logicSentenceId\":\"7587040768071401513\",\"content\":\"行运走到南斗星宿对应的宫限时一定会生男孩，走到北斗星宿对应的宫限时，会先生女孩。\"},{\"logicSentenceId\":\"7587040768071286825\",\"content\":\"这种星辰推演方法与其它术数差异很大。\"},{\"logicSentenceId\":\"7587040768071532585\",\"content\":\"后来学习的人依据这些内容推究详察，就能万无一失。\"},{\"logicSentenceId\":\"7587040768071335977\",\"content\":\"吉星落入合适的宫位就是吉利的象征，凶星落入不利的宫位就是凶险的预兆。\"},{\"logicSentenceId\":\"7587040768071467049\",\"content\":\"杀星降临到三宫，必定夫妻不和；巨门星进入二宫，必定是兄弟无情；刑杀星守护子女宫，子孙难以养老；各种凶星照射财帛宫，财富聚散无常。\"},{\"logicSentenceId\":\"7587040768071417897\",\"content\":\"科星处在陷地，辛勤挑灯苦读；文昌、文曲星位于凶乡，隐居山林生活冷清，频繁设下奸谋。\"},{\"logicSentenceId\":\"7587040768071303209\",\"content\":\"命盘中的四正方位有吉星坐守，命主一定会富贵；三方方位有煞星会照，命主的运势就很少会有奇佳的时候。\"},{\"logicSentenceId\":\"7587040768071270441\",\"content\":\"蟾先生说：观察天斗数，与五星不同。\"},{\"logicSentenceId\":\"7587040768071516201\",\"content\":\"官禄宫遇到紫微星、天府星，会富有而且尊贵；田宅宫遇到破军星，先破败后成功；福德宫遇到天空星、地劫星，奔波劳碌却力不从心；相貌宫加刑杀星，刑克难以避免。\"},{\"logicSentenceId\":\"7587040768071483433\",\"content\":\"擎羊星和陀罗星落在疾厄宫，会导致眼睛昏花失明；火星和铃星落在迁移宫，会使人在长途旅行中感到寂寞。\"},{\"logicSentenceId\":\"7587040768071385129\",\"content\":\"羊陀和七杀星，在限运中不要遇到，遇到必定会有刑伤；天哭星和丧门星，在流年中不要碰上，碰上确实要防备破财、伤害。\"},{\"logicSentenceId\":\"7587040768071319593\",\"content\":\"星曜相互对照的时候，要详细分析其凶吉；星曜相互合照的时候，要仔细观察其贵贱荣辱。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":7551,"chapterOrder":2,"inChapterOrder":13,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158860421529638","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"229\",\"lineNum\":0,\"lineType\":10,\"content\":\"重補斗数彀率\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174249518252051","endPageId":"7330174249518252051","contentEncryptType":0,"translateContent":"","chapterId":"1jvzoopnqo0t6","dataSize":121,"chapterOrder":2,"inChapterOrder":14,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158860421546022","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"230\",\"lineNum\":0,\"lineType\":1,\"content\":\"諸星吉多逢㐫也吉，諸悪星多逢吉也㐫。\",\"logicSentenceId\":\"7587040768071548969\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"231\",\"lineNum\":0,\"lineType\":1,\"content\":\"星更緾度，数分定局，重在看星得垣受制，方可論人禍福竆通。\",\"logicSentenceId\":\"7587040768071565353\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"232\",\"lineNum\":0,\"lineType\":1,\"content\":\"大槩以身命為禍福之柄，以根源為竆通之機。\",\"logicSentenceId\":\"7587040768071581737\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"233\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微在命，輔弼同垣，其貴必矣。\",\"logicSentenceId\":\"7587040768071598121\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"234\",\"lineNum\":0,\"lineType\":1,\"content\":\"財印夾命，日月夾財，其冨何疑。\",\"logicSentenceId\":\"7587040768071614505\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"235\",\"lineNum\":0,\"lineType\":1,\"content\":\"䕃福臨不怕㐫冲；日月㑹不如合照。\",\"logicSentenceId\":\"7587040768071630889\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"236\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼居子，乃為泛水桃花；天刑遇貪，必主風流刑杖。\",\"logicSentenceId\":\"7587040768071647273\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"237\",\"lineNum\":0,\"lineType\":1,\"content\":\"紫微坐命庫，則曰金舉捧御輦；臨官安文曜，號為衣錦惹\",\"logicSentenceId\":\"7587040768071663657\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"238\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174249518383123\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"239\",\"lineNum\":0,\"lineType\":1,\"content\":\"天杳。\",\"logicSentenceId\":\"7587040768071663657\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"240\",\"lineNum\":0,\"lineType\":1,\"content\":\"太隂合文曲於妻宮，翰林清異；太陽會文昌於官禄，金殿傳臚。\",\"logicSentenceId\":\"7587040768071680041\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"241\",\"lineNum\":0,\"lineType\":1,\"content\":\"禄合守田財，為爛糓堆金；財䕃居遷移，為高商豪客。\",\"logicSentenceId\":\"7587040768071696425\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"242\",\"lineNum\":0,\"lineType\":1,\"content\":\"耗居敗地，沿途丐求；貪㑹旺宮，終身𠂦竊；殺居絶地，生成三十二之顔回，日在旺宮，可學八百年之彭祖。\",\"logicSentenceId\":\"7587040768071712809\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"243\",\"lineNum\":0,\"lineType\":1,\"content\":\"巨暗同垣於身命，疾厄羸瘦其軀；㐫星交會於相貌遷移，傷刑其面。\",\"logicSentenceId\":\"7587040768071729193\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"244\",\"lineNum\":0,\"lineType\":1,\"content\":\"大耗㑹𤎉貞於官禄，枷杻囚徒；官符㑹刑殺於遷移，離卿逺配；七殺臨於陷地，流羊必見死亡。\",\"logicSentenceId\":\"7587040768071745577\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"245\",\"lineNum\":0,\"lineType\":1,\"content\":\"耗殺忌逢破軍，火鈴嫌逢太歳。\",\"logicSentenceId\":\"7587040768071761961\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"246\",\"lineNum\":0,\"lineType\":1,\"content\":\"奏書愽士，並官禄以長乎吉祥；力士将軍與靑龍以顯其威福。\",\"logicSentenceId\":\"7587040768071778345\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"247\",\"lineNum\":0,\"lineType\":1,\"content\":\"童子限弱，水上浮泡；老人限衰，風中燃燭。\",\"logicSentenceId\":\"7587040768071794729\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"248\",\"lineNum\":0,\"lineType\":1,\"content\":\"遇殺必驚，流年最緊。\",\"logicSentenceId\":\"7587040768071811113\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"249\",\"lineNum\":0,\"lineType\":1,\"content\":\"人生發逹，限元最怕浮沉，一世沌澶，命限逢乎駁雜。\",\"logicSentenceId\":\"7587040768071827497\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"250\",\"lineNum\":0,\"lineType\":1,\"content\":\"論而\",\"logicSentenceId\":\"7587040768071843881\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"251\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174249518481427\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"252\",\"lineNum\":0,\"lineType\":1,\"content\":\"至此，𠃔矣玄微。\",\"logicSentenceId\":\"7587040768071843881\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174249518252051","endPageId":"7330174249518481427","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587040768071729193\",\"content\":\"巨门星和暗曜在命宫、身宫同处一垣，会因疾病而身体瘦弱；凶星在相貌宫和迁移宫交会时，面部会受到损伤。\"},{\"logicSentenceId\":\"7587040768071581737\",\"content\":\"大体上将身宫和命宫作为祸福的关键，将星曜的根源作为命运好坏、境遇顺逆的契机。\"},{\"logicSentenceId\":\"7587040768071712809\",\"content\":\"耗星居于衰败之地，就会沿途乞讨；贪狼星居于旺宫，就会终身偷窃；七杀星居于绝地，就会像三十二岁的颜回一样早夭，太阳星处于旺盛之宫，能像活了八百年的彭祖那样长寿。\"},{\"logicSentenceId\":\"7587040768071811113\",\"content\":\"遇到煞星必定会惊恐，流年运势最为要紧。\"},{\"logicSentenceId\":\"7587040768071663657\",\"content\":\"紫微星坐命库，就叫做金举捧御辇；临官位安文曜，就叫做衣锦惹天杳。\"},{\"logicSentenceId\":\"7587040768071761961\",\"content\":\"大耗、七杀、忌星忌讳遇到破军星，火星、铃星忌讳遇到太岁星。\"},{\"logicSentenceId\":\"7587040768071680041\",\"content\":\"太阴星与文曲星在夫妻宫相会，主本人能在翰林院任职，声誉清贵；太阳星与文昌星在官禄宫会合，命主会在科举殿试中传名高中。\"},{\"logicSentenceId\":\"7587040768071565353\",\"content\":\"星辰运行的位置度数，用数理来确定格局，关键是看星辰是否处在合适的位置，是否受到克制，才能论定人的祸福、穷通。\"},{\"logicSentenceId\":\"7587040768071598121\",\"content\":\"紫微星落在命宫，左辅星和右弼星也在同一宫位，这样的人一定会显贵。\"},{\"logicSentenceId\":\"7587040768071696425\",\"content\":\"禄存、化禄同守田宅、财帛宫，主家业兴旺，谷满仓，金满箱；财星和荫星落在迁移宫，预示着会成为富商巨贾。\"},{\"logicSentenceId\":\"7587040768071827497\",\"content\":\"人生若要发达，最怕大运起伏不定；一辈子混沌不清，是因为命运遭遇了诸多驳杂不顺。\"},{\"logicSentenceId\":\"7587040768071647273\",\"content\":\"贪狼星位于子宫，便是泛水桃花格局；天刑星与贪狼星相遇，必定预示着会因风流韵事而遭受刑罚。\"},{\"logicSentenceId\":\"7587040768071843881\",\"content\":\"论述到这里，确实是深奥微妙。\"},{\"logicSentenceId\":\"7587040768071778345\",\"content\":\"奏书星和博士星与官禄宫相会，能长久带来吉祥；力士星、将军星和青龙星相聚，则能彰显威福。\"},{\"logicSentenceId\":\"7587040768071614505\",\"content\":\"财星和印星夹着命宫，太阳星和太阴星夹着财帛宫，这样的人富有是毫无疑问的。\"},{\"logicSentenceId\":\"7587040768071794729\",\"content\":\"童子行运衰弱时，就像水上的浮泡；老人行运衰败时，如同风中的蜡烛。\"},{\"logicSentenceId\":\"7587040768071630889\",\"content\":\"荫星、福星降临不怕凶星冲克；日月相会不如日月同照。\"},{\"logicSentenceId\":\"7587040768071548969\",\"content\":\"吉星多的话，遇到凶星也会吉利；恶星多的话，遇到吉星也会凶险。\"},{\"logicSentenceId\":\"7587040768071745577\",\"content\":\"大耗星与廉贞星在官禄宫相会，成为戴枷锁的囚徒；官符星和刑杀星会合在迁移宫，会远离家乡被发配；七杀星临陷地，有流羊星必然会有死亡之事。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":7591,"chapterOrder":2,"inChapterOrder":15,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008437299","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"253\",\"lineNum\":0,\"lineType\":10,\"content\":\"増補大微賦\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174249518481427","endPageId":"7330174249518481427","contentEncryptType":0,"translateContent":"","chapterId":"1jvzoopnqo0t6","dataSize":118,"chapterOrder":2,"inChapterOrder":16,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008470067","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"254\",\"lineNum\":0,\"lineType\":2,\"content\":\"前後两凶神\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"255\",\"lineNum\":0,\"lineType\":1,\"content\":\"謂：两鄰加侮，尚可撑持；同室與謀，最難隄防。\",\"logicSentenceId\":\"7587040768071860265\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"256\",\"lineNum\":0,\"lineType\":1,\"content\":\"片火焚天馬，重羊逐禄存，刼空親戚無常，權禄行藏靡定。\",\"logicSentenceId\":\"7587040768071876649\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"257\",\"lineNum\":0,\"lineType\":1,\"content\":\"君子哉魁鉞，小人也羊鈴，㐫不皆㐫，吉無純吉，主強賔弱，可保無虞，主弱賔強，㐫危立。\",\"logicSentenceId\":\"7587040768071893033\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"258\",\"lineNum\":0,\"lineType\":1,\"content\":\"見，主賔得失両相冝。\",\"logicSentenceId\":\"7587040768071909417\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"259\",\"lineNum\":0,\"lineType\":1,\"content\":\"運限命身當互見，身命最嫌羊陀七。\",\"logicSentenceId\":\"7587040768071925801\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"260\",\"lineNum\":0,\"lineType\":1,\"content\":\"殺遇之未免爲㐫。\",\"logicSentenceId\":\"7587040768071942185\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"261\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限甚忌貪破巨𤎉，逢之，定然作禍，命遇魁昌。\",\"logicSentenceId\":\"7587040768071958569\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"262\",\"lineNum\":0,\"lineType\":1,\"content\":\"常得貴，限逢紫府定財多。\",\"logicSentenceId\":\"7587040768071974953\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"263\",\"lineNum\":0,\"lineType\":1,\"content\":\"凢視女人之命先覌夫子二宮，若值殺星，定三嫁而心不足。\",\"logicSentenceId\":\"7587040768071991337\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"264\",\"lineNum\":0,\"lineType\":1,\"content\":\"或逢羊孛，雖啼哭而淚不乾。\",\"logicSentenceId\":\"7587040768072007721\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"265\",\"lineNum\":0,\"lineType\":1,\"content\":\"若覌男命，始以福財為主，再審遷移何如。\",\"logicSentenceId\":\"7587040768072024105\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"266\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174316752945164\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"267\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限相因吉㐫同。\",\"logicSentenceId\":\"7587040768072040489\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"268\",\"lineNum\":0,\"lineType\":1,\"content\":\"断限逢吉曜，平生動用和諧；命坐㐫郷，一世求謀齟齬。\",\"logicSentenceId\":\"7587040768072056873\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"269\",\"lineNum\":0,\"lineType\":1,\"content\":\"𤎉禄臨身，女得純隂貞絜之徳；同梁守命，男得純陽中正之心。\",\"logicSentenceId\":\"7587040768072073257\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"270\",\"lineNum\":0,\"lineType\":1,\"content\":\"君子命中亦有羊陀火鈴，小人命内豈無科禄權星，要看得垣失垣，專論入廟失廟。\",\"logicSentenceId\":\"7587040768072089641\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"271\",\"lineNum\":0,\"lineType\":1,\"content\":\"若論小児，詳推童限。\",\"logicSentenceId\":\"7587040768072106025\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"272\",\"lineNum\":0,\"lineType\":1,\"content\":\"小児命坐㐫郷，三五歳必然殀析；更有限逢惡殺，五七歳必主災亡。\",\"logicSentenceId\":\"7587040768072122409\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"273\",\"lineNum\":0,\"lineType\":1,\"content\":\"文昌文曲天魁秀，不讀詩書也可，人多學少成，只為擎羊逢刼殺爲人。\",\"logicSentenceId\":\"7587040768072138793\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"274\",\"lineNum\":0,\"lineType\":1,\"content\":\"好訟。\",\"logicSentenceId\":\"7587041034756947987\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"275\",\"lineNum\":0,\"lineType\":1,\"content\":\"盖因太歳遇官符，命之理微，熟察星辰之變化数之理，逺細詳。\",\"logicSentenceId\":\"7587041034756964371\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"276\",\"lineNum\":0,\"lineType\":1,\"content\":\"格局之興衰。\",\"logicSentenceId\":\"7587041034756980755\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"277\",\"lineNum\":0,\"lineType\":1,\"content\":\"北極加㐫殺，為道爲僧羊陀遇惡星。\",\"logicSentenceId\":\"7587041034756997139\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"278\",\"lineNum\":0,\"lineType\":1,\"content\":\"為奴爲僕。\",\"logicSentenceId\":\"7587041034757013523\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"279\",\"lineNum\":0,\"lineType\":1,\"content\":\"如武破𤎉貪，固深謀而貴題。\",\"logicSentenceId\":\"7587041034757029907\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"280\",\"lineNum\":0,\"lineType\":1,\"content\":\"加。\",\"logicSentenceId\":\"7587041034757046291\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"281\",\"lineNum\":0,\"lineType\":1,\"content\":\"羊佗空刼反小志以孤寒限輔。\",\"logicSentenceId\":\"7587041034757062675\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"282\",\"lineNum\":0,\"lineType\":1,\"content\":\"星旺限，雖弱而不弱。\",\"logicSentenceId\":\"7587041034757079059\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"283\",\"lineNum\":0,\"lineType\":1,\"content\":\"命臨吉地，\",\"logicSentenceId\":\"7587041034757095443\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"284\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174316753043468\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"285\",\"lineNum\":0,\"lineType\":1,\"content\":\"命雖㐫而不㐫断。\",\"logicSentenceId\":\"7587041034757095443\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"286\",\"lineNum\":0,\"lineType\":1,\"content\":\"橋截空大小難行。\",\"logicSentenceId\":\"7587041034757111827\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"287\",\"lineNum\":0,\"lineType\":1,\"content\":\"卯酉二空，聦明發福，命身遇紫府叠。\",\"logicSentenceId\":\"7587041034757128211\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"288\",\"lineNum\":0,\"lineType\":1,\"content\":\"積金銀，二主逢刼空，衣食不足，謀而不遂。\",\"logicSentenceId\":\"7587041034757144595\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"289\",\"lineNum\":0,\"lineType\":1,\"content\":\"命限遇入擎羊，東作西成。\",\"logicSentenceId\":\"7587041034757160979\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"290\",\"lineNum\":0,\"lineType\":1,\"content\":\"限身遭逢輔、相、科、權、禄拱，定為板桂之高人；空刼羊鈴，作九流之術士。\",\"logicSentenceId\":\"7599598089904586752\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"291\",\"lineNum\":0,\"lineType\":1,\"content\":\"情懐暢舒，昌曲命身。\",\"logicSentenceId\":\"7587041034757210131\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"292\",\"lineNum\":0,\"lineType\":1,\"content\":\"詭詐浮虚，羊陀陷地。\",\"logicSentenceId\":\"7599598089904603136\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"293\",\"lineNum\":0,\"lineType\":1,\"content\":\"天機、天梁、擎羊㑹，早有刑而晚見孤。\",\"logicSentenceId\":\"7599598089904619520\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"294\",\"lineNum\":0,\"lineType\":1,\"content\":\"貪狼、武曲、𤎉貞逢，少受貧而後享福。\",\"logicSentenceId\":\"7599598089904635904\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"295\",\"lineNum\":0,\"lineType\":1,\"content\":\"此皆斗数之奥妙，學者冝熟思之。\",\"logicSentenceId\":\"7587041034757226515\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174249518481427","endPageId":"7330174316753043468","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587040768071893033\",\"content\":\"魁钺象征君子，羊铃代表小人，凶星并非都凶，吉星也非纯吉，主星强而客星弱，可保平安无事，主星弱而客星强，凶险立刻出现。\"},{\"logicSentenceId\":\"7587040768072024105\",\"content\":\"如果看男性的命盘，首先以福德宫和财帛宫为主，再审视迁移宫的情况如何。\"},{\"logicSentenceId\":\"7587040768071876649\",\"content\":\"零星火星能焚毁天马星，双擎羊星会驱逐禄存星，劫煞、天空星出现预示着亲戚关系变幻无常，权星和禄星的行止也难以确定。\"},{\"logicSentenceId\":\"7587041034757210131\",\"content\":\"命身有文昌、文曲二星的人情怀舒畅；羊陀处于陷地，且天机、天梁与擎羊相会的人，为人诡诈、性情浮躁虚浮，早年有刑克之事，晚年孤独；贪狼、武曲、廉贞相遇，早年贫穷，晚年享福。\"},{\"logicSentenceId\":\"7587040768071991337\",\"content\":\"凡是看女人的命盘，要先看夫妻宫和子女宫，如果这两个宫位有煞星，一定会经历多次婚嫁，而且内心始终不会满足。\"},{\"logicSentenceId\":\"7587040768072056873\",\"content\":\"大限遇吉星照耀，一生行事都会和谐顺畅；命宫处于凶位，一辈子追求目标都会困难重重。\"},{\"logicSentenceId\":\"7587040768072007721\",\"content\":\"如果遇到羊孛星，即使哭泣眼泪也不会干。\"},{\"logicSentenceId\":\"7587040768072040489\",\"content\":\"大运和小运相互关联，吉凶情况是相同的。\"},{\"logicSentenceId\":\"7587041034757013523\",\"content\":\"成为奴仆。\"},{\"logicSentenceId\":\"7587041034757144595\",\"content\":\"能积累金银财富，但如果紫微星和天府星同时遭遇劫煞、天空二星，就会衣食不足，谋划之事难以成功。\"},{\"logicSentenceId\":\"7587040768072122409\",\"content\":\"小孩命宫坐落在凶位，三到五岁时必然夭折；如果限宫又遇到恶煞，五到七岁时必定遭遇灾难死亡。\"},{\"logicSentenceId\":\"7587041034757079059\",\"content\":\"星曜处于旺相的运限，即使本身力量衰弱也不算衰弱。\"},{\"logicSentenceId\":\"7587041034757095443\",\"content\":\"命盘落在吉利之地，即使命格带凶也不会判定为凶险。\"},{\"logicSentenceId\":\"7587041034757111827\",\"content\":\"桥截空，不论大运还是小运都难以顺遂前行。\"},{\"logicSentenceId\":\"7587040768071860265\",\"content\":\"意思是：被邻居欺侮，还能够支撑应对；同一个家庭内部的人参与谋划，最难防备。\"},{\"logicSentenceId\":\"7587041034757029907\",\"content\":\"如武曲、破军、廉贞、贪狼这些星曜，命主固然会有深远的谋略，并且有显贵的运势。\"},{\"logicSentenceId\":\"7587040768071925801\",\"content\":\"大运、流年、命宫、身宫应该相互结合来看，身宫和命宫最忌讳遇到擎羊、陀罗、七杀星。\"},{\"logicSentenceId\":\"7587040768072073257\",\"content\":\"廉贞禄存星临身宫，女性具有纯阴贞洁的品德；天同天梁星守命宫，男性具备纯阳中正的心性。\"},{\"logicSentenceId\":\"7587040768072138793\",\"content\":\"文昌、文曲、天魁主聪慧，不读诗书也无妨，很多人学习难以有成，只因为擎羊星与劫杀星相遇。\"},{\"logicSentenceId\":\"7587041034756947987\",\"content\":\"喜欢打官司。\"},{\"logicSentenceId\":\"7587040768071974953\",\"content\":\"常常能得到贵人相助，运限遇到紫府必定财富丰厚。\"},{\"logicSentenceId\":\"7587041034757046291\",\"content\":\"加。\"},{\"logicSentenceId\":\"7587040768071909417\",\"content\":\"可见，主客双方的得失两相适宜。\"},{\"logicSentenceId\":\"7587040768071958569\",\"content\":\"行运的两个阶段最忌讳贪狼、破军、巨门、廉贞星，遇到它们，必定会引发灾祸，命局中遇到魁星、文昌星。\"},{\"logicSentenceId\":\"7587041034756997139\",\"content\":\"北极星加遇凶杀星，会出家为道为僧；擎羊、陀罗遇到恶星也是如此。\"},{\"logicSentenceId\":\"7587041034757062675\",\"content\":\"羊陀空劫反而使志向微小，处境孤寒，即使有限运中的辅助也难以化解。\"},{\"logicSentenceId\":\"7587041034756980755\",\"content\":\"格局的兴衰。\"},{\"logicSentenceId\":\"7587041034757128211\",\"content\":\"卯酉二宫为空亡宫位，人会聪明且能享受福运，命宫和身宫遇到紫微、天府星重叠。\"},{\"logicSentenceId\":\"7587041034757226515\",\"content\":\"这些都是斗数的奥妙之处，学习的人应当深入思考它们。\"},{\"logicSentenceId\":\"7587040768072089641\",\"content\":\"君子的命中也会出现羊陀火铃等煞星，小人的命里难道就没有科禄权星吗？关键要看星曜是否得垣，主要是判断星曜入庙还是失庙。\"},{\"logicSentenceId\":\"7587040768072106025\",\"content\":\"如果是要论断小孩子的命盘，就要详细推究孩童时期的运势。\"},{\"logicSentenceId\":\"7587041034756964371\",\"content\":\"因为太岁遇到官符，命理精微玄妙，要仔细观察星辰的变化，天数的道理要长远、细致地详察。\"},{\"logicSentenceId\":\"7587041034757160979\",\"content\":\"命宫和大运。遇到擎羊星。东作西成时命限、身宫遇到辅相科权禄星环绕，必定是折桂登科的显贵之人；若逢空劫羊铃凶星，只能当九流的江湖术士。\"},{\"logicSentenceId\":\"7587040768071942185\",\"content\":\"煞星遇到它们难免会有凶险。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":12549,"chapterOrder":2,"inChapterOrder":17,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008486451","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"296\",\"lineNum\":0,\"lineType\":10,\"content\":\"諸星問荅論\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174316753043468","endPageId":"7330174316753043468","contentEncryptType":0,"translateContent":"","chapterId":"1jvzoopnqo0t6","dataSize":118,"chapterOrder":2,"inChapterOrder":18,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008502835","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"297\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：紫微所主若何？\",\"logicSentenceId\":\"7587041034757242899\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"298\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：紫微属土，廼中天之尊星，為帝座，主掌造化樞機。\",\"logicSentenceId\":\"7587041034757259283\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"299\",\"lineNum\":0,\"lineType\":1,\"content\":\"人生主宰，仗五行，育萬物，以人命為之，立定數安星緾各根所司處年数内，常掌爵禄。\",\"logicSentenceId\":\"7587041034757275667\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"300\",\"lineNum\":0,\"lineType\":1,\"content\":\"諸宫降福，能消百\",\"logicSentenceId\":\"7587041034757292051\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"301\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174316753190924\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"302\",\"lineNum\":0,\"lineType\":1,\"content\":\"惡，湏看三台。\",\"logicSentenceId\":\"7587041034757292051\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"303\",\"lineNum\":0,\"lineType\":1,\"content\":\"盖紫微守命是中台，前一位是上台，後一位是下台，俱看在廟旺之卿否，有何吉㐫之守照。\",\"logicSentenceId\":\"7587041034757308435\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"304\",\"lineNum\":0,\"lineType\":1,\"content\":\"如廟旺化吉甚妙，䧟又化㐫甚㐫，吉限不為羙，凶限則㐫也。\",\"logicSentenceId\":\"7587041034757324819\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"305\",\"lineNum\":0,\"lineType\":1,\"content\":\"人之身命，若值禄存同宫，日月三合相照，貴不可言。\",\"logicSentenceId\":\"7587041034757341203\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"306\",\"lineNum\":0,\"lineType\":1,\"content\":\"無輔弼同行，則爲孤君，雖羙玉不足。\",\"logicSentenceId\":\"7587041034757357587\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"307\",\"lineNum\":0,\"lineType\":1,\"content\":\"更與諸殺同宮，或諸吉合照，則君子在野，小人在位，主人奸詐假義，平生惡積。\",\"logicSentenceId\":\"7587041034757373971\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"308\",\"lineNum\":0,\"lineType\":1,\"content\":\"與囚同居，無左右相佐，定為胥吏。\",\"logicSentenceId\":\"7587041034757390355\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"309\",\"lineNum\":0,\"lineType\":1,\"content\":\"如落疾厄、兄弟、奴僕相貌四陷宫，主人劳碌，作事無成，雖得相助，亦不為福。\",\"logicSentenceId\":\"7587041034757406739\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"310\",\"lineNum\":0,\"lineType\":1,\"content\":\"更冝詳細宫度，應究星纒之論。\",\"logicSentenceId\":\"7587041034757423123\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"311\",\"lineNum\":0,\"lineType\":1,\"content\":\"若居官禄身命三官，最要左右守衞。\",\"logicSentenceId\":\"7587041034757439507\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"312\",\"lineNum\":0,\"lineType\":1,\"content\":\"天相禄馬交馳，不落空亡，更坐生郷，可為貴論。\",\"logicSentenceId\":\"7587041034757455891\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"313\",\"lineNum\":0,\"lineType\":1,\"content\":\"如魁鉞三台星㑹吉星，則三台八座矣。\",\"logicSentenceId\":\"7587041034757472275\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"314\",\"lineNum\":0,\"lineType\":1,\"content\":\"帝會\",\"logicSentenceId\":\"7587041034757488659\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"315\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174371857760297\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"316\",\"lineNum\":0,\"lineType\":1,\"content\":\"文昌拱照，又得羙限扶，必文選之職。\",\"logicSentenceId\":\"7587041034757488659\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"317\",\"lineNum\":0,\"lineType\":1,\"content\":\"帝降七殺為權，有吉同位，則帝相有氣，諸吉咸集，作武官之職。\",\"logicSentenceId\":\"7587041034757505043\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"318\",\"lineNum\":0,\"lineType\":1,\"content\":\"財帛田宅，有左右守衞。\",\"logicSentenceId\":\"7587041034757521427\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"319\",\"lineNum\":0,\"lineType\":1,\"content\":\"又與太隂、武曲同度，不見惡星，必為財賦之官。\",\"logicSentenceId\":\"7587041034757537811\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"320\",\"lineNum\":0,\"lineType\":1,\"content\":\"更與武曲、禄存同宫，身命中尤為竒特。\",\"logicSentenceId\":\"7587041034757554195\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"321\",\"lineNum\":0,\"lineType\":1,\"content\":\"男女宫得祥佐吉星，主生貴子。\",\"logicSentenceId\":\"7587041034757570579\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"322\",\"lineNum\":0,\"lineType\":1,\"content\":\"若獨守無相佐，則子息孤单。\",\"logicSentenceId\":\"7587041034757586963\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"323\",\"lineNum\":0,\"lineType\":1,\"content\":\"妻宫會吉，男女得貴羙，夫婦諧老，亦要無破殺。\",\"logicSentenceId\":\"7587041034757603347\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"324\",\"lineNum\":0,\"lineType\":1,\"content\":\"遷移雖是強宫，更要相佐，有吉星照，命則因人之貴，福徳，男為䧟地，女為廟樂，逢吉則吉，逢㐫則凶。\",\"logicSentenceId\":\"7587041034757619731\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174316753043468","endPageId":"7330174371857760297","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034757570579\",\"content\":\"男女宫有吉祥辅佐的吉星，预示会生贵子。\"},{\"logicSentenceId\":\"7587041034757357587\",\"content\":\"如果没有左辅右弼星同行，那就成了孤君，即使本身像美玉一样也存在不足。\"},{\"logicSentenceId\":\"7587041034757423123\",\"content\":\"更应该详细考察宫度，应当探究星缠的理论。\"},{\"logicSentenceId\":\"7587041034757373971\",\"content\":\"如果命宫还和各种凶星处在同一宫位，或者与诸吉曜相互照会，那么就会出现君子被埋没在民间、小人当权，命主为人奸诈、假仁假义，一生作恶多端。\"},{\"logicSentenceId\":\"7587041034757521427\",\"content\":\"财帛宫和田宅宫，有左辅星和右弼星守护。\"},{\"logicSentenceId\":\"7587041034757472275\",\"content\":\"如果魁钺、三台星与吉星会合，那么就能形成三台八座的格局。\"},{\"logicSentenceId\":\"7587041034757390355\",\"content\":\"与囚星同宫，没有左辅星和右弼星辅佐，命主必定是小官吏。\"},{\"logicSentenceId\":\"7587041034757554195\",\"content\":\"如果还与武曲、禄存处于同一宫位，那么在身宫和命宫中就更为奇特了。\"},{\"logicSentenceId\":\"7587041034757406739\",\"content\":\"如果落在疾厄宫、兄弟宫、奴仆宫、相貌宫这四个陷宫，命主会劳碌，做事没有成就，即使得到帮助，也不算有福气。\"},{\"logicSentenceId\":\"7587041034757242899\",\"content\":\"问：紫微星主掌的是什么呢？\"},{\"logicSentenceId\":\"7587041034757439507\",\"content\":\"如果星曜位于官禄、身宫、命宫这三个宫位，最需要左辅星和右弼星守护。\"},{\"logicSentenceId\":\"7587041034757341203\",\"content\":\"人的身宫和命宫，如果与禄存星处于同一宫位，又有太阳星和太阴星以三合的方式相互照临，那其尊贵程度就无法用言语来形容了。\"},{\"logicSentenceId\":\"7587041034757455891\",\"content\":\"天相星与禄存星、天马星相互交会，不落入空亡的宫位，又处于生旺之地，就可以称得上是富贵之相了。\"},{\"logicSentenceId\":\"7587041034757308435\",\"content\":\"就是说紫微守命宫是中台，它前一个宫位是上台，后一个宫位是下台，都要查看这些宫位是否处于庙旺的状态，以及有哪些吉星、凶星坐守、照临。\"},{\"logicSentenceId\":\"7587041034757603347\",\"content\":\"夫妻宫有吉星会合，子女显贵美好，夫妇和谐白头偕老，也不能有破杀星。\"},{\"logicSentenceId\":\"7587041034757275667\",\"content\":\"人生的主宰，依靠五行，孕育万物，以人的命运来确定，确定命数、安置星缠，在各星所掌管的年数内，常常掌管爵禄。\"},{\"logicSentenceId\":\"7587041034757586963\",\"content\":\"如果独自坐守且没有其他星曜辅佐，那么子女就会孤单。\"},{\"logicSentenceId\":\"7587041034757619731\",\"content\":\"迁移宫虽是强宫，更需要有星曜辅佐，有吉星照耀，命主就会因他人而显贵。福德宫，对于男性来说是陷地，对于女性来说是庙乐，遇到吉星就吉利，遇到凶星就凶险。\"},{\"logicSentenceId\":\"7587041034757537811\",\"content\":\"又与太阴星、武曲星处于同一宫度，且不见凶星，必定能担任掌管财赋的官职。\"},{\"logicSentenceId\":\"7587041034757324819\",\"content\":\"如果庙旺化吉就非常好，如果陷地又化凶就非常凶险，即便遇到吉利的运势也不会有多好，处于凶险的期限就会很凶险。\"},{\"logicSentenceId\":\"7587041034757259283\",\"content\":\"回答说：紫微属土，是中天的尊贵星曜，象征帝王之位，掌管着造化的关键。\"},{\"logicSentenceId\":\"7587041034757505043\",\"content\":\"帝星与七杀星组合化为权星，又有吉星同处一宫，那么帝星和相星便有气势，各种吉星都聚集在一起，可担任武官之职。\"},{\"logicSentenceId\":\"7587041034757488659\",\"content\":\"帝星与文昌星相互拱照，又得到吉利的限运扶助，必定担任文官选拔之类的官职。\"},{\"logicSentenceId\":\"7587041034757292051\",\"content\":\"紫微在各宫降下福运，能够消除各种灾祸，还需看三台星。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":9325,"chapterOrder":2,"inChapterOrder":19,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008519219","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"325\",\"lineNum\":0,\"lineType\":1,\"content\":\"希夷先生曰：紫㣲為帝座，在諸宫，能降福消灾，觧諸星之惡虗，能制火鈴為善，能降七殺為權。\",\"logicSentenceId\":\"7587041034757636115\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"326\",\"lineNum\":0,\"lineType\":1,\"content\":\"若得府相、左右、昌曲吉集，無有不貴，不然亦主巨冨。\",\"logicSentenceId\":\"7587041034757652499\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"327\",\"lineNum\":0,\"lineType\":1,\"content\":\"縱有四殺冲破，亦作中局。\",\"logicSentenceId\":\"7587041034757668883\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"328\",\"lineNum\":0,\"lineType\":1,\"content\":\"若遇破\",\"logicSentenceId\":\"7587041034757685267\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"329\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174371857907753\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"330\",\"lineNum\":0,\"lineType\":1,\"content\":\"軍，在辰戌丑未，主為臣不忠，為子不孝之論。\",\"logicSentenceId\":\"7587041034757685267\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"331\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命逢之，作貴婦断。\",\"logicSentenceId\":\"7587041034757701651\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"332\",\"lineNum\":0,\"lineType\":1,\"content\":\"加殺冲破，亦作平常，不為下賤。\",\"logicSentenceId\":\"7587041034757718035\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174371857760297","endPageId":"7330174371857907753","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034757636115\",\"content\":\"希夷先生说：紫微星是帝座，在各个宫位中，能降福消灾，化解众星的恶煞虚耗，能将火星、铃星转化为善星，能使七杀星化为权星。\"},{\"logicSentenceId\":\"7587041034757652499\",\"content\":\"若能得到天府、天相、左辅、右弼、文昌、文曲这些吉星汇聚，命主没有不显贵的，不然也主大富。\"},{\"logicSentenceId\":\"7587041034757668883\",\"content\":\"即使有四杀星冲破，也可算作中等格局。\"},{\"logicSentenceId\":\"7587041034757685267\",\"content\":\"如果遇到破军星，在辰、戌、丑、未这四个宫位，就会有作为臣子不忠诚、作为子女不孝顺的说法。\"},{\"logicSentenceId\":\"7587041034757701651\",\"content\":\"女性命盘遇到这种情况，可判断为贵妇。\"},{\"logicSentenceId\":\"7587041034757718035\",\"content\":\"如果有煞星冲破，也只会是普通的命格，不算下贱之命。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":2365,"chapterOrder":2,"inChapterOrder":20,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008535603","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"333\",\"lineNum\":0,\"lineType\":1,\"content\":\"歌曰：紫微原属土，官祿宫主星。\",\"logicSentenceId\":\"7587041034757734419\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"334\",\"lineNum\":0,\"lineType\":1,\"content\":\"有相為有用，無相為孤君。\",\"logicSentenceId\":\"7587041034757750803\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"335\",\"lineNum\":0,\"lineType\":1,\"content\":\"諸宮皆降福，逢㐫福自申。\",\"logicSentenceId\":\"7587041034757767187\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"336\",\"lineNum\":0,\"lineType\":1,\"content\":\"文昌發科甲，文曲受皇恩。\",\"logicSentenceId\":\"7587041034757783571\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"337\",\"lineNum\":0,\"lineType\":1,\"content\":\"僧道有師號，快樂度春秋。\",\"logicSentenceId\":\"7587041034757799955\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"338\",\"lineNum\":0,\"lineType\":1,\"content\":\"衆星皆拱照，爲吏恊公平。\",\"logicSentenceId\":\"7587041034757816339\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"339\",\"lineNum\":0,\"lineType\":1,\"content\":\"女人㑹帝座，遇吉事貴人。\",\"logicSentenceId\":\"7587041034757832723\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"340\",\"lineNum\":0,\"lineType\":1,\"content\":\"若與桃花㑹，飄蕩落風塵。\",\"logicSentenceId\":\"7587041034757849107\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"341\",\"lineNum\":0,\"lineType\":1,\"content\":\"擎羊火鈴聚，用𥨸狗偷群。\",\"logicSentenceId\":\"7587041034757865491\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"342\",\"lineNum\":0,\"lineType\":1,\"content\":\"三方有吉拱，方作貴人評。\",\"logicSentenceId\":\"7587041034757881875\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"343\",\"lineNum\":0,\"lineType\":1,\"content\":\"若還無輔弼，諸𢙣共欺凌。\",\"logicSentenceId\":\"7587041034757898259\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"344\",\"lineNum\":0,\"lineType\":1,\"content\":\"帝為無道主，考究要知因。\",\"logicSentenceId\":\"7587041034757914643\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"345\",\"lineNum\":0,\"lineType\":1,\"content\":\"二限若遇帝，喜氣自然新。\",\"logicSentenceId\":\"7587041034757931027\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174371857907753","endPageId":"7330174371857907753","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034757783571\",\"content\":\"文昌星能够助人考取功名，文曲星使人受皇恩宠。\"},{\"logicSentenceId\":\"7587041034757931027\",\"content\":\"大运和小运如果遇到紫微星，喜气自然会焕然一新。\"},{\"logicSentenceId\":\"7587041034757849107\",\"content\":\"如果与桃花星相遇，就会漂泊沦落于风尘之中。\"},{\"logicSentenceId\":\"7587041034757832723\",\"content\":\"女子与帝座星相会，遇到吉利之事能得贵人相助。\"},{\"logicSentenceId\":\"7587041034757865491\",\"content\":\"如果擎羊、火星、铃星聚集，则其人会有偷窃行为而沦为盗窃之徒。\"},{\"logicSentenceId\":\"7587041034757799955\",\"content\":\"僧人道士能获得师号，快乐地度过岁月。\"},{\"logicSentenceId\":\"7587041034757734419\",\"content\":\"歌诀说：紫微星原本属于土，是官禄宫的主星。\"},{\"logicSentenceId\":\"7587041034757898259\",\"content\":\"如果没有左辅星和右弼星相助，各种凶星就会共同欺凌。\"},{\"logicSentenceId\":\"7587041034757914643\",\"content\":\"紫微星为无道君主，需要仔细考究其中的原因。\"},{\"logicSentenceId\":\"7587041034757816339\",\"content\":\"众多星辰都环绕照耀，担任官吏能秉持公平。\"},{\"logicSentenceId\":\"7587041034757750803\",\"content\":\"有辅佐星曜就能发挥作用，没有辅佐星曜就成为孤君。\"},{\"logicSentenceId\":\"7587041034757881875\",\"content\":\"三方有吉星拱照，才可以被评定为贵人。\"},{\"logicSentenceId\":\"7587041034757767187\",\"content\":\"在各个宫位都能降下福气，即便遇到凶星，福气也自然会显现。\"}]}","chapterId":"1jvzoopnqo0t6","dataSize":3768,"chapterOrder":2,"inChapterOrder":21,"volumeId":"7330168671848890377","volumeVersion":49},{"paragraphId":"7356158861008551987","paragraphType":1,"content":"{\"lines\":[{\"lineId\":\"346\",\"lineNum\":0,\"lineType\":1,\"content\":\"玉蟾先生曰：紫微乃中天星主，為衆星之樞紐，為造化之根\",\"logicSentenceId\":\"7587041034757947411\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"347\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174371858006057\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"348\",\"lineNum\":0,\"lineType\":1,\"content\":\"柢，為人命之主宰，掌五行，育萬物，各有所司。\",\"logicSentenceId\":\"7587041034757947411\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"349\",\"lineNum\":0,\"lineType\":1,\"content\":\"以左輔、右弼為相，以天相、昌曲為從，以魁鉞為傳令，以日月為分司，以禄馬爲掌爵之司，以天府為帑藏之主。\",\"logicSentenceId\":\"7587041034757963795\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"350\",\"lineNum\":0,\"lineType\":1,\"content\":\"身命逢之，不勝其吉。\",\"logicSentenceId\":\"7587041034757980179\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"351\",\"lineNum\":0,\"lineType\":1,\"content\":\"如遇四殺\",\"logicSentenceId\":\"7587041034757996563\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"352\",\"lineNum\":0,\"lineType\":2,\"content\":\"羊陀火鈴\",\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"353\",\"lineNum\":0,\"lineType\":1,\"content\":\"刼空，機梁冲破，定是僧道。\",\"logicSentenceId\":\"7587041034757996563\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"354\",\"lineNum\":0,\"lineType\":1,\"content\":\"此星在命，爲人厚重，面紫色，専作吉断。\",\"logicSentenceId\":\"7587041034758012947\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"355\",\"lineNum\":0,\"lineType\":1,\"content\":\"問：天機所主如何？\",\"logicSentenceId\":\"7587041034758029331\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"356\",\"lineNum\":0,\"lineType\":1,\"content\":\"荅曰：天機属木，南斗第三益筭之善星也。\",\"logicSentenceId\":\"7587041034758045715\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"357\",\"lineNum\":0,\"lineType\":1,\"content\":\"後化氣曰：善得地合之行事，觧諸星之順逆定数。\",\"logicSentenceId\":\"7587041034758062099\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"358\",\"lineNum\":0,\"lineType\":1,\"content\":\"於人命，逢諸吉咸集，則萬事皆善。\",\"logicSentenceId\":\"7587041034758078483\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"359\",\"lineNum\":0,\"lineType\":1,\"content\":\"勤於禮佛，敬乎六親，利於林泉，冝於僧道，無惡虐不仁之心，有靈機應變之志。\",\"logicSentenceId\":\"7587041034758094867\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"360\",\"lineNum\":0,\"lineType\":1,\"content\":\"淵魚察見，作事有方。\",\"logicSentenceId\":\"7587041034758111251\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"361\",\"lineNum\":0,\"lineType\":1,\"content\":\"女命逢之為福，逢吉爲吉，遇㐫為㐫。\",\"logicSentenceId\":\"7587041034758127635\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"362\",\"lineNum\":0,\"lineType\":1,\"content\":\"或守於身，更逢天\",\"logicSentenceId\":\"7587041034758144019\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"363\",\"lineNum\":0,\"lineType\":3,\"content\":\"\",\"pagePass\":{\"PageId\":\"7330174419656065060\"},\"logicSentenceId\":\"0\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"364\",\"lineNum\":0,\"lineType\":1,\"content\":\"梁，必有高藝隨身。\",\"logicSentenceId\":\"7587041034758144019\",\"marginNoteIdList\":null,\"pinYin\":null},{\"lineId\":\"365\",\"lineNum\":0,\"lineType\":1,\"content\":\"習者冝詳玩之。\",\"logicSentenceId\":\"7587041034758160403\",\"marginNoteIdList\":null,\"pinYin\":null}],\"indent\":0,\"textIndent\":false}","startPageId":"7330174371857907753","endPageId":"7330174419656065060","contentEncryptType":0,"translateContent":"{\"sentences\":[{\"logicSentenceId\":\"7587041034758144019\",\"content\":\"如果天机星守于身宫，又遇到天梁星，命主必定身怀高超技艺。\"},{\"logicSentenceId\":\"7587041034757980179\",\"content\":\"命宫和身宫逢到紫微，有说不尽的吉祥。\"},{\"logicSentenceId\":\"7587041034757947411\",\"content\":\"玉蟾先生说：紫微是中天的星主，是众星的枢纽，是造化的根基，是人命的主宰，掌管五行，孕育万物，各有各的职责。\"},{\"logicSentenceId\":\"7587041034758094867\",\"content\":\"勤于礼佛，尊敬六亲，在山林泉石间生活有益，适合做僧道，无凶恶暴虐、不仁不义之心，有灵活应变的志向。\"},{\"logicSentenceId\":\"7587041034757963795\",\"content\":\"以左辅、右弼为宰相，以天相、文昌、文曲为侍从，以天魁、天钺为传令官，以太阳、太阴为分司官，以禄存、天马为掌管爵位的官员，以天府为掌管国库的官员。\"},{\"logicSentenceId\":\"7587041034758012947\",\"conte
