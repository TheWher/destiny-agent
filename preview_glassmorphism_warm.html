<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玻璃拟态 · 暖色版 · Destiny Agent</title>
<style>
  :root {
    --bg-deep: #0F0A06;
    --bg-warm: #18120C;
    --glass: rgba(255,255,255,0.12);
    --glass-hover: rgba(255,255,255,0.18);
    --glass-input: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.15);
    --glass-border-hover: rgba(255,255,255,0.30);
    --champagne: #E4B863;
    --champagne-light: #F3DCA8;
    --amber: #C8863A;
    --amber-light: #D9A560;
    --warm-white: rgba(255,248,235,0.92);
    --text-primary: rgba(255,248,235,0.90);
    --text-secondary: rgba(255,248,235,0.68);
    --text-muted: rgba(255,248,235,0.42);
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --ease-spring: cubic-bezier(0.16,1,0.3,1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "STSong", "PingFang SC", serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 55% 45% at 65% 18%, rgba(200,134,58,0.18), transparent),
      radial-gradient(ellipse 45% 38% at 35% 78%, rgba(180,130,80,0.22), transparent),
      radial-gradient(ellipse 35% 28% at 50% 50%, rgba(228,184,99,0.06), transparent);
  }

  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 220px 220px;
    mix-blend-mode: overlay;
  }

  .app { position: relative; z-index: 2; max-width: 960px; margin: 0 auto; padding: 40px 28px 80px; }

  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    background: var(--glass);
    backdrop-filter: blur(60px) saturate(180%);
    -webkit-backdrop-filter: blur(60px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    margin-bottom: 32px;
    box-shadow: 0 8px 24px rgba(8,5,3,0.45),
                inset 0 1px 0 rgba(255,248,235,0.14),
                inset 0 -1px 0 rgba(6,3,1,0.3);
  }
  .nav-brand { font-size: 1.1rem; letter-spacing: 3px; color: var(--text-primary); font-weight: 600; }
  .nav-links { display: flex; gap: 20px; }
  .nav-links a {
    font-size: 0.82rem; color: var(--text-secondary); text-decoration: none;
    letter-spacing: 1px; transition: color 0.6s var(--ease-spring);
  }
  .nav-links a:hover { color: var(--champagne-light); }

  .glass-card {
    background: var(--glass);
    backdrop-filter: blur(60px) saturate(160%);
    -webkit-backdrop-filter: blur(60px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 28px 32px;
    margin-bottom: 20px;
    box-shadow: 0 16px 40px rgba(8,5,3,0.5),
                inset 0 1px 0 rgba(255,248,235,0.16),
                inset 0 -1px 0 rgba(6,3,1,0.3);
    background-image: linear-gradient(to bottom, rgba(255,248,235,0.10), transparent 50%);
    transition: all 0.6s var(--ease-spring);
  }
  .glass-card:hover {
    box-shadow: 0 20px 56px rgba(8,5,3,0.6),
                inset 0 1px 0 rgba(255,248,235,0.22),
                inset 0 -1px 0 rgba(6,3,1,0.3);
    border-color: rgba(255,255,255,0.20);
  }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 22px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(40px) saturate(160%);
    -webkit-backdrop-filter: blur(40px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 0.85rem; font-family: inherit; cursor: pointer;
    box-shadow: 0 4px 16px rgba(8,5,3,0.4),
                inset 0 1px 0 rgba(255,248,235,0.18),
                inset 0 -1px 0 rgba(6,3,1,0.25);
    transition: all 0.6s var(--ease-spring);
    letter-spacing: 0.5px;
  }
  .btn:hover {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.30);
    box-shadow: 0 10px 28px rgba(8,5,3,0.5),
                inset 0 1px 0 rgba(255,248,235,0.25);
    transform: translateY(-1px);
  }
  .btn:active { transform: scale(0.97); }
  .btn-accent {
    background: rgba(228,184,99,0.18);
    border-color: rgba(228,184,99,0.40);
    color: var(--champagne-light);
  }
  .btn-accent:hover {
    background: rgba(228,184,99,0.26);
    border-color: rgba(228,184,99,0.55);
    box-shadow: 0 10px 28px rgba(200,134,58,0.2),
                inset 0 1px 0 rgba(255,248,235,0.30);
  }

  .input {
    width: 100%;
    padding: 11px 16px;
    background: var(--glass-input);
    backdrop-filter: blur(40px) saturate(160%);
    -webkit-backdrop-filter: blur(40px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 0.85rem; font-family: inherit;
    box-shadow: inset 0 1px 0 rgba(255,248,235,0.10),
                inset 0 -1px 0 rgba(6,3,1,0.25);
    transition: all 0.6s var(--ease-spring);
    outline: none;
  }
  .input::placeholder { color: rgba(255,248,235,0.30); }
  .input:focus {
    border-color: rgba(255,255,255,0.32);
    background: rgba(255,255,255,0.12);
    box-shadow: 0 0 0 3px rgba(228,184,99,0.12),
                inset 0 1px 0 rgba(255,248,235,0.18);
  }

  h1 { font-size: 2.2rem; font-weight: 600; letter-spacing: 2px; margin-bottom: 8px; color: var(--text-primary); }
  h2 { font-size: 1.2rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 16px; letter-spacing: 1px; }
  .subtitle { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 24px; line-height: 1.8; }
  .label { font-size: 0.72rem; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 4px; }

  .hero { text-align: center; padding: 48px 0 36px; }
  .hero .tag {
    display: inline-block; font-size: 0.7rem; letter-spacing: 3px;
    color: var(--champagne); border: 1px solid rgba(228,184,99,0.35);
    padding: 4px 16px; border-radius: 20px; margin-bottom: 20px;
  }
  .hero h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); }

  .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group.wide { grid-column: span 2; }
  .radio-row { display: flex; gap: 12px; align-items: center; }
  .radio-label { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-secondary); cursor: pointer; }

  .palace-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
    gap: 3px; height: 400px; margin-top: 16px;
  }
  .palace {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(30px) saturate(160%);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    display: flex; flex-direction: column;
    font-size: 0.72rem; color: var(--text-secondary);
    transition: all 0.6s var(--ease-spring);
    overflow: hidden; cursor: pointer;
  }
  .palace:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.16); }
  .palace .pzhi { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
  .palace .pname { font-size: 0.7rem; color: var(--champagne); letter-spacing: 1px; }
  .palace .pstars { margin-top: auto; font-size: 0.62rem; color: var(--text-muted); }
  .palace.ming { border-color: var(--champagne); box-shadow: inset 0 0 20px rgba(228,184,99,0.06); }
  .center-cell {
    grid-column: 2 / 4; grid-row: 2 / 4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: var(--radius-sm);
  }
  .center-cell .wu-ju { font-size: 0.82rem; letter-spacing: 4px; color: var(--text-secondary); }
  .center-cell .ming-star { font-size: 1.6rem; font-weight: 700; color: var(--champagne); margin: 8px 0; }
  .center-cell .info { font-size: 0.68rem; color: var(--text-muted); }

  @media (max-width: 640px) {
    .app { padding: 20px 14px 60px; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-group.wide { grid-column: span 2; }
    .palace-grid { height: 300px; }
    .nav { flex-direction: column; gap: 8px; }
  }
</style>
</head>
<body>
<div class="app">

  <nav class="nav">
    <span class="nav-brand">🔮 Destiny Agent</span>
    <div class="nav-links">
      <a href="#">八字</a>
      <a href="#">紫微</a>
      <a href="#">登录</a>
    </div>
  </nav>

  <div class="hero">
    <div class="tag">符号计算 + LLM 推理</div>
    <h1>推命 · 观星 · 知运</h1>
    <p class="subtitle">八字 · 紫微斗数 · AI深度解读</p>
  </div>

  <div class="glass-card">
    <h2>排盘</h2>
    <div class="form-grid">
      <div class="form-group"><span class="label">年份</span><input class="input" type="number" placeholder="2005" value="2005"></div>
      <div class="form-group"><span class="label">月份</span><input class="input" type="number" placeholder="8" value="8"></div>
      <div class="form-group"><span class="label">日期</span><input class="input" type="number" placeholder="19" value="19"></div>
      <div class="form-group"><span class="label">时辰</span><input class="input" type="number" placeholder="1" value="1"></div>
      <div class="form-group wide">
        <span class="label">性别</span>
        <div class="radio-row">
          <label class="radio-label"><input type="radio" name="gender" checked> 男</label>
          <label class="radio-label"><input type="radio" name="gender"> 女</label>
        </div>
      </div>
      <div class="form-group wide" style="align-items:flex-start">
        <label class="radio-label" style="margin-bottom:4px"><input type="checkbox" checked id="use-true-solar" onchange="var v=this.checked?'flex':'none';document.querySelectorAll('.solar-field,.solar-status').forEach(function(e){e.style.display=v})"> 真太阳时校正</label>
      </div>
      <div class="form-group solar-field" style="display:flex">
        <span class="label">经度</span><input class="input" type="number" step="0.01" placeholder="120" value="120">
      </div>
      <div class="form-group solar-field" style="display:flex">
        <span class="label">地点</span><input class="input" type="text" placeholder="如：东莞" value="东莞">
      </div>
      <div class="form-group wide" style="display:flex;gap:8px;align-items:flex-end">
        <button class="btn btn-accent" style="flex:1">⚡ 排盘</button>
        <button class="btn" style="flex:1">🧠 深度分析</button>
      </div>
      <div class="form-group wide solar-status" style="font-size:0.72rem;color:var(--text-muted);padding-top:4px">
        🌏 已启用真太阳时校正 · 经度 120.00° · 校正 +8分
      </div>
    </div>
  </div>

  <div class="glass-card">
    <h2>命盘预览</h2>
    <div class="palace-grid">
      <div class="palace"><span class="pzhi">巳</span><span class="pname">兄弟</span><span class="pstars">天机 · 禄存</span></div>
      <div class="palace"><span class="pzhi">午</span><span class="pname">命宫</span><span class="pstars">紫微 · 天府</span></div>
      <div class="palace"><span class="pzhi">未</span><span class="pname">父母</span><span class="pstars">—</span></div>
      <div class="palace"><span class="pzhi">申</span><span class="pname">福德</span><span class="pstars">廉贞 · 破军</span></div>
      <div class="palace"><span class="pzhi">辰</span><span class="pname">夫妻</span><span class="pstars">贪狼 · 文昌</span></div>
      <div class="center-cell">
        <div class="wu-ju">水二局</div>
        <div class="ming-star">紫微 天府</div>
        <div class="info">命宫 · 午 · 丙午</div>
        <div class="info" style="margin-top:4px">来因宫：福德</div>
      </div>
      <div class="palace ming"><span class="pzhi">酉</span><span class="pname">田宅</span><span class="pstars">天相</span></div>
      <div class="palace"><span class="pzhi">卯</span><span class="pname">子女</span><span class="pstars">太阴</span></div>
      <div class="palace"><span class="pzhi">戌</span><span class="pname">官禄</span><span class="pstars">巨门</span></div>
      <div class="palace"><span class="pzhi">寅</span><span class="pname">财帛</span><span class="pstars">太阳 · 天梁</span></div>
      <div class="palace"><span class="pzhi">丑</span><span class="pname">疾厄</span><span class="pstars">七杀 · 天钺</span></div>
      <div class="palace"><span class="pzhi">子</span><span class="pname">迁移</span><span class="pstars">武曲 · 贪狼</span></div>
      <div class="palace"><span class="pzhi">亥</span><span class="pname">交友</span><span class="pstars">天同</span></div>
    </div>
  </div>

</div>
</body>
</html>
